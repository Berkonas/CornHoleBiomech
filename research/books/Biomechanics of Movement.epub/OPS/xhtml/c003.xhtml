<header>
<h1><a id="c3-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">3</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Running</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c3-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">If you can fill the unforgiving minute</span></p>
<p class="quote-epigraphpara"><a id="c3-para-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">With sixty seconds’ worth of distance run . . .</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">—Rudyard Kipling</span></p></blockquote>
<p><a id="c3-para-0003"/></p>
<figure id="c3-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img src="../images/c3-fig-5001.jpg" alt="c3-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c3-para-0004"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">anyone who has watched</span></span></b> <i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Jurassic Park</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> probably remembers the iconic scene where a Jeep tries to outrace a pursuing </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Tyrannosaurus rex</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Interestingly, the scene agreed with the conventional wisdom of paleontologists at the time of the movie (1993). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">It was believed that </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">T. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">rex</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"> could run at speeds of 40 km/h, and some scientists argued it could run even faster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">At such speeds it could plausibly have outpaced a Jeep on an unpaved road.</span></p>
<p><a id="c3-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">However, more recent biomechanical studies, beginning with John Hutchinson's groundbreaking article in 2002, have shown that </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">T. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">rex</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"> probably couldn't run at all. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Even if it could, it likely could not have reached 40 km/h. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">Using simulations of </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">T. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">rex</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">, Hutchinson showed that to achieve such a speed, 86 percent of its body mass would have had to be leg muscle, leaving little room in the budget for its massive tail, head, and torso. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">It would have required dedicating this much mass to leg muscles in order to generate sufficiently large ground reaction forces, which typically exceed 2 bodyweights when running.</span></p>
<p><a id="c3-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Studies of animals like dinosaurs, elephants, and kangaroos help to clarify our understanding of human running: what drives the transition from walking to running, and what constrains running speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">Measurements of ground reaction forces show why more injuries occur during running than walking, and how we might design running tracks to decrease injury rates and increase speed.</span></p>
<p><a id="c3-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">In this chapter, we will explore these questions using simple mechanical models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">The models include springs to represent the elastic properties of muscles and tendons, and reveal how the storage and release of elastic energy makes running efficient. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">To get started, we first define the running gait cycle and study the forces and elastic mechanisms involved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.4">We then discover principles that will help you design tracks, shoes, and prosthetic limbs that enable fast and efficient running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.5">We also examine the changes in gait and energy expenditure that occur as we transition from walking to running.</span></p>
<section>
<h2><a id="c3-sec-0001"/><a id="c3-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">The running gait cycle</span></h2>
<p class="paraaftertitle"><a id="c3-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">The running gait cycle comprises alternating phases of single-leg support and flight (</span><a id="c3-fig-0002a"/><a href="#c3-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Figure 3.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">As with walking, a running gait cycle is defined by two consecutive foot contact events on the same leg, with foot contact of the opposite leg occurring halfway through. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">Each leg has a stance phase, when the foot is in contact with the ground, and a swing phase, when the foot is off the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.4">Stance begins at foot contact, ends at toe off, and accounts for about 30 to 45 percent of the gait cycle in human running, though it may account for 25 percent or less during high-speed sprinting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.5">Recall that the duration of the stance phase in walking decreases as walking speed increases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.6">Thus, as walking speed increases, the duration of double-support shortens. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.7">Increasing speed even further, the stance phase corresponding to each leg will eventually span less than half the gait cycle, giving rise to a flight phase.</span></p>
<figure id="c3-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"><img src="../images/c3-fig-0001.jpg" alt="c3-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Figure 3.1</span></a></span> <a id="c3-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">The running gait cycle and its constituent events (e.g., foot contact) and phases (e.g., support). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">The percentages of time spent in stance and swing vary with running speed and style.</span></p></figcaption></figure>
<p><a id="c3-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">The presence of a flight phase is one way we distinguish walking from running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">In fact, it is quite tempting to believe that it is the signature of running, not only in humans but in other animals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">However, we will see shortly that another qualitative change occurs when we switch from a walking gait to a running gait, which is even more important from a biomechanical point of view.</span></p>
<p><a id="c3-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">The metrics used to quantify the running gait cycle are similar to those used for walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">The step length is the distance along the line of progression between two consecutive footprints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">The distance traveled in two consecutive steps, or the distance covered in one gait cycle, is called the stride length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.4">The rate at which foot contact events occur (equivalently, the reciprocal of step duration) is called the step frequency or cadence; the rate at which strides are taken is called the stride frequency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.5">Running speed can be computed as the product of stride length and stride frequency or, equivalently, as the product of step length and cadence:</span></p>
<p><a id="c3-para-0012"/></p>
<figure id="c3-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"><img src="../images/c3-fig-3001.jpg" alt="c3-fig-3001.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c3-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">(3.1)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">A moderate running speed is 4 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">At this speed, the stance phase accounts for about 35 to 40 percent of the gait cycle, a typical cadence is 180 steps/min, and a typical step length is around 1.3–1.4 m:</span></p>
<p><a id="c3-para-0014"/></p>
<figure id="c3-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"><img src="../images/c3-fig-3002.jpg" alt="c3-fig-3002.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c3-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">(3.2)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Of course, these quantities will vary with leg length, running style, footwear, and other factors.</span></p></section>
<section>
<h2><a id="c3-sec-0002"/><a id="c3-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Ground reaction forces</span></h2>
<p class="paraaftertitle"><a id="c3-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">As we saw in Chapter 2, we can gain insight into the dynamics and energetics of gait using measurements of the ground reaction forces over time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">During running, the vertical component of the ground reaction force rises rapidly following foot contact and reaches a maximum at about 15 to 20 percent of the gait cycle (</span><a id="c3-fig-0005a"/><a href="#c3-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Figure 3.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">The vertical ground reaction force peaks at around 2 bodyweights when running at a moderate speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.3">The horizontal ground reaction force points backward during the first half of stance, decelerating the center of mass, and points forward thereafter.</span></p>
<figure id="c3-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"><img src="../images/c3-fig-0002.jpg" alt="c3-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0005a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Figure 3.2</span></a></span> <a id="c3-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Representative ground reaction forces during running when </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">landing on the heel</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">Vertical and horizontal (fore–aft) components (left) and schematic of total vector (right) are shown over the gait cycle. </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">A sharp peak</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> in the vertical ground reaction force occurs at heel strike. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">Data from Yong et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">(2020).</span></p></figcaption></figure>
<p><a id="c3-para-0018"/><a href="#c3-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Figure 3.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"> illustrates the characteristic double-peaked vertical ground reaction force observed in rearfoot strikers, runners who land on their heels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">Although the ground reaction force in walking also has two peaks, in running the first peak is shorter and is due to the impact of the heel on the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.3">Certain runners, notably those who have grown up running barefoot, land instead on their forefeet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.4">For these runners, the vertical ground reaction force rises more gradually and has only one peak (</span><a id="c3-fig-0006a"/><a href="#c3-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Figure 3.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">It has been argued that this style of running is more “natural” and protects against impact-related injuries, but subsequent research has cast doubt on this conclusion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.3">A runner who has grown up rearfoot striking may risk injury if he or she changes to forefoot striking, especially without proper training.</span></p>
<figure id="c3-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1"><img src="../images/c3-fig-0003.jpg" alt="c3-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0006a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Figure 3.3</span></a></span> <a id="c3-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Representative ground reaction forces during running when </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">landing on the forefoot</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">, from the same subject as in </span><a href="#c3-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 3.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">The vertical ground reaction force is devoid of the sharp peak observed when rearfoot striking, which may reduce injury risk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.3">Data from Yong et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.4">(2020).</span></p></figcaption></figure>
<p><a id="c3-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">The forward kinetic energy and gravitational potential energy during running can be computed using Equations 2.3 and 2.4 (</span><a id="c3-fig-0007a"/><a href="#c3-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Figure 3.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">The forward speed and forward kinetic energy are the greatest, and approximately constant, during the flight phase of running (neglecting air resistance). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.3">The center of mass, and therefore the gravitational potential energy, is also highest at midflight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.4">Thus, unlike in walking, the forward kinetic energy and gravitational potential energy reach their maxima at approximately the same time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.5">Similarly, both forward kinetic energy and gravitational potential energy reach minima in midstance—that is, the forward speed is least approximately when the center of mass is lowest.</span></p>
<figure id="c3-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"><img src="../images/c3-fig-0004.jpg" alt="c3-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Figure 3.4</span></a></span> <a id="c3-para-0021"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Representative gravitational potential and forward kinetic energies during running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">Forward kinetic energy is constant during flight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.3">Data from Yong et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.4">(2014).</span></p></figcaption></figure>
<p><a id="c3-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">We want to emphasize a fundamental difference between walking and running: in running, we do not benefit from the exchange of forward kinetic energy and gravitational potential energy, but instead store and release elastic potential energy in our muscles and tendons as they stretch and recoil. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">This observation suggests a model of running as shown in </span><a id="c3-fig-0008a"/><a href="#c3-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Figure 3.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">In this model, the mass reaches its lowest point at midstance when the forward velocity of the mass center is also a minimum, similar to what we find in the experimental data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.3">The spring-like action of our legs makes running an energetically efficient gait.</span></p>
<figure id="c3-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"><img src="../images/c3-fig-0005.jpg" alt="c3-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Figure 3.5</span></a></span> <a id="c3-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">The stance phase of running (left) and a mass–spring model thereof (right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">In this model, the mass of the body is lumped into a point mass, which sits atop a massless linear spring representing the leg. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">The spring compresses and the mass reaches its lowest point during midstance, when the forward velocity of the mass is also lowest.</span></p></figcaption></figure>
<p><a id="c3-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">As we saw in Chapter 2, elephants do not have a flight phase, even when they are moving as fast as possible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">For this reason, you might argue that elephants don't run. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.3">But in fact, they seem to have a “Groucho walk” in which their knees bend and fluctuations in their gravitational potential energy and forward kinetic energy become synchronized. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.4">From a biomechanical perspective, this synchronization means that the elephants are running in a sense. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.5">Just like people, the pachyderms are using their legs as springs to store energy, as illustrated in </span><a href="#c3-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">Figure 3.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.2">Most likely, elephants evolved this method of “running” without going airborne as an adaptation to their great size. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.3">As we will see later in this book, muscle strength scales with the cross-sectional area of muscle (a length squared), whereas body mass scales with volume (a length cubed). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.4">Thus, very large animals have a lower strength-to-weight ratio compared to smaller animals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.5">This principle explains why small animals like squirrels can generate large ground reaction forces and leap several body lengths, but elephants and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Tyrannosaurus rex</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"> (which are roughly the same size) cannot generate a ground reaction force sufficient for even an instant of flight.</span></p></section>
<section>
<h2><a id="c3-sec-0003"/><a id="c3-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Elastic mechanisms in hopping and running</span></h2>
<p class="paraaftertitle"><a id="c3-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Another animal that can teach us about elastic energy storage during running is the kangaroo. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.2">Kangaroos do not run in the conventional sense of the word; normally we describe their motion as a hop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.3">Nevertheless, from a biomechanical point of view, they use a similar mechanism to the one humans use when running.</span></p>
<p><a id="c3-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">In the early 1970s, Terence Dawson and Richard Taylor trained kangaroos to wear a facemask while hopping on a treadmill at speeds ranging from 1 to 22 km/h—an experiment that surely required virtuosic animal-handling skills. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">The facemask allowed the researchers to measure the animals’ metabolic energy consumption, which was the main theme of Taylor's research at the time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.3">His many experiments with kangaroos and other animals focused biologists’ attention on energy consumption as a key factor in animal behavior.</span></p>
<p><a id="c3-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">At low speeds, Dawson and Taylor found that kangaroos do not hop but instead move with a pentapedal gait in which they use their tail as a fifth point of contact with the ground (</span><a id="c3-fig-0009a"/><a href="#c3-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Figure 3.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">This manner of locomotion looks awkward and is energetically inefficient. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.3">Indeed, they found that energy consumption increased dramatically as the animals hobbled forward at higher speeds (from 1 to 6 km/h; </span><a id="c3-fig-0010a"/><a href="#c3-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">Figure 3.7A</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.2">The increase in speed during pentapedal gait was achieved primarily by increasing stride frequency (</span><a href="#c3-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Figure 3.7D</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">At about 6–7 km/h, kangaroos transition to hopping. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">A feature that jumps out of </span><a href="#c3-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Figure 3.7A</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> is the slight </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">decline</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"> in the cost of transport as the animals’ speed increases above 7 km/h. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.2">As </span><a href="#c3-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Figures 3.7C and D</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"> show, in the hopping phase they increase their speed primarily by increasing stride length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.2">Stride frequency is nearly constant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.3">This result is consistent with a mass–spring model of the kangaroo (similar to </span><a href="#c3-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Figure 3.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">), because the natural frequency of a sprung mass does not change when the amplitude of its motion changes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.2">Dawson and Taylor noted that the Achilles tendon of the kangaroo is well suited to store and release elastic energy, and suggested that this mechanism makes hopping efficient and enables hopping at high speed.</span></p>
<figure id="c3-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"><img src="../images/c3-fig-0006.jpg" alt="c3-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">Figure 3.6</span></a></span> <a id="c3-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Modes of locomotion in kangaroos. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">During slow locomotion, kangaroos adopt a pentapedal gait (top) in which they use their tail for support when advancing their hind limbs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.3">At higher speeds, kangaroos adopt a hopping gait (middle) in which their tail is used for balance and to control body pitch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.4">During high-speed hopping (bottom), kangaroos can reach speeds in excess of 50 km/h. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.5">Adapted from Dawson (1977).</span></p></figcaption></figure>
<figure id="c3-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"><img src="../images/c3-fig-0007.jpg" alt="c3-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0010a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Figure 3.7</span></a></span> <a id="c3-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Energetics of kangaroo locomotion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">Mass-normalized rate of oxygen consumption increases with increasing speed during pentapedal gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.3">Kangaroos transition to hopping at around 6–7 km/h; oxygen consumption then decreases with increasing speed until a minimum is reached at about 20 km/h. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.4">Dawson (1977) estimated oxygen consumption for speeds that could not be studied in the lab (dashed lines). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.5">At low hopping speeds, stride frequency remains relatively constant and speed is increased primarily by increasing stride length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.6">Data from Dawson (1977).</span></p></figcaption></figure>
<p><a id="c3-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Around this time, Taylor learned about the force plates in Giovanni Cavagna's laboratory in Italy, and he brought his menagerie (kangaroos, monkeys, dogs, and turkeys) to Milan to try them out on Cavagna's then-new invention. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">The resulting study, published in 1977, provided additional evidence that kangaroos store elastic energy and release it during hopping. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.3">At speeds of up to 30 km/h, oxygen consumption accounted for about one-third of the energy required to accelerate the kangaroo's center of mass; the remaining energy must have been supplied by elastic storage in muscles and tendons.</span></p></section>
<section>
<h2><a id="c3-sec-0004"/><a id="c3-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Hopping robots</span></h2>
<p class="paraaftertitle"><a id="c3-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Many early walking robots remained statically stable during locomotion, shuffling forward while keeping their center of mass above their feet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">In the 1980s, Marc Raibert and his colleagues built the first robots that maintained “dynamic balance” during high-speed motion, moving with alternating phases of support and flight as in running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.3">These early robotic runners had only one leg and relied on motion to maintain stability, remaining upright only by hopping. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.4">This clever design focused the control problem on maintaining balance while avoiding the complexity of coordinating the motions of multiple legs.</span></p>
<p><a id="c3-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">The first of Raibert's robots hopped in a plane on a single springy leg (</span><a id="c3-fig-0011a"/><a href="#c3-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">Figure 3.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">The robot was mechanically constrained to prevent it from falling on its side and was tethered to a control computer and offboard supplies of compressed air and electrical power. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.3">The leg bounced on a spring (pneumatic cylinder) with adjustable stiffness, which provided the energy required for each hop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.4">The controller comprised three independent components: the first regulated vertical motion by adding air to and releasing air from the pneumatic cylinder, adjusting leg stiffness; the second maintained balance by appropriately positioning the foot during flight; and the third stabilized the body's attitude (inclination) by applying torque between the leg and body during stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.5">Leg swing was a natural consequence of the hip torques generated by the balance and attitude controllers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.6">For example, during flight, the balance controller must swing the leg forward to prepare for the next stance phase.</span></p>
<figure id="c3-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1"><img src="../images/c3-fig-0008.jpg" alt="c3-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0011a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">Figure 3.8</span></a></span> <a id="c3-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">The motion of Raibert's planar robot resembles that of a hopping kangaroo, albeit without a tail to help control pitch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.2">Onboard electronics adjust hip angle and leg stiffness to control balance, vertical motion, and body attitude. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.3">Unlike the marsupial, the machine can balance only while it hops. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.4">Adapted from Raibert and Sutherland (1983).</span></p></figcaption></figure>
<p><a id="c3-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">The same three-part control strategy was used to dynamically balance an analogous 3D hopping robot (Raibert et al., 1984). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">The robot again bounced on a single springy leg, storing and releasing energy with each hop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.3">Unlike its planar predecessor, however, the body was unconstrained and thus the balance controller regulated both its pitch and roll angles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.4">The robot reached a top speed of 2.2 m/s (a slow running pace) and was able to recover from external perturbations, proudly supplied by the robot's designers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.5">Raibert went on to found Boston Dynamics in 1992, which has developed a series of agile robots. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.6">They have graduated to two and four legs, but they continue to be based on the same principles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.7">After nearly two decades of developing cutting-edge robots, the company announced its plans to make its first commercial model, the canine-inspired SpotMini, in 2019 (</span><a id="c3-fig-0012a"/><a href="#c3-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Figure 3.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">).</span></p>
<figure id="c3-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1"><img src="../images/c3-fig-0009.jpg" alt="c3-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">Figure 3.9</span></a></span> <a id="c3-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Examples of modern running robots. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">Photos of the Spot robot (left) and Atlas robot (right) are courtesy of Boston Dynamics.</span></p></figcaption></figure></section>
<section>
<h2><a id="c3-sec-0005"/><a id="c3-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Tuned track</span></h2>
<p class="paraaftertitle"><a id="c3-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">In the mid-1970s, Thomas McMahon received an unusual call for help. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">Harvard University was building a new indoor track, and the contractor disagreed with the track coach on how steeply banked the turns should be (Wingerson, 1983). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.3">After McMahon resolved that issue (in favor of the track coach), they asked him another question: How hard should the track surface be?</span></p>
<p><a id="c3-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">At that time, the conventional wisdom was the harder the better, to minimize the amount of time the runners’ feet would be in contact with the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.2">But McMahon questioned this belief. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.3">It seemed to him that a more compliant (or “springy”) surface might increase runners’ speed by increasing stride length, stride frequency, or both (recall Equation 3.1). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.4">He also theorized that a compliant track might reduce the risk of injury by decreasing the initial spike in the ground reaction force observed in rearfoot-striking runners (</span><a href="#c3-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Figure 3.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">).</span></p>
<p><a id="c3-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">A mathematical model can shed light on this theory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.2">Together with his colleague Peter Greene, McMahon focused on the stance phase of running, the only part of the gait cycle when the track can directly influence the runner's dynamics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.3">They modeled the runner as a mass–spring–damper system in series with a spring representing the track (</span><a id="c3-fig-0013a"/><a href="#c3-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Figure 3.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">The runner's spring reflects the elastic properties of muscles and tendons; the damper reflects the influence of velocity on muscle force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.3">The final component of the model is a linear spring that represents the compliance of the track and whose optimal stiffness was sought.</span></p>
<figure id="c3-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1"><img src="../images/c3-fig-0010.jpg" alt="c3-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0013a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Figure 3.10</span></a></span> <a id="c3-para-0039"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">Conceptual model used by McMahon and Greene for predicting running performance on a compliant track. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">A passive spring–damper system represents the mechanical properties of the muscles, and a spring under the foot represents the compliance of the track. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.3">The dynamics of this system as it compresses during early stance (center) and rebounds during late stance (right) are analyzed to find the stiffness of the track spring that is best tuned to the properties of the leg. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.4">Adapted from McMahon and Greene (1979).</span></p></figcaption></figure>
<p><a id="c3-para-0040"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">This system has two degrees of freedom and its dynamics are governed by two second-order ordinary differential equations, which can be derived from the schematic shown in </span><a id="c3-fig-0014a"/><a href="#c3-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Figure 3.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">:</span></p>
<figure id="c3-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1"><img src="../images/c3-fig-0011.jpg" alt="c3-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0014a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Figure 3.11</span></a></span> <a id="c3-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">Schematic used to derive equations of motion for the conceptual model shown in </span><a href="#c3-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Figure 3.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.2">The system is shown in equilibrium (left) and during stance (right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.3">The runner's body is modeled as a mass (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">m</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">) that moves with displacement </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">x</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">r</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1"> due to forces generated by a spring (stiffness </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">k</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">m</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">) and dashpot (damping </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">b</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">m</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">) that represent the combined effect of the leg muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.2">The small piece of the track under the foot is modeled as a massless body that is connected to the ground with a spring (stiffness </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">k</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">) representing the track compliance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.2">Adapted from McMahon and Greene (1979).</span></p></figcaption></figure>
<p><a id="c3-para-0042"/></p>
<figure id="c3-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1"><img src="../images/c3-fig-3003.jpg" alt="c3-fig-3003.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c3-para-0043"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">(3.3)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">m</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1"> is the mass of the runner's body, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">x</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">r</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1"> is its displacement from equilibrium, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">x</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1"> is the displacement of the track under the foot, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">b</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">m</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1"> is the resistance of the damper, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">k</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">m</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">k</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1"> are the stiffnesses of the muscle and track springs, respectively.</span></p>
<p><a id="c3-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">McMahon and Greene estimated the foot–ground contact time as a function of track stiffness </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">k</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1"> by computing the natural frequency of this system and noting that the foot will lift off the ground after approximately half the period of one oscillation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.2">Their first unexpected finding was a range of intermediate track stiffnesses for which the contact time is less than that when running on a very stiff surface, such as concrete (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">t</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">0</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">; </span><a id="c3-fig-0016a"/><a href="#c3-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Figure 3.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.2">Even if the stride length stayed the same, this finding would lead one to expect an increase in running speed because stride frequency tends to increase as the contact time decreases.</span></p>
<figure id="c3-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1"><img src="../images/c3-fig-0012.jpg" alt="c3-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0016a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">Figure 3.12</span></a></span> <a id="c3-para-0045"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">Foot contact time vs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.2">track stiffness. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.3">Both axes are logarithmic scale. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.4">Foot contact time (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">t</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">c</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">) is normalized by the contact time on a hard surface (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">t</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">0</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">); track stiffness (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">k</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">) is normalized by leg stiffness (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">k</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">m</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.2">The solid line was determined from the model shown in </span><a href="#c3-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">Figure 3.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1"> using a damping ratio of </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1"><img src="../images/c3-fig-6001.jpg" alt="c3-fig-6001.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1"> because this value gives the best fit to the experimental data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.2">The tuned region (shaded) shows the potential to reduce contact time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.3">Adapted from McMahon (1984).</span></p></figcaption></figure>
<p><a id="c3-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">But there was even better news to come. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.2">Their model was too simple to predict stride length, so McMahon and Greene built running surfaces of various stiffnesses, ranging from nearly rigid to very compliant trampoline tracks, and estimated step lengths as individuals ran on these surfaces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.3">As expected, running on very compliant surfaces dramatically increased step lengths compared to running on stiff surfaces (</span><a id="c3-fig-0017a"/><a href="#c3-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">Figure 3.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.2">But of course, running on a trampoline is much too slow because of the greatly increased time of contact between the foot and the trampoline. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.3">The most relevant finding was that step lengths still increased by about 1 percent even in the “tuned region” (shown with a gray stripe in </span><a href="#c3-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Figures 3.12 and 3.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">), where contact time also decreased. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.2">This is a win-win zone where both stride length and stride frequency are enhanced. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.3">For a track whose stiffness is within this region, roughly 2 to 4 times the stiffness of the runner's leg, we expect running speed to increase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.4">(For comparison, concrete is 100 times as stiff as a human leg.)</span></p>
<figure id="c3-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1"><img src="../images/c3-fig-0013.jpg" alt="c3-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0017a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Figure 3.13</span></a></span> <a id="c3-para-0047"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">Step length (normalized by step length on a hard surface) vs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.2">track stiffness (normalized by leg stiffness). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.3">Dots are experimental step lengths that are best fit by the curve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.4">The tuned region (shaded) is the same as that shown in </span><a href="#c3-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">Figure 3.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.2">There is about a 1 percent increase in step length in this region. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.3">Adapted from McMahon (1984).</span></p></figcaption></figure>
<p><a id="c3-para-0048"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">Indoor tracks with stiffnesses in the tuned range were built at Harvard, Yale, Madison Square Garden, and the Meadowlands in New Jersey. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.2">The track at Harvard was designed with a stiffness of about 190 kN/m, enabling roughly 8 mm of track deflection for a 75 kg runner (assuming the runner exerts two times their body weight during midstance, per </span><a href="#c3-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">Figure 3.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.2">Not only did runners improve their times by about 2 or 3 percent (about 5 seconds per mile), but injury rates also decreased, perhaps because of the softer landing on the tuned track.</span></p>
<p><a id="c3-para-0049"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Today's tracks are built with attention to the amount of energy the track returns to the runner. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.2">No doubt their construction is more sophisticated than Harvard's track, which opened in 1977. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.3">Even if McMahon's work no longer represents the state of the art, his analysis of running and design of a tuned track are excellent examples of just how much mileage you can get from simple models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.4">Similar analyses can be used to design running shoes, as we will see next.</span></p></section>
<section>
<h2><a id="c3-sec-0006"/><a id="c3-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Elastic mechanisms to improve running shoes</span></h2>
<p class="paraaftertitle"><a id="c3-para-0050"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">Rodger Kram and his collaborators evaluated a prototype running shoe from Nike that included a carbon-fiber plate embedded in an elastic foam midsole, intended to store and release elastic energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.2">When a force is applied to a shoe, it deforms; analyzing the force–deformation relationship can tell us something about the storage and return of elastic energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.3">A comparison between the prototype shoe and a standard running shoe used by marathon runners revealed that the prototype shoe stored more elastic energy as it was deformed and returned a higher percentage of this energy when it recoiled (</span><a id="c3-fig-0018a"/><a href="#c3-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Figure 3.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.2">When 18 elite athletes ran in these shoes, their energetic cost of running decreased by an average of 4 percent compared with standard marathon racing shoes, similar to the advantage provided by the tuned track some four decades earlier.</span></p>
<figure id="c3-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1"><img src="../images/c3-fig-0014.jpg" alt="c3-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0018a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">Figure 3.14</span></a></span> <a id="c3-para-0051"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">Force–deformation curves of two running shoes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.2">As force is applied to each shoe, the shoe deforms (upper trace in each curve). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.3">Then, as the shoe is unloaded, the midsole recoils (lower trace in each curve). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.4">The area between loading and unloading curves indicates the mechanical energy lost as heat. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.5">The area below the lower traces (shaded) represents the amount of elastic energy that is returned when the shoe is unloaded. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.6">Adapted from Hoogkamer et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.7">(2018).</span></p></figcaption></figure></section>
<section>
<h2><a id="c3-sec-0007"/><a id="c3-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Leg stiffness changes with body mass</span></h2>
<p class="paraaftertitle"><a id="c3-para-0052"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">Analyses of mass–spring models have suggested that leg stiffness increases in proportion to body mass among a wide range of animals (Farley et al., 1993). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">For example, squirrels have a small body mass and move with flexed, compliant limbs whereas elephants have a large body mass and prefer to walk with straighter legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.3">Running while carrying load artificially increases body mass and is common in humans, making it an interesting scenario for exploring how mass influences leg stiffness during human running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.4">When Amy Silder was working in my lab at Stanford, she collected data from recreational runners as each ran at his or her comfortable training pace (3.34 ± 0.22 m/s) on a treadmill that was instrumented with force plates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.5">Subjects ran while carrying no load and while carrying loads of 10, 20, or 30 percent of their body weight in a vest. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.6">Dimensionless leg stiffness (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">k</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">leg</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">) was estimated as the ratio of the peak vertical ground reaction force normalized by body weight (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">F</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">peak</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">) to the change in leg length during that stance phase, normalized by leg length at foot contact (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">ℓ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">0</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">):</span></p>
<p><a id="c3-para-0053"/></p>
<figure id="c3-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1"><img src="../images/c3-fig-3004.jpg" alt="c3-fig-3004.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c3-para-0054"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">(3.4)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">ℓ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">min</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1"> is the minimum leg length during stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.2">Leg length was defined as shown in </span><a id="c3-fig-0020a"/><a href="#c3-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">Figure 3.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">.</span></p>
<figure id="c3-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1"><img src="../images/c3-fig-0015.jpg" alt="c3-fig-0015.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0020a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">Figure 3.15</span></a></span> <a id="c3-para-0055"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">Leg length defined as the distance between the center of pressure and the geometric center of the pelvis.</span></p></figcaption></figure>
<p><a id="c3-para-0056"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">These experiments revealed that dimensionless leg stiffness increased when running with load because the peak vertical ground reaction force increased and the change in stance-phase leg length decreased (</span><a id="c3-fig-0021a"/><a href="#c3-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Figure 3.16</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.2">These experiments agree with the trend noted by Farley et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.3">(1993) that leg stiffness increases with body mass.</span></p>
<figure id="c3-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1"><img src="../images/c3-fig-0016.jpg" alt="c3-fig-0016.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0021a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">Figure 3.16</span></a></span> <a id="c3-para-0057"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">Vertical ground reaction force normalized by body weight (left) and leg length normalized by leg length at foot contact (right) over the stance phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.2">Subjects ran while carrying no load and while wearing vests loaded with 10, 20, or 30 percent of their body weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.3">As loads increased, the peak vertical ground force increased (p &lt; 0.001) and change of leg length decreased (p = 0.025). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.4">Adapted from Silder et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.5">(2015).</span></p></figcaption></figure>
<p><a id="c3-para-0058"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">Leg stiffness may also change with the type of running shoe worn. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.2">Running shoe cushioning is often used in an attempt to reduce impact loading, as we saw in the tuned track described above. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.3">However, Kulmala and colleagues (2018) reported that running in highly cushioned shoes increased leg stiffness and amplified impact loading compared to a conventional running shoe. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.4">Thus, one needs to consider the complex interaction of running shoe mechanics and limb stiffness when attempting to reduce musculoskeletal loading during running.</span></p></section>
<section>
<h2><a id="c3-sec-0008"/><a id="c3-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">Gait transitions</span></h2>
<p class="paraaftertitle"><a id="c3-para-0059"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">As walking speed increases, the stance phase shortens; ultimately, the double-support phase disappears entirely, producing a flight phase (</span><a id="c3-fig-0022a"/><a href="#c3-fig-0022"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">Figure 3.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.2">It is interesting to examine what happens to the ground reaction forces during the transition from walking to running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.3">At low walking speeds, the stance phase is long, as is the period of double support. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.4">As walking speed increases, the variation of the ground reaction force over the gait cycle increases and the period of double support drops. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.5">It's hard to walk at a speed of over 2 m/s; even though there is no flight phase, the peak ground reaction force increases to well above body weight and varies substantially over the gait cycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.6">At even higher speeds, it's impossible to walk and you break into a run. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.7">The peak ground reaction force increases dramatically, to over 2 bodyweights, because the foot is in contact with the ground for such a short duration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.8">An important question to ask is: What drives this transition between gaits? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.9">Comparing the gaits of different animals provides important clues.</span></p>
<figure id="c3-fig-0022"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1"><img src="../images/c3-fig-0017.jpg" alt="c3-fig-0017.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0022a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">Figure 3.17</span></a></span> <a id="c3-para-0060"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">Vertical component of ground reaction forces as speed increases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.2">Left, top to bottom: walking at slow, moderate, and fast speeds; right: running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.3">Adapted from Alexander (1984).</span></p></figcaption></figure>
<p><a id="c3-para-0061"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">When moving at a particular speed, humans and other animals typically select the mode of locomotion with the lowest cost of transport. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.2">For example, horses transition from walking to trotting to galloping as they increase speed (</span><a id="c3-fig-0023a"/><a href="#c3-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">Figure 3.18</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.2">Although they adapt their gait to the desired speed, the reverse is also true: once they have chosen a particular gait, they prefer to travel at the speed where the cost of transport is lowest for that gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.3">For example, horses typically walk at around 1.25 m/s, which is the lowest point of the blue curve in </span><a href="#c3-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">Figure 3.18</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.2">Humans similarly transition from walking to running around the speed at which running becomes more economical. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.3">Notice that, if you need to cover a particular distance in a fixed amount of time, it may be more energetically economical to walk comfortably part of the way and run the rest of the way rather than walking quickly or running slowly the whole way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.4">As with walking, we naturally choose variables such as step length and step frequency to minimize energy consumption when running at a particular speed.</span></p>
<figure id="c3-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1"><img src="../images/c3-fig-0018.jpg" alt="c3-fig-0018.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0023a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">Figure 3.18</span></a></span> <a id="c3-para-0062"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">Cost of transport at various speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.2">When moving at a particular speed, horses, humans, and other animals naturally select the gait with the lowest cost of transport, and prefer moving at speeds near the minima of these curves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.3">Horse data from Hoyt and Taylor (1981); human data from Rathkey and Wall-Scheffler (2017).</span></p></figcaption></figure></section>
<section>
<h2><a id="c3-sec-0009"/><a id="c3-title-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">Bipedal mass–spring model</span></h2>
<p class="paraaftertitle"><a id="c3-para-0063"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">In Chapter 2 we modeled walking as the motion of an inverted pendulum with rigid legs, and in this chapter we have modeled running as a bouncing gait with compliant legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.2">Each model has strengths but also important limitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.3">In 2006, Hartmut Geyer, Andre Seyfarth, and Reinhard Blickhan proposed a unified model for walking and running that overcomes some of these limitations by including two compliant legs (</span><a id="c3-fig-0024a"/><a href="#c3-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">Figure 3.19</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.2">The model reproduces three important features of running: the ground reaction force, elastic storage of energy, and a running gait cycle with alternating periods of stance and flight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.3">Interestingly, the model also demonstrates the out-of-phase fluctuations in forward kinetic energy and gravitational potential energy that are characteristic of walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.4">Analysis of this model shows that walking efficiency depends on the center-of-mass trajectory following an inverted pendulum arc and on elastic energy storage in the leg springs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.5">Energy that would otherwise be lost during double support is recovered from the energy stored in the leg springs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.6">Having a single model that can produce both walking and running suggests that these gaits are more similar than was previously thought.</span></p>
<figure id="c3-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1"><img src="../images/c3-fig-0019.jpg" alt="c3-fig-0019.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0024a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">Figure 3.19</span></a></span> <a id="c3-para-0064"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">An inverted pendulum model of walking on stiff legs (left) and a mass–spring model of running on compliant legs (center) can be combined into a bipedal mass–spring model that explains the basic dynamics of walking and running (right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.2">The center-of-mass trajectory during walking is shown in the right panel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.3">Adapted from Geyer et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.4">(2006).</span></p></figcaption></figure></section>
<section>
<h2><a id="c3-sec-0010"/><a id="c3-title-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">Kinematics of running</span></h2>
