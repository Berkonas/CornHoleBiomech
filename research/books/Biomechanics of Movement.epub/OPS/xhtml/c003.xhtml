<p class="paraaftertitle"><a id="c3-para-0065"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">In addition to understanding the ground reaction forces and energy consumption involved in running, it is important to understand running kinematics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.2">That is, we want to see how the joints pictured in Figure 2.17 behave: when they flex, when they extend, and by how much. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.3">Using motion capture methods, which we describe in Chapter 7, we can estimate the joint angles that occur during running and describe how joint motions vary with running speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.4">Typical results for subjects who run with a rearfoot-striking running style are shown in </span><a id="c3-fig-0025a"/><a href="#c3-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">Figure 3.20</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.2">The ranges of joint motions are greater during running than during walking, and the ranges of motion increase with running speed.</span></p>
<figure id="c3-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1"><img src="../images/c3-fig-0020.jpg" alt="c3-fig-0020.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0025a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">Figure 3.20</span></a></span> <a id="c3-para-0066"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">Representative joint motions over the gait cycle when running at several speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.2">Walking at 1.5 m/s from Figure 2.19 is shown for reference. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.3">Averaged over 10 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.4">Vertical lines on the horizontal axis indicate toe off at each speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.5">Data from Hamner and Delp (2013).</span></p></figcaption></figure>
<p><a id="c3-para-0067"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">The kinematics of the joints during the stance phase have several notable features. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.2">The hip is flexed at foot contact (0 percent of the gait cycle) and extends for the duration of the stance phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.3">In contrast, the knee begins in slight flexion at foot contact, flexes for the first part of stance, and then extends for the second part of stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.4">This knee flexion pattern contributes to the compression and extension of the leg during the stance phase, and thus to the spring-like behavior of the limb. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.5">For runners who land on their heels, the ankle is in a neutral position at foot contact; the ankle then dorsiflexes during the first part of stance and plantarflexes during the second part, working in concert with the knee to produce the spring-like behavior of the leg.</span></p>
<p><a id="c3-para-0068"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">During the swing phase, the hip flexes to advance the limb. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.2">The knee flexes during the first half of swing so that the foot clears the ground, and extends during the second half of swing to prepare for landing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.3">The ankle, which is highly plantarflexed at the end of stance, dorsiflexes back to a neutral position during the swing phase to prepare for landing.</span></p></section>
<section>
<h2><a id="c3-sec-0011"/><a id="c3-title-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">Ground reaction forces and running speed</span></h2>
<p class="paraaftertitle"><a id="c3-para-0069"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">At low running speeds (e.g., 2 m/s), the vertical component of the ground reaction force peaks at about 2 bodyweights (</span><a id="c3-fig-0026a"/><a href="#c3-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">Figure 3.21</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.2">As speed increases, so does the peak of the vertical ground reaction force, increasing to over 2.5 bodyweights at 5 m/s and up to 3 bodyweights at higher running speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.3">Increasing speed also increases the horizontal force that is directed backward during the first half of stance, and the horizontal force that accelerates the center of mass forward during the second half of stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.4">The ground contact time shortens with increasing speed, which can be observed as a decrease in the fraction of the gait cycle spent in stance.</span></p>
<figure id="c3-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1"><img src="../images/c3-fig-0021.jpg" alt="c3-fig-0021.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c3-fig-0026a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">Figure 3.21</span></a></span> <a id="c3-para-0070"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">Representative ground reaction forces over the gait cycle when running at several speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.2">Walking at 1.5 m/s from Figure 2.20 is shown for reference. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.3">Normalized by body weight and averaged over 10 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.4">Data from Hamner and Delp (2013).</span></p></figcaption></figure>
<p><a id="c3-para-0071"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">So far, we have analyzed steady-state running at speeds up to 5 m/s, a fast marathon pace, but the fastest human sprinters can run more than twice this fast. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.2">Tim Dorn and colleagues studied high-speed sprinting and discovered that runners use two strategies to increase their speed (Dorn et al., 2012). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.3">Up to about 7 m/s, running speed is increased primarily by producing larger ground reaction forces to propel the body upward and forward, thereby increasing stride length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.4">Above 7 m/s, the ground reaction force no longer increases, and the strategy to increase running speed shifts from increasing stride length to increasing stride frequency, achieved by moving the legs more rapidly during the flight phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.5">We will see how muscles are used to achieve high-speed running in Chapter 12.</span></p>
<p><a id="c3-para-0072"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">In these two chapters on walking and running, we have used simple mechanical models to illustrate some of the fundamental features of gait, including how we move efficiently using pendular dynamics in walking and elastic energy in running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.2">We have also examined ground reaction forces in detail because these recordings indicate how much force is applied to the foot and how the center of mass accelerates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.3">We have gotten just about as far as possible without explicitly describing a crucially important ingredient in human locomotion—the muscles.</span></p>
<p><a id="c3-para-0073"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">As we have hinted above, it is muscles and tendons that give rise to the spring-like properties of legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.2">Although we can measure ground reaction forces, we cannot determine which muscle forces produce those reaction forces without considering the dynamics of the musculoskeletal system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.3">Once we calculate muscle forces, we will be able to estimate how large the loads are within the hip, knee, or ankle, and hence we can begin to understand joint injuries or design artificial joints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.4">In the upcoming chapters, we will explore the structure, function, and computational modeling of muscle (Chapters 4–6), followed by the methods we use to estimate joint motions and muscle forces from experimental measurements of movement (Chapters 7–9). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.5">We will then be poised to explore how we coordinate our muscles during walking and running in Chapters 10–12.</span></p></section>
</section>
