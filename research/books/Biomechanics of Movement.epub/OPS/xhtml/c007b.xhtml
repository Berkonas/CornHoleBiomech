<figure id="c7-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1"><img src="../images/c7-fig-3013.jpg" alt="c7-fig-3013.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0080"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">(7.13)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">Thus, a point expressed in frame B can be expressed in frame A using a transformation matrix as follows:</span></p>
<p><a id="c7-para-0081"/></p>
<figure id="c7-fig-0027"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1"><img src="../images/c7-fig-3014.jpg" alt="c7-fig-3014.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0082"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">(7.14)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">Equation 7.14 effectively includes the offset vector </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1"><img src="../images/c7-fig-6002.jpg" alt="c7-fig-6002.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1"> on the right-hand side of Equation 7.12 while preserving the notational convenience of relating two frames with a single matrix (</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">A</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">).</span></p>
<p><a id="c7-para-0083"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Finally, as a note to readers who are particularly interested in the mathematics, we will mention that representing rotations with rotation matrices (e.g., Equation 7.10) is not always the best choice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.2">This method suffers from a defect called “gimbal lock”: it becomes impossible to represent certain rotations when two or more axes of rotation are aligned. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.3">For example, if pitch </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">θ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1"> = −90 degrees in </span><a href="#c7-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">Figure 7.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">, then Z = X″, and changing angles </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">ψ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1"> would have the same effect on the airplane. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.2">Gimbal lock can be avoided in applications where the coordinate frames have a limited range of motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.3">But if, for example, you are programming a flight simulator and you want users to be able to execute smooth somersaults, then transformation matrices may be a poor choice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.4">Another representation, called the quaternion, avoids gimbal lock but at the cost of using more esoteric mathematics.</span></p></section>
<section>
<h2><a id="c7-sec-0005"/><a id="c7-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Calculating joint angles with unconstrained inverse kinematics</span></h2>
<p class="paraaftertitle"><a id="c7-para-0084"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">The great advantage of transformation matrices is that they simplify navigation among multiple coordinate systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.2">In particular, they allow us to easily calculate anatomical joint angles from data collected in the laboratory frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.3">Recall that a mocap system records the positions of skin-mounted markers expressed relative to a reference frame fixed in the lab (</span><a id="c7-fig-0028a"/><a href="#c7-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">Figure 7.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.2">To calculate the knee flexion angle, for example, we can determine the transformation matrix relating the reference frames fixed to the femur and tibia:</span></p>
<figure id="c7-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1"><img src="../images/c7-fig-0013.jpg" alt="c7-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0028a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">Figure 7.13</span></a></span> <a id="c7-para-0085"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">The relative position and orientation of any two reference frames can be described by a 4×4 transformation matrix </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">T</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">, which facilitates calculation of joint angles from marker locations measured relative to a global reference frame.</span></p></figcaption></figure>
<p><a id="c7-para-0086"/></p>
<figure id="c7-fig-0029"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1"><img src="../images/c7-fig-3015.jpg" alt="c7-fig-3015.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0087"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">(7.15)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">Reading this formula from right to left describes how coordinates in the tibia frame are related to coordinates in the femur frame.</span></p>
<p><a id="c7-para-0088"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">Assuming there is neither bone deformation nor soft-tissue motion, the thigh and shank tracking reference frames can be related to the femur and tibia anatomical frames, respectively, through constant transformations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.2">These transformation matrices (</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">thigh</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">femur</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1"> and </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">shank</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">tibia</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">) can be obtained by relating the tracking and anatomical reference frames during a “static calibration trial” in which both sets of markers are attached to the subject and data are collected during standing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.2">Transformations </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">lab</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">thigh</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1"> and </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">lab</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">shank</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1"> are obtained by computing thigh and shank reference frames from the marker positions recorded by the mocap system at each instant of the motion trial. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.2">The knee flexion angle can then be extracted from the </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">femur</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">tibia</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1"> transformation matrix using Equation 7.10. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.2">The simpler Equation 7.6 can be used if the femur and tibia frames have parallel Z axes, as shown in </span><a href="#c7-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">Figure 7.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">.</span></p>
<p><a id="c7-para-0089"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">The unconstrained inverse kinematics approach is popular due to its ease of implementation and its availability in many commercial software packages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.2">However, this approach has a major limitation: it does not account for the constraints imposed by anatomy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.3">As a result, the model's body segments can change length, its joints can dislocate during movement, and the algorithm is sensitive to soft-tissue motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.4">Unconstrained inverse kinematic models produce errors that affect the computed joint angles and all subsequent calculations (e.g., joint moments and muscle forces). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.5">I prefer to use an alternative approach, which is described next.</span></p></section>
<section>
<h2><a id="c7-sec-0006"/><a id="c7-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">Constrained inverse kinematics</span></h2>
<p class="paraaftertitle"><a id="c7-para-0090"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">The constrained inverse kinematics approach uses optimization to minimize the distance between the locations of experimental markers affixed to the subject and the locations of corresponding markers affixed to a kinematic model of the subject's skeleton (</span><a id="c7-fig-0030a"/><a href="#c7-fig-0030"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">Figure 7.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.2">The model is composed of rigid bodies interconnected by anatomically accurate joints that permit only motions that can be reliably measured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.3">The model is scaled to match the dimensions of the subject. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.4">Using a model that incorporates knowledge about the subject's geometry and mobility can produce more accurate estimates of joint angles than the unconstrained inverse kinematics approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.5">The constraints in such a model limit the set of possible solutions to those that represent anatomically feasible movements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.6">For example, the lengths of the bones cannot change over time and the joints can neither dislocate nor move beyond defined anatomical limits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.7">The following objective function </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1"><img src="../images/c7-fig-6003.jpg" alt="c7-fig-6003.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1"> is minimized over the model's generalized coordinates </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1"><img src="../images/c7-fig-6004.jpg" alt="c7-fig-6004.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1"> (e.g., its location in space and the angles of each joint) at each point in time:</span></p>
<figure id="c7-fig-0030"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1"><img src="../images/c7-fig-0014.jpg" alt="c7-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0030a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">Figure 7.14</span></a></span> <a id="c7-para-0091"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">An inverse kinematics algorithm may produce more accurate estimates of joint angles if the solutions are constrained by an underlying skeletal model, where markers placed on the model (orange) track the trajectories of markers placed on the subject (blue).</span></p></figcaption></figure>
<p><a id="c7-para-0092"/></p>
<figure id="c7-fig-0031"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1"><img src="../images/c7-fig-3016.jpg" alt="c7-fig-3016.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0093"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">(7.16)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">where </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1"><img src="../images/c7-fig-6005.jpg" alt="c7-fig-6005.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1"> is the location of the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1">k</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">th</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1"> experimental marker in a global reference frame, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1"><img src="../images/c7-fig-6006.jpg" alt="c7-fig-6006.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1"> is the location of the corresponding marker on the model (which is a function of the model's generalized coordinates), and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">k</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1"> is the relative penalty associated with errors in the location of marker </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">k</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.2">Ideally, each marker attached to the model would follow the same path through space as the corresponding experimental marker. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.3">The penalties encourage this result but do not demand it, allowing for a little bit of uncertainty in the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.4">A high weight </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">k</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1"> relative to the others puts a relatively high cost on any differences between the position of the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">k</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">th</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1"> experimental marker and the position of the corresponding model marker. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.2">You can think of each weight as the stiffness of a spring between the experimental marker and the marker in the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.3">The goal of the optimization is to minimize the energy stored in these imaginary springs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.4">This goal can be posed as a weighted least-squares problem and solved using a suitable numerical algorithm, such as the Broyden–Fletcher–Goldfarb–Shanno (BFGS) iterative method (Nocedal and Wright, 2006).</span></p>
<p><a id="c7-para-0094"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">Although the constrained inverse kinematics approach can produce more accurate results than the unconstrained approach, two key conditions must be satisfied for the method to be successful. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.2">First, the kinematic model must be properly scaled and constrained to represent the subject's geometry and the range of motion of each joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.3">For example, a two-dimensional model may suffice for computing the knee flexion angle during gait, but would be unsuitable for studying frontal-plane kinematics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.4">The second condition is that the markers must be correctly registered—that is, they must be placed on the model to match the locations of experimental markers placed on the subject. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.5">Model scaling and marker registration can be time-consuming tasks, but well-designed software tools can alleviate this burden. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.6">My laboratory always computes joint angles using a constrained inverse kinematics approach because of its superior accuracy, especially for complex joints like the shoulder.</span></p></section>
<section>
<h2><a id="c7-sec-0007"/><a id="c7-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">Kinematic model of the shoulder</span></h2>
<p class="paraaftertitle"><a id="c7-para-0095"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">The human shoulder is a complex mechanism comprising the scapula, clavicle, humerus, and the muscles and ligaments connecting them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.2">A healthy shoulder provides a large range of motion and the structural support necessary to perform daily activities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.3">The motion of the scapula is often used as a diagnostic indicator of shoulder pathologies like rotator cuff injuries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.4">However, because the scapula moves underneath layers of muscle, fat, and skin, it can be difficult to determine its position and orientation accurately. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.5">Thus, it is difficult to identify patients with abnormal shoulder motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.6">A kinematic model can be used to refine our measurements by reducing the space of allowable joint motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.7">The model acts as a kinematic filter that removes infeasible motions and corrects for measurement noise.</span></p>
<p><a id="c7-para-0096"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">Ajay Seth and colleagues developed a kinematic model of the shoulder that enables estimation of shoulder motion to a clinically relevant accuracy by tracking markers affixed to the skin. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.2">The model uses four degrees of freedom to define the position and orientation of the scapula relative to the thorax (</span><a id="c7-fig-0032a"/><a href="#c7-fig-0032"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">Figure 7.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.2">The abduction–adduction and elevation–depression degrees of freedom are analogous to longitude and latitude, defining the position of the scapula as it glides over an ellipsoid that represents the surface of the thorax. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.3">The upward rotation degree of freedom allows the scapula to rotate about an axis normal to the thoracic surface. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.4">Finally, the internal rotation or “winging” degree of freedom enables the scapula to rotate about a longitudinal axis in the plane of the scapula (with the axis remaining tangent to the thoracic surface). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.5">This last degree of freedom allows the medial border of the scapula to lift off the surface of the thorax. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.6">The surface dimensions and joint axes can be customized to match an individual patient.</span></p>
<figure id="c7-fig-0032"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1"><img src="../images/c7-fig-0015.jpg" alt="c7-fig-0015.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0032a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">Figure 7.15</span></a></span> <a id="c7-para-0097"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">A kinematic model of the shoulder. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.2">Adapted from Seth et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.3">(2016).</span></p></figcaption></figure>
<p><a id="c7-para-0098"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">To validate their model, Ajay and colleagues compared the motion of the scapula in the model to the motion of bone-anchored pins that were tracked in the lab using a motion capture system (</span><a id="c7-fig-0033a"/><a href="#c7-fig-0033"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">Figure 7.16</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.2">The shoulder model reduced root-mean-squared error in scapular kinematics due to skin-mounted marker noise by 65 percent compared to a solution computed without a model (i.e., using unconstrained inverse kinematics). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.3">This increase in accuracy allows clinical use of measurements with up to 20 mm of marker noise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.4">Similar improvements in tracking accuracy can be obtained for gait studies using models of the lower limb.</span></p>
<figure id="c7-fig-0033"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1"><img src="../images/c7-fig-0016.jpg" alt="c7-fig-0016.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0033a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">Figure 7.16</span></a></span> <a id="c7-para-0099"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">Root-mean-squared error (RMSE) of scapular kinematics in the presence of measurement noise during a shoulder abduction task (mean ±1 standard deviation). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.2">Kinematic models attenuate noise due to soft-tissue motion by prohibiting nonphysiological motions, enabling clinical use. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.3">Adapted from Seth et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.4">(2016).</span></p></figcaption></figure></section>
<section>
<h2><a id="c7-sec-0008"/><a id="c7-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">Assessing anterior cruciate ligament injury risk</span></h2>
<p class="paraaftertitle"><a id="c7-para-0100"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">The anterior cruciate ligament (ACL) is a key part of the knee's stabilization system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.2">It connects the femur and tibia, and crosses in front of the posterior cruciate ligament (PCL). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.3">This “cross” shape gives the ligaments their name (“cruciate”). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.4">Roughly speaking, the ACL keeps the tibia from moving forward relative to the femur, while the PCL keeps it from moving backward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.5">The PCL is rather hard to injure, but injuries to the ACL are staggeringly common and usually happen without any initiating contact. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.6">Over a quarter-million ACL repair surgeries are performed in the United States every year.</span></p>
<p><a id="c7-para-0101"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">Female athletes are at much greater risk of ACL injury than male athletes, with one out of every 50–70 female athletes suffering this injury per year (Bates and Hewett, 2016). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.2">Several explanations have been proposed for this disparity, but a consistent finding of many biomechanics studies is that the ACL is placed under greatest stress when the knee is in a valgus position (</span><a id="c7-fig-0034a"/><a href="#c7-fig-0034"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">Figure 7.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">).</span></p>
<figure id="c7-fig-0034"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1"><img src="../images/c7-fig-0017.jpg" alt="c7-fig-0017.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0034a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">Figure 7.17</span></a></span> <a id="c7-para-0102"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">Soccer players landing in a risky pose where the knee is in a valgus position (top photo; orange curves) and in a safe pose (bottom photo; blue curves). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.2">The plots show the average knee flexion and valgus angles during landing, computed from motion capture and a constrained inverse kinematic model, averaged over 13 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.3">Adapted from Thompson et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.4">(2016).</span></p></figcaption></figure>
<p><a id="c7-para-0103"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">The good news is that some ACL tears can be prevented. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.2">Both female and male athletes can be trained to avoid landing with the knee in a valgus alignment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.3">We wanted to see whether we could help prevent ACL injuries and began by performing motion analysis on members of the Stanford women's soccer team. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.4">We found that these athletes are so strong and well trained that very few of them have biomechanical features that put them at risk for ACL injuries, at least during tasks we could perform in the laboratory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.5">We then decided to study a population that had yet to be examined, preadolescent girls. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.6">My daughter's soccer coach helped us recruit 51 female athletes from local soccer teams. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.7">The athletes were 10 to 12 years old, about half of whom participated in training sessions to improve their biomechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.8">The sessions were orchestrated by Julie Thompson, the leader of the study, who attended each team's practice sessions for 7–8 weeks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.9">The training sessions were approximately 25 minutes long and replaced each team's standard warm-up before the start of regular practice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.10">After the training program was complete, the girls came back into our lab for biomechanical analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.11">The encouraging result is that this training program was effective at reducing a key risk factor for ACL injury, knee valgus alignment during a double-legged jump task.</span></p>
<p><a id="c7-para-0104"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">Inverse kinematic modeling as we described above can also compute not just what an athlete is doing, but also what he or she should be doing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.2">Cyril Donnelly recorded motion capture video of 34 Australian-rules football players performing a quick movement or “cut” to the side, which is common in sports and places the knee of the stance leg into the vulnerable valgus position (Donnelly et al., 2012). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.3">He identified the nine volunteers with the largest valgus moments and then used our OpenSim software to find anatomically feasible movements that would have placed the least stress on the ACL. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.4">OpenSim searched for poses of the model that satisfied two criteria: the pose must be a close match to the athlete's actual posture as recorded by the mocap system, and the pose must be less stressful for the ACL.</span></p>
<p><a id="c7-para-0105"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">One strategy consistently worked for all nine volunteers: to move the body's center of mass slightly toward the desired direction of travel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.2">Even a shift as small as 3 cm reduced the peak valgus moment by 40 percent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.3">The benefit of the kinematic model is, first, that it identifies the center-of-mass shift as the most effective strategy to reduce the valgus moment during these maneuvers, and second, that it can be tailored to an individual athlete. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.4">In this way, an athlete can learn from the computer what will work best for him or her.</span></p>
<p><a id="c7-para-0106"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">As you can see, subtle differences in the kinematics of different athletes can lead to big differences in injury risk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.2">By quantifying movement and teasing out these differences, we have an opportunity to avoid unnecessary injuries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.3">In this case, 3 cm of prevention may be worth $30,000 of cure!</span></p></section>
