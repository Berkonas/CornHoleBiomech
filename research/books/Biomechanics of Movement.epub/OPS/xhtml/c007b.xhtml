<section epub:type="chapter" role="doc-chapter">
<header>
<h1><a id="c7-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">7</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Quantifying Movement</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c7-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">All change is not growth,</span></p>
<p class="quote-epigraphpara"><a id="c7-para-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">as all movement is not forward.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">—Ellen Glasgow</span></p></blockquote>
<p><a id="c7-para-0003"/></p>
<figure id="c7-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img src="../images/c7-fig-5001.jpg" alt="c7-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c7-para-0004"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">it's the moment</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> that every soccer player dreads. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">An awkward landing, a popping sound. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">Excruciating pain in the knee and crumpling to the ground as the knee can no longer support any weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">An examination by the team doctor, and the three letters no one wants to hear in this situation: ACL. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.5">As in, anterior cruciate ligament, the most common site of knee injuries.</span></p>
<p><a id="c7-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Perhaps worse than the initial pain is what comes next: an operation in which a surgeon drills holes through the tibia and femur, weeks of wearing a brace, followed by months of rehabilitation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">After all this, the chances of returning to action are good. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">But returning to action is not the same as living happily ever after. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">Players who return from an ACL injury have a greater risk of reinjury and an elevated risk of developing arthritis in the injured knee. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.5">Long after the competition is over, the athlete will still be paying the price.</span></p>
<p><a id="c7-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">What if ACL injuries could be prevented? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">The majority of ACL injuries are not caused by contact, and many of them might be prevented with training exercises that focus on balance, proper landing technique, and improved awareness of body position. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">The training can be even more effective when targeted at athletes who are most at risk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">Measuring an athlete's motion can determine whether they are at risk of injuring their ACL. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5">Do they land from a jump with their knees aligned (good) or misaligned (bad)? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.6">Do they absorb the energy of impact by landing with flexed knees (good) or are their knees more extended (bad)?</span></p>
<p><a id="c7-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">At high levels of athletic competition, details matter, and there is no substitute for quantitative measures of performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">The same is true in scientific research. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">Lord Kelvin, the famous mathematical physicist after whom the unit of absolute temperature was named, had this to say about quantification (Thomson, 1889, pp. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">73–74):</span></p>
<blockquote class="quote">
<p class="quoteparafirst"><a id="c7-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">I often say that when you can measure what you are speaking about, and express it in numbers, you know something about it; but when you cannot measure it, when you cannot express it in numbers, your knowledge is of a meagre and unsatisfactory kind: it may be the beginning of knowledge, but you have scarcely, in your thoughts, advanced to the stage of science, whatever the matter may be.</span></p></blockquote>
<p class="paraaftertitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">In this chapter, we will introduce the most common techniques for measuring movement, including force plates and motion capture using cameras. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">We also describe techniques for determining the pose of a subject's skeleton, known as the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">inverse kinematics</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> problem.</span></p>
<p><a id="c7-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Our ultimate goal is to understand the muscle forces that produce movement, but these forces usually cannot be measured directly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Instead, we estimate these muscle forces by constructing a skeletal model and computing the joint angles over time that best agree with the observed motion (this chapter). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">We then compute the forces and moments acting at each joint (Chapter 8), and finally solve an optimization problem that reflects how the body coordinates dozens of muscles to generate these forces and moments (Chapter 9). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">Clearly, we must have a solid foundation to achieve the more ambitious goals of the next two chapters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.5">The quality of all our subsequent analyses depends on how accurately we compute the joint angles, which is our main objective in this chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.6">But first, let's take a step back in time to see how inverse kinematics methods developed.</span></p>
<section>
<h2><a id="c7-sec-0001"/><a id="c7-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Measurement techniques</span></h2>
<p class="paraaftertitle"><a id="c7-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Early studies of movement were limited to qualitative observations and measurements of gross body motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Advances in the photographic process in the 1800s made photography practical and enabled exciting new investigations of movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">In 1872, Leland Stanford (who, with his wife Jane, founded Stanford University) sought to settle an argument about the locomotion of horses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.4">When trotting, a horse advances diagonally opposite legs in unison. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.5">Stanford believed there was a period of time during which all four hooves of a trotting horse were airborne simultaneously and hired Eadweard Muybridge to investigate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.6">Muybridge and engineer John Isaacs pioneered a technique for photographing a horse during locomotion using a series of cameras positioned along the horse's path, and were able to capture the instant a trotting horse was airborne. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.7">The </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Horse in Motion</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1"> photographs (</span><a id="c7-fig-0002a"/><a href="#c7-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Figure 7.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">) revolutionized the field of biomechanics and launched the development of motion pictures.</span></p>
<figure id="c7-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"><img src="../images/c7-fig-0001.jpg" alt="c7-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Figure 7.1</span></a></span> <a id="c7-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Yea or </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">neigh</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">In 1872, Leland Stanford hired Eadweard Muybridge to determine whether all four hooves are airborne simultaneously when a horse trots. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">The fourth photograph in this sequence captures an instant at which all four hooves are airborne. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">Image courtesy of Stanford University.</span></p></figcaption></figure>
<p><a id="c7-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">While video analysis remains a key component of biomechanics, other techniques have been developed for measuring movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">For example, submillimeter measurements of bones can be obtained using fluoroscopy, in which X-ray images are taken continuously over time (</span><a id="c7-fig-0003a"/><a href="#c7-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Figure 7.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">Unfortunately, the exposure to ionizing radiation (as well as a limited field of view) often makes this technique impractical for large-scale studies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">Accurate kinematic measurements can also be obtained by implanting bone-anchored pins that protrude from the skin and tracking the motion of these pins using optical techniques. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.4">As you might expect, the invasiveness of this procedure makes it impractical for most research studies.</span></p>
<figure id="c7-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"><img src="../images/c7-fig-0002.jpg" alt="c7-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0003a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Figure 7.2</span></a></span> <a id="c7-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Fluoroscopic images showing bone motions in a healthy shoulder (top row) and following a total shoulder replacement (bottom row). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">Images courtesy of the University of Utah Orthopaedic Research Laboratory.</span></p></figcaption></figure>
<p><a id="c7-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Inertial measurement units (IMUs) have become popular as a low-cost alternative to existing strategies for quantifying movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">IMUs typically comprise accelerometers for measuring linear accelerations, gyroscopes for measuring angular velocities, and a magnetometer for measuring heading relative to magnetic north. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">In many studies, IMUs eliminate the need for cameras and controlled lighting conditions, which enables one to perform biomechanical experiments in natural environments, during activities like swimming and trail running, and over long durations to capture infrequent events or to monitor health (</span><a id="c7-fig-0004a"/><a href="#c7-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Figure 7.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">For example, Helen Bronte-Stewart used IMUs to measure the angular velocity of each leg in the sagittal plane as individuals walked through a simulated living environment, where optical motion capture would be impractical. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.3">The beginning and end of each swing phase corresponded to zero-crossings of the angular velocity signals they measured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.4">This experimental setup enabled them to detect freezing-of-gait episodes in individuals with Parkinson's disease (</span><a id="c7-fig-0005a"/><a href="#c7-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Figure 7.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">), a gait disturbance in which walking is suddenly interrupted. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">IMUs have also been used to measure the motion of a football player's skull (</span><a id="c7-fig-0006a"/><a href="#c7-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Figure 7.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">) and could be used to help monitor the health of an athlete's brain.</span></p>
<figure id="c7-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"><img src="../images/c7-fig-0003.jpg" alt="c7-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Figure 7.3</span></a></span> <a id="c7-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Inertial measurement units, the orange sensors on the runner's pelvis and ankles, can measure linear accelerations and angular velocities throughout long runs to assess musculoskeletal loading.</span></p></figcaption></figure>
<figure id="c7-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"><img src="../images/c7-fig-0004.jpg" alt="c7-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0005a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Figure 7.4</span></a></span> <a id="c7-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Inertial measurement units can measure the angular velocity of the shank in the sagittal plane (top), detecting freezing-of-gait episodes as individuals with Parkinson's disease navigate living environments (bottom). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">Adapted from O’Day et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">(2020).</span></p></figcaption></figure>
<figure id="c7-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"><img src="../images/c7-fig-0005.jpg" alt="c7-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0006a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Figure 7.5</span></a></span> <a id="c7-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Kinematic measurements for monitoring athlete health. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">A mouthguard instrumented with an inertial measurement unit provides measurements of skull motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.3">The Head Injury Criterion (HIC) is proportional to the area under the total acceleration curve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.4">In this example, the safe threshold for a 15-millisecond time window is accumulated in only 14.6 milliseconds, leading to a traumatic brain injury. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.5">Adapted from Hernandez et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.6">(2015).</span></p></figcaption></figure></section>
<section>
<h2><a id="c7-sec-0002"/><a id="c7-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Optical motion capture</span></h2>
<p class="paraaftertitle"><a id="c7-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Motion capture, or “mocap,” has evolved over nearly a century. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">Besides its role in biomechanics, it has also been an integral part of the entertainment industry. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.3">To animate characters in movies and video games, we go from reality (an actor swinging a stick around the room) to a series of images (an alien catching a butterfly in a net). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.4">In biomechanics, we are, in a sense, reversing this process: we use a series of images to determine what the underlying bones and muscles were doing to produce an observed motion.</span></p>
<p><a id="c7-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Whether in a movie studio or a biomechanics lab, the technology is the same. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">We affix small spherical retroreflective markers either to the subject's skin or onto plates that are then attached to the subject's body (</span><a id="c7-fig-0007a"/><a href="#c7-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Figure 7.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">Video cameras track the motion of these markers, typically using infrared light. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.3">Operating in the infrared spectrum has two benefits: it reduces the effects of ambient light and allows for pulsed illumination to reduce motion-blur artifacts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.4">The stroboscopic effect would be very distracting if we used visible light instead.</span></p>
<figure id="c7-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"><img src="../images/c7-fig-0006.jpg" alt="c7-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 7.6</span></a></span> <a id="c7-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Optical motion capture (mocap) is a popular technique for quantifying movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">We can estimate the motion of the underlying skeleton from the trajectories of points on the skin.</span></p></figcaption></figure>
<p><a id="c7-para-0021"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">In general, three noncollinear markers must be placed on a body segment to determine its position and orientation in space. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">Fewer than 3</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">n</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"> markers can track </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">n</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> body segments if some markers are assumed to be common to adjacent segments (e.g., if the marker on the lateral side of the knee is assumed to remain fixed relative to both the thigh and the shank). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">It is also possible to reduce the number of markers by using a kinematic model of the underlying skeleton. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">However, using more markers may improve joint angle estimates for some inverse kinematics algorithms.</span></p>
<p><a id="c7-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Each camera records a series of 2D images, capturing the location of each marker in that camera's local 2D image plane over time (</span><a id="c7-fig-0008a"/><a href="#c7-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Figure 7.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">For each time frame, a computer combines the location information from all cameras with knowledge of the relative position and orientation of each camera in space (determined during an earlier calibration procedure) to estimate the 3D location of each marker relative to a “global” laboratory reference frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.3">Because a single image does not provide accurate information about the distance between the camera and a marker, each marker must be visible by at least two cameras to determine its location in space. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.4">Increasing the number of cameras in the lab and the distance between them can improve marker location estimates, account for temporary marker occlusion that occurs as the subject moves, and enlarge the volume through which the subject's movement can be measured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.5">Two to four cameras may be sufficient for two-dimensional analyses; three-dimensional analyses over a large volume may require dozens. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.6">When a mocap system is calibrated and operated correctly, marker measurement errors are no greater than a few millimeters in a typical biomechanics experiment.</span></p>
<figure id="c7-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"><img src="../images/c7-fig-0007.jpg" alt="c7-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Figure 7.7</span></a></span> <a id="c7-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">The location of each marker is determined in each camera's local 2D image plane (e.g., by computing the centroid of each region of illuminated pixels, weighted by intensity; see crosshairs in inset). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">These 2D locations are then combined with information obtained during camera calibration to calculate the best estimate for the location of each marker in space, relative to a global reference frame.</span></p></figcaption></figure>
<p><a id="c7-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">The largest source of experimental measurement error is the motion of soft tissue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">Muscles bulge, fat jiggles, and skin stretches as we move, changing the relationship between the skin-mounted markers and the underlying bones we wish to track. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">Soft-tissue artifacts are unavoidable, but their effects can be reduced by placing markers in strategic locations and by using algorithms that account for these artifacts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.4">Several marker placement protocols are in common use; selection of a suitable protocol depends, in part, on the objectives of the study being performed and the inverse kinematics algorithm being used. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.5">Markers are often placed on bony anatomical landmarks where soft-tissue motion is relatively low, such as the tibial and fibular malleoli at the ankle.</span></p>
<p><a id="c7-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Placing markers on anatomical landmarks may be impractical in locations with large amounts of fat or because the marker would interfere with the motion being studied (e.g., on the medial side of the knee during walking). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">In such cases, “virtual markers” can be defined by relating the positions of anatomical landmarks (for example, the greater trochanter) to the positions of nearby skin-mounted markers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.3">When studying obese subjects, for example, we press a calibration wand of known length against the skin until the tip of the wand reaches the anatomical landmark. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.4">We capture a single frame of video to calculate the location of the tip from the positions of markers mounted along the length of the wand. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.5">This information gives us a relationship between the position of the markers on the skin and the location of the anatomical landmark, which we can then use to estimate the trajectory of the anatomical landmark during motion trials. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.6">It can also be useful to define virtual markers at joint centers, the locations of which can be estimated using the trajectories of skin-mounted markers as the joint moves through a large range of motion.</span></p>
<p><a id="c7-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">Even after we have created virtual markers, we typically need to do more work before our video data are suitable for analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">For example, we often want to obtain velocity data by taking the derivative of the measured position data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.3">But differentiation amplifies the high-frequency noise that these data typically contain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.4">One way to avoid this is to smooth the data with a low-pass filter, which removes high-frequency motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.5">But we must be careful to avoid filtering out meaningful information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.6">Because the frequency range of interest depends on the activity being studied, so too does the appropriate filter cutoff frequency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.7">For example, we may be interested in frequencies up to about 3 Hz for studying posture, 6 Hz for studying walking, and 10–15 Hz for studying running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.8">By contrast, frequencies up to 300 Hz may be relevant in a study of rapid changes in motion during the heel strike of running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.9">Unfortunately, soft-tissue artifacts often appear in the same frequency range as the signal of interest, so we need to address these errors through strategic marker positioning and algorithms that are designed to take them into account.</span></p>
<p><a id="c7-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">There are two other ways in which we process the raw video data before analyzing it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.2">First, it is common for markers to become temporarily obscured from a camera's view during an experiment, and thus the measured trajectories of these markers are incomplete. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.3">Short missing segments may be approximated using interpolation; longer gaps may be accommodated by simply ignoring the occluded marker, provided that enough other markers are visible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.4">Second, the cameras cannot distinguish between the retroreflective optical markers; a label must be applied to each marker in each frame of video. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.5">We may need to assign these labels manually or correct errors that were made by an automated labeling method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.6">To avoid marker labeling issues altogether, light-emitting “active” markers can be used in place of the retroreflective “passive” markers described above. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.7">Active markers can be sequentially pulsed so that only one marker is illuminated at any one time, making them uniquely identifiable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.8">Despite this advantage, we seldom use active markers in my laboratory. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.9">Many systems require a power supply and cables, which can encumber a subject's motion, and the frequency at which each marker can be pulsed (the rate at which data can be collected) decreases as more markers are added. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.10">For example, a mocap system operating at 1 kHz can capture only 10 markers unambiguously if they are pulsed at 100 Hz. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.11">A typical process for computing joint angles from mocap data is summarized in </span><a id="c7-fig-0009a"/><a href="#c7-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Figure 7.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"> and described below.</span></p>
<figure id="c7-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"><img src="../images/c7-fig-0008.jpg" alt="c7-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Figure 7.8</span></a></span> <a id="c7-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Typical process for computing joint angles from mocap data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">The trajectories of skin-mounted markers are recorded by a calibrated motion capture system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.3">A kinematic model of the subject is then used to estimate skeletal joint angles from 3D marker positions.</span></p></figcaption></figure>
<p><a id="c7-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">From Muybridge to the modern day, video-based analysis has been the workhorse of movement research. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">In the future, markerless motion capture technologies that use only video will increase in accuracy and popularity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.3">Body-worn accelerometers and IMUs will dramatically expand the types of biomechanical studies that can be performed and increase the number of people who participate in them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.4">In the remainder of this chapter, however, we will focus on the most common techniques currently used in biomechanics research and clinical motion capture labs, where we collect optical marker trajectories and compute skeletal joint kinematics.</span></p></section>
<section>
<h2><a id="c7-sec-0003"/><a id="c7-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Unconstrained inverse kinematics</span></h2>
<p class="paraaftertitle"><a id="c7-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">One common method for estimating joint angles from marker trajectories involves first establishing a reference frame (</span><a id="c7-fig-0010a"/><a href="#c7-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">Figure 7.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">) fixed to each body segment based on the positions of the markers attached to that segment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.2">The relative orientations of reference frames fixed to adjacent segments are then interpreted as the angles of the joints connecting the segments (</span><a id="c7-fig-0011a"/><a href="#c7-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Figure 7.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">We refer to this method as “unconstrained” inverse kinematics because no constraints, or limits, are imposed on either the limb lengths or the joint motions of the implied skeletal model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">(This approach has also been referred to as the “direct method” because joint angles are calculated “directly” from marker positions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.4">We discourage using this term to prevent confusion with “direct kinematics,” a synonym for “forward kinematics,” which describes the opposite process of computing the positions of markers given the angles of the joints.) Note that we are often interested in the joints’ angular velocities and angular accelerations as well, but we will assume that the joint angles can be differentiated with respect to time (after filtering, if necessary) to obtain these quantities.</span></p>
<figure id="c7-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"><img src="../images/c7-fig-0009.jpg" alt="c7-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0010a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Figure 7.9</span></a></span> <a id="c7-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">A reference frame fixed to a body is defined by a point on that body (the “origin” of the reference frame, O) and three orthogonal axes (X, Y, and Z). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">By convention, we use reference frames that are “right-handed”: if you extend the thumb and index finger of your right hand and align them with the X and Y axes, your middle finger will be aligned with the Z axis when it is pointed away from your palm (left). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.3">If you curl the fingers of your right hand from </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"><img src="../images/c7-fig-6007.jpg" alt="c7-fig-6007.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> to </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"><img src="../images/c7-fig-6008.jpg" alt="c7-fig-6008.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">, your fully extended thumb points in the direction of </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1"><img src="../images/c7-fig-6009.jpg" alt="c7-fig-6009.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> (right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">In a right-handed coordinate system, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"><img src="../images/c7-fig-6010.jpg" alt="c7-fig-6010.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">.</span></p></figcaption></figure>
<figure id="c7-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"><img src="../images/c7-fig-0010.jpg" alt="c7-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0011a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Figure 7.10</span></a></span> <a id="c7-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Joint angles can be calculated by comparing the orientations of reference frames fixed to adjacent body segments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">Knee flexion can be computed by inspection in a two-dimensional analysis (left), but a more formal approach is useful when computing the relative orientation between two frames in three dimensions (right).</span></p></figcaption></figure>
<p><a id="c7-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Suppose we sought to measure a subject's knee flexion angle (specifically, the angle between the femur and tibia about the knee joint axis) throughout a gait cycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">In the simplest scenario, we would track the motion of two reference frames over time: one fixed to the femur and one fixed to the tibia, both aligned with the anatomical knee joint axis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.3">The knee angle could then be defined simply as the relative orientation of these reference frames in the plane orthogonal to the knee axis (</span><a href="#c7-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Figure 7.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">More commonly, however, we would track the positions of markers affixed to the thigh and shank, and must perform two additional calculations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.3">First, we must compute the position and orientation of the thigh and shank body segments by constructing body-fixed reference frames from the marker positions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.4">Second, because markers placed on the medial femoral epicondyles are likely to be occluded and may interfere with the subject's gait, the location and orientation of the knee anatomical joint axis is generally not tracked directly and must also be determined from the positions of the markers affixed to the thigh and shank. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.5">Clearly, this scenario is more complex, and the remainder of this section describes each step of the unconstrained inverse kinematics method in detail.</span></p>
<p><a id="c7-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">The number and locations of markers can vary depending on the study objectives, the motion being tracked, and the software used for analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.2">It is common to use two sets of markers, one to define anatomical reference frames and one to define tracking reference frames (</span><a id="c7-fig-0012a"/><a href="#c7-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">Figure 7.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">Anatomical reference frames represent the underlying skeletal structure and are defined by placing markers on anatomical landmarks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.3">For example, the anatomical reference frame fixed to the femur might be defined as follows:</span></p>
<figure id="c7-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1"><img src="../images/c7-fig-0011.jpg" alt="c7-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">Figure 7.11</span></a></span> <a id="c7-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Body-fixed reference frames determined from markers mounted on anatomical landmarks (anatomical reference frames) and markers mounted on body segments (tracking reference frames); m = marker, GT = greater trochanter, ME/LE = medial/lateral femoral epicondyle, MM/LM = medial/lateral malleolus, Th = thigh, Sh = shank.</span></p></figcaption></figure>
<ol class="none">
<li><a id="c7-li-0001"/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">1. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">The origin is midway between the greater trochanter marker (m</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">GT</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">) and the knee joint center (the midpoint between the medial and lateral femoral epicondyle markers, m</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">ME</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"> and m</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">LE</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">);</span></li>
<li><a id="c7-li-0002"/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">2. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Z</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">femur</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1"> is parallel to the knee joint axis, which is defined as the vector from medial to lateral femoral epicondyle markers, normalized to unit length;</span></li>
<li><a id="c7-li-0003"/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">3. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">femur</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1"> is the cross product of Z</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">femur</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1"> and a vector from the greater trochanter marker to one of the femoral epicondyle markers, normalized to unit length;</span></li>
<li><a id="c7-li-0004"/><span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">4. </span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">femur</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1"> is the cross product of Z</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">femur</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1"> and X</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">femur</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">, which completes the right-handed reference frame (</span><a href="#c7-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">Figure 7.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">).</span></li></ol>

<p><a id="c7-para-0040"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">A reference frame fixed to the tibia can be defined similarly, again using the femoral epicondyle markers to define the Z axis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.2">We can then define the knee flexion angle as the angle of the tibia reference frame relative to the femur frame about the (parallel) Z axes.</span></p>
<p><a id="c7-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">Tracking reference frames are also fixed to body segments, but they might not be aligned with anatomically relevant axes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.2">Tracking reference frames are defined by at least three noncollinear markers on each segment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.3">These markers need not be distinct from those used to define anatomical reference frames, but they should be placed in locations that will remain visible throughout the experiment and have relatively small amounts of soft-tissue motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.4">For example, the greater trochanter and lateral femoral epicondyle markers could be used to define the thigh reference frame along with one additional marker placed somewhere on the thigh. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.5">An orthogonal, right-handed reference frame can then be defined from these markers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.6">Tracking reference frames are useful because they allow us to place markers in more convenient locations than the anatomical landmarks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.7">We still require anatomical reference frames to compute joint angles, but the anatomical frames can be readily computed once the tracking frames are known, as described in the next section.</span></p></section>
<section>
<h2><a id="c7-sec-0004"/><a id="c7-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">Transformation matrices</span></h2>
<p class="paraaftertitle"><a id="c7-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">In the example above, computing the knee flexion angle was straightforward because the anatomical reference frames fixed to the femur and tibia were defined with parallel Z axes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.2">Thus, the orientation of one frame relative to the other could be described by a single angle of rotation about the common Z axis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.3">In general, we relate two arbitrarily oriented reference frames by not one but </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">three</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1"> angles, which we call Euler angles (named after the eighteenth-century mathematician Leonhard Euler). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.2">These angles always describe a sequence of consecutive rotations about three axes, but the order of the rotations is not unique. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.3">For example, you might describe rotating about the X axis, then about the Y axis, and finally about the Z axis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.4">Alternatively, you might rotate about the Z axis first, or about the rotated Y axis rather than the original one. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.5">A few choices for these three axes are more common than the others. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.6">In aeronautics, for example, the axes of rotation are traditionally chosen such that the three angles are the yaw, pitch, and roll (</span><a id="c7-fig-0013a"/><a href="#c7-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">Figure 7.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.2">This sequence of rotations is called a Z–Y–X body-fixed rotation sequence, “body-fixed” because each rotation occurs with respect to the frame that is attached to the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.3">(The alternative is called “space-fixed,” where each rotation is performed about one of the lab frame's axes.)</span></p>
<figure id="c7-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1"><img src="../images/c7-fig-0012.jpg" alt="c7-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c7-fig-0013a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">Figure 7.12</span></a></span> <a id="c7-para-0043"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">Yaw, pitch, and roll describe the three angles of rotation in the popular Z–Y–X body-fixed rotation sequence.</span></p></figcaption></figure>
<p><a id="c7-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">Suppose we are given two reference frames, A and B, and a point whose coordinates are expressed relative to frame B, and we wish to compute this point's coordinates relative to frame A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.2">We can relate the orientations of these two frames by means of a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">rotation matrix</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">, a 3×3 matrix </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">A</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1"> whose columns are simply the coordinates of unit vectors pointed along frame B's X, Y, and Z axes, when they are expressed relative to frame A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.2">Once we know this matrix, we can transform the frame-B coordinates of any point, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">p</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">, into the corresponding frame-A coordinates by multiplying the matrix </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">A</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1"> by the vector </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">p</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">:</span></p>
<p><a id="c7-para-0045"/></p>
<figure id="c7-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1"><img src="../images/c7-fig-3001.jpg" alt="c7-fig-3001.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">(7.1)</span></p></figcaption></figure>

<p><a id="c7-para-0047"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">By analogy, we can transform the frame-A coordinates of any point, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">p</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">A</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">, into the corresponding frame-B coordinates by multiplying the matrix </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">B</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">A</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1"> by the vector </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">p</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">A</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.2">Equivalently, we could compute </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">p</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1"> from </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">p</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">A</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1"> by premultiplying each side of Equation 7.1 by (</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">A</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">)</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">−1</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">:</span></p>
<p><a id="c7-para-0048"/></p>
<figure id="c7-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1"><img src="../images/c7-fig-3002.jpg" alt="c7-fig-3002.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0049"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">(7.2)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">which reveals the following relationship:</span></p>
<p><a id="c7-para-0050"/></p>
<figure id="c7-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1"><img src="../images/c7-fig-3003.jpg" alt="c7-fig-3003.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0051"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">(7.3)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">In fact, rotation matrices satisfy a property called orthogonality, which means that the inverse of a rotation matrix is equal to its transpose:</span></p>
<p><a id="c7-para-0052"/></p>
<figure id="c7-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1"><img src="../images/c7-fig-3004.jpg" alt="c7-fig-3004.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0053"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">(7.4)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">Thus, we can also define </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">A</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1"> as the rotation matrix whose rows are the coordinates of unit vectors pointed along frame A's X, Y, and Z axes, when they are expressed relative to frame B.</span></p>
<p><a id="c7-para-0054"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">To derive the relationship between the matrix </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">A</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1"> and a particular set of Euler angles, we will begin with an analogy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.2">Imagine that you are sitting in an airplane preparing for takeoff and have defined a coordinate system whose X axis points out the nose of the plane, whose Y axis points toward the right wing, and whose Z axis points down (</span><a href="#c7-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">Figure 7.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.2">We will call this frame the lab frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.3">Now, fasten your seatbelt and imagine the plane executing three maneuvers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.4">First, it turns to the right as it taxis toward the runway, rotating about the Z axis by an angle </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">ψ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.2">(For now, we will ignore the distance the plane has moved down the taxiway and consider only the change in its orientation.) This maneuver, called a “yaw” in aeronautics, results in a new set of basis vectors for axes X′, Y′, and Z′. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.3">Note that Z′ = Z because the direction of the “down” vector has not changed as a result of the right turn. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.4">The axes {X′, Y′, Z′} define a new reference frame, which we will call frame 1 or f1.</span></p>
<p><a id="c7-para-0055"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Second, the plane takes off, lifting its nose (rotating about the Y′ axis) by an angle </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">θ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.2">This motion, which the pilot would call “pitch,” results in another new reference frame, f2 = {X″, Y″, Z″}, as shown in </span><a href="#c7-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">Figure 7.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.2">This time, Y″ = Y′ because pitching the nose upward does not affect the direction in which the right wing is pointing.</span></p>
<p><a id="c7-para-0056"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Third, the plane banks to one side, tipping the right wing down (rotating about the X″ axis) by an angle </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.2">This maneuver is called “roll” in aeronautics and results in a third reference frame that we will call the body frame: body = {X′′′, Y′′′, Z′′′}. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.3">In this case, X′′′ = X″ because tipping a wing up or down does not change the direction in which the plane's nose is pointing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.4">In this manner, we can arrive at the reference frame fixed to any body in space, starting from an inertial or lab-fixed frame and performing the above three maneuvers in sequence.</span></p>
<p><a id="c7-para-0057"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">How do we transform from a (movable) body-fixed reference frame back to a (stationary) lab-fixed frame? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.2">In symbols, what is the matrix </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">lab</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">b</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">o</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">dy</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.2">Or in words, how do we convert a measurement from a body-fixed sensor to an observation in our preferred lab coordinates?</span></p>
<p><a id="c7-para-0058"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">Thanks to our airplane analogy, we hope that the answer is relatively obvious: we undo the above sequence of rotations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.2">To transform from body to lab coordinates, we first transform from the body frame to the f2 frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.3">Then we transform from the f2 frame to the f1 frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.4">Finally, we transform from the f1 frame to the lab frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.5">Thus, we compute the rotation matrix labRbody as follows:</span></p>
<p><a id="c7-para-0059"/></p>
<figure id="c7-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1"><img src="../images/c7-fig-3005.jpg" alt="c7-fig-3005.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0060"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">(7.5)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">Note the order of the transformations, which may not be obvious at first. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.2">Because these transformations can be thought of as a sequence of functions, we write their composition from right to left, so transformation </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">f2</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">b</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">o</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">dy</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1"> (from body coordinates to f</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1"> coordinates) is applied first.</span></p>
<p><a id="c7-para-0061"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">A big payoff of the above decomposition is that each of the three rotation matrices has a particularly simple form. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.2">We start with the transformation from f</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1"> coordinates to lab coordinates:</span></p>
<p><a id="c7-para-0062"/></p>
<figure id="c7-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1"><img src="../images/c7-fig-3006.jpg" alt="c7-fig-3006.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0063"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">(7.6)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">To see why the matrix has this form, remember that the first column of a rotation matrix expresses the coordinates of the new X′ axis with respect to the original {X, Y, Z} reference frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.2">And remember what X′ is: the direction the nose of the plane points after rotating about the Z axis by the angle </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">ψ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.2">A unit vector in that direction is (cos</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">ψ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">, sin</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">ψ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">, 0), which are indeed the entries in the first column of the matrix. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.2">Similarly, the third column is the direction of the Z′ axis in the {X, Y, Z} reference frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.3">Keeping in mind that Z′ = Z, as we pointed out earlier, we conclude that the unit vector in this direction is just (0, 0, 1), and hence that is the third column of the rotation matrix.</span></p>
<p><a id="c7-para-0064"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">We can also check this matrix by transforming points along each coordinate axis in frame f1 to the lab frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.2">For example, a bird sitting on the right wing might have the following coordinates when expressed with respect to the lab frame:</span></p>
<p><a id="c7-para-0065"/></p>
<figure id="c7-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1"><img src="../images/c7-fig-3007.jpg" alt="c7-fig-3007.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0066"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">(7.7)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">If the airplane were to make a right turn (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">ψ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1"> = 90 degrees), then the bird would end up where the rudder used to be. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.2">The bird's coordinates relative to the original frame would be (−1, 0, 0). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.3">Using similar arguments, we can show that</span></p>
<p><a id="c7-para-0067"/></p>
<figure id="c7-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1"><img src="../images/c7-fig-3008.jpg" alt="c7-fig-3008.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0068"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">(7.8)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">and</span></p>
<p><a id="c7-para-0069"/></p>
<figure id="c7-fig-0022"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1"><img src="../images/c7-fig-3009.jpg" alt="c7-fig-3009.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0070"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">(7.9)</span></p></figcaption></figure>

<p><a id="c7-para-0071"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">The matrices in Equations 7.6, 7.8, and 7.9 are called </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">elementary rotation matrices</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1"> because, in each case, one of the body-fixed coordinate axes remains stationary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.2">The full rotation transformation </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">lab</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">b</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">o</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">dy</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1"> is given by the product of these three elementary rotation matrices in the prescribed order:</span></p>
<p><a id="c7-para-0072"/></p>
<figure id="c7-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1"><img src="../images/c7-fig-3010.jpg" alt="c7-fig-3010.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0073"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">(7.10)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">where each entry </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">r</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">ij</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1"> is a number between 1 and 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.2">We can compute the angles, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">ψ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1">θ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1"> from the numeric entries of any rotation matrix by setting its entries equal to the corresponding trigonometric expressions in Equation 7.10. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.2">A unique solution is obtained only if limits are imposed on the three angles; one strategy is to use the 4-quadrant (2-argument) inverse tangent function (atan2) as follows:</span></p>
<p><a id="c7-para-0074"/></p>
<figure id="c7-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1"><img src="../images/c7-fig-3011.jpg" alt="c7-fig-3011.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0075"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">(7.11)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">Note that we could compute the angles corresponding to a different sequence of rotations (e.g., rotating about X, then Y′, then Z″) simply by relating the numeric entries </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">r</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">ij</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1"> to a different symbolic rotation matrix. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.2">We would simply compute the product of a different set of elementary rotation matrices in Equation 7.10.</span></p>
<p><a id="c7-para-0076"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">In the foregoing discussion, we assumed that all reference frames shared a common origin and thus were related through rotation transformations alone. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.2">However, reference frames that are attached to different body segments (e.g., the thigh and shank) usually have different origins and thus are related by translations as well as rotations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.3">In general, the transformation from coordinates in frame B to coordinates in frame A is accomplished by a combination of a rotation </span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">A</span></sup><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">R</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">B</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1"> and a translation:</span></p>
<p><a id="c7-para-0077"/></p>
<figure id="c7-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1"><img src="../images/c7-fig-3012.jpg" alt="c7-fig-3012.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c7-para-0078"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">(7.12)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">where </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1"><img src="../images/c7-fig-6001.jpg" alt="c7-fig-6001.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1"> is the position vector from the origin of frame A (Ao) to the origin of frame B (Bo), expressed in frame A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.2">(Note that Equation 7.12 simplifies to Equation 7.1 when the origins of frames A and B are coincident.) This kind of transformation, which combines rotations with a translation, can be conveniently represented using a 4×4 transformation matrix that captures the relative position and orientation between two frames:</span></p>
<p><a id="c7-para-0079"/></p>
