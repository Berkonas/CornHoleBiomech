<p><a id="c4-para-0067"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">The effects of rate encoding and motor unit recruitment can be incorporated into a mathematical model of activation dynamics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.2">There are many strategies for modeling muscle activation; my laboratory uses the following approach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.3">The model accepts as input a time-varying function </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">u</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">) that describes the strength of the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">excitation</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1"> signal from the nerve to the muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.2">Its output, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">), is the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">activation</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">, which represents the availability of calcium ions within the intracellular space and, thus, the extent to which cross-bridge cycling can occur. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.2">Both </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">u</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">) and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">) vary between 0 (no excitation; no cross-bridge cycling) and 1 (maximum excitation; fused tetanus and all motor units recruited).</span></p>
<p><a id="c4-para-0068"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">We model the relationship between excitation and activation with an empirically determined first-order ordinary differential equation:</span></p>
<p><a id="c4-para-0069"/></p>
<figure id="c4-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1"><img src="../images/c4-fig-3001.jpg" alt="c4-fig-3001.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c4-para-0070"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">(4.1)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">Parameters </span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">A</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1"> and </span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">D</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1"> represent the activation and deactivation time constants. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.2">As mentioned above, </span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">A</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1"> is smaller than </span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">D</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">; typical values are 10 and 40 ms, respectively, but these values may vary with age, muscle composition, and other factors. </span><a id="c4-fig-0018a"/><a href="#c4-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">Figure 4.16</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1"> shows a typical solution to this differential equation, when the input </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">u</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">) is a square wave.</span></p>
<figure id="c4-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1"><img src="../images/c4-fig-0016.jpg" alt="c4-fig-0016.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0018a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">Figure 4.16</span></a></span> <a id="c4-para-0071"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">A computational model of activation dynamics relates excitation (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">u</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">)) to activation (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">)) using a first-order ordinary differential equation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.2">Excitation often lags behind a measured EMG signal, and force production lags further still.</span></p></figcaption></figure></section>
<section>
<h2><a id="c4-sec-0011"/><a id="c4-title-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">Modeling the force–length–velocity–activation relationship</span></h2>
<p class="paraaftertitle"><a id="c4-para-0072"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">As we have seen, the force generated by a muscle depends on the length and velocity of its fibers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.2">Muscle force is also modulated by motor unit firing rate and recruitment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.3">The functional relationship between force, length, and velocity can be illustrated at maximal activation (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">) = 1) as shown in </span><a id="c4-fig-0019a"/><a href="#c4-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">Figure 4.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">, where the force-generating capacity at a particular length and velocity is simply the product of the corresponding values on the force–length and force–velocity curves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.2">Notice that the cross-sections of this graph created by holding one variable constant (either length or velocity), shown in blue and green, are exactly the same as the active force–length and force–velocity curves we have already seen. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.3">In </span><a id="c4-fig-0020a"/><a href="#c4-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Figure 4.18</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">, we see the effect of submaximal activations (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">) &lt; 1), which scale the surface plot downward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.2">The passive component of the force–length relationship is not illustrated in </span><a href="#c4-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">Figures 4.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1"> or 4.18, but it is always contributing force in healthy muscle and does not depend on activation.</span></p>
<figure id="c4-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1"><img src="../images/c4-fig-0017.jpg" alt="c4-fig-0017.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0019a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Figure 4.17</span></a></span> <a id="c4-para-0073"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">Muscle force-generating capacity varies with fiber length and velocity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.2">Adapted from Lieber (2010).</span></p></figcaption></figure>
<figure id="c4-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1"><img src="../images/c4-fig-0018.jpg" alt="c4-fig-0018.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0020a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">Figure 4.18</span></a></span> <a id="c4-para-0074"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">The nervous system modulates muscle force through rate encoding and motor unit recruitment, collectively modeled by muscle activation (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">).</span></p></figcaption></figure>
<p><a id="c4-para-0075"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">The model shown in </span><a href="#c4-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">Figure 4.18</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1"> is, of course, a simplification of how real muscle behaves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.2">For example, we have assumed that fiber length, fiber velocity, and activation affect muscle force generation independently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.3">In real muscle, these relationships are more complex. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.4">Also, force generation depends on past states as well as temperature and fatigue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.5">Nevertheless, as we will see, simplified models like these are powerful tools because they are easy to understand but sufficiently detailed to provide insight into muscle-driven movement.</span></p>
<p><a id="c4-para-0076"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">We all know that muscles come in a wide variety of shapes and sizes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.2">In the next chapter, we will see how to use the concepts we have covered here to formulate a computational model of muscle—that is, a model that can be used to perform numerical analyses and generate simulations of movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.3">The model will enable us to represent the force-generating properties of many different muscles in a wide variety of conditions.</span></p></section>
</section>
