<header>
<h1><a id="c4-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">4</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Muscle Biology and Force</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c4-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Alone we can do so little. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.2">Together we can do so much.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">—Helen Keller</span></p></blockquote>
<p><a id="c4-para-0002"/></p>
<figure id="c4-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"><img src="../images/c4-fig-5001.jpg" alt="c4-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c4-para-0003"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">the royal society of london</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> is a 350-year-old institution with a nearly 200-year-old tradition of public lectures by scientists, often accompanied by simple experiments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">In 1952, one of these experiments became the talk of the town.</span></p>
<p><a id="c4-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Two stationary bicycles were oriented in opposite directions and linked together by a single chain, so that pedaling forward on one bike caused the pedals on the other bike to go backward (</span><a id="c4-fig-0002a"/><a href="#c4-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Figure 4.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">).</span></p>
<figure id="c4-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1"><img src="../images/c4-fig-0001.jpg" alt="c4-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Figure 4.1</span></a></span> <a id="c4-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">The </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">push-me–pull-you</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1"> device described by Abbott et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">(1952).</span></p></figcaption></figure>
<p><a id="c4-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">On one bike sat a petite woman named Brenda Bigland, a leading expert on muscle fatigue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">On the other sat a strapping young man named Murdoch Ritchie, who was married to his cycling “opponent.” </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">The lecturer was A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">V. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.5">Hill, who had been awarded a Nobel Prize for his work on heat production in muscles.</span></p>
<p><a id="c4-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">On command, Ritchie pedaled forward as hard as he could, while Bigland resisted his pedaling as her pedals moved backward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">Imagine the amazement of the audience when they saw the small woman easily preventing the large man from pedaling faster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">He was soon sweating profusely and gasping for breath while she expended very little energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.4">Even the Lord Mayor of London came up afterward and wanted to give it a spin. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.5">“The equipment came to be named the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">push-me–pull-you</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">, after Dr. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">Doolittle's two-headed animal that never knew which way it was going,” wrote Brenda Bigland-Ritchie later.</span></p>
<p><a id="c4-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Magic? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">Parlor trick? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">No, but it does show that there is nothing obvious about the way that muscles consume energy and generate forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.4">When muscles do positive work (such as when they act as the “motors” during forward pedaling) they consume more energy and generate more heat than when they do negative work (such as when they act as brakes to resist pedaling). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.5">In general, the forces produced and energy consumed by a muscle depend very much on whether it is shortening or lengthening. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.6">The lessons learned from Hill's experiment are still applied every day in rehabilitation and resistance training. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.7">As we will see, the magic happens at the molecular level.</span></p>
<p><a id="c4-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">This chapter and the next take a deep look inside muscles, exploring the relationship between their structure and function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">Muscles are amazing biological motors, capable of silently generating thousands of newtons of force in a fraction of a second. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.3">The forces are so large that the muscles of your calf could pick up the back end of a small car. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.4">These large forces are generated through the combined actions of trillions of nanoscale molecular motors that convert the chemical energy derived from the food we eat into mechanical work that enables us to move. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.5">This remarkable function is a result of the specialized cellular machinery and the highly organized hierarchical structure of skeletal muscle (</span><a id="c4-fig-0003a"/><a href="#c4-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Figure 4.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">).</span></p>
<figure id="c4-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"><img src="../images/c4-fig-0002.jpg" alt="c4-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0003a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Figure 4.2</span></a></span> <a id="c4-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Multiscale structure of muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">Skeletal muscle is structured hierarchically, with nanoscale molecular motors called myosin, each of which generates only a few piconewtons of force, arranged into sarcomeres, myofibrils, fibers, fascicles, and whole muscles that can generate thousands of newtons of force during powerful muscle contractions.</span></p></figcaption></figure>
<p><a id="c4-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">The organization of the next two chapters will roughly follow the hierarchical structure of muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">We will begin by studying the force-generating process at the molecular level. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">Next, we will see how molecular motors are packed into subcellular structures called sarcomeres. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">(The first image of sarcomeres in a live human was captured in my arm and is shown in this chapter's opening figure.) Moving up in scale, we will see how individual muscle cells are activated by the nervous system and learn the difference between “fast-twitch” and “slow-twitch” muscle fibers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.5">In Chapter 5, we will look at the macroscopic scale and see how muscles are arranged in the body and how they interact with tendons, the structures that convey muscle forces to the bones.</span></p>
<section>
<h2><a id="c4-sec-0001"/><a id="c4-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Muscle structure</span></h2>
<p class="paraaftertitle"><a id="c4-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">At the most basic level, muscles generate force via the interaction of two long, narrow proteins called actin and myosin. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">In the early 1950s, Hugh Huxley discovered through X-ray microscopy that these proteins line up in parallel, interlacing fibers, with connections between them that he called </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">cross-bridges</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">Andrew Huxley (no relation to Hugh) discovered cross-bridges at the same time using different methods. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">Both Huxleys suspected that the cross-bridges were the mechanism that generated force, and in 1954 they proposed a model for how these molecular motors work, which we explain below. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">Their model has remained the basic paradigm for explaining force generation ever since, although it has become more detailed as more experimental data have been collected.</span></p>
<p><a id="c4-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Any single molecular motor generates only a few piconewtons of force when forming a cross-bridge. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">Massive teams of these motors are organized into subcellular structures called </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">sarcomeres</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">, which are about 3 μm long. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">These in turn are connected end-to-end to form long, thin strands called </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">myofibrils</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">In long muscles, a myofibril may contain more than 50,000 sarcomeres in series. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.3">Myofibrils are arranged in parallel to form a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">muscle fiber</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"> or myocyte (“muscle cell”). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">Muscle fibers are roughly 50 μm across and can be tens of centimeters long. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">Because muscle fibers are cells, they contain the typical organelles required for essential cellular functions, such as nuclei and mitochondria. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">They also contain a special-purpose structure called the sarcoplasmic reticulum, which stores the calcium required to activate muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.5">We will explore the role of calcium in more detail later in this chapter.</span></p>
<p><a id="c4-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Moving up the size scale, muscle fibers are arranged in bundles called </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">muscle fascicles</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"> which, like muscle fibers, can be tens of centimeters long. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">The cross-section of a muscle fascicle measures about 1 mm across. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.3">In addition to muscle fibers, the fascicle also contains connective tissue called the extracellular matrix, which includes collagen, nerve fibers, and blood vessels. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.4">Muscle fibers are packed tightly in healthy muscle; in diseased muscle, however, muscle fiber cross-sections can be smaller and separated by more extracellular matrix and fat.</span></p>
<p><a id="c4-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">The fascicles are surrounded by more connective tissue, and pack together to form a muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">An additional sheath of connective tissue called fascia encapsulates the muscle and separates it from other muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.3">The muscle fibers that terminate at the end of each fascicle may attach directly to bones, but typically they connect to tendons which then attach to bones. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.4">The region of the tendon that inserts into the muscle is known as the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">aponeurosis</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">; the region of tendon that is external to the muscle is often called the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">free tendon</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">As we will see in Chapter 5, tendons play important roles by not only transferring muscle forces to the skeleton, but also storing and releasing energy as they stretch and recoil.</span></p></section>
<section>
<h2><a id="c4-sec-0002"/><a id="c4-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">The cross-bridge cycle</span></h2>
<p class="paraaftertitle"><a id="c4-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">When activated by the nervous system, muscles generate force through the coordinated action of trillions of actin and myosin proteins in a process called the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">cross-bridge cycle</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"> (</span><a id="c4-fig-0004a"/><a href="#c4-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Figure 4.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">This mechanism can be roughly described as a molecular-sized ratchet.</span></p>
<figure id="c4-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"><img src="../images/c4-fig-0003.jpg" alt="c4-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Figure 4.3</span></a></span> <a id="c4-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">The cross-bridge cycle describes the process by which actin and myosin interact to produce force and motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">A is adenosine; P is phosphate.</span></p></figcaption></figure>
<p><a id="c4-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">The myosin molecule has three regions, known as the head, neck, and tail. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.2">The unique structure of the myosin head allows it to bind firmly to certain locations on the actin filament (first frame of </span><a href="#c4-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Figure 4.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">When the muscle is called on to produce force, the myosin head receives exactly one molecule of a fuel called adenosine triphosphate (ATP). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.3">This stimulates the myosin head to detach from the actin, rotate forward, and attach to the next binding site on the actin (frames 2 and 3 in </span><a href="#c4-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Figure 4.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.2">Next, the myosin head pivots about the neck region in a motion referred to as the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">power stroke</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">, which generates a few piconewtons of force and slides the filaments about 10 nm past each other.</span></p>
<p><a id="c4-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Of course, it is impossible to perform mechanical work without consuming energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">The energy comes from a chemical reaction that detaches one phosphate ion from the ATP (frame 4 in </span><a href="#c4-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Figure 4.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">), leaving adenosine diphosphate (ADP). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">Finally, the ADP is released and the myosin returns to its original state, but now displaced from its original position. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.3">As myosin proteins cycle in this way, the thin filaments are pulled toward the middle of the sarcomere, thereby creating tension as chemical energy is converted into mechanical energy.</span></p>
<p><a id="c4-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">While this mechanism might sound complex, it is an elegant and economical solution to the problem of how to generate force in a predictable direction at the molecular level. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">Like automobile engines, our muscles convert chemical energy into mechanical work, but with less noise and less toxic exhaust.</span></p></section>
<section>
<h2><a id="c4-sec-0003"/><a id="c4-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Sarcomere structure</span></h2>
<p class="paraaftertitle"><a id="c4-para-0021"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Moving one step up in scale, we come to sarcomeres, which are roughly cylindrical and vary in length between about 1 and 5 μm depending on the length of the muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">Sarcomeres are comprised of many interlacing “thick” and “thin” filaments, which slide past each other as the sarcomere changes length.</span></p>
<p><a id="c4-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Hundreds of myosin tails are bundled together to form each thick filament, giving rise to rodlike structures with myosin heads emanating radially outward at regular intervals (</span><a id="c4-fig-0005a"/><a href="#c4-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Figure 4.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">Running parallel to the thick filaments are the thin filaments, which are composed of three proteins: actin, tropomyosin, and troponin. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.3">We have already described actin, which provides binding sites for the myosin heads. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.4">The binding sites are spaced at regular intervals along the thin filament. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.5">Tropomyosin and troponin help to regulate force production by exposing these binding sites only when the muscle is activated by the nervous system and calcium is present. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.6">One additional protein of interest, called titin, attaches each thick filament to the ends of the sarcomere (which we call the Z-lines or Z-discs). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.7">As we will see later, titin plays an important role in passive force generation, a separate process from the cross-bridge cycle and a phenomenon that the Huxleys’ original model missed.</span></p>
<figure id="c4-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"><img src="../images/c4-fig-0004.jpg" alt="c4-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0005a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Figure 4.4</span></a></span> <a id="c4-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Schematics of myosin (top), interaction of thick and thin filaments (center), and cross-section of myofibril showing thick and thin filaments arranged in a highly organized three-dimensional pattern (bottom).</span></p></figcaption></figure>
<p><a id="c4-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Sarcomeres are arranged in series and parallel within skeletal muscle in a regular pattern, resulting in striations, or alternating light and dark bands, when skeletal muscle tissue is viewed under a microscope. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">You can see these bands in </span><a id="c4-fig-0006a"/><a href="#c4-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Figure 4.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">, which go by the names of I-bands, A-bands, Z-discs, and M-discs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">Properly speaking, the Z-discs and M-discs are indeed discs, but they are often called Z-lines and M-lines because that is what they look like when viewed in two dimensions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.3">The A-bands appear only in regions containing myosin, and the I-bands appear elsewhere. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.4">The thin actin filaments are anchored at one end to the Z-discs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.5">The thick myosin filaments attach at one end to structures in the M-disc and at the other end are tethered to the Z-discs by titin molecules. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.6">Skeletal muscles are sometimes referred to as “striated” muscles—in contrast to “smooth” muscles, such as those that control the caliber of blood vessels, which are not organized into sarcomeres and do not exhibit striated patterns.</span></p>
<figure id="c4-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"><img src="../images/c4-fig-0005.jpg" alt="c4-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0006a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Figure 4.5</span></a></span> <a id="c4-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">A schematic of a myofibril (top) shows its highly organized microscopic structure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">The I-band, A-band, M-line, and Z-line are labeled in a microscopic image of muscle (middle) and a schematic of a sarcomere (bottom). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.3">The ends of the sarcomere are defined by the Z-lines.</span></p></figcaption></figure></section>
<section>
<h2><a id="c4-sec-0004"/><a id="c4-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">Force–length relationship</span></h2>
<p class="paraaftertitle"><a id="c4-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">The maximum force that can be generated by a sarcomere changes as the sarcomere changes length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.2">The relationship between length and tension can be explained by the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">sliding filament theory</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">, which was independently proposed by two research teams in 1954. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">Andrew Huxley and Rolf Niedergerke (in single muscle fibers) and Hugh Huxley and Jean Hanson (in isolated myofibrils) showed that the A-band does not narrow during active muscle contraction, which disproved the prevailing theory that the thick filaments shorten. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">The explanation they offered was that the thick and thin filaments slide past each other as the sarcomere changes length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.4">As a consequence, the length of the sarcomere affects the amount of “overlap” between the actin and myosin, or the number of myosin heads that are in proximity to binding sites on the thin filament. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.5">As the number of cross-bridges between myosin heads and actin binding sites increases, so does the tension within an activated sarcomere.</span></p>
<p><a id="c4-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">The force that can be generated by cross-bridge cycling in activated muscle varies with sarcomere length as shown in </span><a id="c4-fig-0007a"/><a href="#c4-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Figure 4.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">This </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">active force–length curve</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"> is often described as having three regions: an ascending region where force increases with increasing sarcomere length, a plateau region where force remains at its maximum, and a descending region where force decreases with increasing sarcomere length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.2">The plateau region spans a range of sarcomere lengths known as the “optimal” range, where the number of interactions between myosin heads and actin binding sites is at a maximum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.3">The optimal sarcomere length varies across vertebrates, but generally lies between 2.2 and 2.7 μm, and is around 2.7 μm in human skeletal muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.4">The amount of actin–myosin overlap decreases when sarcomeres become longer than the optimal range, as does the force that can be generated by cross-bridge cycling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.5">At lengths slightly shorter than optimum, the thin filaments originating at opposite ends of the sarcomere begin to overlap and interfere with each other in the middle of the sarcomere, hence the decrease in force in this so-called “shallow ascending region.” </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.6">At even shorter lengths (in the “steep ascending region”), the thick filaments collide with the Z-discs and deform, generating a force that opposes the action of the cross-bridge cycling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.7">Because muscles are composed of sarcomeres arranged in series and parallel, we can observe a similar relationship between force and length during active contraction in whole muscle.</span></p>
<figure id="c4-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"><img src="../images/c4-fig-0006.jpg" alt="c4-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Figure 4.6</span></a></span> <a id="c4-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">The active force generated by a sarcomere is a function of its length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.2">Force varies as the thick and thin filaments slide past each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.3">Force increases with length in the ascending limb of the curve, plateaus, and decreases with length in the descending limb. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.4">Force generation peaks when the maximum number of cross-bridges are formed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.5">Adapted from Gordon et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.6">(1966).</span></p></figcaption></figure>
<p><a id="c4-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">Muscles generate force when stretched beyond their resting length even when they are inactive, like a nonlinear spring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">This </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">passive force–length relationship</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1"> arises primarily from two structures in the muscle: titin and the connective tissue surrounding fibers, fascicles, and muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.2">Titin is a large, flexible protein that tethers the thick filament to the Z-discs at either end of the sarcomere. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.3">Titin is coiled and has low stiffness when the sarcomere is short; as the sarcomere lengthens, the titin straightens and its stiffness increases (</span><a id="c4-fig-0008a"/><a href="#c4-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">Figure 4.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.2">The connective tissue that surrounds muscle fibers exhibits a similar force–length behavior. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.3">The total force generated by the muscle when it is activated is the sum of its passive force and the active force generated by the cross-bridges (</span><a id="c4-fig-0009a"/><a href="#c4-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Figure 4.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">).</span></p>
<figure id="c4-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1"><img src="../images/c4-fig-0007.jpg" alt="c4-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Figure 4.7</span></a></span> <a id="c4-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">Titin attaches the thick filaments to the Z-discs at either end of the sarcomere and develops force when stretched.</span></p></figcaption></figure>
<figure id="c4-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"><img src="../images/c4-fig-0008.jpg" alt="c4-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">Figure 4.8</span></a></span> <a id="c4-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">The active force–length curve can be determined by subtracting measurements of the passive force from the total force over a range of fiber lengths. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">The peak active force, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1"><img src="../images/c4-fig-6001.jpg" alt="c4-fig-6001.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">, occurs at the optimal muscle fiber length, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1"><img src="../images/c4-fig-6002.jpg" alt="c4-fig-6002.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">.</span></p></figcaption></figure></section>
<section>
<h2><a id="c4-sec-0005"/><a id="c4-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Force–velocity relationship</span></h2>
<p class="paraaftertitle"><a id="c4-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">It may come as some surprise that the force generated by muscle depends not only on its length but also on the rate at which the length is changing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.2">We characterize this rate dependence with the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">force–velocity curve</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"> (</span><a id="c4-fig-0010a"/><a href="#c4-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Figure 4.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">This relationship was first observed by A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.3">V. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.4">Hill in 1938, and it eventually led him and his colleagues to develop the “push-me–pull-you” experiment described at the beginning of this chapter.</span></p>
<figure id="c4-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1"><img src="../images/c4-fig-0009.jpg" alt="c4-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0010a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Figure 4.9</span></a></span> <a id="c4-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">Muscle fiber force and power as functions of the fiber's velocity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.2">Force-generating capacity increases when lengthening and decreases when shortening (left). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.3">Mechanical power, the product of force and velocity, reaches a maximum (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">p</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">*) at about one-third of the maximum shortening velocity (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">v</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">*; right).</span></p></figcaption></figure>
<p><a id="c4-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Here is why force depends on velocity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.2">Sarcomeres generate force by way of the cross-bridge cycle, in which myosin heads bind with and pull on the actin filament. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.3">Because this process takes time, the active force that can be generated through cross-bridge cycling decreases when the sarcomere is shortening. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.4">At very high shortening velocities, no active force can be generated because the thick and thin filaments are sliding past each other faster than the myosin heads can pivot during the power stroke. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.5">Conversely, the active force increases when the muscle is lengthening because the neck regions of the myosin are strained before the heads detach from the thin filaments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.6">Very high lengthening velocities can damage these and other structures, resulting in dramatic decreases in active muscle force.</span></p>
<p><a id="c4-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">A muscle's velocity is of great significance when exercising. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">In an </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">isometric</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1"> exercise, a muscle is activated while pulling on an equal resistive force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">In this case, the muscle will not change length (i.e., it will have zero velocity). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.3">If a muscle is opposed by a weaker resistive force, the muscle will shorten and its contraction is said to be </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">concentric</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">Conversely, a muscle will elongate if it is opposed by a greater force, in which case its contraction is said to be </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">eccentric</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">.</span></p>
<p><a id="c4-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Hill observed that the active force decreases hyperbolically as shortening velocity increases during concentric contractions, reaching zero at the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">maximum contraction velocity</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1"> (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1"><img src="../images/c4-fig-6003.jpg" alt="c4-fig-6003.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.2">During eccentric contractions, the muscle force increases beyond its force during an isometric contraction, reaching up to around 1.5 times its maximum isometric force.</span></p>
<p><a id="c4-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">Hill's observations explain why Murdoch Ritchie had to work so hard during the “push-me–pull-you” experiment, while Brenda Bigland scarcely broke a sweat. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.2">The apparatus forced Ritchie's muscles to operate on the “concentric” side of </span><a href="#c4-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">Figure 4.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">, where they exerted far less than their maximum force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.2">By contrast, Bigland's muscles were operating on the “eccentric” side of the force–velocity curve, where they could exert nearly their maximum force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.3">Ritchie, pedaling forward, was acting as the motor, while Bigland, pedaling backward, was acting as a brake.</span></p>
<p><a id="c4-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Another distinction between concentric and eccentric contraction is the nature of the work done by the muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.2">Muscles do positive work during concentric contraction because force and displacement are in the same direction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.3">During eccentric contraction, however, muscles have work done on them (i.e., muscle work is negative) because the force and displacement are in opposite directions.</span></p>
<p><a id="c4-para-0039"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">You may wonder whether muscles perform both positive and negative work in daily life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.2">They do! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.3">When cycling or walking uphill, your muscles are performing primarily positive work. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.4">When walking down a steep slope, however, many of your muscles are doing negative work to control the speed of your descent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.5">Interestingly, doing negative work makes muscles sore and promotes muscle regeneration.</span></p>
<p><a id="c4-para-0040"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Negative work suggests that, in principle, muscles can gain energy or “recharge” themselves from an external force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.2">Alas, this does not happen. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.3">Our bodies are not equipped to reverse the chemical reaction that powers the cross-bridge mechanism and convert ADP (adenosine diphosphate) back into ATP (adenosine triphosphate). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.4">However, recharging is possible for machines powered by rechargeable batteries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.5">For example, whereas the friction brakes in conventional vehicles convert kinetic energy into heat, electric automobiles use regenerative braking to capture and store this energy.</span></p>
<p><a id="c4-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">The force–velocity relationship has an important consequence for the mechanical power generated by contracting muscle (</span><a href="#c4-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">Figure 4.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">, right panel). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.2">When the muscle is isometric, large forces can be generated but the velocity is zero; thus, the mechanical power, which is the product of force and velocity, is zero. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.3">The mechanical power is also zero at and above shortening velocities of </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1"><img src="../images/c4-fig-6004.jpg" alt="c4-fig-6004.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">, where the velocity is large but no force can be generated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.2">The peak positive mechanical power occurs at approximately </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1"><img src="../images/c4-fig-6005.jpg" alt="c4-fig-6005.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">, when the product of force and velocity is at a maximum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.2">The power–velocity relationship does well at predicting some features of everyday movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.3">For example, cyclists shift gears when they sense their muscles moving too fast or too slow, venturing far from the range of maximum power.</span></p></section>
<section>
<h2><a id="c4-sec-0006"/><a id="c4-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">Muscle activation</span></h2>
<p class="paraaftertitle"><a id="c4-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">We have assumed that actin and myosin can engage in cross-bridge cycling as long as the myosin heads are in proximity to binding sites on the thin filament and ATP is present. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">However, when a muscle is relaxed, the myosin-binding sites on actin are blocked by the protein tropomyosin. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.3">When a muscle is excited, calcium ions are released into the intracellular space and bind to the protein complex troponin, which causes the tropomyosin to change shape and expose the binding sites on the thin filament (</span><a id="c4-fig-0011a"/><a href="#c4-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">Figure 4.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">).</span></p>
<figure id="c4-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1"><img src="../images/c4-fig-0010.jpg" alt="c4-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0011a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">Figure 4.10</span></a></span> <a id="c4-para-0043"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">Molecular changes during muscle activation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.2">When a muscle is relaxed (left), the myosin-binding sites on the actin filament are blocked by the tropomyosin protein. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.3">Activating a muscle (right) causes a release of calcium ions from the sarcoplasmic reticulum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.4">The calcium ions bind to the troponin protein complex, causing the tropomyosin to change shape and reveal the myosin-binding sites on the actin, thereby allowing cross-bridge cycling to begin and force to be generated.</span></p></figcaption></figure>
<p><a id="c4-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">It's natural to wonder: Where do the calcium ions come from? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.2">As mentioned earlier, they are stored in a sort of holding tank in the cell. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.3">Their release is orchestrated by the central nervous system (CNS), an extremely important player in the muscular story that we have not mentioned yet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.4">Muscles do not activate themselves; under ordinary circumstances, they become active only when instructed to do so by the nervous system.</span></p>
<p><a id="c4-para-0045"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">The muscle fiber has several structural features that allow it to receive signals from the CNS and quickly propagate those signals to release calcium ions along the entire length of the cell. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.2">A motor neuron joins with each fiber at a specialized synapse called a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">neuromuscular junction</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1"> (</span><a id="c4-fig-0012a"/><a href="#c4-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">Figure 4.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.2">An excitatory signal from the CNS results in the transfer of a neurotransmitter called acetylcholine across the neuromuscular junction synapse. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.3">This transfer triggers depolarization of the cell membrane and causes an outflow of positive calcium ions from the sarcoplasmic reticulum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.4">The transverse-axial tubular system (often referred to simply as the T-tubules) ensures that the depolarization propagates quickly along the entire length of the muscle fiber. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.5">The T-tubules are formed by the cell membrane (called the sarcolemma) as it dips into the cell, extending membranous fingers into the cytoplasm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.6">Located adjacent to the T-tubules are the terminal cisternae, extensions of the sarcoplasmic reticulum that store calcium. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.7">When the cell depolarizes, this calcium is released into the intracellular space and initiates cross-bridge cycling.</span></p>
<figure id="c4-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1"><img src="../images/c4-fig-0011.jpg" alt="c4-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Figure 4.11</span></a></span> <a id="c4-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">The structure of a muscle fiber enables rapid propagation of action potentials and coordination of cross-bridge cycling along its entire length.</span></p></figcaption></figure>
<p><a id="c4-para-0047"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">When the excitatory signal from the CNS ends, the cell begins pumping calcium ions back into the sarcoplasmic reticulum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.2">This calcium reuptake process is slower than the release process because calcium ions are being transported against a concentration gradient.</span></p>
<p><a id="c4-para-0048"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">So far, we have examined only how the central nervous system activates a muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.2">But its job is not done! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.3">It also needs to tell muscles whether to pull hard or gently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.4">The CNS uses the above machinery to modulate the amount of force generated by a muscle in two ways: rate encoding and motor unit recruitment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.5">We describe these mechanisms in the next two sections.</span></p></section>
<section>
<h2><a id="c4-sec-0007"/><a id="c4-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Rate encoding</span></h2>
<p class="paraaftertitle"><a id="c4-para-0049"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Information is coded and transmitted along a motor neuron in the form of electrical impulses called </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">action potentials</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.2">Ordinarily, the signal to activate comes from the brain, but a muscle can also be stimulated artificially by passing electric current through its innervating motor neuron. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.3">Functional electrical stimulation therapy exploits this property by electrically stimulating peripheral motor neurons in individuals with paralysis due to spinal cord injury. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.4">Functional electrical stimulation systems can be used to strengthen muscles and produce coordinated movements such as rowing, grasping, and cycling, as we saw in Chapter 1.</span></p>
<p><a id="c4-para-0050"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">A short electrical stimulus applied to a motor neuron causes a “twitch” in the muscle fibers it innervates (</span><a id="c4-fig-0013a"/><a href="#c4-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Figure 4.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">), provided the stimulus exceeds a threshold voltage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.2">There is a small delay between application of an electrical impulse and force production as the depolarization propagates and calcium ions are released. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.3">The fiber force then rises rapidly, peaks, and falls back to zero relatively slowly as the reuptake process pumps calcium ions out of the intracellular space.</span></p>
<figure id="c4-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1"><img src="../images/c4-fig-0012.jpg" alt="c4-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0013a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">Figure 4.12</span></a></span> <a id="c4-para-0051"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">Muscle force resulting from different stimulation frequencies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.2">Fiber force is modulated by the frequency of stimulation (rate encoding), producing force responses ranging from a twitch (left) to fused tetanus (right).</span></p></figcaption></figure>
<p><a id="c4-para-0052"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">Muscle fibers are generally not stimulated to produce a single twitch; rather, a train or sequence of impulses is applied at a particular rate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.2">If two impulses are applied in sufficiently close succession, the second twitch will begin before the force from the first has fully decayed to zero, resulting in a second force peak that is higher than the first. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.3">As the frequency of an impulse train (or the “firing rate”) increases, so too does the peak force—until a threshold stimulation rate has been reached where the fiber force plateaus and the peak force does not increase at higher frequencies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.4">This threshold stimulation rate is called the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">tetanic frequency</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.2">A muscle operating at or above the tetanic frequency is said to be in </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">fused tetanus</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1"> (the discrete twitches have fused together to form a smooth force profile); at lower frequencies, the muscle is said to be in </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">unfused tetanus</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.2">Muscle force can be modulated approximately fourfold from twitches to tetanus by varying the stimulation frequency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.3">In other words, the modulation of force can be expressed in the rate of stimulation, hence the term </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">rate encoding</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">.</span></p>
<p><a id="c4-para-0053"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Of course, many movements would be impossible if rate encoding were the only mechanism for modulating force production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.2">Many muscles require greater than a fourfold variation in force to perform the range of functions for which they are used, and our movements would be shaky if submaximal muscle forces fluctuated like the ones shown in </span><a href="#c4-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">Figure 4.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">.</span></p></section>
<section>
<h2><a id="c4-sec-0008"/><a id="c4-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">Motor unit recruitment</span></h2>
<p class="paraaftertitle"><a id="c4-para-0054"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">As might be expected, the second mechanism for controlling muscle force production involves modulating the amplitude of the control signal rather than its frequency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.2">The nervous system accomplishes this by recruiting only some of the muscle fibers available for any given task: fewer to generate small amounts of force, more to generate larger forces (</span><a id="c4-fig-0014a"/><a href="#c4-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">Figure 4.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.2">During submaximal efforts, some muscle fibers are left inactive.</span></p>
<figure id="c4-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1"><img src="../images/c4-fig-0013.jpg" alt="c4-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0014a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">Figure 4.13</span></a></span> <a id="c4-para-0055"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">Motor unit recruitment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.2">A motor unit comprises a motor neuron and the muscle fibers that it innervates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.3">Three motor units (blue, orange, and red) are shown (left); the central nervous system modulates muscle force by adjusting the number of motor units being recruited (right).</span></p></figcaption></figure>
<p><a id="c4-para-0056"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">In more detail, this is how the process works. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.2">Muscles are functionally separated into distinct </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">motor units</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1"> that consist of one motor neuron and the muscle fibers it innervates (</span><a href="#c4-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">Figure 4.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">, left panel). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.2">Motor units vary in size from tens of muscle fibers to thousands. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.3">Small muscles that require fine control, such as muscles of the thumb, have only a few muscle fibers per motor neuron; larger muscles that can be controlled more coarsely, such as muscles of the back, have many muscle fibers per motor neuron. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.4">Typically, the fibers belonging to a motor unit are not clustered together, but rather are distributed throughout the muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.5">Thus, adjacent fibers generally belong to different motor units, and the fibers innervated by a particular motor neuron may be located in several fascicles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.6">The CNS adjusts the number of motor units that are recruited based on the demands of the task (</span><a href="#c4-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Figure 4.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">, right panel).</span></p>
<p><a id="c4-para-0057"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">Motor units are recruited in a particular order, referred to as </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">orderly recruitment</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">, as described by </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">Henneman's size principle</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1"> (Henneman et al., 1965). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.2">To generate small amounts of force, the CNS recruits only small motor units. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.3">As the required muscle force increases, the CNS recruits progressively larger motor units as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.4">Small and large motor units differ in more than just size: the small motor units that are recruited preferentially are also more resistant to fatigue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.5">Thus, when performing low-intensity movements, the CNS selectively recruits small fibers so as to avoid muscle fatigue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.6">The significance of orderly recruitment will be discussed in more detail in Chapter 5.</span></p>
<p><a id="c4-para-0058"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">In contrast to orderly motor unit recruitment, externally applied electrical stimulation does not recruit motor units according to Henneman's size principle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.2">When muscles are stimulated externally, large motor units are recruited at the same time as small ones (Gregory and Bickel, 2005). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.3">This has implications for functional electrical stimulation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.4">In particular, recruiting large, fatigable fibers at low levels of stimulation makes it difficult to modulate force precisely and results in rapid fatigue.</span></p>
<p><a id="c4-para-0059"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Clearly, the quality of therapy could be improved if we could induce orderly recruitment in individuals with paralysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.2">Recent experiments in my laboratory have demonstrated that orderly recruitment can be achieved artificially using optical control to activate motor neurons that have been altered to respond to light (Llewellyn et al., 2010). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.3">This technology may eventually lead to more effective therapies and treatments for individuals with spinal cord injury and other motor impairments.</span></p></section>
<section>
<h2><a id="c4-sec-0009"/><a id="c4-title-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">Electromyography</span></h2>
<p class="paraaftertitle"><a id="c4-para-0060"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">When muscle is excited by the nervous system, it generates a small electrical signal. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.2">We just saw that the nervous system modulates the amount of force generated by muscle via rate encoding and motor unit recruitment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.3">Roughly speaking, the greater the stimulation arriving to a muscle via the motor neurons (either from a higher frequency or greater recruitment), the larger the electrical signal will be. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.4">Thus we can measure the level of muscle activity using </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">electromyography</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1"> (EMG), which, as its name suggests, records electrical activity in the muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.2">If we connect EMG electrodes to an amplifier and speaker, we can literally hear the muscles working. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.3">Since we will frequently discuss research that uses EMG signals in this book, it is important to understand the basics of how we make these measurements.</span></p>
<p><a id="c4-para-0061"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">To record muscle activity, we either mount electrodes to the skin for “surface” EMG or insert wires into muscle for intramuscular EMG. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.2">Surface electrodes are used to record the activity of large superficial muscles, whereas intramuscular electrodes are best suited to smaller or deeper muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.3">In most setups, a single pair of electrodes (reference and signal) is used for each muscle; thus, the measured time series represents a combination of the firing of all recruited motor units within the muscle—and, potentially, surrounding muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.4">To complicate matters further, the magnitude of the measurement is sensitive to electrode placement relative to the nerve and muscle fibers (which may be difficult to control precisely, particularly during movement). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.5">Consequently, the raw EMG signal is noisy and can be challenging to interpret.</span></p>
<p><a id="c4-para-0062"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">A measured EMG signal is typically filtered and otherwise processed to increase its interpretability (</span><a id="c4-fig-0015a"/><a href="#c4-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Figure 4.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">We typically high-pass-filter the EMG signal to remove drift over time, then rectify and low-pass-filter it to obtain an envelope that indicates how the magnitude of the muscle's activity varies over time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.3">Finally, we normalize the EMG signal relative to a calibration measurement collected during a maximum voluntary contraction or a high-intensity dynamic movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.4">The result is a representation of the muscle's activity as a percentage of its maximum.</span></p>
<figure id="c4-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1"><img src="../images/c4-fig-0014.jpg" alt="c4-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0015a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">Figure 4.14</span></a></span> <a id="c4-para-0063"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Processing of electromyographic (EMG) signals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.2">Raw EMG signals increase in amplitude as motor unit firing rate increases and as more motor units are recruited. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.3">To facilitate interpretation, a raw EMG signal is typically processed by high-pass filtering, rectifying, low-pass filtering, and then normalizing to a maximal signal.</span></p></figcaption></figure>
<p><a id="c4-para-0064"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">Two delays are often introduced in the processing of an EMG signal to relate the signal to a muscle's force production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.2">First, there is a delay between the appearance of a nonzero EMG signal and a nonzero muscle force; the duration of the delay may vary with electrode placement and between muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.3">A second delay is due to activation dynamics, as discussed below. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.4">EMG provides a gross measurement of muscle activation, including information from both rate encoding and recruitment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.5">When properly calibrated, EMG can be a useful tool for studying muscle coordination and for testing the accuracy of simulations involving muscle activations.</span></p></section>
<section>
<h2><a id="c4-sec-0010"/><a id="c4-title-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Modeling muscle activation dynamics</span></h2>
<p class="paraaftertitle"><a id="c4-para-0065"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">Now that we have covered some fundamentals of muscle biology, we can form engineering models to describe muscle mechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.2">To do this, we need to characterize the transformation from muscle excitation to muscle activation, which we call activation dynamics, and also develop equations that represent the contraction dynamics of muscle (</span><a id="c4-fig-0016a"/><a href="#c4-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">Figure 4.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.2">We consider activation dynamics below; contraction dynamics will be covered in the next chapter.</span></p>
<figure id="c4-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1"><img src="../images/c4-fig-0015.jpg" alt="c4-fig-0015.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c4-fig-0016a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">Figure 4.15</span></a></span> <a id="c4-para-0066"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">Inputs and outputs of a muscle–tendon model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.2">In computational models of muscle–tendon actuators, we assume that the process of activation dynamics, which converts excitation (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">u</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">)) to activation (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">)), is distinct from contraction dynamics, which relates muscle–tendon length (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">)) and velocity (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">)) to muscle force (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">)).</span></p></figcaption></figure>
