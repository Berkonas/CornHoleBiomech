<td><a id="c5-para-0297"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.553.1">Tendon force–length</span></td>
<td><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.554.1"><img src="../images/c5-fig-6015.jpg" alt="c5-fig-6015.jpg"/></span></td></tr></tbody></table></div></figure>
<p><a id="c5-para-0298"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.1">The generic curves are derived from experimental measurements and reflect the biological properties of muscle and tendon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.555.2">In particular, the active force–length curve is a scaled version of the relationship between the length of a sarcomere and the force it generates when activated (Figure 4.6); the hyperbolic force–velocity curve reflects the dynamics of cross-bridge cycling (Figure 4.9); the passive force–length curve represents the force generated when a muscle is stretched beyond its resting length, regardless of its activation (Figure 4.7); and the tendon force–length curve expresses the nonlinear relationship between a tendon's strain and its stress (</span><a href="#c5-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.556.1">Figure 5.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.557.2">As indicated by the normalized variables appearing in </span><a href="#c5-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.558.1">Figure 5.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.559.1">, the four generic, dimensionless curves are scaled by the tendon's slack length (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.560.1"><img src="../images/c5-fig-6038.jpg" alt="c5-fig-6038.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.561.1">) and the muscle's maximum isometric force (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.562.1"><img src="../images/c5-fig-6039.jpg" alt="c5-fig-6039.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.563.1">), optimal fiber length (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.564.1"><img src="../images/c5-fig-6040.jpg" alt="c5-fig-6040.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.565.1">), and maximum contraction velocity (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.566.1"><img src="../images/c5-fig-6041.jpg" alt="c5-fig-6041.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.567.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.567.2">Tendon force scales with the muscle's maximum isometric force because, in general, stronger muscles have stronger tendons to avoid tendon failure.</span></p>
<figure id="c5-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.568.1"><img src="../images/c5-fig-0011.jpg" alt="c5-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0020a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.569.1">Figure 5.11</span></a></span> <a id="c5-para-0299"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.1">Schematic of a typical Hill-type muscle–tendon model (A) and the corresponding generic, dimensionless curves that describe the dynamics of its three components: the force–velocity curve (B), the tendon force–length curve (C), and the active and passive force–length curves (D). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.2">The curves shown here are from Millard et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.570.3">(2013), which were fit to experimental data and differ from other force–length curves shown in this text.</span></p></figcaption></figure>
<p><a id="c5-para-0300"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.1">The importance of scaling and using dimensionless curves could be discussed at great length, but the main point is that scaling allows us to isolate the part of the model that is unique to each muscle and individual. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.571.2">What remains is the part that is generic, shared by all healthy muscles.</span></p></section>
<section>
<h2><a id="c5-sec-0009"/><a id="c5-title-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.572.1">Computing muscle force with a rigid tendon</span></h2>
<p class="paraaftertitle"><a id="c5-para-0301"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.573.1">We use the Hill-type model shown in </span><a href="#c5-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.574.1">Figure 5.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.1"> to generate muscle-driven simulations of movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.2">In this section, we present the mathematical details that make up the “contraction dynamics” block in Figure 4.15. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.3">Specifically, we describe a strategy to compute muscle force if we know muscle activation and the length and velocity of the muscle–tendon actuator. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.575.4">We will assume here that muscle activation has already been computed by the activation dynamics model, thus </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.576.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.577.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.578.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.1">) is known. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.579.2">We also assume that we know the length and velocity of the entire muscle–tendon actuator (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.580.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.581.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.582.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.583.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.584.1">) and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.585.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.586.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.587.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.588.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.1">)). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.2">However, we must determine the muscle and tendon lengths. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.589.3">Once these lengths are known, we can use the muscle-specific parameters with the dimensionless curves shown in </span><a href="#c5-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.590.1">Figure 5.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.1"> to compute the forces being generated by the muscle and transmitted through the tendon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.591.2">(Note that we often omit the “(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.592.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.1">),” indicating functional dependence on time, for simplicity of notation but show it explicitly in this section and the next to distinguish time-varying quantities from constants. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.2">Also note that we have defined muscle fiber velocity as shortening velocity, in keeping with the convention used in the muscle physiology literature and in Chapter 4. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.593.3">Consequently, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.594.1"><img src="../images/c5-fig-6042.jpg" alt="c5-fig-6042.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.595.1"> in the equations below.)</span></p>
<p><a id="c5-para-0302"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.1">Let's begin with a simpler problem and assume that the tendon is rigid; we will then generalize our strategy in the next section to account for elastic tendon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.596.2">The rigid-tendon assumption replaces the tendon spring shown in </span><a href="#c5-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.597.1">Figure 5.11A</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.598.1"> with a rigid rod (i.e., </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.599.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.600.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.1"> is constant). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.601.2">This assumption is reasonable if the tendon is short relative to the muscle to which it attaches, in which case the tendon will not stretch appreciably beyond its slack length even when subjected to high tensile forces (recall </span><a href="#c5-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.602.1">Figure 5.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.603.2">We are then left with two unknowns in Equation 5.8, and can relate muscle length (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.604.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.605.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.606.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.607.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.608.1">)) to muscle fiber pennation angle (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.609.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.610.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.611.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.612.1">)) as follows:</span></p>
<p><a id="c5-para-0303"/></p>
<figure id="c5-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.613.1"><img src="../images/c5-fig-3009.jpg" alt="c5-fig-3009.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0304"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.614.1">(5.9)</span></p></figcaption></figure>

<p><a id="c5-para-0305"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.1">We have one equation but two unknowns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.615.2">To make headway, recall that the fixed-height pennation model relates muscle length and pennation angle to the height of the parallelogram (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.616.1">h</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.617.1">) shown in </span><a href="#c5-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.618.1">Figure 5.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.619.1">, which remains constant:</span></p>
<p><a id="c5-para-0306"/></p>
<figure id="c5-fig-0022"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.620.1"><img src="../images/c5-fig-3010.jpg" alt="c5-fig-3010.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0307"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.621.1">(5.10)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.622.1">We can solve for height </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.623.1">h</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.624.1"> by substituting into Equation 5.10 the optimal fiber length (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.625.1"><img src="../images/c5-fig-6043.jpg" alt="c5-fig-6043.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.626.1">) and the pennation angle at optimal fiber length (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.627.1">ϕ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.628.1">o</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.629.1">):</span></p>
<p><a id="c5-para-0308"/></p>
<figure id="c5-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.630.1"><img src="../images/c5-fig-3011.jpg" alt="c5-fig-3011.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0309"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.631.1">(5.11)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.632.1">We can now solve Equations 5.9 and 5.10 for muscle length (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.633.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.634.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.635.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.636.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.637.1">)) and pennation angle (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.638.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.639.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.640.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.641.1">)), where parameter </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.642.1">h</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.643.1"> is given by Equation 5.11. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.643.2">We know this system is solvable because we have as many independent equations as unknowns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.643.3">Substituting Equation 5.9 into Equation 5.10 produces an expression for the pennation angle in terms of known quantities:</span></p>
<p><a id="c5-para-0310"/></p>
<figure id="c5-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.644.1"><img src="../images/c5-fig-3012.jpg" alt="c5-fig-3012.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0311"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.645.1">(5.12)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.646.1">Finally, we can solve for muscle length using Equation 5.9.</span></p>
<p><a id="c5-para-0312"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.647.1">Muscle force (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.648.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.649.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.650.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.651.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.652.1">)) can be computed from the activation (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.653.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.654.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.655.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.656.1">)), normalized muscle length (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.657.1"><img src="../images/c5-fig-6044.jpg" alt="c5-fig-6044.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.658.1">), and normalized muscle velocity (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.659.1"><img src="../images/c5-fig-6045.jpg" alt="c5-fig-6045.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.660.1">):</span></p>
<p><a id="c5-para-0313"/></p>
<figure id="c5-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.661.1"><img src="../images/c5-fig-3013.jpg" alt="c5-fig-3013.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0314"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.662.1">(5.13)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.1">Here we have summed the active and passive components of the muscle force because they act in parallel. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.663.2">To compute the muscle velocity (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.664.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.665.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.666.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.667.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.668.1">)), we note that velocity is the time derivative of length and differentiate Equation 5.8:</span></p>
<p><a id="c5-para-0315"/></p>
<figure id="c5-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.669.1"><img src="../images/c5-fig-3014.jpg" alt="c5-fig-3014.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0316"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.670.1">(5.14)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.671.1">Recall that we have assumed </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.672.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.673.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.674.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.675.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.676.1">) is known, and the rigid-tendon assumption tells us that </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.677.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.678.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.679.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.680.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.681.1">) = 0. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.681.2">Thus, there are only two unknowns in Equation 5.14: muscle velocity (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.682.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.683.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.684.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.685.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.686.1">)) and pennation angular velocity (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.687.1"><img src="../images/c5-fig-6046.jpg" alt="c5-fig-6046.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.688.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.688.2">Two unknowns but only one equation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.688.3">Fortunately, we can also differentiate Equation 5.10 to obtain a second equation relating these variables:</span></p>
<p><a id="c5-para-0317"/></p>
<figure id="c5-fig-0027"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.689.1"><img src="../images/c5-fig-3015.jpg" alt="c5-fig-3015.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0318"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.690.1">(5.15)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.691.1">We now substitute Equation 5.15 into Equation 5.14 to solve for muscle velocity, and finally use Equation 5.13 to compute muscle force.</span></p></section>
<section>
<h2><a id="c5-sec-0010"/><a id="c5-title-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.692.1">Computing muscle force with a compliant tendon</span></h2>
<p class="paraaftertitle"><a id="c5-para-0319"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.1">The situation is more complicated when the tendon is compliant rather than rigid. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.693.2">In this case, the tendon can change length, and thus </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.694.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.695.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.696.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.697.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.698.1">) is an unknown in Equation 5.9. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.698.2">One strategy for accommodating this additional unknown is to define muscle length </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.699.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.700.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.701.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.702.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.703.1">) as a state variable—that is, a quantity that will be numerically integrated from one instant to the next over the course of a simulation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.703.2">This process works as follows. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.703.3">We provide an initial value for muscle length at time zero (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.704.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.705.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.706.1">(0)), an equation that describes the rate at which muscle length is changing (i.e., its velocity, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.707.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.708.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.709.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.710.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.711.1">)), and a numerical integrator for computing the muscle length a short time into the future from its current length and velocity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.711.2">The “contraction dynamics” block in Figure 4.15 will then have the form shown in </span><a id="c5-fig-0028a"/><a href="#c5-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.712.1">Figure 5.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.713.1">.</span></p>
<figure id="c5-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.714.1"><img src="../images/c5-fig-0012.jpg" alt="c5-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0028a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.715.1">Figure 5.12</span></a></span> <a id="c5-para-0320"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.716.1">Muscle fiber length (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.717.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.718.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.719.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.720.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.721.1">)) is integrated forward in time to compute contraction dynamics with a compliant tendon.</span></p></figcaption></figure>
<p><a id="c5-para-0321"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.722.1">Using a simple numerical integrator, we might compute the future muscle length as follows:</span></p>
<p><a id="c5-para-0322"/></p>
<figure id="c5-fig-0029"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.723.1"><img src="../images/c5-fig-3016.jpg" alt="c5-fig-3016.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0323"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.724.1">(5.16)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.725.1">where Δ</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.726.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.727.1"> is the amount of time we advance into the future with each time step. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.727.2">(Recall that </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.728.1"><img src="../images/c5-fig-6047.jpg" alt="c5-fig-6047.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.729.1">.) By repeating this process over and over, we eventually obtain the value of muscle length over the entire time interval of interest. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.729.2">Use of the integration strategy shown in Equation 5.16 (known as Euler's method) generally requires that we take small time steps to obtain accurate answers.</span></p>
<p><a id="c5-para-0324"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.730.1">We can now derive an expression for </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.731.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.732.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.733.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.734.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.735.1">) by assuming that the muscle and tendon are massless and frictionless, in which case there is no net horizontal force at the point where they meet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.735.2">Thus, the muscle and tendon are in equilibrium:</span></p>
<p><a id="c5-para-0325"/></p>
<figure id="c5-fig-0030"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.736.1"><img src="../images/c5-fig-3017.jpg" alt="c5-fig-3017.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0326"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.737.1">(5.17)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.738.1">(Because the tendon is constrained to remain horizontal in </span><a href="#c5-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.739.1">Figure 5.11A</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.740.1">, we can ignore the vertical component of the force generated by the muscle, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.741.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.742.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.743.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.744.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.745.1">) sin(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.746.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.747.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.748.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.749.1">)).) The force generated by the tendon (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.750.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.751.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.752.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.753.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.754.1">)) can be computed from normalized tendon length (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.755.1"><img src="../images/c5-fig-6048.jpg" alt="c5-fig-6048.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.756.1">) using the tendon force–length curve:</span></p>
<p><a id="c5-para-0327"/></p>
<figure id="c5-fig-0031"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.757.1"><img src="../images/c5-fig-3018.jpg" alt="c5-fig-3018.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0328"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.758.1">(5.18)</span></p></figcaption></figure>

<p><a id="c5-para-0329"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.759.1">We obtain an expression for muscle velocity by substituting expressions for the muscle and tendon forces (Equations 5.13 and 5.18) into the equilibrium equation (Equation 5.17) and solving for </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.760.1"><img src="../images/c5-fig-6049.jpg" alt="c5-fig-6049.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.761.1">:</span></p>
<p><a id="c5-para-0330"/></p>
<figure id="c5-fig-0032"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.762.1"><img src="../images/c5-fig-3019.jpg" alt="c5-fig-3019.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0331"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.763.1">(5.19)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.764.1">where </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.765.1"><img src="../images/c5-fig-6050.jpg" alt="c5-fig-6050.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.766.1"> is the inverse of the force–velocity curve (i.e., it describes muscle velocity as a function of force). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.766.2">Note that Equation 5.19 has four numerical singularities that must be avoided during a simulation: as the pennation angle approaches 90 degrees, as activation approaches zero, at fiber lengths where the active force–length curve approaches zero, and where the force–velocity curve is not invertible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.766.3">These singularities can be avoided by introducing constraints on the corresponding variables, such as by preventing pennation from exceeding some upper limit less than 90 degrees.</span></p>
<p><a id="c5-para-0332"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.767.1">The approach described above is used to estimate muscle and tendon forces in nearly all muscle-driven simulations of movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.767.2">The approach is valuable because it allows us to account for each muscle's activation, fiber length, and fiber velocity in estimating the force it generates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.767.3">However, other approaches are also valuable, which we describe below.</span></p></section>
<section>
<h2><a id="c5-sec-0011"/><a id="c5-title-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.768.1">Other models of muscle force generation</span></h2>
<p class="paraaftertitle"><a id="c5-para-0333"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.769.1">We have focused on the Hill-type model because it is widely used in simulations of movement, including those presented throughout this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.769.2">However, several phenomena are not captured by the Hill-type model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.769.3">For example, the model ignores </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.770.1">short-range stiffness</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.771.1">, which describes a muscle's velocity-independent resistance to small, rapid perturbations in its length; </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.772.1">force enhancement</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.773.1">, or the increase in a muscle's maximum isometric force immediately following stretch; and dependence on temperature and fatigue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.773.2">Furthermore, although the Hill-type model does a good job of representing changes in muscle force with changes in length and velocity when the muscle is maximally active, it is less accurate for submaximal activation (Millard et al., 2013). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.773.3">These limitations must be considered when using a Hill-type model in scientific investigations.</span></p>
<p><a id="c5-para-0334"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.774.1">Other muscle models have been developed, some simpler and some more complex. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.774.2">A simple strategy for modeling muscle forces is to represent the total moment generated by all muscles crossing a joint with a single torque actuator (a motor with physiologically inspired properties). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.774.3">The actuator's maximum torque can be expressed as a function of the joint angle, as determined experimentally, but individual muscle forces cannot be computed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.774.4">As we will see, this model is sufficiently simple to use in large-scale optimization problems, yet still produces simulations that closely resemble human movement.</span></p>
<p><a id="c5-para-0335"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.775.1">There are also muscle models that provide more detailed information when these details are necessary to answer a particular question. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.775.2">A well-known example is based on the work of Andrew Huxley (1957), in which the sliding-filament mechanism of muscle contraction is modeled explicitly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.775.3">This Huxley-type model describes force generation using partial differential equations of the following form:</span></p>
<p><a id="c5-para-0336"/></p>
<figure id="c5-fig-0033"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.776.1"><img src="../images/c5-fig-3020.jpg" alt="c5-fig-3020.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0337"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.777.1">(5.20)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.778.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.779.1">n</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.780.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.781.1">x</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.782.1">,</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.783.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.784.1">) is a probability density function describing the proportion of actin and myosin that are engaged in cross-bridge cycling; </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.785.1">x</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.786.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.787.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.788.1"> are the independent variables of distance and time; </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.789.1">v</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.790.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.791.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.792.1">) is the shortening speed of a half-sarcomere; and the functions </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.793.1">f</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.794.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.795.1">x</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.796.1">) and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.797.1">g</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.798.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.799.1">x</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.800.1">) represent, respectively, the rates at which cross-bridges are formed and broken. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.800.2">A major challenge in using this model is to determine appropriate values for the many parameters in the model, since little is known about how these quantities vary between species and between muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.800.3">Nevertheless, this model captures some of the effects noted above that are not captured by the Hill-type model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.800.4">The cross-bridge model is usually used to study the dynamics of a single muscle.</span></p>
<p><a id="c5-para-0338"/><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.801.1">Finite-element models</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.802.1"> provide yet another alternative. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.802.2">In a finite-element model, the muscle is divided into many small elements (on the order of thousands), each of which is governed by a set of equations that describe the behavior of the tissue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.802.3">Finite-element models are the state of the art for engineering applications, such as the design of aircraft, and without question they would provide greater accuracy than the simple equations we have derived in this chapter.</span></p>
<p><a id="c5-para-0339"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.803.1">But greater power comes at a cost: finite-element models can take hundreds of times longer to solve than Hill-type models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.803.2">Despite this computational burden, finite-element models can be used to good effect to model muscles whose fibers have different lengths, strain nonuniformly, and transmit tension laterally (</span><a id="c5-fig-0034a"/><a href="#c5-fig-0034"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.804.1">Figure 5.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.805.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.805.2">Ultimately, you must find the right balance between the amount of detail provided by a model and its analytical tractability for the application at hand.</span></p>
<figure id="c5-fig-0034"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.806.1"><img src="../images/c5-fig-0013.jpg" alt="c5-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0034a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.807.1">Figure 5.13</span></a></span> <a id="c5-para-0340"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.808.1">A model of the gluteus maximus from Blemker and Delp (2005). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.808.2">Finite-element models provide detailed characterizations of muscle architecture and allow calculation of internal muscle and tendon strains.</span></p></figcaption></figure>
<p><a id="c5-para-0341"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.809.1">Since many muscles are involved in the coordination and control of movement, simulations with large numbers of muscles are critical for studying activities like walking and running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.809.2">The models discussed in this chapter allow us to simulate dozens of muscles at a time using only modest computational resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.809.3">We will flex our computational muscles in Chapters 10–12 to generate muscle-driven simulations of movement.</span></p>
<p><a id="c5-para-0342"/></p>
