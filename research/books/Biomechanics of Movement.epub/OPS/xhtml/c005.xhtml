<section epub:type="chapter" role="doc-chapter">
<header>
<h1><a id="c5-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">5</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Muscle Architecture and Dynamics</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c5-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">If you want to understand function, study structure.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">—Francis Crick</span></p></blockquote>
<p><a id="c5-para-0002"/></p>
<figure id="c5-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"><img src="../images/c5-fig-5001.jpg" alt="c5-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c5-para-0003"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">researchers seeking to understand</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> human and animal movement have performed a wide variety of experiments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Biomechanists have studied whole-body movement by measuring joint motions, ground reaction forces, and electromyographic signals from thousands of people. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Physiologists have studied isolated muscle to characterize the dynamics of muscle activation and force production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">Muscle-driven simulations allow us to connect these two worlds, synthesizing biomechanical measurements of whole-body movement with experiments performed on individual muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.5">We will see in Chapters 10–12 that muscle-driven simulations provide insight into the role of muscles in producing movement and provide estimates of important quantities that are nearly impossible to measure in people as they move, such as the force generated by a muscle and the amount of energy it consumes.</span></p>
<p><a id="c5-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Modeling the dynamics of muscles is necessary for creating muscle-driven simulations of movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">However, a one-size-fits-all model is not adequate because each muscle has a distinct structure to suit its unique functions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">For example, some muscles provide fine motor control of the fingers while others support body weight during locomotion (</span><a id="c5-fig-0002a"/><a href="#c5-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">Figure 5.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">All skeletal muscles have a hierarchical arrangement of sarcomeres, but muscles differ in several important respects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">Among these differences are their size and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">architecture</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">, the geometric arrangement of their fibers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">A computational model of muscle must, therefore, capture the features of muscle force generation that are common to all muscles while also being able to represent the unique features of each muscle.</span></p>
<figure id="c5-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1"><img src="../images/c5-fig-0001.jpg" alt="c5-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Figure 5.1</span></a></span> <a id="c5-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Muscle architecture and function vary throughout the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">The flexor digitorum superficialis (far left) flexes the fingers via four tendons; the broad gluteus medius and thin gracilis generate hip abduction and adduction moments; the gastrocnemius (far right) inserts into the calcaneus via the long Achilles tendon.</span></p></figcaption></figure>
<p><a id="c5-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">In this chapter, we will see how to create a generic model of muscle force production and how to customize it to represent nearly any muscle in the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">The muscle model we will describe belongs to a class of models named after A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">V. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">Hill, who performed many fundamental studies of muscle in addition to the “push-me–pull-you” experiment we saw in Chapter 4. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.5">Felix Zajac, my doctoral advisor, enhanced the Hill-type model and brought it into the modern era of computer simulation (Zajac, 1989). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.6">In particular, Zajac developed a model that includes only four generic curves and five muscle-specific parameters, all of which can be derived from experimental data and used to tune the model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.7">The simplicity of Zajac's model is crucial for dynamic simulations that involve dozens of muscles, yet it is sufficiently detailed to represent the dynamics of muscles of different size, strength, and structure.</span></p>
<p><a id="c5-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">The features of muscle force generation common to all muscles are summarized in Figure 4.18. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">These features include three curves that describe the nonlinear relationships between a muscle's length and the force it generates: the active force–length curve, the passive force–length curve, and the force–velocity curve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">Because muscle attaches to bone via tendon, we must also consider the properties of this connective tissue, which we describe by a tendon's force–length curve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.4">We scale these generic curves to represent a specific muscle using five parameters: (1) optimal muscle fiber length, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"><img src="../images/c5-fig-6001.jpg" alt="c5-fig-6001.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">; (2) muscle fiber pennation angle at optimal fiber length, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">ϕ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">o</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">; (3) maximum isometric muscle force, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1"><img src="../images/c5-fig-6002.jpg" alt="c5-fig-6002.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">; (4) maximum muscle contraction velocity, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1"><img src="../images/c5-fig-6003.jpg" alt="c5-fig-6003.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">; and (5) tendon slack length, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"><img src="../images/c5-fig-6004.jpg" alt="c5-fig-6004.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">We begin this chapter by describing each of these five muscle-specific parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">We will see how each parameter affects muscle force and can be incorporated into a model of muscle–tendon dynamics.</span></p>
<section>
<h2><a id="c5-sec-0001"/><a id="c5-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Optimal muscle fiber length, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1"><img src="../images/c5-fig-6005.jpg" alt="c5-fig-6005.jpg"/></span></h2>
<p class="paraaftertitle"><a id="c5-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">As we saw in Chapter 4, the active force that can be generated by a sarcomere depends on its length (Figure 4.6). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">The length at which a sarcomere can develop maximum isometric force is called its </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">optimal length</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">Because a muscle fiber is composed of a number (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">n</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">) of sarcomeres arranged end to end, the fiber also has an optimal length (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"><img src="../images/c5-fig-6006.jpg" alt="c5-fig-6006.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">) that is reached when each of its constituent sarcomeres is at its optimal length (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1"><img src="../images/c5-fig-6007.jpg" alt="c5-fig-6007.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">):</span></p>
<p><a id="c5-para-0009"/></p>
<figure id="c5-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"><img src="../images/c5-fig-3001.jpg" alt="c5-fig-3001.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">(5.1)</span></p></figcaption></figure>

<p><a id="c5-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Equation 5.1 assumes that all sarcomeres in series along a muscle fiber are the same length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">Muscles lengthen and shorten during movement, which affects the active force they can generate as the thick and thin filaments of their sarcomeres slide past each other. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.3">Muscle fibers with longer optimal lengths (i.e., with more sarcomeres in series) have broader active force–length curves and can generate a high fraction of their maximum active force over a wider range of lengths (</span><a id="c5-fig-0004a"/><a href="#c5-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Figure 5.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">, top). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">Increasing a muscle fiber's optimal length also increases its maximum shortening velocity (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"><img src="../images/c5-fig-6008.jpg" alt="c5-fig-6008.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">):</span></p>
<figure id="c5-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"><img src="../images/c5-fig-0002.jpg" alt="c5-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Figure 5.2</span></a></span> <a id="c5-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">Muscles with longer optimal fiber lengths have broader active force–length curves (top) and higher maximum shortening velocities (bottom). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">Note that the schematics of the long fiber (blue) have twice as many sarcomeres as the short fiber (orange), and thus the long fiber can shorten twice the distance in a given time period (bottom right).</span></p></figcaption></figure>
<p><a id="c5-para-0013"/></p>
<figure id="c5-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"><img src="../images/c5-fig-3002.jpg" alt="c5-fig-3002.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">(5.2)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">where </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"><img src="../images/c5-fig-6009.jpg" alt="c5-fig-6009.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1"> is the maximum shortening velocity of a sarcomere. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">Thus, the force–velocity curve also broadens as the optimal fiber length of a muscle increases (</span><a href="#c5-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Figure 5.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">, bottom).</span></p>
<p><a id="c5-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Biological muscles are comprised of fascicles that have different lengths, which themselves contain fibers that are also of different lengths and that may even terminate within the fascicle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">In our model, however, we shall assume that all fibers in a muscle are the same length—an assumption made by many (but not all) models of muscle–tendon dynamics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.3">We further assume that all fibers are straight, parallel, and coplanar. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.4">Thus, to characterize the force–length and force–velocity properties of a muscle, we simply magnify the corresponding properties of a muscle fiber which, in turn, are merely scaled-up versions of the same properties of sarcomeres.</span></p></section>
<section>
<h2><a id="c5-sec-0002"/><a id="c5-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Muscle fiber pennation angle at optimal fiber length, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">ϕ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">o</span></sub></h2>
<p class="paraaftertitle"><a id="c5-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Muscle typically attaches to bone through tendon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">In </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">parallel-fibered muscles</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">, such as the sartorius, the fibers are arranged in the direction of the tendon (</span><a id="c5-fig-0006a"/><a href="#c5-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Figure 5.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">In most other muscles, such as the rectus femoris, the fibers are arranged at an acute angle to the tendon; we refer to these muscles as </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">pennated</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.2">This word comes from the Latin word for feathered, and indeed the structure of a pennated muscle is reminiscent of a bird feather.</span></p>
<figure id="c5-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"><img src="../images/c5-fig-0003.jpg" alt="c5-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0006a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Figure 5.3</span></a></span> <a id="c5-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Examples of muscles with different architectures: parallel-fibered, unipennate, bipennate, and multipennate.</span></p></figcaption></figure>
<p><a id="c5-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">If all muscle fibers attach on one side of the tendon, we say the muscle is </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">unipennate</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">; if they attach on both sides, it is </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">bipennate</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">In </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">multipennate</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"> muscles, the tendon branches and the muscle fiber architecture may be complex. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">We henceforth assume that all fibers in a given muscle attach to tendon at the same angle, called the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">pennation angle</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"> (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">), and adopt the model of muscle–tendon geometry shown in </span><a id="c5-fig-0007a"/><a href="#c5-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Figure 5.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">We thus obtain the following relationship between the force in the muscle fibers (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">) and the force in the tendon (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">):</span></p>
<figure id="c5-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"><img src="../images/c5-fig-0004.jpg" alt="c5-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">Figure 5.4</span></a></span> <a id="c5-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Simplified geometric representation of muscle fibers and tendon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.2">Muscle fibers are assumed to be straight, parallel, coplanar, of equal length, and attached to tendon at the same pennation angle (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">The height </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">h</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"> (and therefore the area) of the parallelogram remains constant as the muscle fibers shorten and lengthen, increasing and decreasing the pennation angle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">Adapted from Zajac (1989).</span></p></figcaption></figure>
<p><a id="c5-para-0020"/></p>
<figure id="c5-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"><img src="../images/c5-fig-3003.jpg" alt="c5-fig-3003.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0021"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">(5.3)</span></p></figcaption></figure>

<p><a id="c5-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Now, referring to </span><a href="#c5-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Figure 5.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">, we can explain how biological muscles maintain a constant volume even though the fibers change length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">As the fibers in the figure shorten, imagine them shortening in such a way that the parallelogram in </span><a href="#c5-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">Figure 5.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"> maintains the same height </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">h</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">The top of the parallelogram will stay fixed, but the bottom will be pulled to the right, and the parallelogram will become more rectangular. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.3">Yet as long as the height remains constant, the area will also remain constant, in accordance with the geometric rule that the area of a parallelogram is the product of its base and height. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.4">We have drawn this figure in two dimensions, but the motion is similar in three dimensions and ensures that the volume of the muscle does not change. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.5">Stated briefly, pennated muscles maintain their volume not by bulging, but by shearing.</span></p>
<p><a id="c5-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">In the process described above, the pennation angle increases and the force transmitted from the fibers to the tendon decreases, until the fibers and tendon are perpendicular and the muscle in the figure becomes rectangular (i.e., </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1"> = 90 degrees). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">We use the parameter </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">ϕ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">o</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1"> to denote the pennation angle at which the muscle fibers are at their optimal length (i.e., when </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"><img src="../images/c5-fig-6010.jpg" alt="c5-fig-6010.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">The fixed-height approximation that we have described may introduce errors for muscles that bulge appreciably as they contract, but it provides a simple geometric model for studying the functional implications of a muscle's architecture.</span></p>
<p><a id="c5-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Pennation plays a critical role in determining a muscle's force-generating capacity beyond the relationship expressed in Equation 5.3. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.2">In general, muscles with a greater pennation angle are able to pack more fibers into a given volume. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.3">Consider the analogous situation of installing a hardwood floor in a rectangular room: one could use a relatively small number of long planks that extend the length of the room, or a larger number of shorter planks oriented diagonally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.4">Similarly, compared to a parallel-fibered muscle of the same volume, a pennated muscle will have shorter fibers and, therefore, narrower active force–length and force–velocity curves (</span><a href="#c5-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">Figure 5.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.2">Of course, the pennated muscle would also contain more fibers, the consequences of which will be explored in the next section.</span></p></section>
<section>
<h2><a id="c5-sec-0003"/><a id="c5-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Maximum isometric muscle force, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1"><img src="../images/c5-fig-6011.jpg" alt="c5-fig-6011.jpg"/></span></h2>
<p class="paraaftertitle"><a id="c5-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">The third in our series of five muscle parameters is relatively easy to understand but not so easy to measure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.2">This is the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">maximum isometric muscle force</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">It is defined as the force generated by a muscle when it is maximally activated and held at its optimal fiber length.</span></p>
<p><a id="c5-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">In a living person, the maximum isometric muscle force is hard to measure because we cannot isolate one muscle from the others and apply a resisting force only to that muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">For this reason, we use a proxy called the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">physiological cross-sectional area</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1"> (PCSA; </span><a id="c5-fig-0009a"/><a href="#c5-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Figure 5.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">This is the area of a cross-section of the muscle oriented perpendicular to the fibers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.3">Notice that in a pennated muscle, this cross-section is oblique to the longitudinal axis of the muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.4">The maximum isometric force can be estimated as follows:</span></p>
<figure id="c5-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1"><img src="../images/c5-fig-0005.jpg" alt="c5-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Figure 5.5</span></a></span> <a id="c5-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">The muscles shown on the left have the same volume but different PCSAs, optimal fiber lengths, and pennation angles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.2">The more pennated muscle can generate a greater active force but has shorter fibers; thus, its active force–length and force–velocity curves are taller but narrower. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.3">Adapted from Lieber (2010).</span></p></figcaption></figure>
<p><a id="c5-para-0028"/></p>
<figure id="c5-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1"><img src="../images/c5-fig-3004.jpg" alt="c5-fig-3004.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">(5.4)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">where </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1"><img src="../images/c5-fig-6016.jpg" alt="c5-fig-6016.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1"> is the muscle's </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">specific tension</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1"> (also known as its </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">peak isometric stress</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">), or the maximum muscle force that can be generated per unit area. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.2">A typical value for this parameter when modeling healthy muscle is </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1"><img src="../images/c5-fig-6017.jpg" alt="c5-fig-6017.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">.</span></p>
<p><a id="c5-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">In the previous section, we noted that the fibers in a pennated muscle will be shorter but also more numerous than those in a parallel-fibered muscle of the same volume. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.2">Thus, although the force–length and force–velocity curves of the pennated muscle would be narrower, these curves would also be taller because the PCSA (and therefore the maximum isometric force) of the pennated muscle would be greater (</span><a href="#c5-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">Figure 5.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">).</span></p>
<p><a id="c5-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">The length and contraction velocity of a muscle's fibers are affected by more than just its geometry, as we will see in the next two sections. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.2">Nevertheless, we can already observe how a muscle's architecture affects the range of functions it can perform: all else being equal, a pennated muscle will be able to generate greater force than a parallel-fibered muscle of the same volume, but over a smaller range of lengths and at lower contraction velocities.</span></p></section>
<section>
<h2><a id="c5-sec-0004"/><a id="c5-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">Maximum muscle contraction velocity, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1"><img src="../images/c5-fig-6018.jpg" alt="c5-fig-6018.jpg"/></span></h2>
<p class="paraaftertitle"><a id="c5-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">Thus far, we have introduced three variables related to the geometric arrangement of a muscle's fibers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.2">To determine the maximum contraction velocity of a muscle, we now introduce the idea that muscle fibers come in two types: </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">fast-twitch</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">slow-twitch</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.2">Fast-twitch fibers have faster rise times and relaxation times in single-twitch experiments (Figure 4.12), and have a higher maximum contraction velocity—roughly 10 optimal-fiber-lengths per second (10</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1"><img src="../images/c5-fig-6019.jpg" alt="c5-fig-6019.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">) compared to about 3</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1"><img src="../images/c5-fig-6020.jpg" alt="c5-fig-6020.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1"> for slow-twitch fibers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.2">Mammalian muscles contain both fiber types, but the ratio of fast-twitch to slow-twitch fibers varies depending on a muscle's function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.3">For example, the gastrocnemius muscle has a large fraction of fast-twitch fibers that are recruited during activities that require large forces to be developed quickly, such as sprinting. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.4">The neighboring soleus muscle has mostly slow-twitch fibers that are well suited for generating force during long periods of standing, because slow-twitch fibers are resistant to fatigue.</span></p>
<p><a id="c5-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">Muscle fibers are distinguished not only by their speed of contraction but also by how they create ATP. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.2">Fibers that create ATP aerobically (i.e., using oxygen) are more resistant to fatigue than are fibers that create ATP anaerobically (i.e., without oxygen). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.3">Slow-twitch fibers tend to be resistant to fatigue, while fast-twitch fibers fatigue quickly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.4">Humans and some other animals have a third fiber type, so we generally categorize fibers as </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Type I</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1"> (slow, fatigue-resistant), </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">Type IIA</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1"> (fast, moderately fatigable), or </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">Type IIB</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1"> (very fast, highly fatigable). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.2">The fraction of muscle fibers that are fast and only moderately fatigable can be increased with intensive training.</span></p>
<p><a id="c5-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Recall from Chapter 4 that motor units differ in size, and that the central nervous system recruits motor units from smallest to largest, following Henneman's size principle (Figure 4.13). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.2">In addition to differing in size, motor units also differ in the types of fibers they contain, with all fibers in a given motor unit being of the same type. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.3">The smallest motor units are typically comprised of Type I fibers and are recruited first, followed by the somewhat larger motor units comprising Type IIA fibers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.4">The largest motor units, containing Type IIB fibers, are usually recruited last. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.5">Thus, at low activations (as might be observed during quiet standing), primarily slow-twitch, fatigue-resistant motor units are recruited. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.6">The maximum muscle contraction velocity is, therefore, likely to decrease at low activations; however, a constant value of 10</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1"><img src="../images/c5-fig-6021.jpg" alt="c5-fig-6021.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1"> is typically assumed in models of muscle–tendon dynamics.</span></p>
<p><a id="c5-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">Roughly speaking, fatigable and fatigue-resistant muscle fibers in fowl and fishes are segregated (</span><a id="c5-fig-0011a"/><a href="#c5-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Figure 5.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.2">In contrast, fatigable and fatigue-resistant muscle fibers are interspersed in mammalian muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.3">This is why a chicken dish can be prepared with either white or dark meat, but a beef dish cannot. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.4">The difference in color arises because dark muscle (or meat) is rich in a protein called myoglobin that stores oxygen within the muscle, darkening its color and making it more resistant to fatigue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.5">The dark meat in chicken drumsticks consists of leg muscles that are used for long periods of standing and running (fatigue-resistant, slow-twitch fibers). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.6">The white breast meat comprises muscle that is used only for short bouts of flight (fatigable, fast-twitch fibers). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.7">In humans, individual muscle fibers are either “dark” or “white,” but both fiber types are sprinkled throughout each muscle.</span></p>
<figure id="c5-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1"><img src="../images/c5-fig-0006.jpg" alt="c5-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0011a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">Figure 5.6</span></a></span> <a id="c5-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">Some muscles in chicken and fishes comprise primarily fatigue-resistant, slow-twitch fibers (dark meat) while others comprise fatigable, fast-twitch fibers (white meat). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.2">In humans and other mammals, fiber types are interspersed within each muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.3">Image of human fibers stained to show different fiber types courtesy of Richard Lieber.</span></p></figcaption></figure></section>
<section>
<h2><a id="c5-sec-0005"/><a id="c5-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Tendon slack length, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1"><img src="../images/c5-fig-6022.jpg" alt="c5-fig-6022.jpg"/></span></h2>
<p class="paraaftertitle"><a id="c5-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">So far, none of the parameters we have discussed say anything about tendon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.2">In our Hill-type model, we describe tendons as nonlinear springs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.3">This section introduces the fifth of our five parameters, called the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">tendon slack length</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">, and the fourth of our four generic dimensionless curves, which is called the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">tendon force–length curve</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.2">We derive the force–length curve from experimental measurements that relate stress and strain (</span><a id="c5-fig-0012a"/><a href="#c5-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Figure 5.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">).</span></p>
<figure id="c5-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1"><img src="../images/c5-fig-0007.jpg" alt="c5-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">Figure 5.7</span></a></span> <a id="c5-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">Tendon stress–strain relationship.</span></p></figcaption></figure>
<p><a id="c5-para-0039"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">In this graph, the horizontal axis indicates the tendon's strain, expressed as a percentage increase of its length compared to the length when it is at rest and developing no force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.2">That resting length is what we call the slack length, which we denote by </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1"><img src="../images/c5-fig-6023.jpg" alt="c5-fig-6023.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.2">The strain in the tendon (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">ε</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">) at any given instant is defined as follows:</span></p>
<p><a id="c5-para-0040"/></p>
<figure id="c5-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1"><img src="../images/c5-fig-3005.jpg" alt="c5-fig-3005.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">(5.5)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1"> is the tendon's current length and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1"><img src="../images/c5-fig-6024.jpg" alt="c5-fig-6024.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1"> is its slack length.</span></p>
<p><a id="c5-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">The vertical axis in </span><a href="#c5-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">Figure 5.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1"> indicates the force generated per unit of cross-sectional area of tendon, called the stress. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.2">In a linear spring, the graph of stress against strain is a straight line, whose slope is the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">stiffness</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1"> of the spring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.2">Because tendon acts as a nonlinear spring, the stress–strain curve is not a straight line, and it has three regions with distinct stiffness characteristics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.3">In the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">toe region</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">, when the tendon is stretched by roughly 0 to 3 percent, it is more compliant (“stretchy”), gradually increasing in stiffness as it lengthens and its constituent collagen fibers uncoil. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.2">In the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">linear region</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1"> of the stress–strain curve, when the tendon is stretched by roughly 3 to 7 percent, the tendon has constant stiffness; in this region it behaves like a linear spring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.2">Finally, above 10 percent strain the tendon begins to experience mechanical failure and there is a high risk of injury. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.3">We typically assume that the internal tendon (aponeurosis) and external tendon have the same material properties and strain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.4">There is experimental evidence to support the values of strain given above, but some argue that tendons can experience higher values of strain, up to 15 percent, before they fail.</span></p>
<p><a id="c5-para-0043"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">A tendon can affect the length and therefore the force-generating capacity of the muscle to which it attaches (</span><a id="c5-fig-0014a"/><a href="#c5-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Figure 5.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.2">The stretch of a tendon will have little effect if its slack length is short relative to the length of the muscle fibers: even if such a tendon experiences very high strain, its absolute length change (and thus the amount by which the muscle fibers shorten) will be only a small fraction of the optimal length of the muscle fibers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.3">In contrast, if the tendon slack length is long compared to the optimal muscle fiber length, the tendon will stretch substantially when the muscle generates force, resulting in appreciably shorter muscle fibers and a change in the active force that is generated. </span><a id="c5-fig-0015a"/><a href="#c5-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">Figure 5.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1"> shows that a longer tendon can also increase the range of lengths over which the muscle–tendon unit can generate force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.2">In both of these ways, tendon profoundly affects muscle function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.3">The role of tendon is especially apparent, of course, when a tendon injury renders the muscle practically unusable. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.4">As we will see in Chapter 12, tendons also play an important role in the storage and release of energy as they stretch and recoil during running.</span></p>
<figure id="c5-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1"><img src="../images/c5-fig-0008.jpg" alt="c5-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0014a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Figure 5.8</span></a></span> <a id="c5-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">Tendon compliance affects muscle force generation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.2">In both cases shown, a parallel-fibered muscle is at its optimal length when the muscle is inactive (top). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.3">If the tendon is relatively short and rigid (left), there will be negligible change in the length of the muscle fibers when the muscle is activated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.4">If the tendon is long and compliant (right), the tendon will stretch when the muscle is activated, thereby shortening the muscle fibers and reducing the generated force.</span></p></figcaption></figure>
<figure id="c5-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1"><img src="../images/c5-fig-0009.jpg" alt="c5-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0015a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Figure 5.9</span></a></span> <a id="c5-para-0045"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">Effects of tendon compliance on the active force–length curve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">Increasing the slack length of the tendon relative to the optimal muscle fiber length (i.e., increasing tendon compliance) broadens the range of lengths over which a muscle–tendon actuator can generate active force.</span></p></figcaption></figure></section>
<section>
<h2><a id="c5-sec-0006"/><a id="c5-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">Measuring muscle-specific parameters</span></h2>
<p class="paraaftertitle"><a id="c5-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">To summarize, we have defined five muscle-specific parameters, listed in </span><a id="c5-tbl-0001a"/><a href="#c5-tbl-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Table 5.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">, which capture much of the variability among the muscles of the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.2">We have listed values for these parameters for the major muscles of the lower extremity in </span><a id="c5-tbl-0002a"/><a href="#c5-tbl-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Table 5.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.2">For convenience, we often normalize forces, velocities, muscle lengths, and tendon lengths by dividing by </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1"><img src="../images/c5-fig-6025.jpg" alt="c5-fig-6025.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1"><img src="../images/c5-fig-6026.jpg" alt="c5-fig-6026.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1"><img src="../images/c5-fig-6027.jpg" alt="c5-fig-6027.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">, and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1"><img src="../images/c5-fig-6028.jpg" alt="c5-fig-6028.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">, respectively, and use a tilde to denote normalized quantities (e.g., </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1"><img src="../images/c5-fig-6029.jpg" alt="c5-fig-6029.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">).</span></p>

<p class="tableFootnote"><a id="c5-fn-0001"/><a href="#c5-fn-0001a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">*</span></a> <a id="c5-para-0271"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">Maximum isometric forces were derived from muscle volumes measured by Handsfield et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.2">(2014) in young, healthy subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.3">Optimal fiber lengths and pennation angles at optimal fiber length were derived from measurements by Ward et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.4">(2009) in cadavers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.5">Tendon slack lengths were derived from Rajagopal et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.6">(2016).</span></p></figure>
<p><a id="c5-para-0272"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">Several techniques have been developed to measure or compute values for muscle and tendon parameters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.2">Architectural parameters have historically been obtained from measurements on human cadavers, whereas dynamic properties such as the shape of the force–velocity relationship have typically been derived from experiments on animal muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.3">Care must be taken when obtaining and interpreting measurements from cadavers because tissue properties can change postmortem; for example, muscles become dehydrated, which can change the muscle's mass, volume, shape, and length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.4">Also, cadaveric measurements are typically obtained from the bodies of older donors whose muscles may have atrophied and are, therefore, not representative of the young, healthy subjects who often participate in research studies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.5">Whenever possible, it is generally preferable to calibrate a musculoskeletal model using measurements obtained from the subject being studied, particularly for parameters that are known to vary substantially between individuals (e.g., maximum isometric force).</span></p>
<p><a id="c5-para-0273"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">Muscle fiber lengths and pennation angles can be measured in dissected cadaver specimens or </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">in vivo</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1"> using ultrasonography (</span><a id="c5-fig-0016a"/><a href="#c5-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">Figure 5.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">, left). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.2">Note, however, that the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">optimal</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1"> fiber length cannot be determined from ultrasound images because, while the fiber length can be measured, it is not apparent how this length relates to the length at which maximum active force is generated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.2">Measurement of sarcomere lengths provides the information needed to relate measured fiber lengths to optimal fiber lengths, because the sarcomere's force–length curve is known. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.3">If muscle fiber length (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">) and sarcomere length (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">S</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">) are measured, the optimal muscle fiber length (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1"><img src="../images/c5-fig-6036.jpg" alt="c5-fig-6036.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">) can be computed as follows:</span></p>
<figure id="c5-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1"><img src="../images/c5-fig-0010.jpg" alt="c5-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c5-fig-0016a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">Figure 5.10</span></a></span> <a id="c5-para-0274"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1">Imaging provides data needed to calibrate models of muscle–tendon dynamics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.2">Shown at left is an ultrasound image of the fibers of the tibialis anterior muscle from which fiber lengths can be measured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.3">Shown at right is an image of sarcomeres in the same muscle obtained using two-photon microendoscopy, from which sarcomere lengths can be measured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.4">Images courtesy of Glen Lichtwark and Gabriel Sanchez.</span></p></figcaption></figure>
<p><a id="c5-para-0275"/></p>
<figure id="c5-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1"><img src="../images/c5-fig-3006.jpg" alt="c5-fig-3006.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0276"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">(5.6)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">where </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1"><img src="../images/c5-fig-6037.jpg" alt="c5-fig-6037.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1"> is the optimal sarcomere length, estimated to be 2.7 μm in human muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.2">There are several techniques to measure sarcomere lengths in whole muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.3">One method is laser diffraction, a technique pioneered by Richard Lieber, in which the muscle is surgically exposed and a laser is shone through the muscle to generate a diffraction pattern (Lieber et al., 1984). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.4">A less invasive approach developed in my laboratory (Llewellyn et al., 2008) uses needle-sized microendoscopes to image sarcomere lengths </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">in vivo</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1"> (</span><a href="#c5-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">Figure 5.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">, right).</span></p>
<p><a id="c5-para-0277"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">Tendon slack lengths cannot be easily determined in cadavers or imaging experiments due to the aponeurosis, which is internal to muscle and difficult to measure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.2">One strategy to determine tendon slack lengths in models of muscle–tendon dynamics is to measure muscle fiber lengths, sarcomere lengths, and joint positions in cadavers, and then set tendon slack lengths in a model such that the muscle fiber lengths and sarcomere lengths match the cadaveric measurements in the same pose.</span></p>
<p><a id="c5-para-0278"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">As mentioned earlier, we can estimate maximum isometric muscle force from measurements of PCSA and specific tension (Equation 5.4). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.2">PCSA can be estimated by measuring muscle mass in cadaver specimens or muscle volume using MRI, the latter being preferable due to the likelihood of atrophy in the muscles of older donor subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.3">We can compute PCSA from muscle volume and optimal fiber length as follows:</span></p>
<p><a id="c5-para-0279"/></p>
<figure id="c5-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1"><img src="../images/c5-fig-3007.jpg" alt="c5-fig-3007.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0280"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1">(5.7)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.1">Specific tension has been estimated in many experiments on human and animal muscles by computing the ratio of maximum measured muscle tension to a known PCSA or fiber cross-sectional area (see Equation 5.4). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.503.2">Be aware that values for PCSA reported in the literature may, in fact, be strictly geometric cross-sectional areas, or may have already been multiplied by cos(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.504.1">ϕ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.505.1">).</span></p></section>
<section>
<h2><a id="c5-sec-0007"/><a id="c5-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.506.1">Hill-type model of muscle–tendon dynamics</span></h2>
<p class="paraaftertitle"><a id="c5-para-0281"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.1">In this section, we describe a widely used model of muscle–tendon dynamics based on the work of Hill (1938), Wilkie (1956), and Ritchie and Wilkie (1958). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.2">A. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.3">V. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.4">Hill performed the pioneering experiments in the 1930s to characterize the force–velocity property of muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.5">The model has since been extended to capture the other salient features of muscle force generation that we have described. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.507.6">The convention is still to call it a “Hill-type model,” even though Hill is responsible for only part of it.</span></p>
<p><a id="c5-para-0282"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.508.1">The most popular Hill-type model consists of three components: an </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.509.1">active contractile element</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.510.1"> and a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.511.1">passive elastic element</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.512.1"> that represent the active and passive force-generating properties of muscle, and a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.513.1">tendon elastic element</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.514.1"> (</span><a id="c5-fig-0020a"/><a href="#c5-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.515.1">Figure 5.11A</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.2">The symbols for these elements, shown in green, orange, and blue, are borrowed from the engineering literature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.516.3">We call the combination of these three components a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.517.1">muscle–tendon actuator</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.2">The model represents muscles and tendons with simple elements; the biological complexities are distilled into the parameters and dimensionless curves that define the dynamics of these elements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.518.3">Of course, many biological details are omitted in our pursuit of a model that is computationally tractable.</span></p>
<p><a id="c5-para-0283"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.1">This model is commonly used in studies of whole-body movement because it provides sufficiently accurate estimates of muscle force to study the actions of muscles during walking and running without being computationally burdensome. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.2">As we have seen, tendon elasticity can affect muscle fiber dynamics substantially, and the interaction of muscle and tendon is an essential feature of this model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.3">We assume that it is mechanically equivalent to use a single nonlinear spring to represent the effect of the tendons on both ends of the muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.519.4">Note from the schematic in </span><a href="#c5-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.520.1">Figure 5.11A</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.521.1"> that the lengths of the muscle (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.522.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.523.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.524.1">), tendon (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.525.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.526.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.527.1">), and muscle–tendon actuator (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.528.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.529.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.530.1">) are related as follows:</span></p>
<p><a id="c5-para-0284"/></p>
<figure id="c5-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.531.1"><img src="../images/c5-fig-3008.jpg" alt="c5-fig-3008.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c5-para-0285"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.532.1">(5.8)</span></p></figcaption></figure>
</section>
<section>
<h2><a id="c5-sec-0008"/><a id="c5-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.533.1">Dimensionless curves</span></h2>
<p class="paraaftertitle"><a id="c5-para-0286"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.534.1">The force-generating properties of the three components in the Hill-type model are described by four generic, time-invariant curves, listed in </span><a id="c5-tbl-0003a"/><a href="#c5-tbl-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.535.1">Table 5.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.536.1"> and shown in </span><a href="#c5-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.537.1">Figure 5.11B–D</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.538.2">These curves become dimensionless once we normalize them by muscle-specific parameters.</span></p>
