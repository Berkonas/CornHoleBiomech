<header>
<h1><a id="c9-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">9</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Muscle Force Optimization</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c9-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">There is always a well-known solution to every human problem—neat, plausible, and wrong.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">—H. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.2">L. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.3">Mencken</span></p></blockquote>
<p><a id="c9-para-0002"/></p>
<figure id="c9-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"><img src="../images/c9-fig-5001.jpg" alt="c9-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c9-para-0003"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">one of the great</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> biomechanics discoveries of my lifetime did not occur in a laboratory, and did not involve any special equipment other than the marvelously adaptable human body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">In 1968, a 21-year-old civil engineering student named Dick Fosbury revealed his discovery and astounded the sports world by going to the Olympics and jumping over the high-jump bar </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">backward</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">“Fosbury goes over the bar like a guy being pushed out of a 30th-story window,” wrote one sportswriter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">Yet this seemingly ungainly style took him to an Olympic record height of 2.24 meters and a gold medal.</span></p>
<p><a id="c9-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Fosbury actually began using his signature technique in high school, out of desperation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">He had failed to master the standard technique of the time, the “Western roll,” in which the jumper crosses the bar face down, as if embracing it with his arms and legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">He also tried the older “scissors” technique, in which the jumper clears the bar in almost a seated posture while moving his legs up and down like scissors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">But this technique is less than ideal because the jumper has to propel his center of mass far above the bar.</span></p>
<p><a id="c9-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">In a Fosbury flop, the jumper runs toward the bar at one end, curves inward toward the middle, and then twists at the last moment so that he or she jumps over the bar backward (</span><a id="c9-fig-0002a"/><a href="#c9-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Figure 9.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">One part of the body slithers over the bar at a time: first the head and shoulders, then the torso, the hips, the knees, and finally the feet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">An advantage of the Fosbury flop is that the body's center of mass never has to go over the bar. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.4">At peak altitude, when the hips are above the bar, the back is arched so that the head and legs dangle below the bar, lowering the center of mass.</span></p>
<figure id="c9-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1"><img src="../images/c9-fig-0001.jpg" alt="c9-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Figure 9.1</span></a></span> <a id="c9-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">The “Fosbury flop” high-jump technique. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Photo of Ma’ayan Furman-Shahaf by Evren Kalinbacak.</span></p></figcaption></figure>
<p><a id="c9-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Although Fosbury discovered the flop without any formal biomechanics training, we have now caught up to his pioneering genius. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">Coaches now use high-speed video to instruct their high jumpers on where to plant their foot, how low to crouch before pushing off the ground, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.3">They have thought of improvements Fosbury never dreamed of. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.4">Lifting the arms at takeoff increases the vertical kinetic energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.5">Tucking the chin after the hips clear the bar helps to force the hips down and, by Newton's third law, lifts the feet up and over the bar.</span></p>
<p><a id="c9-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Since 1980, every high-jump world record has been set using the Fosbury flop, and all other techniques have disappeared from the world stage. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Now the debate is over which kind of Fosbury flop is best: the “speed flop” or the “power flop”?</span></p>
<p><a id="c9-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">For me, the Fosbury flop story teaches several valuable lessons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">The first is that we should never assume that the popular way to do something is the only way or the best way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">But a less philosophical and more biomechanical message is that our body, with an articulating skeleton and hundreds of muscles, gives us an infinite variety of ways to accomplish a task, whether it's an ostensibly simple one like reaching for a cup of coffee or a complex one like high-jumping two meters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.4">Every action requires our brain to coordinate the activity of our muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.5">A simple motion of our chin can have effects all the way down to our feet.</span></p>
<p><a id="c9-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">To perform any motion, our bodies solve an optimization problem, trying to get the maximum result out of a minimum effort. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">But one catch, which can trip up both mathematical models and real-world athletes, is that a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">local</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1"> optimum is not always the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">global</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"> optimum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">High-jumpers before Fosbury thought they had found the best technique. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">They were wrong. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.4">But they could not raise the bar merely by making small (“local”) adjustments to the Western roll technique. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.5">They needed an athlete-engineer who was willing to make large (“global”) adjustments that would change our idea of what a high jump should look like.</span></p>
<p><a id="c9-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">In this chapter, we explore two broad scenarios in which numerical optimization is used to compute muscle forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">The first scenario arises when we wish to estimate the muscle forces that were responsible for generating an observed motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">Because of the redundancy of the human musculoskeletal system, there are many possible solutions in general, and we will apply optimization to find the set of muscle forces that is the best by some criterion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.4">We call this problem the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">muscle redundancy problem</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> (it is also known as the muscle force-sharing problem). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">The second broad scenario arises when studying the muscle coordination that optimizes performance of a given task, such as the high jump. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">In this scenario, we need to compute muscle forces as well as the body segmental motions that achieve the task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">If an optimizer were provided with the rules of the high-jump competition and a sufficiently realistic model of the musculoskeletal system, it would discover the Fosbury flop (as well as other techniques we may never have seen before). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.5">Note that estimating muscle forces using optimization is not merely a computational convenience: the nervous system is, itself, an optimizer of sorts. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.6">Let's jump into the details here.</span></p>
<section>
<h2><a id="c9-sec-0001"/><a id="c9-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Biological and numerical optimizers</span></h2>
<p class="paraaftertitle"><a id="c9-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">People consciously optimize their everyday lives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">We make decisions about how to allocate our time, money, attention, and other limited resources to maximize some balance of short-term and long-term satisfaction, and do so while adhering to constraints like laws and other obligations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">Amazingly, humans optimize subconsciously as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.4">Recall from Chapter 2 that we naturally adjust our walking speed, cadence, and other variables of gait to keep our cost of transport near a minimum—unless we're in a hurry, of course, in which case we prioritize speed over metabolic cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.5">We also optimize when learning new tasks and adapting to new situations, maximizing some combination of accuracy, efficiency, comfort, and other performance metrics depending on the situation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.6">Experiments have shown that we maintain an “internal model” of our bodies, a subconscious understanding of the relationship between the amount we excite our muscles and the resulting motions of our body segments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.7">When exposed to a new environment, such as microgravity aboard the International Space Station or an artificial force field imposed by a robotic device, we are initially clumsy and inefficient because we are planning and anticipating our movements using an internal model that is no longer accurate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.8">As we explore the new environment, we use visual and other sensory feedback to adjust our internal model and improve our coordination. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.9">Over time, we adapt to the new environment and regain proficiency by relearning the relationship between muscle excitations and performance.</span></p>
<p><a id="c9-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Numerical optimization algorithms use similar exploratory or “guess-and-check” strategies to find solutions to underdetermined problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">We refer to the guesses as </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">candidate solutions</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">, each of which proposes a numerical value for all unknowns or </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">design variables</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">, such as muscle excitations in the muscle redundancy problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">The suitability of each candidate solution is determined by evaluating the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">objective function</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> or </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">cost function</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">, an expression that quantifies the favorability of a particular set of design-variable values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">The candidate solution that renders the best objective function value (minimum or maximum, as the case may be) is referred to as the</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"> optimal solution</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">, or simply the solution to the optimization problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">(Note that we may define our task as always seeking to </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">minimize</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"> the objective function; to </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">maximize</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"> a quantity like jump height, we simply minimize its negative.) As we will see, the choice of objective function can have a profound effect on the solution and the amount of effort required to compute it.</span></p>
<p><a id="c9-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">The optimal solution is also influenced by </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">constraints</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">In many problems, we demand that certain expressions (equalities or inequalities) are satisfied by a candidate solution for it to be </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">feasible</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">, or acceptable as a solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">In the muscle redundancy problem, for example, we require that all muscle forces be tensile and that the moments they generate sum to the desired net joint moments (computed using an inverse dynamics algorithm, for example). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.3">Because constraints can only reduce the number of feasible solutions (i.e., they decrease the size of the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">solution space</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">), the solution to a constrained optimization problem has an objective function value that is no better than if the optimization problem were unconstrained. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">Adding constraints reduces your options. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.3">If there are too many constraints, the solution space may be empty (the problem may have no feasible solutions). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.4">Depending on the research question, it may be acceptable to convert one or more strict constraints into soft constraints, which take the form of “penalties” that are added to the objective function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.5">Penalty terms are typically scaled by weighting factors so that their contributions to the objective function can be adjusted according to their relative importance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.6">A generic optimization problem may be stated as follows:</span></p>
<div class="top"><hr/></div>

<section class="featureS1"><a id="c9-feafxd-0001"/>
<h2 class="featuretitle"><a id="c9-title-0003"/><b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Generic Optimization Problem</span></b></h2>
<p class="paraaftertitle"><a id="c9-para-0015"/></p>
<figure id="c9-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"><img src="../images/c9-fig-5002.jpg" alt="c9-fig-5002.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<div class="bottom "><hr/></div></section>

<p><a id="c9-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">We subconsciously coordinate our muscles using these same principles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">Consider the action of picking up a pen that is sitting on your desk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.3">You know the required final position and orientation of your hand, but you are free (within limits) to choose the final pose of your arm and the path to arrive at this pose. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.4">Stated formally, each candidate solution to this problem might propose a different set of muscle excitations defined as parameterized functions of time; these parameters would be the design variables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.5">Of all the candidate solutions, the feasible solutions would be those describing muscle excitation patterns that achieve the desired final hand pose. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.6">Additional constraints might describe other nonnegotiable requirements, such as avoiding obstacles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.7">You would presumably seek to minimize travel time to some degree, but the objective function would also likely include a term that favors low muscle effort for this nonurgent task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.8">A naive approach to solving such problems is to evaluate the objective function for all feasible solutions and select the best candidate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.9">As you might expect, however, a so-called “exhaustive search” (in which every possibility is considered) is inefficient and impractical for all but the simplest problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.10">A numerical optimizer attempts to find the most favorable feasible solution (or at least a feasible solution that is good enough for the problem at hand) by evaluating only as many candidate solutions as it deems necessary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.11">Many optimizers differ only in how they select new candidate solutions to evaluate based on the suitability of those that have already been explored.</span></p>
<p><a id="c9-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Our exploration now moves to discussing strategies for solving the muscle redundancy problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">For simplicity, we will seek a solution at a single instant of time, assuming that the required net joint moments are known and that the subject is stationary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">We sometimes refer to such problems as “static” optimization problems because some of the time-dependent aspects of the problem are ignored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.4">In the next section, we formulate an optimization problem statement and solve a simple muscle redundancy problem by inspection to build intuition about the solution space. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.5">In the subsequent sections, we discuss numerical algorithms that can solve the nontrivial optimization problems that we encounter in the real world.</span></p></section>
<section>
<h2><a id="c9-sec-0002"/><a id="c9-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Static optimization problems solved by inspection</span></h2>
<p class="paraaftertitle"><a id="c9-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">We will first focus on the model shown in </span><a id="c9-fig-0004a"/><a href="#c9-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Figure 9.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">Suppose we wish to generate a net ankle plantarflexion moment of 100 N·m. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.3">Which muscles should be excited to generate this moment? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.4">There are many feasible solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.5">For example, perhaps the entire desired moment should be generated by the soleus, or perhaps it would be best if each of the three plantarflexors in the model contributed some fraction of the total. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.6">Forces could be generated by one or both of the dorsiflexor muscles as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.7">As given, the problem is underdetermined: there are fewer equations than unknowns and we need more information to solve the problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.8">Stated formally, we wish to find the force </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">F</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> generated by each muscle </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">i</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1"> (our design variables) such that the total ankle plantarflexion moment is 100 N·m (an equality constraint), subject to the condition that </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">F</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> is positive and does not exceed </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1"><img src="../images/c9-fig-6001.jpg" alt="c9-fig-6001.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> for any </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">i</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1"> = 1, …, 5 (bounds).</span></p>
<figure id="c9-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"><img src="../images/c9-fig-0002.jpg" alt="c9-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Figure 9.2</span></a></span> <a id="c9-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">A musculoskeletal model of the shank and foot with the key plantarflexor and dorsiflexor muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.2">A measured ankle moment could have been generated by many combinations of muscle forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.3">Values in parentheses are the instantaneous maximum force (assuming zero velocity and a rigid tendon) and moment arm at the ankle corresponding to the pose shown.</span></p></figcaption></figure>
<p><a id="c9-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">One approach to solving an underdetermined problem is to modify the problem so that there are as many equations as unknowns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">In our example, we will assume for simplicity that the dorsiflexors are inactive and generate zero force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.3">This assumption reduces the number of unknowns from five to three: the force generated by the gastrocnemius (which we will call </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">GAS</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">), soleus (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">SOL</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">), and tibialis posterior (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">TP</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">However, we still have only one equation (the equality constraint specifying the desired net ankle joint moment). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">We could assume that each plantarflexor muscle will generate the same force and introduce two additional equations, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">SOL</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"> = </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">GAS</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">TP</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"> = </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">GAS</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">This strategy will lead to a feasible solution, but will not produce physiologically reasonable results in general. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.3">Instead, we will define an objective function, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"><img src="../images/c9-fig-6002.jpg" alt="c9-fig-6002.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">, that quantifies the favorability of a solution as a function of muscle forces </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"><img src="../images/c9-fig-6003.jpg" alt="c9-fig-6003.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">, and will then solve the following optimization problem:</span></p>
<div class="top"><hr/></div>

<section class="featureS1"><a id="c9-feafxd-0002"/>
<h2 class="featuretitle"><a id="c9-title-0005"/><b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Optimization Problem 1:</span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1"> Find the ankle plantarflexor muscle forces that produce a desired joint moment</span></h2>
<p class="paraaftertitle"><a id="c9-para-0021"/></p>
<figure id="c9-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"><img src="../images/c9-fig-5003.jpg" alt="c9-fig-5003.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<div class="bottom "><hr/></div></section>

<p><a id="c9-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">For example, suppose we assume that the nervous system minimizes the total muscle force generated at each instant of time, so that </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1"><img src="../images/c9-fig-6004.jpg" alt="c9-fig-6004.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1"> is the sum of the instantaneous muscle forces:</span></p>
<p><a id="c9-para-0023"/></p>
<figure id="c9-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1"><img src="../images/c9-fig-3001.jpg" alt="c9-fig-3001.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c9-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">(9.1)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">The solution in this case is </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">GAS</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"> = 2564, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">SOL</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1"> = 0, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">TP</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1"> = 0, because the gastrocnemius has the largest moment arm and therefore can generate the desired ankle plantarflexion moment using the least amount of force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.2">Note that the gastrocnemius is capable of generating the entire 100 N·m of plantarflexion moment in this model (i.e., 2564 N &lt; 4097 N), and in fact it can generate a moment of about 160 N·m in this pose when fully activated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.3">Ankle moments in excess of 160 N·m would be generated by recruiting the soleus as well (the muscle with the second-largest moment arm), followed by the tibialis posterior once the soleus had also reached its maximum force (</span><a id="c9-fig-0007a"/><a href="#c9-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Figure 9.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">).</span></p>
<figure id="c9-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1"><img src="../images/c9-fig-0003.jpg" alt="c9-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">Figure 9.3</span></a></span> <a id="c9-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">The force exerted by each muscle in </span><a href="#c9-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">Figure 9.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1"> to generate ankle plantarflexion moments, assuming a muscle coordination strategy that minimizes the sum of muscle forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.2">This objective function (Equation 9.1) results in the unrealistic behavior in which each muscle reaches its maximum force before the next muscle is recruited.</span></p></figcaption></figure>
<p><a id="c9-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Although the objective function in Equation 9.1 leads to an optimization problem that can be easily solved, notice that only one muscle is recruited when a plantarflexion moment of 100 N·m is desired. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">If a greater moment is required, then we recruit a second muscle only when the first muscle has reached its maximum force-generating capacity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.3">We know from experiments that muscles are not in fact recruited in this stepwise, noncooperative manner.</span></p>
<p><a id="c9-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">Different objective functions will lead to different solutions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.2">More realistic objective functions have been proposed in the biomechanics literature but result in optimization problems that cannot be solved by inspection. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.3">Typically, we must use computers to solve the nonlinear, constrained, high-dimensional problems encountered in biomechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.4">In the next sections, we will discuss two broad categories of optimization algorithms: </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">local methods</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">global methods</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.2">We then move on to solve a more realistic muscle force-sharing problem.</span></p></section>
<section>
<h2><a id="c9-sec-0003"/><a id="c9-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Local methods to solve static optimization problems</span></h2>
<p class="paraaftertitle"><a id="c9-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">Starting from an initial guess (candidate solution), a local optimization method generates a sequence of new guesses, each in the neighborhood of its predecessor and typically having a better objective function value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.2">The algorithm terminates when it reaches a local optimum: a solution that is surrounded by inferior solutions in its immediate neighborhood. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.3">A classic example of a local method is the steepest-descent algorithm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.4">If we are solving a minimization problem in two variables, for example, the objective function </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">J</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">x</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">,</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">y</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">) can be represented as a surface whose height above the X–Y plane at the point (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">x</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">*,</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">y</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">*) is </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">J</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">x</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">*,</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">y</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">*). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.2">The steepest-descent strategy can then be imagined as placing a marble on the objective function surface and letting it roll downhill until it settles at the bottom of a basin. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.3">As shown in </span><a id="c9-fig-0008a"/><a href="#c9-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Figure 9.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">, the final solution depends on the initial guess and may not be the best possible solution. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.2">Newton's method is similar to the steepest-descent method, but takes a more direct route to a local minimum by using information about the second derivative (curvature) of the objective function surface—though at the potentially substantial cost of computing this additional information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.3">Interior-point methods are also popular, which begin by finding any feasible solution (i.e., a solution in the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">interior</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1"> of the feasible region) and then seeking progressively better solutions while remaining within the feasible region.</span></p>
<figure id="c9-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1"><img src="../images/c9-fig-0004.jpg" alt="c9-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">Figure 9.4</span></a></span> <a id="c9-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">Graphical representation of an objective function in two variables, where the height of the surface represents the objective function value </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">J</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">x</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">,</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">y</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.2">The steepest-descent algorithm starts at a point in the solution space and takes steps downhill, in the direction of the steepest local slope, until movement in any direction would increase </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">J</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">(</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">x</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">,</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">y</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.2">The final solution depends on the initial guess, as illustrated by the four paths shown here, and may not be globally optimal.</span></p></figcaption></figure>
<p><a id="c9-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">In </span><a id="c9-fig-0009a"/><a href="#c9-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">Figure 9.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">, we show the solution to Optimization Problem 1 (above) for all possible ankle plantarflexion moments when minimizing the sum of squared muscle activations, which has been used as a surrogate for metabolic power consumption:</span></p>
<figure id="c9-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1"><img src="../images/c9-fig-0005.jpg" alt="c9-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">Figure 9.5</span></a></span> <a id="c9-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">The force exerted by each muscle in </span><a href="#c9-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">Figure 9.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1"> to generate all possible ankle plantarflexion moments, assuming a muscle coordination strategy that minimizes the sum of squared muscle activations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.2">This objective function (Equation 9.2) results in behavior that agrees with experimental observations, in which several muscles are recruited to generate even modest joint moments.</span></p></figcaption></figure>
<p><a id="c9-para-0032"/></p>
<figure id="c9-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1"><img src="../images/c9-fig-3002.jpg" alt="c9-fig-3002.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c9-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">(9.2)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Muscle activity as computed using Equation 9.2 is closer to what is observed in human experiments than when using the simpler objective function shown in Equation 9.1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.2">In particular, notice in </span><a href="#c9-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">Figure 9.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1"> that all three muscles are recruited even when only small ankle plantarflexion moments are desired, which is qualitatively similar to experimental measurements of EMG (</span><a id="c9-fig-0011a"/><a href="#c9-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">Figure 9.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">).</span></p>
<figure id="c9-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1"><img src="../images/c9-fig-0006.jpg" alt="c9-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0011a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">Figure 9.6</span></a></span> <a id="c9-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Electromyographic (EMG) signals from the gastrocnemius lateralis (left) and soleus (right) during walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.2">Both muscles contribute to generating ankle plantarflexion moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.3">Data from Bartlett and Kram (2008); Arnold et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.4">(2013).</span></p></figcaption></figure>
<p><a id="c9-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">A local method seeks a solution that is optimal within its immediate neighborhood; however, there can be many such local minima. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.2">As illustrated in </span><a href="#c9-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">Figure 9.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">, for example, the solution found by a gradient-descent algorithm depends on the initial guess. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.2">We might simply try running the algorithm a few times with different initial guesses, but this might still miss a solution that is better—perhaps substantially better. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.3">Remember Dick Fosbury. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.4">Thus, although local methods can be fast, a global method may lead to better solutions.</span></p></section>
<section>
<h2><a id="c9-sec-0004"/><a id="c9-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">Global methods to solve static optimization problems</span></h2>
<p class="paraaftertitle"><a id="c9-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">Global optimization methods avoid getting “stuck” in local minima by considering candidate solutions beyond the immediate neighborhood of the previous guess. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.2">One such algorithm is the genetic algorithm, where a population of candidate solutions evolves from one stage (generation) to the next through simulated natural processes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.3">The philosophy behind this optimization strategy is to explore in more detail those regions of the solution space that are known to be favorable while also venturing into unexplored regions of the solution space that may contain even better solutions.</span></p>
<p><a id="c9-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">Genetic algorithms tend to scale poorly with problem size, but other evolutionary algorithms perform well in practice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.2">For example, the covariance matrix adaptation evolution strategy (CMA-ES) illustrated in </span><a id="c9-fig-0012a"/><a href="#c9-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">Figure 9.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1"> performs very well for high-dimensional problems with many local minima. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.2">In each generation, the CMA-ES algorithm selects candidate solutions from a distribution whose mean and covariance are updated based on the favorability of the previous generations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.3">Over time, the distribution will home in on a solution: the mean will approach an optimum and the distribution will shrink. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.4">Simulated annealing uses a similar idea; here the algorithm begins with a high “temperature” that permits more adventurous exploration of the solution space, then gradually “cools” into a more conservative steepest-descent method.</span></p>
<figure id="c9-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1"><img src="../images/c9-fig-0007.jpg" alt="c9-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">Figure 9.7</span></a></span> <a id="c9-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">Global optimization methods like the covariance matrix adaptation evolution strategy (CMA-ES) avoid converging to local minima. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.2">Shown here are nine generations of the CMA-ES algorithm as it minimizes the function shown in </span><a href="#c9-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Figure 9.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.2">Each cyan dot represents a candidate solution; the ellipse in each panel indicates the distribution of the population in that generation.</span></p></figcaption></figure>
<p><a id="c9-para-0039"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">The best optimizer to use depends on the nature of the problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.2">For example, if the objective function is smooth and the problem has only one minimum, then a simple local search strategy will suffice as it will be guaranteed to converge to the global minimum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.3">On the other hand, algorithms like CMA-ES would be more appropriate in the presence of many local minima. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.4">For large problems, it is advantageous to use an algorithm that can be run in parallel and to define criteria for deciding when a solution will be good enough to answer a particular research question.</span></p></section>
<section>
<h2><a id="c9-sec-0005"/><a id="c9-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Muscle forces during walking and running</span></h2>
<p class="paraaftertitle"><a id="c9-para-0040"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">With these optimization methods in hand, we are now equipped to solve one of the most important problems in biomechanics: determining the muscle forces that are responsible for generating movements such as walking and running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.2">This is called the muscle redundancy (or force-sharing) problem.</span></p>
<p><a id="c9-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">When we run, our muscles generate hip extension, knee extension, and ankle plantarflexion moments during the first part of the stance phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.2">Suppose we wish to compute the muscle forces generated at the instant of peak vertical ground reaction force (</span><a id="c9-fig-0013a"/><a href="#c9-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">Figure 9.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.2">Using the lower-limb model and data given in </span><a id="c9-fig-0014a"/><a href="#c9-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">Figure 9.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">, and the objective function given in Equation 9.2 to minimize the sum of squared muscle activations, we can express the optimization problem as follows:</span></p>

<p><span class="figureLabel"><a href="#c9-fig-0013a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Figure 9.8</span></a></span> <a id="c9-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">Net joint moments generated in the sagittal plane by one subject while running at 5 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.2">The vertical line indicates the time of peak vertical ground reaction force (GRF). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.3">Data from Hamner and Delp (2013).</span></p></figcaption></figure>

<figure id="c9-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1"><img src="../images/c9-fig-0009.jpg" alt="c9-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0014a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">Figure 9.9</span></a></span> <a id="c9-para-0043"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">A simple musculoskeletal model of the leg can be used to study muscle coordination and joint loads during the stance phase of running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.2">Key muscles involved in generating sagittal-plane movement have been grouped into nine representative muscle paths (Hamner and Delp, 2013). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.3">Values in parentheses are the instantaneous maximum force (assuming zero velocity and a rigid tendon) and moment arms corresponding to the pose shown.</span></p></figcaption></figure>

<p><a id="c9-para-0065"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">We can estimate the forces generated by each muscle during walking and running by repeating this analysis at evenly spaced instants over the gait cycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.2">The muscle forces and resulting joint moments are shown for walking in </span><a id="c9-fig-0016a"/><a id="c9-fig-0017a"/><a href="#c9-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">Figures 9.10 and 9.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">; for running, in </span><a id="c9-fig-0018a"/><a id="c9-fig-0019a"/><a href="#c9-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">Figures 9.12 and 9.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.2">As expected, the computed muscle forces are higher during running than during walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.3">Also notice that the muscle forces peak earlier in the gait cycle during running, as we would expect given the shorter stance phase.</span></p>
