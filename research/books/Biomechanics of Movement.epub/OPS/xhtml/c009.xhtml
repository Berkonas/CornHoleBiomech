<section>
<h2><a id="c9-sec-0006"/><a id="c9-title-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">Estimating joint loads</span></h2>
<p class="paraaftertitle"><a id="c9-para-0070"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">Joint loads can only be estimated once muscle forces are known. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.2">As we mentioned in Chapter 8, it is important to distinguish between the net joint reaction forces computed from an inverse dynamic analysis and the “bone-on-bone” forces that would be measured by a sensor implanted in a joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.3">The intersegmental forces we computed in Chapter 8 would be equal to the actual joint loads only if our muscles applied pure joint torques like rotational motors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.4">Of course, our muscles do not generate torques directly but rather generate pulling forces that are applied to the skeleton. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.5">These forces produce moments as well as compressive and shearing forces in the joints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.6">As we will see, the contribution of muscle forces to joint loads can be substantial.</span></p>
<p><a id="c9-para-0071"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">To demonstrate how muscle forces contribute to joint loads, we consider the instant at which the vertical ground reaction force peaks during running at 5 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.2">For simplicity, we will use the planar model shown in </span><a id="c9-fig-0020a"/><a href="#c9-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">Figure 9.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1"> to compute the compressive and shearing forces at the ankle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.2">In the previous section, we used the lower-limb model shown in </span><a href="#c9-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">Figure 9.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1"> to estimate the forces that would be generated by the gastrocnemius and soleus at this instant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.2">Note, however, that the paths of the gastrocnemius and soleus muscles in that model do not lie in the plane perpendicular to the ankle joint axis, so we retain in our forthcoming calculations only the components of these forces that act in the plane of </span><a href="#c9-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">Figure 9.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.2">We project the ground reaction force onto this plane as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.3">Finally, we assume the foot is stationary during the stance phase and compute forces </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">Fx</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">Fy</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1"> as in Chapter 8:</span></p>
<figure id="c9-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1"><img src="../images/c9-fig-0014.jpg" alt="c9-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0020a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">Figure 9.14</span></a></span> <a id="c9-para-0072"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">Planar model used to estimate ankle joint loads during running at 5 m/s, at the instant of peak vertical ground reaction force (GRF). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.2">The forces shown have been projected into the plane perpendicular to the ankle joint axis.</span></p></figcaption></figure>
<p><a id="c9-para-0073"/></p>
<figure id="c9-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1"><img src="../images/c9-fig-3003.jpg" alt="c9-fig-3003.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c9-para-0074"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">(9.3)</span></p></figcaption></figure>

<p><a id="c9-para-0075"/></p>
<figure id="c9-fig-0022"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1"><img src="../images/c9-fig-3004.jpg" alt="c9-fig-3004.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c9-para-0076"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">(9.4)</span></p></figcaption></figure>

<p><a id="c9-para-0077"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">Notice that the muscle forces (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">GAS</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">SOL</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">) contribute substantially to the compressive force in the joint (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">Fy</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">), accounting for about 80 percent of the total. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.2">The total compressive force is over 10 bodyweights in this example during running, but substantial compressive loads have been measured in less dynamic activities as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.3">Instrumented artificial joints have recorded peak contact forces in the hip of about 2.5 bodyweights during walking and over 5 bodyweights during periods of instability while standing on one leg. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.4">Even during a stationary single-leg stance, the contact force in the hip is over 2 bodyweights due to the forces generated by muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.5">Thus, it is essential to calculate muscle forces if we wish to assess the forces within joints.</span></p></section>
<section>
<h2><a id="c9-sec-0007"/><a id="c9-title-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">Dynamic optimization</span></h2>
<p class="paraaftertitle"><a id="c9-para-0078"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">In the preceding sections, we made several assumptions about the underlying optimization problem being solved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.2">Perhaps most importantly, we assumed that the objective function depends only on instantaneous quantities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.3">We ignored muscle–tendon dynamics and assumed that muscle activations (and the consequent forces that are generated) depend only on the net joint moments required at a particular instant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.4">Static optimizations such as these are relatively easy to handle computationally, but we know that humans and animals anticipate the future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.5">For example, we may invest energy at the beginning of a movement if it will be profitable later, as when we “wind up” before throwing a ball or squat before performing a standing long jump. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.6">These explosive activities take advantage of the dynamics of our muscles and tendons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.7">Static optimization may be insufficient to fully understand muscle coordination during movements such as throwing, jumping, and sprinting, where accurately predicting the muscle activations at one point in time may require us to consider the entire movement.</span></p>
<p><a id="c9-para-0079"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">A second key assumption we made in the previous sections is that the kinematics and net joint moments are known </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">a priori</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.2">If we are studying a movement for which motion capture data are available, for example, we can estimate joint motions and moments computationally using inverse kinematic and inverse dynamic simulations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.3">However, suitable experimental data may be unavailable and difficult (or impossible) to collect, such as when studying activities with high injury rates or the gait of </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">Tyrannosaurus rex</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.2">Further, we may specifically wish to predict unobserved movement adaptations in response to surgeries, implants, prostheses, or exoskeletons, or to discover novel movement strategies for maximizing athletic performance or minimizing joint loads. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.3">We can use dynamic optimization for these tasks.</span></p>
<p><a id="c9-para-0080"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">In a dynamic optimization, we use a model of musculoskeletal dynamics to determine the muscle coordination and consequent motion that optimize a mathematical description of a motor task. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.2">Dynamic optimization typically proceeds by selecting a candidate solution, running a forward dynamic simulation, evaluating the performance of the candidate solution, and iterating until some stopping criterion is met (e.g., a target objective function value has been reached or a predetermined number of candidate solutions has been considered; </span><a id="c9-fig-0023a"/><a href="#c9-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">Figure 9.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.2">The design variables might include musculoskeletal parameters like the length of the Achilles tendon, parameters of a wearable device like the stiffness of a performance-enhancing shoe, or the activity of each muscle over time.</span></p>
<figure id="c9-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1"><img src="../images/c9-fig-0015.jpg" alt="c9-fig-0015.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0023a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">Figure 9.15</span></a></span> <a id="c9-para-0081"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1">A dynamic optimization proceeds by selecting a candidate solution, running a forward dynamic simulation, evaluating the performance of the candidate solution, and iterating until the stopping criterion is met. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.2">Candidate solutions can be selected by any optimizer, may adjust any parameters in the model, and may be evaluated based on any performance metrics.</span></p></figcaption></figure>
<p><a id="c9-para-0082"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">For example, suppose we wish to optimize muscle coordination during a 100 m sprint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.2">Each candidate solution might describe the activity of each muscle over time (e.g., as a parameterized curve or sequence of control points). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.3">We would seek to minimize the time required to travel 100 m, perhaps including constraints to prevent injury. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.4">Evaluating the objective function would involve running a forward dynamic simulation (see Figure 1.12) where the model is posed in an initial configuration, the proposed activations at the first time point are applied to the model's muscles, the resulting muscle forces are applied to the skeleton, the consequent accelerations (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1"><img src="../images/c9-fig-6005.jpg" alt="c9-fig-6005.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">) are numerically integrated forward in time to determine the model's configuration at the next time point, and the process is repeated until the runner reaches the finish line. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.2">Solving this optimization problem would require substantial computational resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.3">To make the problem more tractable, we might use a planar model that includes only a few key muscles, focus on a single gait cycle at a fixed speed, or design a neural controller and optimize a relatively small number of controller parameters rather than the activation of each muscle at each point in time.</span></p>
<p><a id="c9-para-0083"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">The objective function and constraints can take many forms, depending on the research question being explored. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.2">In the sprinting example above, we simply sought to minimize duration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.3">For a task like walking to the bus stop or opening a door, however, it would be more appropriate to use an objective function that combines minimizing duration with minimizing total energy expenditure, perhaps balancing these terms with weights that reflect the urgency of the activity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.4">Analysis of other tasks might demand additional terms that account for considerations like safety, comfort, fatigue, and stability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.5">Note that optimizers are “clever” and will exploit any aspect of an optimization problem that leads to a better objective function value, regardless of the subjective nature of the solution—so be careful what you wish for! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.6">I once defined an objective function to minimize the cost of transport without imposing a minimum travel distance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.7">The optimizer wisely chose to simply fall forward, which took very little energy but was not what I intended. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.8">Defining optimization problems can be an iterative process, where the solutions returned by the optimizer are used to identify errors in the translation from research question to objective function and constraints.</span></p>
<p><a id="c9-para-0084"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">As is the case with any research study, it is critical to validate the results obtained through optimization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.2">As we saw in </span><a href="#c9-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">Figure 9.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">, the timing of computed muscle activity might be compared to the timing of experimental EMG. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.2">Experimental kinematics, ground reaction forces, joint loads (e.g., from instrumented joint replacements), indirect calorimetry, and other measurements for the same or similar activities can also be useful. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.3">Robust, properly validated results from dynamic optimizations can lead to deep insights about movement and muscle coordination. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.4">For example, B. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.5">J. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.6">Fregly used optimization to discover a new way to walk that reduces the loads in his knees (Fregly et al., 2007). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.7">He learned how to walk with this gait and, as a result, was able to keep up with his kids when they visited Disney World.</span></p>
<p><a id="c9-para-0085"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">In the case of the Fosbury flop, a dynamic optimization might reveal that the jumper should raise his arms as he leaves the ground to maximize the vertical velocity of his mass center at takeoff. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.2">Likewise, he should maintain contact with the ground as long as possible during takeoff to maximize the impulse of the ground reaction force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.3">These insights have been obtained empirically, through the experience of athletes and coaches over the 50 years since Fosbury debuted his flop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.4">In the next section, by contrast, we will describe an example in which such insights have been achieved much more rapidly through computer modeling and numerical optimization.</span></p></section>
<section>
<h2><a id="c9-sec-0008"/><a id="c9-title-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">Muscle coordination during a standing long jump</span></h2>
<p class="paraaftertitle"><a id="c9-para-0086"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">Assistive devices such as orthoses, prostheses, and exoskeletons have the potential to improve human life by restoring mobility following injury and enhancing athletic performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.2">However, we do not yet fully understand how assistive devices interact with the coordination of our muscles when we are performing complex tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.3">My student Carmichael Ong set out to investigate how a simulated assistive device could improve performance of a standing long jump. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.4">This task demands precise muscle coordination and has a clear objective, and is therefore well suited for optimization.</span></p>
<p><a id="c9-para-0087"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">Carmichael used a planar, five-segment model (</span><a id="c9-fig-0024a"/><a href="#c9-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">Figure 9.16</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.2">Physiological torque actuators at the ankle, knee, hip, and shoulder represented the combined action of all muscles crossing each joint and included the length- and velocity-dependent force-generation capacities found in biological muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.3">The activity of each torque actuator was described by a piecewise linear function, the nodes of which were the design variables in the dynamic optimization problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.4">The objective function in this problem maximized jump distance (by minimizing its negative) while avoiding undesirable outcomes:</span></p>
<figure id="c9-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1"><img src="../images/c9-fig-0016.jpg" alt="c9-fig-0016.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0024a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">Figure 9.16</span></a></span> <a id="c9-para-0088"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">A planar model with five segments and seven degrees of freedom for studying muscle coordination during a standing long jump. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.2">Dynamic optimization was used to predict the coordination of muscles crossing the ankle, knee, hip, and shoulder to maximize jump distance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.3">Adapted from Ong et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.4">(2016).</span></p></figcaption></figure>
<p><a id="c9-para-0089"/></p>
<figure id="c9-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1"><img src="../images/c9-fig-3005.jpg" alt="c9-fig-3005.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c9-para-0090"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">(9.5)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">Weights </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1"> in Equation 9.5 were chosen to reflect the relative importance of each term and to appropriately balance units of length, torque, force, and time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.2">Determining appropriate weights in the objective function is often an iterative process, with adjustments being made manually or using another optimizer (in a process sometimes called “meta-optimization”).</span></p>
<p><a id="c9-para-0091"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">In this study, Carmichael began by using the CMA-ES algorithm to optimize the jump distance of the model without assistance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.2">This initial optimization problem produced a standing long jump that captured the salient kinematic and kinetic features of human jumps, including a counter-movement, takeoff kinematics, ground reaction forces, and joint moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.3">He then augmented the model with massless rotational springs placed at the hip, knee, and ankle (</span><a id="c9-fig-0026a"/><a href="#c9-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">Figure 9.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.2">Of course, such devices do not exist, but the simulations allowed us to adjust the applied torques in any way we wished, which helped us to understand how they affect performance.</span></p>
<figure id="c9-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1"><img src="../images/c9-fig-0017.jpg" alt="c9-fig-0017.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c9-fig-0026a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">Figure 9.17</span></a></span> <a id="c9-para-0092"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">Joint torques during the ground contact phase when unassisted (left) and augmented (right) that maximize performance of a standing long jump. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.2">Mean ±1 standard deviation shown for experimental data (Horita et al., 1991). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.3">Adapted from Ong et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.4">(2016).</span></p></figcaption></figure>
<p><a id="c9-para-0093"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">In the augmented scenario, Carmichael optimized the stiffness and equilibrium position of each spring simultaneously with the other design variables. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.2">The optimal assistive device increased jump distance by over 1 m, from 2.27 m to 3.32 m. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.3">It was exciting to see the algorithm co-optimize the device parameters and the human coordination so that their combined performance achieved the longest possible jump. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.4">This study demonstrates how dynamic optimization can provide insight into human movement and complement experimental approaches to assistive device design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.5">In the future, predictive tools like this may be used to customize a surgery, implant, prosthesis, or assistive device for an individual patient, perhaps helping to determine which of these treatments would lead to the best outcome.</span></p></section>
