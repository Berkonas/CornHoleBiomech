<header>
<h1><a id="f2-title-0001"/><br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">Preface</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="f2-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Start a huge, foolish project, like Noah . . .</span></p>
<p class="quote-epigraphpara"><a id="f2-para-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">it makes absolutely no difference what people think of you.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">—Rumi</span></p></blockquote>
<p class="Sp-text-1"><a id="f2-para-0003"/><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">biomechanics has been a positive</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> and sustained force in my life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.2">Playing sports dominated my life as a kid in the Delp family. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.3">I felt alive playing baseball and lacrosse, and loved to run and ski. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.4">The only two books I read before graduating from high school were a technique manual on alpine skiing and a coaches’ guide to the long jump. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.5">I had dyslexia, and these rudimentary biomechanics manuals were the only books I found worth the struggle and embarrassment of reading.</span></p>
<p><a id="f2-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">I studied biomechanics in college to learn how to recover my ability to walk after injuring my hip in a ski accident. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">I learned everything I could about biomechanics and entered graduate school a few years later when I could walk well enough to limp around the Stanford University campus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">I studied design, robotics, neuroscience, and biomechanics in graduate school. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">I felt I was in a good position to help people with impaired movement because I had empathy for their issues and had gained a strong background in engineering design and computer science, which was not so common in biomedical research at the time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.5">I had the good fortune to study biomechanics with Felix Zajac, who greatly influenced my thinking.</span></p>
<p><a id="f2-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">After I finished at Stanford, I took a job as an assistant professor at Northwestern University and the Rehabilitation Institute of Chicago. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">As a new professor, I wanted to share my joy of biomechanics and teach principles that would enable students to understand and analyze muscle and movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">This gave rise to a course, Biomechanics of Movement, which I have taught about 30 times at Northwestern University and Stanford University. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">This book covers most of what I teach in this course.</span></p>
<p><a id="f2-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">By reading this book you will learn some of the most important principles of biomechanics, a field that explains how living things work using physics, and thus helps us understand and appreciate life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Biomechanics is at the center of many disciplines, including bioengineering, mechanical engineering, physical therapy, ergonomics, kinesiology, and biology, and I expect students in these fields will benefit from reading this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">I am also writing for people who are interested in neuroscience, robotics, computer science, and sports. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">In addition to learning principles of biomechanics, you will acquire skills for analyzing and simulating human movement; these skills will empower you to make a positive change in the world.</span></p>
<p><a id="f2-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Many people who begin studying biomechanics fall into one of two groups: engineers who are baffled by the language of biology or biologists who are baffled by the language of engineering. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Both of these languages are important. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">Although they are frequently taught separately, nature does not care about the boundaries that humans place between disciplines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">One of the purposes of this book is to give you a good start toward proficiency in both. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5">For that reason, I do not assume any prior knowledge of biology.</span></p>
<p><a id="f2-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">I do have to assume some familiarity with physics, as otherwise this book would be much longer than it is. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Newton's laws characterize the motions of everything from planets to people. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">We need these laws, and other principles of mechanics, to analyze human movement, so I assume that you have a basic background in mechanics from a prior course in physics or engineering. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">Because mathematics is the language of mechanics, I also assume that readers have a grasp of the basic concepts of calculus, including derivatives, integrals, and differential equations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.5">Newton's second law, the starting point for mechanics, is, after all, a differential equation.</span></p>
<p><a id="f2-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">My goal was to write an approachable book that demonstrates key concepts of biomechanics using examples that are interesting and inspiring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">I did not write this book as a review of the literature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">There are thousands of fascinating articles on biomechanics, and many excellent review articles; I have cited only a small fraction of these. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">My objective is to introduce biomechanics to people who are new to the field and enable them to explore the biomechanics literature. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">In addition to covering established principles, I highlight some of the big ideas that will shape the future of the field and illustrate how you can pursue these ideas to have a positive impact in science, engineering, art, and the lives of others. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.6">If you are already a biomechanics guru, I very much hope you enjoy this book and find it useful in your teaching.</span></p>
<p><a id="f2-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">I want to provide you with tools to solve practical problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">While there are no homework problems printed in the book, my colleagues and I have developed a website that has many fun and challenging problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">Solving these problems will expand your knowledge substantially. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.4">You can find these problems online at </span><a href="http://biomech.stanford.edu"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">biomech.stanford.edu</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">, which also has lecture slides, a syllabus, and other materials that you are welcome to use. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">You can also provide feedback at this website. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">Please let me know what you like and how I can improve the book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.4">This book includes lots of data, and my collaborators and I provide much of these data at </span><a href="http://simtk.org"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">simtk.org</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.2">We established this website as a place to share biomechanical models, software, and data, and I encourage you to use and contribute to this resource.</span></p>
<p><a id="f2-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">This book contains a lot of information that has rarely been collected in one place, but it is not comprehensive. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">I provide few details on the role of the nervous system in coordination and control of movement, and I do not discuss how muscle changes with exercise, disuse, or age. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">I also include only limited discussion of the biomechanics of bone, cartilage, and ligaments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.4">These are fascinating topics that are covered well in other books.</span></p>
<p><a id="f2-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Writing and illustrating this book with Tom Uchida and my brother, David Delp, has been one of the most enjoyable and rewarding partnerships of my career. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">Much of the work was done during our “jamborees” at my kitchen table. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">One of our goals was to write with a single voice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.4">Tom and I have collaborated so closely that neither of us can tell you who drafted the sentences in this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.5">The stories come from my experience, and we decided to write in my voice since I have taught the Biomechanics of Movement course so many times; however, Tom's fingerprints are on every page. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.6">If you appreciate the precision with which concepts of mechanics are expressed, you can thank Tom for that. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.7">If you like the pictures in the book more than the words, which most people do, you can thank my brother. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.8">He is a fantastic artist and has helped us create what we hope you will find to be a fine-looking book.</span></p>
<p><a id="f2-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Dana Mackenzie, a mathematician and brilliant writer, dramatically improved the book by providing detailed comments and suggestions on the entire manuscript. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">A book should not be a chore to read, but should give the reader the same joy that it gives to the author. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">Dana has worked to summon that joy from chapters in which it was hidden. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.4">I am deeply grateful to him for doing this, and I think you will be too.</span></p>
<p><a id="f2-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Silvia Blemker, a world-class biomechanist, provided early drafts of Chapters 4–6, including some great ideas for the figures and examples, and she deserves special thanks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">We also thank Molly Seamans and Matthew Abbate from the MIT Press. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.3">Molly provided creative input on the book design and laid out every page. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.4">Matthew gave valuable feedback on the text and reviewed every word.</span></p>
<p><a id="f2-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Many examples are taken from work performed in my laboratory, and my collaborators need to be recognized, which I do by naming some of them in the book and referencing others in our coauthored papers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">The National Institutes of Health made this work possible, and I am deeply grateful for their support.</span></p>
<p><a id="f2-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Other friends, colleagues, students, and mentors have made valuable contributions by reviewing early drafts of this book, coauthoring papers from which I drew inspiration, or explaining key concepts to me. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">I would like to thank the people pictured on the following pages for their insights and partnership. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">Biomechanics is a team sport, and I am grateful to be on a team with you.</span></p>
<p><a id="f2-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">I am deeply thankful for the many friends I have made in biomechanics, which continues to be a positive force in my life.</span></p>
<p class="Sp-text-2"><a id="f2-para-0018"/><b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Scott L. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">Delp</span></b></p>
<p class="Sp-text-3"><a id="f2-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Stanford, California</span></p>
<p><a id="f2-para-0020"/></p>
<figure id="f2-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"><img src="../images/ffirs01-fig-5003.jpg" alt="ffirs01-fig-5003.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="Sp-text-1"><a id="f2-para-0021"/><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">when i moved to california</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"> with a fine arts degree, there weren't many </span><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">sculptor wanted</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"> ads in the paper, so my brother Scott wrangled me some work as the Visual Information Specialist for Felix Zajac's Neuromuscular Biomechanics Lab where Scott was a grad student. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">Making charts and computer animations for scientists, I learned the power of clear visual communication. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">I got to ask really smart people the “stupid” questions: What's the main thing you want people to understand? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">Is a piconewton super small or super big? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.5">And can we leave that wiggly line out of the picture?</span></p>
<p><a id="f2-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Thirty years later I call it a career. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.2">I get to ask smart people stupid questions, and Scott and Tom seem happy I do. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.3">How else could we stand each other after years making something daunting like a textbook? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.4">Here's how. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.5">We each bring a love for elegant communication, the drive to cross the finish line, and buckets of mutual respect.</span></p>
<p class="Sp-text-2"><a id="f2-para-0023"/><b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">David Delp</span></b></p>
<p class="Sp-text-3"><a id="f2-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">San Francisco, California</span></p>
<p class="Sp-text-1"><a id="f2-para-0025"/><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">every researcher</span></span> <span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">knows</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"> that some collaborations go more smoothly than others. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">I feel very fortunate to have worked with so many great collaborators. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">Among the first was John McPhee, my Ph.D. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.4">supervisor at the University of Waterloo, who introduced me to the world of multibody dynamics, the rigor of technical writing, and a community of inspiring people.</span></p>
<p><a id="f2-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Working with Scott and David has been a uniquely enriching intellectual and personal experience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">We all enjoyed the opportunity and I think the book is better because of it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">We worked hard to fill these pages with ideas that we think are worth sharing and with illustrations that are fascinating, informative, and beautiful. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">We have also seasoned the text with subtly philosophical quotes and a pinch of humor to make your literary journey as palatable as possible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.5">I hope you enjoy our creation.</span></p>
<p class="Sp-text-2"><a id="f2-para-0027"/><b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Thomas K. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">Uchida</span></b></p>
<p class="Sp-text-3"><a id="f2-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Ottawa, Ontario, Canada</span></p>
