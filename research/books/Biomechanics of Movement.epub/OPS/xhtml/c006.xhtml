<header>
<h1><a id="c6-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">6</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Musculoskeletal Geometry</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c6-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Give me a place to stand and with a lever I will move the whole world.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">—Archimedes</span></p></blockquote>
<p><a id="c6-para-0002"/></p>
<figure id="c6-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"><img src="../images/c6-fig-5001.jpg" alt="c6-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c6-para-0003"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">when i was in graduate school</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">, one of my mentors was Eugene Bleck, the chief of orthopedic surgery at Stanford Hospital and the person who literally wrote the book on orthopedic management of cerebral palsy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">One of the most common causes of disability in children, cerebral palsy affects a person's ability to walk and maintain balance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Individuals with cerebral palsy often develop distinctive gaits, like crouch gait, which are inefficient and exhausting.</span></p>
<p><a id="c6-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">In many cases, surgery to lengthen the hamstring muscles can improve crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">But not always! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">When I asked Dr. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">Bleck how he decided whether to lengthen the hamstrings of a particular patient, he told me that he lengthens the muscles when they are “too tight,” which he assessed by seeing how far he could stretch the muscles with the children lying on his exam table. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.5">As I traveled around to different hospitals, I found that their criteria for performing the surgery were inconsistent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.6">I thought there must be a better way to determine which children would benefit and which ones would not. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.7">Was the problem simply that the hamstrings were too short, or were there other issues that would not be resolved by making the muscle longer?</span></p>
<p><a id="c6-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">The computer models we began developing in Chapters 4 and 5 are well suited to answer such questions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">Before performing an irreversible surgery on a person, perhaps we could simulate the surgery on a computational model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">But we need to add something to these models first: the way that muscles interact with the skeleton to produce motion of the whole body.</span></p>
<p><a id="c6-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">We start with the fact that muscles produce movement by applying forces to bones. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">However, there is a subtlety here. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">If, for example, your biceps attached exactly at your elbow joint, you would never be able to move your forearm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">Instead, muscles attach to bones at a distance from anatomical joints so that they have sufficient leverage to move the limbs (if not the whole world). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5">This leverage is called the muscle's mechanical advantage or </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">moment arm</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">The moment arm can be increased by increasing the distance between the muscle attachment site on the bone and the joint's axis of rotation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">The effect is similar to placing a door handle far from the hinge to make it easy to open the door. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">The mechanical advantage of a muscle is determined by bone geometry, body pose, and the path of the muscle's line of action. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">We refer to these features collectively as </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">musculoskeletal geometry</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">.</span></p>
<p><a id="c6-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">As we will see in this chapter, a muscle's mechanical advantage is intimately related to its functions in the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">Thus, musculoskeletal geometry is studied by scientists and clinicians from a variety of disciplines. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">Paleontologists study the shapes of fossilized bones from extinct animals to determine where muscles attached and to make inferences about how these animals might have moved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.4">Biomechanists study the musculoskeletal geometry of world-class athletes to determine the features that make elite performance possible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.5">And surgeons can apply musculoskeletal models to improve the lives of people with cerebral palsy.</span></p>
<p><a id="c6-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">We will begin our journey with a simple example, which will nevertheless teach us a lot about how these models work. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">The questions are: How much effort does it take to stand still? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">And which is harder: standing still with your weight over the front of your feet, or standing still with your weight centered on the middle of your feet?</span></p>
<section>
<h2><a id="c6-sec-0001"/><a id="c6-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Muscle mechanical advantage</span></h2>
<p class="paraaftertitle"><a id="c6-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">To answer these questions, we consider a two-dimensional, static analysis of the force required by a single ankle plantarflexor muscle to hold the body upright during quiet standing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">We model the body as a single inverted pendulum, assume the entire weight of the body is supported by a single leg, and compare two scenarios. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">In the first scenario, the person stands with her weight evenly distributed over her foot, which positions the center of pressure halfway between her heel and toes (</span><a id="c6-fig-0002a"/><a href="#c6-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Figure 6.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">, left). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">In the second scenario, she leans forward, which moves the center of pressure toward her toes.</span></p>
<figure id="c6-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"><img src="../images/c6-fig-0001.jpg" alt="c6-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Figure 6.1</span></a></span> <a id="c6-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Free-body diagrams (left) and model (right) used to estimate plantarflexor muscle force with a person standing in an upright posture (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1"><img src="../images/c6-fig-6001.jpg" alt="c6-fig-6001.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">) and when leaning forward (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"><img src="../images/c6-fig-6002.jpg" alt="c6-fig-6002.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">).</span></p></figcaption></figure>
<p><a id="c6-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">We begin our analysis by drawing a free-body diagram of the foot in each scenario, isolating it from the rest of the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">We represent the foot as a triangle and assume that the ankle joint is located at the upper vertex A of the triangle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">According to Archimedes’ law of the lever, the fact that we can stand upright without falling either forward or backward means that the sum of the moments about the ankle joint is zero:</span></p>
<p><a id="c6-para-0012"/></p>
<figure id="c6-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1"><img src="../images/c6-fig-3001.jpg" alt="c6-fig-3001.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">(6.1)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">The index </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">i</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1"> refers to the two scenarios, 1 and 2, in which the person is standing with her weight centered over her foot and leaning forward, respectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">Rearranging this equation allows us to calculate the force that must be generated by the muscle:</span></p>
<p><a id="c6-para-0014"/></p>
<figure id="c6-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"><img src="../images/c6-fig-3002.jpg" alt="c6-fig-3002.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">(6.2)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">This equation shows that the force in the muscle (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"><img src="../images/c6-fig-6003.jpg" alt="c6-fig-6003.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">) is influenced by the magnitude of the ground reaction force (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"><img src="../images/c6-fig-6004.jpg" alt="c6-fig-6004.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">) and the weight of the foot (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">w</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">f</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">oo</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">t</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">), as well as the geometry of the system: the location of the center of pressure (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">ℓ</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">), the location of the foot's center of mass (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">c</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">), and, notably, the perpendicular distance from the center of the ankle to the muscle force vector (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">r</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">The distance </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">r</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"> defines the muscle moment arm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.2">A muscle with a small moment arm must apply greater force to generate the same joint moment as a muscle with a large moment arm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.3">We say that the muscle with the larger moment arm has a greater mechanical advantage.</span></p>
<p><a id="c6-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Realistic quantities for each variable in each scenario are shown in </span><a id="c6-tbl-0001a"/><a href="#c6-tbl-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Table 6.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">In the first scenario, the force in the muscle is roughly equal to the magnitude of the ground reaction force (which is equal to body weight because the person is in static equilibrium). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.3">In the second scenario, simply moving the center of pressure forward by 3 centimeters results in a doubling of the muscle force.</span></p>

<p><a id="c6-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Note that we balanced moments about the ankle to compute muscle force </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"><img src="../images/c6-fig-6005.jpg" alt="c6-fig-6005.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"> (Equation 6.2). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">If we instead balance forces in the horizontal and vertical directions, we can compute the two components of the joint reaction force (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Fx</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Fy</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.2">We find that the vertical force (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Fy</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">) is about 2–3 times body weight even during quiet standing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.2">Large internal joint contact forces exist because the moment arms of muscles are generally small; thus, large muscle forces can be required even when engaging in ostensibly effortless tasks like standing still or walking slowly.</span></p>
<p><a id="c6-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">The above example applies basic concepts of mechanics to a simple two-dimensional static analysis involving only one muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">In the next section, we develop a more formal engineering definition of a moment arm that applies more broadly to three-dimensional problems.</span></p></section>
<section>
<h2><a id="c6-sec-0002"/><a id="c6-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">Definition of a muscle moment arm</span></h2>
<p class="paraaftertitle"><a id="c6-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">In our analysis of musculoskeletal geometry, we assume that muscle–tendon units can be modeled as frictionless, extensible strings that attach to bones and wrap around anatomical structures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.2">Although biological muscles are composed of thousands of fibers, each with a unique three-dimensional path, we often represent a muscle as a single tensile force acting along the path from one point of attachment to another. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.3">This path determines the points at which the muscle force is applied as well as the direction of application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.4">The moment generated by a muscle (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1"><img src="../images/c6-fig-6009.jpg" alt="c6-fig-6009.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">) can be computed as follows (see </span><a id="c6-fig-0005a"/><a href="#c6-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">Figure 6.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">):</span></p>
<figure id="c6-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1"><img src="../images/c6-fig-0002.jpg" alt="c6-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0005a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Figure 6.2</span></a></span> <a id="c6-para-0039"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Definition of moment arm </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">r</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"> associated with the generation of a moment about point O.</span></p></figcaption></figure>
<p><a id="c6-para-0040"/></p>
<figure id="c6-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"><img src="../images/c6-fig-3003.jpg" alt="c6-fig-3003.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">(6.3)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">where “×” denotes the vector cross product. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">Point O indicates the joint's center of rotation, vector </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1"><img src="../images/c6-fig-6010.jpg" alt="c6-fig-6010.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1"> represents the magnitude and orientation of the muscle force applied at point P</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">, and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1"><img src="../images/c6-fig-6011.jpg" alt="c6-fig-6011.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1"> is a vector from O to any point on the muscle's line of action.</span></p>
<p><a id="c6-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">One appealing property of the straight-line muscle model, illustrated in </span><a href="#c6-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Figure 6.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">, is the fact that </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1"><img src="../images/c6-fig-6012.jpg" alt="c6-fig-6012.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1"> may be drawn from O to P</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">, or to P</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">, or to any other point along the muscle's line of action. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.2">In all cases, the cross product in Equation 6.3 will come out the same. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.3">The moment generated by a muscle (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1"><img src="../images/c6-fig-6013.jpg" alt="c6-fig-6013.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">) is a vector, but it is often more convenient to obtain a scalar quantity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.2">In this example, we project Equation 6.3 onto the Z axis:</span></p>
<p><a id="c6-para-0043"/></p>
<figure id="c6-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1"><img src="../images/c6-fig-3004.jpg" alt="c6-fig-3004.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">(6.4)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">where “·” denotes the vector dot product and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1"><img src="../images/c6-fig-6014.jpg" alt="c6-fig-6014.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1"> is a unit vector along the Z axis, the axis of rotation associated with moment </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">M</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">z</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.2">We define the moment arm of the muscle (r) by normalizing </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">M</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">z</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1"> by the magnitude of the muscle force (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1"><img src="../images/c6-fig-6015.jpg" alt="c6-fig-6015.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">):</span></p>
<p><a id="c6-para-0045"/></p>
<figure id="c6-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1"><img src="../images/c6-fig-3005.jpg" alt="c6-fig-3005.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">(6.5)</span></p></figcaption></figure>

<p><a id="c6-para-0047"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">Remember that </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">r</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1"> represents the perpendicular distance from the muscle's line of action to the joint's center of rotation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">In </span><a id="c6-fig-0009a"/><a href="#c6-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">Figure 6.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">, you can see how to estimate this distance from a magnetic resonance imaging (MRI) scan of the ankle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.2">Here we have to assume that the axis of rotation of the ankle, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1"><img src="../images/c6-fig-6016.jpg" alt="c6-fig-6016.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">, is perpendicular to the plane of the image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.2">If the ankle is oblique to the scanner, then our estimate of </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">r</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1"> will not be accurate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.2">For that reason, and because we do not always have an MRI scan available, we will present another strategy for estimating </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">r</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1"> in the next section.</span></p>
<figure id="c6-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1"><img src="../images/c6-fig-0003.jpg" alt="c6-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">Figure 6.3</span></a></span> <a id="c6-para-0048"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">Estimating muscle moment arm from a magnetic resonance image. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.2">MRI courtesy of Alex Frietas.</span></p></figcaption></figure>
<p><a id="c6-para-0049"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">The perpendicular distance between the muscle's line of action and the axis of rotation changes when the joint angle changes (</span><a id="c6-fig-0010a"/><a href="#c6-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Figure 6.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.2">Consequently, a muscle's moment arm varies as a function of the joint angle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.3">For many limb muscles, this function reaches a peak value near the middle of the range of motion; however, the relationship varies widely across muscles and must be measured if we are to accurately characterize the moment arm.</span></p>
<figure id="c6-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1"><img src="../images/c6-fig-0004.jpg" alt="c6-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0010a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">Figure 6.4</span></a></span> <a id="c6-para-0050"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Demonstration of how a muscle's moment arm (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">r</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">) depends on the angle of the joint that it spans (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">θ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">).</span></p></figcaption></figure></section>
<section>
<h2><a id="c6-sec-0003"/><a id="c6-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Tendon-excursion definition of a moment arm</span></h2>
<p class="paraaftertitle"><a id="c6-para-0051"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">We now introduce a second definition of the moment arm: the tendon-excursion definition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.2">Given certain assumptions, this definition is mathematically equivalent to the anatomical definition described in connection with </span><a href="#c6-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Figure 6.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">; however, the tendon-excursion definition provides valuable conceptual insights.</span></p>
<p><a id="c6-para-0052"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">Consider the system shown in </span><a href="#c6-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">Figure 6.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">, where the muscle path is represented by a line segment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.2">This representation makes three assumptions: (1) the path of the muscle is independent of muscle force (which may not be the case for muscles that bulge appreciably as they contract), (2) the path of the muscle can be defined by a series of line segments (which may not be the case for large muscles with broad attachments or complicated path geometry), and (3) the muscle–tendon unit slides without friction over neighboring structures (which may not be the case for muscles that are attached to neighboring muscles with connective tissue).</span></p>
<p><a id="c6-para-0053"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">As described by An et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.2">(1984), the tendon-excursion definition arises as a result of applying the principle of virtual work to a muscle–joint system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.3">The principle of virtual work states that the total work done by all forces and moments acting on a system in static equilibrium is zero for a set of infinitesimally small “virtual displacements” (imagined displacements occurring with time held fixed). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.4">The virtual work done by a muscle (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">δw</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">) is defined as the product of the force generated by the muscle (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">) and a virtual translational displacement of the muscle–tendon unit (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">δℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">):</span></p>
<p><a id="c6-para-0054"/></p>
<figure id="c6-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1"><img src="../images/c6-fig-3006.jpg" alt="c6-fig-3006.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0055"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">(6.6)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">For the total work done by all forces and moments acting on this system to be zero, the virtual work done by the muscle must be balanced by the virtual work done by an external moment, defined as follows:</span></p>
<p><a id="c6-para-0056"/></p>
<figure id="c6-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1"><img src="../images/c6-fig-3007.jpg" alt="c6-fig-3007.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0057"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">(6.7)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">δθ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1"> is the virtual rotational displacement of the joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.2">Equating the right-hand sides of Equations 6.6 and 6.7 balances the virtual work done by the muscles with the virtual work done by external moments; substituting Equation 6.3 then leads to the following relationship:</span></p>
<p><a id="c6-para-0058"/></p>
<figure id="c6-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1"><img src="../images/c6-fig-3008.jpg" alt="c6-fig-3008.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0059"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">(6.8)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Finally, we take the limit as the virtual displacement goes to zero, whereupon this equation takes the form of a partial derivative:</span></p>
<p><a id="c6-para-0060"/></p>
<figure id="c6-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1"><img src="../images/c6-fig-3009.jpg" alt="c6-fig-3009.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0061"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">(6.9)</span></p></figcaption></figure>

<p><a id="c6-para-0062"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Equation 6.9 enables us to measure moment arms experimentally using the tendon-displacement method. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.2">In this method, the length of the muscle–tendon unit is monitored with a position transducer while the joint moves through a range of motion; the joint angle is recorded simultaneously. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.3">Thus, we obtain samples of how the muscle–tendon length varies with joint angle (</span><a id="c6-fig-0015a"/><a href="#c6-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">Figure 6.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">, left). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.2">To determine the relationship between moment arm and joint angle from these data, we can simply compute the derivative of muscle–tendon length with respect to joint angle, in radians, as described by Equation 6.9. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.3">The data shown in </span><a id="c6-tbl-0002a"/><a href="#c6-tbl-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">Table 6.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1"> and the corresponding plot in </span><a href="#c6-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">Figure 6.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1"> demonstrate how the method of central differences can be used to calculate muscle moment arm as a function of joint angle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.2">Notice that if we wanted to determine this relationship using the “anatomical” method shown in </span><a href="#c6-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Figure 6.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">, we would need to take many MRI scans of the ankle with different amounts of flexion.</span></p>
<figure id="c6-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1"><img src="../images/c6-fig-0005.jpg" alt="c6-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0015a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Figure 6.5</span></a></span> <a id="c6-para-0063"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">Tendon-excursion data and the corresponding moment-arm data, calculated using numerical derivatives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.2">These curves correspond to the data shown in </span><a href="#c6-tbl-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Table 6.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">.</span></p></figcaption></figure>
<figure><figcaption class="tablecaption"><a id="c6-tbl-0002"/><span class="figureLabel"><a href="#c6-tbl-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">Table 6.2</span></a></span> <a id="c6-para-0064"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Calculation of moment arm from tendon-excursion data</span></figcaption>
<div class="big_device">
<table border="1"><thead>
