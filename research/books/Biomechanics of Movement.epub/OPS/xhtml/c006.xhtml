<p><a id="c6-para-0139"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">We and others have measured tendon excursions of many muscles in the arms and legs, and have used these data to estimate the moment arms of these muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.2">For example, Wendy Murray measured tendon excursions and moment arms for the major muscles that cross the elbow (</span><a id="c6-fig-0016a"/><a href="#c6-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">Figure 6.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.2">These data are useful for testing the accuracy with which computer models of the musculoskeletal system represent the geometry of humans and for determining the rules that describe how musculoskeletal geometry differs between individuals.</span></p>
<figure id="c6-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1"><img src="../images/c6-fig-0006.jpg" alt="c6-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0016a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">Figure 6.6</span></a></span> <a id="c6-para-0140"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">Tendon excursions and moment arms for major muscles crossing the elbow. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.2">Data from Murray et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.3">(1995).</span></p></figcaption></figure></section>
<section>
<h2><a id="c6-sec-0004"/><a id="c6-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Muscle moment arms affect muscle lengths and velocities</span></h2>
<p class="paraaftertitle"><a id="c6-para-0141"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">The tendon-excursion definition of a moment arm demonstrates that, over a given range of joint motion, a muscle–tendon unit will undergo a greater change in length if its moment arm is larger. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.2">Because a muscle's force-generating capacity depends on its length (due to the force–length relationship), a muscle with a large moment arm will operate over a larger range of the force–length curve than a muscle with a small moment arm (assuming the muscles have equal optimal fiber lengths; </span><a id="c6-fig-0017a"/><a href="#c6-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">Figure 6.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">).</span></p>
<figure id="c6-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1"><img src="../images/c6-fig-0007.jpg" alt="c6-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0017a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">Figure 6.7</span></a></span> <a id="c6-para-0142"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">Two muscles with the same optimal fiber length but different moment arms change length by different amounts and, therefore, traverse different ranges of the active force–length curve for the same range of joint angle.</span></p></figcaption></figure>
<p><a id="c6-para-0143"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">A muscle's moment arm also affects the velocity of the muscle–tendon unit (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">) for a given joint angular velocity (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">∂θ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">∕</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">∂t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.2">The relationship between </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1"> and ∂</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">θ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">∕∂</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1"> can be examined mathematically by first multiplying Equation 6.9 by the joint angular velocity:</span></p>
<p><a id="c6-para-0144"/></p>
<figure id="c6-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1"><img src="../images/c6-fig-3010.jpg" alt="c6-fig-3010.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0145"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">(6.10)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">Simplifying Equation 6.10, we obtain the following relationship:</span></p>
<p><a id="c6-para-0146"/></p>
<figure id="c6-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1"><img src="../images/c6-fig-3011.jpg" alt="c6-fig-3011.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0147"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">(6.11)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">Equation 6.11 demonstrates that, for a given joint angular velocity, a muscle with a large moment arm will experience higher velocities than one with a small moment arm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.2">This relationship has important functional implications because muscle force depends on muscle velocity, as described by the force–velocity curve (</span><a id="c6-fig-0020a"/><a href="#c6-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">Figure 6.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">).</span></p>
<figure id="c6-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1"><img src="../images/c6-fig-0008.jpg" alt="c6-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0020a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">Figure 6.8</span></a></span> <a id="c6-para-0148"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">A muscle with a larger moment arm (blue) will shorten at a higher velocity than a muscle with a smaller moment arm (orange). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.2">The force-generating capacity of the muscle with the larger moment arm will be lower due to the force–velocity relationship.</span></p></figcaption></figure>
<p><a id="c6-para-0149"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">The effect of muscle moment arm on muscle velocity suggests that it might be beneficial for muscles to have small moment arms and long fibers if they actuate joints that undergo high angular velocities, to reduce the velocity at which the fibers shorten. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.2">Indeed, Sabrina Lee and Steve Piazza (2009) found that elite sprinters have Achilles tendon moment arms that are 25 percent smaller and ankle muscle fibers that are 11 percent longer than those of size-matched non-sprinters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.3">Longer muscle fibers and smaller moment arms allow elite sprinters to maintain plantarflexor fiber lengths that are closer to their optimal lengths and to reduce fiber shortening velocities as the ankle plantarflexes rapidly during the push-off phase of running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.4">These morphological features increase the force-generating capacity of the plantarflexors, which enables them to generate the large forces necessary for high-speed running.</span></p>
<p><a id="c6-para-0150"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">In addition to comparing the same muscle in different individuals, it is instructive to compare the capabilities of different muscles in the same individual and how they are affected by moment arms. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.2">Increasing the moment arm of a muscle will increase the magnitude of the maximum moment it can generate but will also increase the amount (and rate) by which it changes length for a given movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.3">Larger changes in length can result in decreased muscle force-generation capacity at the extremes of the joint's range of motion as the muscle fibers reach the extremes of their force–length relationship. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.4">These two phenomena create a trade-off between maximum moment and maximum joint excursion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.5">Different muscles will operate at different points in the range of possible moment arms, making each uniquely suited to perform a particular set of functions and, collectively, enabling the remarkable versatility of the human body.</span></p></section>
<section>
<h2><a id="c6-sec-0005"/><a id="c6-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">Moment arms of multi-joint muscles</span></h2>
<p class="paraaftertitle"><a id="c6-para-0151"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1">Thus far, we have limited our analysis to muscles that cross only one joint, yet many muscles cross more than one joint and have moment arms with respect to each. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.2">For example, the semimembranosis, one of the hamstring muscles, crosses behind the hip and knee joints and thus has two moment arms in a planar model (</span><a id="c6-fig-0021a"/><a href="#c6-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1">Figure 6.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.2">In fact, even if a muscle spans only one joint, it will have one moment arm for each degree of freedom of the joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.3">For example, the gluteus maximus, which crosses only the hip, has moment arms for hip extension, hip abduction, and hip rotation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.4">The moment arm for each degree of freedom can be calculated with Equation 6.4.</span></p>
<figure id="c6-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1"><img src="../images/c6-fig-0009.jpg" alt="c6-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0021a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">Figure 6.9</span></a></span> <a id="c6-para-0152"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">The hamstrings cross posterior to the hip and knee. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.2">The muscle shown here has a hip extension moment arm (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1">r</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">) and a knee flexion moment arm (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1">r</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.2">Its length (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1">ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">) and velocity depend on the joint angles (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">θ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">θ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">) and angular velocities.</span></p></figcaption></figure>
<p><a id="c6-para-0153"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1">The amount by which a muscle changes length as the body moves depends on the displacements of the joints spanned by the muscle and the moment arms of the muscle with respect to each joint angle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.2">The velocity of a muscle–tendon unit depends on the angular velocities of the joints spanned by the muscle and, again, on the moment arms of the muscle with respect to each joint angle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.3">We can generalize Equation 6.11 to calculate the velocity of a muscle–tendon unit (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">v</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">) that crosses n joints as follows:</span></p>
<p><a id="c6-para-0154"/></p>
<figure id="c6-fig-0022"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1"><img src="../images/c6-fig-3012.jpg" alt="c6-fig-3012.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c6-para-0155"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">(6.12)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">r</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1"> is the moment arm corresponding to the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">i</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1">th</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1"> degree of freedom (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">θ</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">).</span></p>
<p><a id="c6-para-0156"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">As we mentioned at the beginning of this chapter, calculations of muscle–tendon lengths and velocities can guide treatment of movement disorders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.2">This may be helpful for individuals with cerebral palsy who walk with a crouch gait, in which the knee is flexed more than normal (</span><a id="c6-fig-0023a"/><a href="#c6-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">Figure 6.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">, left). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.2">This gait abnormality is often attributed to “short” or “spastic” hamstring muscles that restrict knee extension and is often treated by surgically lengthening the hamstrings. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.3">Allison Arnold and I worked with collaborators from several children's hospitals to examine whether the hamstrings are shorter than normal in subjects with crouch gait, which would suggest that they might be good candidates for hamstring lengthening surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.4">We examined 152 children during crouch gait, measuring their joint angles and stride durations, and then used a computer model to calculate the muscle–tendon lengths and velocities of the hamstrings over the gait cycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.5">We compared our results to the same lengths and velocities calculated for 45 unimpaired individuals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.6">All lengths and velocities were normalized to account for the different sizes of the participants. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.7">The resulting plots enabled us to distinguish between the subjects whose hamstrings were operating at shorter peak lengths than normal and those whose hamstrings were operating at slower peak velocities than normal. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.8">For example, Subject 1 walked with hamstring lengths that were substantially shorter than normal, while Subject 2 walked with hamstring velocities that were substantially slower than normal (</span><a href="#c6-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">Figure 6.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">, right).</span></p>
<figure id="c6-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1"><img src="../images/c6-fig-0010.jpg" alt="c6-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0023a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">Figure 6.10</span></a></span> <a id="c6-para-0157"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">Models of musculoskeletal geometry (center) can be used to calculate the muscle–tendon lengths and velocities of the hamstrings during gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.2">The plots on the right compare the hamstring lengths and velocities of two subjects with crouch gait to the average of 45 unimpaired individuals (mean ±2 standard deviations). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.3">Adapted from Arnold et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.4">(2006).</span></p></figcaption></figure>
<p><a id="c6-para-0158"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1">Analyzing hamstring lengths and velocities can indicate who might be a good candidate for hamstring surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.2">Roughly one-third of the individuals we analyzed had hamstrings that were of normal length and normal velocity during walking, suggesting that their muscles were not too tight, and they would not benefit from surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.3">About two-thirds of the individuals did have short or slow hamstrings; these patients were more likely to benefit from surgical lengthening of their hamstrings. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.4">While estimation of muscle lengths and velocities is only one piece of the puzzle, these data provide an objective basis for assessing which muscles should be surgically lengthened. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.5">To enable others to make these assessments, my laboratory provides free models of musculoskeletal geometry and open-source software, called OpenSim, for analyzing musculoskeletal mechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.6">These tools are now used at many hospitals to help plan surgery, and you are welcome to use them as well.</span></p></section>
<section>
<h2><a id="c6-sec-0006"/><a id="c6-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">Measurement and modeling of maximum joint moments</span></h2>
<p class="paraaftertitle"><a id="c6-para-0159"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">The previous sections illustrated that moment arms vary with joint angle, as do muscle forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.2">We also saw that a single muscle may actuate more than one joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.3">The reverse is also true—every joint is actuated by multiple muscles, each with its own architecture and geometry.</span></p>
<p><a id="c6-para-0160"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">The muscles that actuate a joint come in pairs: </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">agonist</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1"> muscles that rotate the joint in one direction and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">antagonist</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1"> muscles that rotate it in the opposite direction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.2">For example, during walking, the tibialis anterior on the front of the leg generates force to control the lowering of the foot to the ground following foot contact (</span><a id="c6-fig-0024a"/><a href="#c6-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">Figure 6.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">, left). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.2">Muscles on the back of the leg subsequently generate force to plantarflex the ankle and generate a ground reaction force during the push-off phase of the gait cycle (</span><a href="#c6-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">Figure 6.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">, right).</span></p>
<figure id="c6-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1"><img src="../images/c6-fig-0011.jpg" alt="c6-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0024a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">Figure 6.11</span></a></span> <a id="c6-para-0161"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">Skeletal muscles generate movement by pulling on the bones to which they attach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.2">The forces in agonist and antagonist muscles are timed to produce coordinated motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.3">Inspired by Verne Inman's book </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">Human Walking</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1"> (1981).</span></p></figcaption></figure>
<p><a id="c6-para-0162"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">The reason for this arrangement is simple: muscles only pull (they cannot push). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.2">This may seem counterintuitive at first, because in everyday speech we often talk about pushing (including in the last paragraph where we refer to the “push-off phase”). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.3">Yet when you carefully consider which muscles are doing the work when we are allegedly pushing, you will find that those muscles are indeed pulling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.4">The “push-off” of the foot is actually generated by tension in the calf muscles.</span></p>
<p><a id="c6-para-0163"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">Although only two muscles are illustrated in </span><a href="#c6-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">Figure 6.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">, the agonist and antagonist muscles may in fact be groups of muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.2">For instance, the so-called “quadriceps muscle” in the thigh actually consists of four separate muscles (the prefix “quadri-” means “four” in Latin). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.3">When predicting the maximum strength of the quadriceps, or of all the muscles acting on a joint in general, we need to take into account the architecture and geometry of each muscle, realizing that the total muscle moment will vary with joint angle and angular velocity.</span></p>
<p><a id="c6-para-0164"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">The maximum voluntary isometric moment is often predicted from computer models of the musculoskeletal system, but it can also be measured experimentally using a dynamometer (</span><a id="c6-fig-0025a"/><a href="#c6-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">Figure 6.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.2">For example, to measure the strength of the elbow flexor muscles, a subject may be seated with their wrist attached to a load cell for measuring the force applied by the limb. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.3">In measurements of maximum isometric strength, the subject's body position is constrained during the experiment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.4">Typically, several attempts are made to reach a maximum moment while the investigator observes the subject to ensure that they are using only their elbow flexor muscles and are exerting maximum effort. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.5">The subject may then be repositioned several times to measure their maximum strength at a series of elbow flexion angles, as shown in </span><a href="#c6-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1">Figure 6.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">.</span></p>
<figure id="c6-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1"><img src="../images/c6-fig-0012.jpg" alt="c6-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0025a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">Figure 6.12</span></a></span> <a id="c6-para-0165"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1">Measurement of the maximum isometric moment generated by the elbow flexor muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.2">The data collected by Thomas Buchanan et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.3">(1998) at left were measured using an experimental setup similar to that shown at right.</span></p></figcaption></figure>
<p><a id="c6-para-0166"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">Notice that the maximum isometric moment shown in </span><a href="#c6-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">Figure 6.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1"> varies with elbow flexion angle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.2">The moment is generated by several muscles (e.g., the biceps, brachialis, and brachioradialis; see </span><a href="#c6-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">Figure 6.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">), and the elbow flexion moment generated by each muscle varies with elbow flexion angle because their moment arms and force-generation capacities vary.</span></p>
<p><a id="c6-para-0167"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">To explore this concept more deeply, consider </span><a id="c6-fig-0026a"/><a href="#c6-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">Figure 6.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">, where we see moment arm, muscle force, and joint moment plotted with respect to joint angle for two fictitious muscles that span a single joint: the “strongialis” and the “longialis.” </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.2">The strongialis has short fibers, a large PCSA, and a relatively small moment arm; the longialis has long fibers, a small PCSA, and a large moment arm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.3">For each muscle, the maximum joint moment that can be generated at a given joint angle is the product of the moment arm and the maximum force that can be generated at that angle (Equation 6.4). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.4">The total muscle moment for the joint is computed by adding the two moment-versus-angle curves, one from each muscle, resulting in the maximum voluntary isometric moment for the joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.5">Notice that, at small joint angles, the moment generated by the strongialis is largest; at large joint angles, it is the longialis that contributes the majority of the total joint moment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.6">Together, these two muscles make a good team, ensuring that at least moderate joint moments can be generated over the entire range of motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.7">In the clinic, one measures only the total joint moment (see </span><a href="#c6-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">Figure 6.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.2">Models and simulations are critical for understanding how individual muscles contribute to generating the measured joint moment.</span></p>
<figure id="c6-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1"><img src="../images/c6-fig-0013.jpg" alt="c6-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0026a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">Figure 6.13</span></a></span> <a id="c6-para-0168"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">The peak moment generated by a muscle occurs at a joint angle that corresponds to neither peak moment arm nor peak force, demonstrated here for two fictitious muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.2">The total joint moment generated by a muscle group is simply the sum of the moments generated by all muscles in the group.</span></p></figcaption></figure></section>
<section>
<h2><a id="c6-sec-0007"/><a id="c6-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1">Muscle architecture, moment arms, and tendon transfer surgery</span></h2>
<p class="paraaftertitle"><a id="c6-para-0169"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">The interplay between muscle architecture and moment arms in determining the functional capacity of a muscle can be illustrated by analyzing tendon transfer surgeries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.2">These surgeries are performed on individuals with a nerve or spinal cord injury who have lost use of some of their muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.3">In some cases, the tendon of a functioning muscle can be rerouted to the tendon of a nonfunctioning muscle to improve strength or range of motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.4">These surgeries may enable patients to use parts of their bodies that have been paralyzed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.5">For example, a functioning elbow flexor muscle may be transferred to paralyzed wrist or finger muscles to restore the ability to grasp objects.</span></p>
<p><a id="c6-para-0170"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">The role of moment arms in determining muscle moments is important in tendon transfer surgeries, in which the surgeon selects a muscle with an architecture that has evolved to function in one location and modifies its moment arms to achieve a new function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.2">We must consider how the change in the muscle's moment arms will influence its ability to generate forces and moments about the joint of interest over the desired range of motion. </span><a id="c6-fig-0027a"/><a href="#c6-fig-0027"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1">Figure 6.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1"> provides a simplified illustration of a tendon transfer surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.2">In this example, the surgeon has two choices for where to attach the functioning muscle, which has a maximum isometric force of 1.2 kN and an optimal fiber length of 8 cm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.3">If she chooses to attach the muscle to the tendon of muscle A, the average moment arm of the newly configured muscle will be 4 cm (blue); if she chooses attachment site B, the average moment arm of the newly configured muscle will be 2 cm (orange).</span></p>
<figure id="c6-fig-0027"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1"><img src="../images/c6-fig-0014.jpg" alt="c6-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0027a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">Figure 6.14</span></a></span> <a id="c6-para-0171"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">Application of muscle force and moment arm concepts to decision-making in tendon transfer surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.2">In this example, transferring to the tendon of muscle A would generate a higher peak moment, but only option B would meet the given functional requirement.</span></p></figcaption></figure>
<p><a id="c6-para-0172"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">Suppose the requirement is that the rerouted muscle must be able to generate a moment of at least 15 N·m over a 90-degree range of motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.2">Requirements like this one may be established so that the patient can achieve a specific goal, like bringing their hand to their mouth while holding a glass of water. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.3">Interestingly, whereas option A would generate a higher peak moment (48 N·m) due to the larger moment arm, the muscle fibers would also change length more and would therefore traverse a larger region of the active force–length curve (</span><a href="#c6-fig-0027"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">Figure 6.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">, right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.2">Because of the force–length relationship, option A would result in a minimum moment that is lower than the required 15 N·m at joint angles above about 76 degrees. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.3">By contrast, option B would result in a lower peak moment (24 N·m), but because the moment arm is smaller, the muscle would undergo a smaller change in length over the 90-degree range of motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.4">As such, the force and moment in option B would not vary much with joint angle, and the minimum moment would be around 21 N·m—well above the required 15 N·m. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.5">Thus, attachment site B would be the preferred choice in this scenario.</span></p></section>
<section>
<h2><a id="c6-sec-0008"/><a id="c6-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">Moment arms of muscles with complex actions</span></h2>
<p class="paraaftertitle"><a id="c6-para-0173"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">The definitions provided above describe useful principles for understanding how muscle force leads to moment generation; however, there are several joints and muscles for which the assumptions described at the beginning of the chapter do not hold. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.2">In these scenarios, the muscle moment arms must be considered using a more sophisticated analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.3">For example, if a muscle bulges appreciably as it contracts, then its moment arm depends on its active force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.4">In this case, the assumptions we used to derive the tendon-excursion definition no longer hold, and therefore calculating </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">∂ℓ</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">MT</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">∕</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">∂θ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1"> will no longer render the perpendicular distance from the muscle's line of action to the joint center (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">r</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1">; Equation 6.9). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.2">Similarly, if friction is present in the joint or as a muscle slides over other structures during joint rotation, then the assumption that muscles are frictionless and independent will be violated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.3">Finally, there are several joints in which the position and orientation of the axis of rotation change during movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.4">In these situations, the moment arm must be calculated relative to the instantaneous center of rotation, which changes as the joint moves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.5">Delp and Loan (1995) and Sherman et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.6">(2013) provide more in-depth descriptions of these special cases and how to handle them.</span></p>
<p><a id="c6-para-0174"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1">We must also represent the geometry of muscles that have broad attachments and muscles that wrap (curve) over bones and deeper muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.2">The psoas muscle, for example, has a complex path that wraps around the pelvic brim, hip joint capsule, and femoral neck (</span><a id="c6-fig-0028a"/><a href="#c6-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">Figure 6.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.2">Muscle paths such as this can be represented in a computer model using “via points” (the blue dots in the figure) or “wrapping surfaces” (wireframe), both of which prevent the muscle from penetrating adjacent structures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.3">However, it is difficult to define via points and wrapping surfaces that work robustly for many degrees of freedom and over a large range of motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.4">The gluteus maximus is also difficult to model because it has broad areas of attachment and its fibers have a complex geometric arrangement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.5">As shown in </span><a href="#c6-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">Figure 6.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1">, the muscle can be divided into three muscle–tendon compartments to better approximate its mechanical function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.2">An alternative to via points and wrapping surfaces is to represent the three-dimensional fiber geometries with dozens or hundreds of paths (</span><a id="c6-fig-0029a"/><a href="#c6-fig-0029"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">Figure 6.16</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.2">The appropriate level of modeling complexity depends on the goal of the analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.3">For example, to estimate the total moment generated by muscles with relatively simple geometry, a model like that shown in </span><a href="#c6-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">Figure 6.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1"> is likely to be sufficient. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.2">In contrast, to calculate how the variation of fiber lengths within a muscle affects its force-generating capacity, more detailed models like those shown in </span><a href="#c6-fig-0029"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1">Figure 6.16</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1"> may be required.</span></p>
<figure id="c6-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1"><img src="../images/c6-fig-0015.jpg" alt="c6-fig-0015.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0028a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1">Figure 6.15</span></a></span> <a id="c6-para-0175"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">Representation of the psoas wrapping over the pelvic brim (left) and the gluteus maximus separated into three compartments (right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.2">Adapted from Blemker and Delp (2005).</span></p></figcaption></figure>
<figure id="c6-fig-0029"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1"><img src="../images/c6-fig-0016.jpg" alt="c6-fig-0016.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0029a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1">Figure 6.16</span></a></span> <a id="c6-para-0176"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1">Representations of fiber geometries of the psoas (left) and gluteus maximus (right) allow for detailed modeling of muscle geometry and force generation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.2">Adapted from Blemker and Delp (2005).</span></p></figcaption></figure></section>
<section>
<h2><a id="c6-sec-0009"/><a id="c6-title-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">Wrapping up</span></h2>
<p class="paraaftertitle"><a id="c6-para-0177"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">We have seen how a muscle's moment arm affects its ability to generate forces and joint moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.2">Thus far, we have assumed that the muscles are maximally activated, as they would be during a strength assessment; however, muscles are rarely maximally activated during movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.3">To estimate the forces and moments generated by muscles during submaximal activation, we might use the process illustrated in </span><a id="c6-fig-0030a"/><a href="#c6-fig-0030"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">Figure 6.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.2">In the example shown, electromyographic (EMG) data are collected experimentally, filtered, and used to drive a model of activation dynamics (Chapter 4). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.3">Each muscle activation is then used as an input to a model of muscle contraction dynamics (Chapter 5). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.4">The other key inputs to the contraction dynamics model—namely, the length and velocity of the muscle–tendon unit—can be determined from measurements of joint angles and a model of the musculoskeletal system.</span></p>
<figure id="c6-fig-0030"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1"><img src="../images/c6-fig-0017.jpg" alt="c6-fig-0017.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c6-fig-0030a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">Figure 6.17</span></a></span> <a id="c6-para-0178"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1">Process for estimating the force (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1">) and moment arms (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1"><img src="../images/c6-fig-6017.jpg" alt="c6-fig-6017.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">) of a muscle, which are used to compute muscle-generated joint moments during movement.</span></p></figcaption></figure>
<p><a id="c6-para-0179"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">The process shown in </span><a href="#c6-fig-0030"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1">Figure 6.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1"> describes a type of forward problem: given EMG data and joint angles, find the resulting muscle forces and joint moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.2">We will use exactly this formulation in Chapter 12 to study the energy stored in tendon during running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.3">Biomechanists also frequently solve inverse problems in which effects are observed and then algorithms are used to determine the underlying phenomena responsible for inducing these effects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.4">For example, we often measure motions of the body and wish to estimate the muscle forces that must have been present to produce the observed movement.</span></p>
<p><a id="c6-para-0180"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">In the next three chapters, we will leverage what we have learned thus far and explore some of the tools that are used for inverse analyses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.2">In Chapter 7, we will learn how computational models and algorithms are used to estimate joint angles from measurements of body segment motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.3">Chapter 8 describes how we can use these joint angles along with measurements of external forces to estimate net joint moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.4">Finally, in Chapter 9, we will use optimization to estimate the muscle forces that would have generated the net joint moments and elicited the joint trajectories that we calculated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.5">By viewing just a few noninvasive measurements through the lens of a musculoskeletal model, we can calculate internal joint forces, muscle activity, energy expenditure, and other valuable information.</span></p></section>
