<section epub:type="chapter" role="doc-chapter">
<header>
<h1><a id="c12-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">12</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Muscle-Driven Running</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c12-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">I let my feet spend as little time on the ground as possible.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">—Jesse Owens</span></p></blockquote>
<p><a id="c12-para-0002"/></p>
<figure id="c12-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"><img src="../images/c12-fig-5001.jpg" alt="c12-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c12-para-0003"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">our human ancestors</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> started running as a form of transportation over 2 million years ago. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Today, we run for exercise, when we're in a rush, and just for the love of it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">We are not the fastest runners on the planet—that distinction goes to the cheetah with a top speed of about 30 m/s, well over twice as fast as the best human sprinters. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">Nevertheless, our bodies, and those of our ancestors, include features that make us excellent distance runners.</span></p>
<p><a id="c12-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Our distance-running ability is tested each year in the Man versus Horse Marathon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">The races began when Gordon Green, a Welsh pub owner, got into an argument with a friend about whether horses or humans were better runners. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">Green believed that a human could beat a horse over long distances and initiated the Marathon in 1980 to settle the disagreement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">The race distance was 22 miles, slightly shorter than an official marathon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.5">Riders on horseback defeated human runners for over two decades. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.6">But in 2004, a British man named Huw Lobb finished the race in 2 hours, 5 minutes and 19 seconds, beating the fastest horse by about 2 minutes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.7">Three years later, two other men outran their quadrupedal competitors.</span></p>
<p><a id="c12-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">One of the most important features of human running that enables us to move efficiently over long distances is our bouncing gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">In running, the body's center of mass slows and lowers during the first half of the stance phase, storing elastic energy in muscles and tendons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">The stored energy is then liberated from these tissues during the second half of the stance phase to accelerate the center of mass forward and upward into flight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">This remarkable feat takes place with each step during the 200–300 ms when the foot is in contact with the ground.</span></p>
<p><a id="c12-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Analyses of mass center trajectories and ground reaction forces have suggested that the storage and release of elastic energy is important for running efficiently (Cavagna et al., 1976). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">This finding motivated researchers to develop models of running in which all lower-limb muscles are represented by a single spring (Figure 3.5). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">These simple mass–spring models have provided valuable insight into the dynamics of running, and enabled researchers to tune a track to increase running speed (Figure 3.10). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">While mass–spring models provide a valuable theoretical framework for examining running dynamics, these models are not intended to describe the actions of individual muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5">Yet examining muscle actions during running is essential to understand how muscle architecture and tendon compliance affect running performance, and to inform the design of training programs and technologies that increase running speed and efficiency.</span></p>
<p><a id="c12-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Muscle-driven simulations of running provide this deeper view. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">They complement the mass–spring models we discussed in Chapter 3 by providing a systematic methodology for estimating muscle forces and their contributions to ground reaction forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">We will see in this chapter that the mass–spring model tells only part of the story. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">Yes, humans run efficiently in part because the Achilles tendon stores elastic energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.5">But the elasticity of this tendon also allows the attached muscles to operate in a more efficient regime. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.6">Counterintuitively, when we increase our pace and transition from a fast walk to a slow run, the contractions of our plantarflexor muscles become </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">slower</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">, allowing the muscles to generate force more efficiently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">This phenomenon could not have been predicted with a mass–spring model.</span></p>
<p><a id="c12-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">This chapter examines how muscles contribute to the ground reaction force and thus to the support and propulsion of the body's center of mass during running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">We will study what the muscles are doing at a typical long-distance running pace of 4 m/s and describe how muscle activations, ground reaction forces, and the muscles’ contributions to support and propulsion change with running speed—from a speed that is just above the walk-to-run transition pace of 2 m/s to a brisk run at 5 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">We will also see how sprinting is different from lower-speed running and will examine a topic that has been controversial in the running community: the differences between forefoot and rearfoot striking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">Finally, we will study how technology can improve running performance.</span></p>
<section>
<h2><a id="c12-sec-0001"/><a id="c12-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Building and testing simulations of running</span></h2>
<p class="paraaftertitle"><a id="c12-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">To study muscle actions during running, Sam Hamner measured body segment motions, ground reaction forces, and electromyographic (EMG) patterns from key muscles as experienced runners ran on a treadmill at 2, 3, 4, and 5 m/s (Hamner and Delp, 2013). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">We used these data to create muscle-driven simulations of each person running at each speed using OpenSim. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">To do this, we first scaled a generic dynamic musculoskeletal model (</span><a id="c12-fig-0002a"/><a href="#c12-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Figure 12.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">) to match each subject's size, based on the measured locations of markers placed on anatomical landmarks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">We calculated the joint angles over the gait cycle using an inverse kinematics algorithm that minimized the difference between the experimentally measured marker positions and the positions of the corresponding markers attached to the model, as described in Chapter 7. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">We calculated the joint moments using inverse dynamics methods (Chapter 8) and then estimated the muscle activations needed to generate those moments using the computed muscle control algorithm (Chapter 10). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.4">We assessed the accuracy of the simulations through comparison to experimental data, including the body segment motions and EMG recordings, as described in Chapter 10. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.5">Finally, we used an induced acceleration analysis to determine the contribution of each muscle force to generating the measured vertical and fore–aft ground reaction forces.</span></p>
<figure id="c12-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"><img src="../images/c12-fig-0001.jpg" alt="c12-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Figure 12.1</span></a></span> <a id="c12-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Generic musculoskeletal model used to generate muscle-driven simulations of running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">The model's 12 segments and 29 degrees of freedom are actuated by 86 lower-limb muscles and by torque actuators in the upper body (Rajagopal et al., 2016).</span></p></figcaption></figure></section>
<section>
<h2><a id="c12-sec-0002"/><a id="c12-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Muscle contributions to ground reaction forces</span></h2>
<p class="paraaftertitle"><a id="c12-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">In running, the center of mass is accelerated by gravity and the muscles of the stance limb (</span><a id="c12-fig-0003a"/><a href="#c12-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Figure 12.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">During early stance, the quadriceps are the largest contributors to upward and backward accelerations of the center of mass. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">Throughout most of stance, the ankle plantarflexors (soleus and gastrocnemius) are the main contributors to upward and forward accelerations of the center of mass. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.4">The gluteus maximus makes substantial contributions to supporting the body's weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.5">There are, of course, dozens of other muscles generating forces that influence the motions of the joints and body segments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.6">You can determine the actions of each muscle through a detailed analysis of a muscle-driven simulation; our simulations are freely available at </span><a href="http://simtk.org"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">simtk.org</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">.</span></p>
<figure id="c12-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"><img src="../images/c12-fig-0002.jpg" alt="c12-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0003a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Figure 12.2</span></a></span> <a id="c12-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Actions of the gluteus medius, quadriceps, soleus, gluteus maximus, and gastrocnemius during the stance phase of running at 4 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">The quadriceps are most active during early stance when they accelerate the center of mass upward and backward; the gastrocnemius and soleus are active throughout stance, accelerating the center of mass upward and forward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">The gluteus medius and gluteus maximus also make important contributions to body-weight support. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.4">Adapted from Hamner et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.5">(2010).</span></p></figcaption></figure>
<p><a id="c12-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">The soleus is the largest contributor to upward and forward mass center accelerations because it produces large forces and crosses only the ankle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">The gastrocnemius, the other major ankle plantarflexor, crosses the ankle and the knee; the knee flexion moment it generates reduces its capacity to accelerate the center of mass upward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">Skeletal alignment makes almost no contribution to acceleration of the mass center during running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">In slow walking, the lower limb is nearly straight and the skeleton provides passive support, but this is not the case in running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.5">Muscle forces produce nearly all of the ground reaction force (top right panel in </span><a href="#c12-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Figure 12.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">).</span></p></section>
<section>
<h2><a id="c12-sec-0003"/><a id="c12-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Muscle activity during running</span></h2>
<p class="paraaftertitle"><a id="c12-para-0014"/><a id="c12-fig-0004a"/><a href="#c12-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Figure 12.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1"> shows EMG recordings from 11 lower-limb muscles during running at four speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">These data have been filtered to eliminate high-frequency and low-frequency noise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.3">Each subject's EMG measurements were then normalized to the maximum value recorded for each muscle across all speeds to obtain a value between 0 and 1.</span></p>
<figure id="c12-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"><img src="../images/c12-fig-0003.jpg" alt="c12-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Figure 12.3</span></a></span> <a id="c12-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Average EMG from 11 muscles during running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">Adapted from Arnold et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.3">(2013).</span></p></figcaption></figure>
<p><a id="c12-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">We observe relatively high activation of the gluteus maximus, gluteus medius, rectus femoris, vasti, gastrocnemii, and soleus during the stance phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">The rectus femoris is most strongly activated at the beginning of the swing phase at high running speeds; this muscle crosses in front of the hip and knee, and accelerates the leg forward at the beginning of swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.3">The hamstrings (biceps femoris long head and semitendinosus) are most strongly activated at the end of swing; these muscles cross behind the hip and knee, and accelerate the leg backward at the end of swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.4">The tibialis anterior is most active during the swing phase to lift the foot. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.5">As speed increases, muscle activity increases, and the plantarflexors are recruited earlier in the gait cycle as the stance phase shortens.</span></p></section>
<section>
<h2><a id="c12-sec-0004"/><a id="c12-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Changes with running speed</span></h2>
<p class="paraaftertitle"><a id="c12-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">As one might expect, an increase in running speed is accompanied by increases both in muscle activations and in the upward and fore–aft mass center accelerations produced by the gluteus maximus, gluteus medius, rectus femoris, vasti, and gastrocnemii. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">The changes in activation, as measured by EMG signals, are shown in </span><a href="#c12-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Figure 12.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">Note, in particular, that the activation patterns change dramatically as we move from a brisk walk to a slow run. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">The difference between a slow and a fast run is mostly one of magnitude, with muscles like the rectus femoris and biceps femoris long head increasing their activity dramatically with increasing speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.4">Though the increase in the activity of the soleus is not as dramatic, it is particularly important. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.5">As speed increases, the contribution to upward and forward mass center accelerations by the soleus also increases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.6">The soleus plays a key role in increasing flight times and stride lengths (</span><a id="c12-fig-0005a"/><a href="#c12-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Figure 12.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">; </span><a id="c12-tbl-0001a"/><a href="#c12-tbl-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Table 12.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">), thereby providing a mechanism for increasing running speed (Equation 3.1).</span></p>
<figure id="c12-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"><img src="../images/c12-fig-0004.jpg" alt="c12-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0005a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Figure 12.4</span></a></span> <a id="c12-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Visualizations from muscle-driven simulations of a representative subject running at four speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">Muscle color indicates simulated activation level, from no activation (blue) to full activation (red). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.3">Adapted from Hamner and Delp (2013).</span></p></figcaption></figure>

<p><a id="c12-para-0055"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">When running at 5 m/s, soleus muscle fibers shorten with the highest velocities of any muscle during late stance, which coincides with increased ankle plantarflexion speed and decreased stance time compared to lower-speed running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">Because runners generate larger upward and forward mass center accelerations at faster running speeds (i.e., ground reaction forces are higher), and because the soleus is the largest contributor to these accelerations, limited force production from the soleus due to its high shortening velocity may put a cap on a runner's top speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.3">Stated positively, a strong soleus muscle enables runners to generate the large ground reaction forces they need to increase stride length and running speed.</span></p></section>
<section>
<h2><a id="c12-sec-0005"/><a id="c12-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Run-to-sprint transition</span></h2>
<p class="paraaftertitle"><a id="c12-para-0056"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">The changes in joint angles we observed for running speeds up to 5 m/s continue up to about 7 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">In general, maximum joint angles continue to increase with increasing speed, as we saw in Figure 3.20. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.3">Below about 7 m/s, runners increase their speed primarily by generating greater ground reaction forces, substantially increasing stride length while increasing stride frequency only slightly (</span><a id="c12-fig-0006a"/><a href="#c12-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Figure 12.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">The increases in ground reaction forces are the consequence of increases in muscle “action” forces, particularly in the ankle plantarflexors.</span></p>
<figure id="c12-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"><img src="../images/c12-fig-0005.jpg" alt="c12-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0006a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Figure 12.5</span></a></span> <a id="c12-para-0057"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Increases in running speed are achieved primarily by increasing stride length at low speeds and increasing stride frequency at high speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">Data from one representative subject are shown. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.3">Adapted from Weyand et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.4">(2000).</span></p></figcaption></figure>
<p><a id="c12-para-0058"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">The muscles must generate larger ground reaction forces to run faster, and they must generate these forces in less time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.2">(As Jesse Owens observed in this chapter's epigraph, he ran fast by touching the ground for as little time as possible.) Thus, the plantarflexors, which are key muscles in generating the ground reaction force, shorten more quickly as running speed increases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.3">Recall that increasing a muscle's shortening velocity decreases its force-generating capacity (Figure 4.9). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.4">Beyond speeds of about 7 m/s, the ankle plantarflexors are contracting so quickly that they cannot generate enough force to continue increasing stride length.</span></p>
<p><a id="c12-para-0059"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">At very high running speeds, rather than push on the ground with more force, the strategy for increasing speed switches to pushing on the ground more frequently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.2">Stride length reaches a maximum when running at around 7 m/s; higher running speeds are achieved primarily by increasing stride frequency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.3">The hip muscles, primarily the iliopsoas, rectus femoris, gluteus maximus, and hamstrings, accelerate the limb forward and backward vigorously during the swing phase of high-speed sprinting to swing the legs rapidly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.4">Thus, the highest running speeds are achieved by generating large ground reaction forces during stance, which produces a long stride length, as well as swinging the legs rapidly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.5">Stated another way, our maximum running speed is limited by the ability of our plantarflexors to generate high force at high speed and by the rate at which our hip and knee muscles can swing our legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.6">If you jump back to Figure 3.7, you will notice that kangaroos have similar trends in stride length and stride frequency as hopping speed increases.</span></p></section>
<section>
<h2><a id="c12-sec-0006"/><a id="c12-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">Muscle actions during the walk-to-run transition</span></h2>
<p class="paraaftertitle"><a id="c12-para-0060"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Humans transition from walking to running at around 2 m/s, the speed at which running becomes more energetically economical (Figure 3.18). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">The majority of the metabolic cost of locomotion is consumed by muscles, so we might expect some muscles to become more efficient when making the transition from fast walking to slow running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.3">In fact, an interesting mechanism can be observed in the soleus and gastrocnemius, and their interaction with the Achilles tendon, at the walk-to-run transition. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.4">As we walk faster, the shortening velocities of our ankle plantarflexors increase and therefore they produce less force for a given level of activation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.5">The transition from walking to running increases the ability of these muscles to generate force by reducing their fiber velocities (</span><a id="c12-fig-0007a"/><a href="#c12-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">Figure 12.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.2">Muscle-driven simulations reveal a significant difference in </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">f</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">V</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">, the effect of fiber velocity on muscle force, between fast walking and slow running in the gastrocnemius lateralis and soleus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.2">Even though gait speed and the shortening velocities of the muscle–tendon units are higher in running, the transition from walking to running decreases the shortening velocities of the muscle fibers, moving gastrocnemius lateralis from concentric to eccentric contraction and soleus from concentric to isometric contraction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.3">Thus, the transition from walking to running is characterized by a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">slowing</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"> of the plantarflexor muscle fibers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">This striking result, supported by ultrasound measurements (Farris and Sawicki, 2012), occurs because the stretch of the Achilles tendon is greater in running, which better positions the muscles to generate force with less energy.</span></p>
<figure id="c12-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"><img src="../images/c12-fig-0006.jpg" alt="c12-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Figure 12.6</span></a></span> <a id="c12-para-0061"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">Mean and one standard deviation (n = 5) of the force–velocity multiplier, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">f</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">V</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">, at the instant of largest active force in walking at 1.75 m/s (blue dot) and running at 2.0 m/s (red dot), plotted on the force–velocity curve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.2">The switch from walking to running decreases fiber shortening velocity and increases </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">f</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">V</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1"> in gastrocnemius lateralis and soleus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">Data from Arnold et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.3">(2013).</span></p></figcaption></figure>
<p><a id="c12-para-0062"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">We rely on the storage and release of elastic energy as our muscles and tendons stretch and recoil. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">Because muscles attach to bones via tendons, the interaction between our muscle fibers and tendons plays a critical role in determining running economy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.3">Lai et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.4">(2014) found that the elastic strain energy of the Achilles tendon accounts for a large proportion of positive muscle–tendon work, and that this proportion increases with running speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.5">As we saw above, the compliance of the Achilles tendon reduces the shortening velocity of the soleus and gastrocnemius muscle fibers during running, allowing them to operate at lengths and velocities at which they generate force efficiently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.6">Compliant tendons also store and release energy during running to stretch our limited energetic budget, similar to regenerative braking in electric cars. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.7">At the end of this chapter, we will see a device that uses the storage and release of elastic energy to reduce the metabolic cost of running.</span></p></section>
<section>
<h2><a id="c12-sec-0007"/><a id="c12-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Interaction of arm and leg dynamics</span></h2>
<p class="paraaftertitle"><a id="c12-para-0063"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">Muscle-driven simulations reveal that the arms do not contribute substantially to either propulsion or support when running at or below 5 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">However, the angular momentum of the arms about a vertical axis passing through the center of mass counterbalances (i.e., is equal and opposite to) the angular momentum of the legs about the vertical axis (</span><a id="c12-fig-0008a"/><a href="#c12-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Figure 12.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">Running speed has a significant effect on peak vertical angular momentum of the arms and legs, each doubling from about 1.5 kg·m</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">2</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">/s at 2 m/s to 3.0 kg·m</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">2</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">/s at 5 m/s.</span></p>
<figure id="c12-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1"><img src="../images/c12-fig-0007.jpg" alt="c12-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Figure 12.7</span></a></span> <a id="c12-para-0064"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">The opposing angular momenta of the arms and legs about a vertical axis passing through the body's center of mass during running, averaged over 10 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.2">Adapted from Hamner and Delp (2013).</span></p></figcaption></figure></section>
<section>
<h2><a id="c12-sec-0008"/><a id="c12-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">Swinging the legs in running</span></h2>
<p class="paraaftertitle"><a id="c12-para-0065"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">In the early 2000s, Jesse Modica and Rodger Kram sought to understand the role muscles played in swinging the legs during running and the amount of metabolic energy that was consumed in the process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.2">They recorded EMG from key muscles and measured whole-body metabolic cost during moderate-speed treadmill running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.3">Based on EMG timing alone, one may surmise that the rectus femoris and hamstrings are responsible for initiating and arresting leg swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.4">To test this hypothesis, Modica and Kram constructed an ingenious apparatus that applied a forward force to each foot during only the first part of the swing phase (</span><a id="c12-fig-0009a"/><a href="#c12-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">Figure 12.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.2">During assisted running, they observed significant decreases in the activity of the rectus femoris in the first half of swing but observed no decreases in gastrocnemius or soleus EMG, suggesting that the rectus femoris plays a prominent role in leg swing during natural (unassisted) running and the ankle plantarflexors do not. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.3">They also observed a decrease in average net metabolic rate; this and follow-on studies suggest that leg swing accounts for approximately 10 to 20 percent of the energy consumed during moderate-speed running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.4">The rest of the energy is consumed to support the body's weight and propel it forward.</span></p>
<figure id="c12-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1"><img src="../images/c12-fig-0008.jpg" alt="c12-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Figure 12.8</span></a></span> <a id="c12-para-0066"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">Swing-assist mechanism and effect on EMG during treadmill running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.2">Left: The rubber tubing stretched as the foot moved posteriorly during stance, applied anterior forces to the foot at the beginning of swing, and became slack when the cable clamp met the stopper plate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.3">Right: EMG magnitudes during running with increasing swing assistance, averaged over the periods during which each muscle is active when running without assistance (n = 10, mean ± standard error; *p &lt; 0.0001). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.4">Adapted from Modica and Kram (2005).</span></p></figcaption></figure></section>
<section>
<h2><a id="c12-sec-0009"/><a id="c12-title-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Foot-strike patterns</span></h2>
<p class="paraaftertitle"><a id="c12-para-0067"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">In Chapter 11, we saw that “toe-walking” is observed in people with severe tightness of the ankle plantarflexors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.2">In people with healthy muscles, toe-walking is rare (though it is occasionally used over short distances for sneaking up on people). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.3">By contrast, many healthy runners are natural forefoot strikers, who land on the balls of their feet rather than their heels (</span><a id="c12-fig-0010a"/><a href="#c12-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">Figure 12.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.2">Running coaches debate whether forefoot or rearfoot striking is best. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.3">The vast majority of long-distance runners are rearfoot strikers, but neither foot-strike pattern has been shown to be more efficient.</span></p>
<figure id="c12-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1"><img src="../images/c12-fig-0009.jpg" alt="c12-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0010a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">Figure 12.9</span></a></span> <a id="c12-para-0068"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">Foot-strike patterns in running.</span></p></figcaption></figure>
<p><a id="c12-para-0069"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">The kinematics and kinetics of these foot-strike patterns are noticeably different. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.2">We saw in Chapter 3 that the vertical ground reaction force rises more gradually in forefoot strikers than in rearfoot strikers (compare Figures 3.2 and 3.3), which has led people to believe that forefoot striking may help prevent bone stress fractures. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.3">However, the strain rate in the Achilles tendon is higher when forefoot striking (Lyght et al., 2016), indicating that forefoot striking may have a higher risk of tendon injury than rearfoot striking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.4">Indeed, habitual rearfoot strikers report calf muscle soreness when they convert to forefoot striking, which suggests that the plantarflexors and the Achilles tendon may be loaded differently in the two running styles.</span></p>
<p><a id="c12-para-0070"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">To examine the differences in plantarflexor muscle–tendon mechanics between forefoot and rearfoot striking, Jenny Yong and others in my laboratory generated simulations using data from 16 healthy runners. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.2">All the runners were habitual rearfoot strikers, and one set of simulations was generated from data collected while they ran at their natural speed and using their habitual rearfoot-striking gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.3">The runners then underwent a training protocol whereby they learned to adopt a forefoot-striking pattern. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.4">A second set of simulations was generated from data collected during running while forefoot striking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.5">We measured kinematics, which were used to prescribe the joint angles of a muscle-driven model, and EMG, which was processed and applied to the simulated muscles as excitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.6">The simulations were used to compute muscle activations, fiber lengths, fiber velocities, and the capacity of each muscle to generate active force (</span><a id="c12-fig-0011a"/><a href="#c12-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Figure 12.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">).</span></p>
<figure id="c12-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1"><img src="../images/c12-fig-0010.jpg" alt="c12-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0011a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">Figure 12.10</span></a></span> <a id="c12-para-0071"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">Muscle activation and fiber dynamics of plantarflexor muscles from simulations of running at 2.94 ± 0.30 m/s while rearfoot and forefoot striking (n = 16, mean ±1 standard deviation; *p &lt; 0.05). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.2">Data from Yong et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.3">(2020).</span></p></figcaption></figure>
<p><a id="c12-para-0072"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">Our simulations show that foot-strike pattern affects the gastrocnemius and soleus muscles differently. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.2">When forefoot striking, the activation of the gastrocnemius is greater during the first part of stance, resulting in greater forces in the gastrocnemius fibers and the corresponding component of the Achilles tendon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.3">By contrast, the activation of the soleus is lower during push off (at about 25 percent of the gait cycle) when forefoot striking.</span></p>
<p><a id="c12-para-0073"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">There are also similarities in how foot-strike pattern affects the gastrocnemius and soleus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.2">Both muscles have shorter fibers from late swing to early stance during forefoot striking, and fiber velocities are lower in late swing but higher in early stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.3">During much of early stance, the plantarflexor fibers shorten when rearfoot striking but lengthen when forefoot striking.</span></p>
<p><a id="c12-para-0074"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Interestingly, despite the springy appearance of forefoot striking, this foot-strike pattern does not affect the amount of energy stored in the gastrocnemius tendon (the apparent difference is not statistically significant), and the soleus tendon actually stores </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">less</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1"> energy when forefoot striking (</span><a id="c12-fig-0012a"/><a href="#c12-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">Figure 12.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">, top). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.2">The total energy stored in the Achilles tendon does not differ between forefoot and rearfoot striking; however, the timing of energy storage and return is strikingly different between foot-strike patterns (</span><a href="#c12-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">Figure 12.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">, bottom).</span></p>
<figure id="c12-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1"><img src="../images/c12-fig-0011.jpg" alt="c12-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">Figure 12.11</span></a></span> <a id="c12-para-0075"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">Tendon elastic energy (top) and power (bottom) for plantarflexor muscles in simulations of running while rearfoot and forefoot striking (n = 16, mean ±1 standard deviation; *p &lt; 0.05). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.2">Data from Yong et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.3">(2020).</span></p></figcaption></figure>
<p><a id="c12-para-0076"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Forefoot striking increases the rate at which energy is absorbed by the gastrocnemius fibers in early stance, when the muscle is generating large forces and lengthening. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.2">Muscles tend to become injured when they generate large forces while lengthening, and this may explain why some rearfoot-striking runners report calf muscle soreness when attempting to convert to forefoot striking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.3">My recommendation to runners who are planning to convert to forefoot striking is to adopt a progressive eccentric gastrocnemius strengthening program prior to converting, to avoid muscle injury.</span></p></section>
<section>
<h2><a id="c12-sec-0010"/><a id="c12-title-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Device-assisted running</span></h2>
<p class="paraaftertitle"><a id="c12-para-0077"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">Assistive devices can interact with our musculoskeletal system to restore mobility and enhance performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.2">Among the many potential applications of this technology is reducing the metabolic cost of running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.3">Thomas Uchida used muscle-driven simulations of running to explore the biomechanical and energetic effects of assistive devices (Uchida et al., 2016b). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.4">The simulated devices were massless and could deliver large torques instantaneously, with precise timing, and directly to the skeleton. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.5">The simulations enabled comparison of assistive devices without building prototypes, and in isolation from confounding factors such as imperfect transmission of forces to the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.6">Uchida used muscle-driven simulations of 10 athletes running on a treadmill at 2 and 5 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.7">He augmented the musculoskeletal model shown in </span><a href="#c12-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">Figure 12.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1"> with ideal assistive devices that provide flexion and extension moments at the hips, knees, and ankles, and then determined the patterns of assistance that minimize the sum of squared simulated muscle activations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.2">The metabolic cost of running with and without assistance was estimated using a model of the energy consumed by muscle fibers as a function of their excitation, activation, length, and velocity (Umberger et al., 2003; Uchida et al., 2016a).</span></p>
<p><a id="c12-para-0078"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">The simulations predicted a substantial reduction in metabolic cost in all assistance scenarios at both running speeds (</span><a id="c12-fig-0013a"/><a href="#c12-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">Figure 12.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.2">When running at 2 m/s, the ankle, knee, and hip devices were equally effective, reducing average metabolic power by 1.5 W/kg, about one-quarter of the metabolic power consumed during unassisted running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.3">When running at 5 m/s, however, the hip device reduced metabolic cost significantly more than the ankle or knee devices (p &lt; 0.002). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.4">This result suggests that assistive devices should adapt to the user's running speed by redistributing device power from the ankle to the hip as speed increases.</span></p>
<figure id="c12-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1"><img src="../images/c12-fig-0012.jpg" alt="c12-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0013a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">Figure 12.12</span></a></span> <a id="c12-para-0079"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">Reductions in the energy expended by lower-extremity muscles when a musculoskeletal model was assisted by ideal flexion–extension assistive devices (the shaded column represents the mean; the line represents standard deviation; n = 10; *p &lt; 0.002). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.2">Average power was normalized by subject mass (W/kg), and percentages were computed relative to the cost of unassisted running at each speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.3">Adapted from Uchida et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.4">(2016b).</span></p></figcaption></figure>
<p><a id="c12-para-0080"/><a id="c12-fig-0014a"/><a href="#c12-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">Figure 12.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1"> shows the effect of each assistive device on the coordination of nine muscles when running at 5 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.2">Muscle activations generally decreased in muscles crossing assisted joints; however, activations also decreased in muscles crossing </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">unassisted</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1"> joints, and some activations </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">increased</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1"> when assistance was added. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.2">With assistance added at the ankle, the soleus and tibialis anterior activations decreased dramatically throughout the gait cycle because these muscles generate only ankle moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.3">The activation of the gastrocnemius decreased only partially during stance; although it was no longer responsible for generating an ankle plantarflexion moment, it was still recruited to generate a flexion moment at the (unassisted) knee. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.4">What remained of the original gastrocnemius activation roughly reflects its activity attributable to generating a knee flexion moment during stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.5">With assistance added at the knee, we observed an increase in the rectus femoris activation during early swing to take advantage of its relatively high force-generating capacity as its fibers lengthened. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.6">The increased hip flexion moment generated by the rectus femoris enabled a decrease in the activity of the psoas. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.7">Complex changes in muscle activity were observed when assistance was added at the hip.</span></p>
<figure id="c12-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1"><img src="../images/c12-fig-0013.jpg" alt="c12-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0014a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">Figure 12.13</span></a></span> <a id="c12-para-0081"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">Activations of nine representative lower-extremity muscles in simulations of running at 5 m/s with ideal flexion–extension assistive devices (mean; n = 10). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.2">Adapted from Uchida et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.3">(2016b).</span></p></figcaption></figure>
<p><a id="c12-para-0082"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">Compensations to assistance can be complex. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.2">Muscle-driven simulations like these are an important complement to experiments because they provide biomechanical explanations for observed effects and suggest hypotheses for future experimental studies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.3">Our simulations demonstrated the importance of considering muscle coordination throughout the lower limbs when designing assistance strategies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.4">As we saw for device-assisted walking in Chapter 11, the optimal device torque profiles generally differ from the corresponding net joint moments generated by muscles during unassisted running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.5">This finding was confirmed by a team led by Connor Walsh at Harvard, who used our results to determine what hip extension torques their assistive device should apply to reduce the metabolic cost of running (</span><a id="c12-fig-0015a"/><a href="#c12-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">Figure 12.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.2">When applying a scaled version of the net hip extension moment generated by muscles when unassisted, their device reduced net metabolic power consumption by only 0.11 W/kg. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.3">A torque profile informed by the results of our simulations was four times more effective.</span></p>
<figure id="c12-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1"><img src="../images/c12-fig-0014.jpg" alt="c12-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0015a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">Figure 12.14</span></a></span> <a id="c12-para-0083"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">The hip extension device of Lee et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.2">was more effective at reducing the metabolic cost of running when it applied a torque that was informed by muscle-driven simulations rather than net joint moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.3">Metabolic power consumption is shown relative to the power consumed during standing, normalized by body mass, and averaged over 9 subjects during running at 2.5 m/s (mean ±1 standard deviation; *p ≤ 0.05). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.4">Adapted from Lee et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.5">(2017).</span></p></figcaption></figure></section>
<section>
<h2><a id="c12-sec-0011"/><a id="c12-title-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">Springs to enhance running</span></h2>
<p class="paraaftertitle"><a id="c12-para-0084"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">Elliot Hawkes, an avid runner and former student in my Biomechanics of Movement course, was riding his bike in Golden Gate Park one afternoon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.2">The park has concentric tracks, with an inner track for bikes and an outer track for runners. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.3">Riding in circles was boring, so Elliot naturally turned his attention to the runners. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.4">From the reference frame of his bike, the runners appeared almost stationary—except for their legs, which looked like pendula oscillating back and forth under a fixed trunk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.5">Elliot thought he might be able to save the runners energy by joining their legs with a spring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.6">The next day, Elliot and his lab mate Cole Simpson, who had been thinking along similar lines, tied some surgical tubing to their shoes and went for a brief run. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.7">It felt amazing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.8">This quick investigation inspired a two-year team project to explore how we might decrease the energetic cost of running with this simple device.</span></p>
<p><a id="c12-para-0085"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">The team made springs from latex tubing and attached each end to the top of runners’ shoes (</span><a id="c12-fig-0016a"/><a href="#c12-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">Figure 12.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.2">The spring must be long enough that it does not apply elastic forces when the feet pass each other and does not break when the feet are far apart, yet short enough that it does not become entangled. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.3">The stiffness of the initial device was 125 N/m, with a free length equal to 25 percent of the participant's leg length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.4">The mass was about 0.02 kg. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.5">We tested many springs, but none offered a substantial advantage over this initial design. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.6">The student inventors each ran a 6 km loop around the Stanford campus without tripping (which was an initial concern).</span></p>
<figure id="c12-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1"><img src="../images/c12-fig-0015.jpg" alt="c12-fig-0015.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0016a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">Figure 12.15</span></a></span> <a id="c12-para-0086"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">Time-lapse photographs of a runner using a spring connecting the legs to improve running efficiency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.2">The spring generates force when the legs are separated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.3">Photo courtesy of Cara Welker.</span></p></figcaption></figure>
<p><a id="c12-para-0087"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">We measured metabolic energy consumption while 12 healthy participants ran at 2.7 m/s on a treadmill with and without shoes connected by springs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.2">Over two testing days, the participants each completed four 10-minute runs with the spring, interspersed with four 10-minute natural runs without the spring as experimental controls. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.3">During the first trial, participants showed no metabolic savings when running with the spring compared to natural running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.4">However, by the end of the second trial, participants expended 3.8 ± 5.4 percent less energy (p = 0.034) during spring-assisted running compared to natural running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.5">Metabolic savings increased with practice, and all participants ran using less energy by the end of the second day of testing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.6">The average energy savings was 6.4 ± 2.8 percent (Simpson et al., 2019).</span></p>
<p><a id="c12-para-0088"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">To explore the mechanism by which the spring reduced energy, we developed an OpenSim model of running with and without a spring connecting the legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.2">The model revealed that the spring produced moments about the hip and knee, which reduced the hip and knee moments generated by muscles (</span><a id="c12-fig-0017a"/><a href="#c12-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">Figure 12.16</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.2">The spring improves running economy through a complex mechanism that produces savings beyond those associated with leg swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.3">When runners learn to use the spring, they adopt a running gait with shorter strides and higher stride frequency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.4">The shorter and faster strides, in turn, reduce the work required to redirect the center of mass during stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.5">Therefore, the spring reduces the work not only during swing but also during stance.</span></p>
<figure id="c12-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1"><img src="../images/c12-fig-0016.jpg" alt="c12-fig-0016.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c12-fig-0017a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">Figure 12.16</span></a></span> <a id="c12-para-0089"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">Mechanism of energetic savings when running with a spring connecting the legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.2">Moments generated by muscles during swing were reduced due to the assistance of the spring. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.3">Muscle-generated moments during stance were also reduced, possibly due to the increased stride frequency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.4">Adapted from Simpson et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.5">(2019).</span></p></figcaption></figure>
<p><a id="c12-para-0090"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">A spring connecting the legs could serve as an inexpensive assistive device to improve human running performance, or a simple intervention to further explore human–machine interactions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.2">Elliot Hawkes’ experience of conceiving of this invention from his bicycle reminds us that a new perspective can lead to creative insights.</span></p></section>
