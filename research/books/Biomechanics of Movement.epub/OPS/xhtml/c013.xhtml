<header>
<h1><a id="c13-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">13</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Moving Forward</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c13-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">We must walk consciously only part way toward our goal,</span></p>
<p class="quote-epigraphpara"><a id="c13-para-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">and then leap in the dark to our success.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">—Henry David Thoreau</span></p></blockquote>
<p><a id="c13-para-0003"/></p>
<figure id="c13-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img src="../images/c13-fig-5001.jpg" alt="c13-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c13-para-0004"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">the field of movement biomechanics</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> has made great strides, but there is more ground to cover. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">In this book, we have seen how measurements, models, and computational tools can help us understand human movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">We have shown how biomechanical models have been used to design robots, running tracks, and exoskeletons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">Biomechanics has enabled us to design factories that protect workers from injuries and to create joint replacements that enable people with diseased joints to walk without pain.</span></p>
<p><a id="c13-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">These triumphs have improved the lives of millions of people, but we must also be aware of the limits of current knowledge and technology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">New developments in technology will enable us to make further positive impacts in people's lives; the increasing functionality of prosthetic limbs is a good example. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">Limitations of knowledge are harder to overcome. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.4">More than anything else, overcoming these limitations requires our creativity and, as Thoreau suggests, the courage to take a leap in the dark.</span></p>
<p><a id="c13-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">I would like to start this chapter with an example of a creative leap that one of my collaborators took, to great success. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">I will move on to paint a picture of the future I envision for the field of biomechanics—a picture that is surely incomplete. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">Your vision will add color and texture to the canvas of possibilities, where there is infinite space for you to create your masterpiece.</span></p>
<section>
<h2><a id="c13-sec-0001"/><a id="c13-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Wearable technology</span></h2>
<p class="paraaftertitle"><a id="c13-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Kate Rosenbluth was working in my laboratory when she met a man at the Stanford Hospital who was unable to write a note to his wife or drink coffee with a friend because his hands shook from a condition called essential tremor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">This is an enormously frustrating condition that is nevertheless very common. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">People who develop essential tremor in their fifties and sixties find themselves unable to carry out activities of daily living because their hands shake.</span></p>
<p><a id="c13-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">The man with essential tremor told Kate that the drugs he had tried did not reduce his hand tremor and had terrible side effects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">His only remaining option was a surgery to place stimulating electrodes in his brain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">This therapy, called deep brain stimulation, has proved very effective for reducing tremor, but it requires brain surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.4">With brain surgery comes a risk of serious complications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.5">It is not a decision to take lightly.</span></p>
<p><a id="c13-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Kate knew that his shaking hands were likely caused by oscillatory neural activity within specific areas of the brain, including a region called the ventral intermediate nucleus of the thalamus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">Kate found articles showing that electrical stimulation of the median nerve at the wrist evokes neural activity within the ventral intermediate nucleus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">She reasoned that stimulation of the sensory nerves at the wrist might produce activity in this brain region and thus reduce hand tremor without surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">As an experiment, she decided to try stimulating the median nerve in a few willing participants with essential tremor.</span></p>
<p><a id="c13-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">It was a leap in the dark. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">We don't know exactly what causes the oscillatory neural activity in the brain, and we didn't know whether electrical stimulation at the wrist would affect it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">But to our (and our participants’) delight, we saw dramatic reductions in their hand tremor after stimulating their median nerves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.4">These preliminary data encouraged us to push forward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.5">We continued experimenting and learning about this new technology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.6">For example, we saw the best results when stimulating the nerves at the same frequency as the tremor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.7">Kate teamed up with Serena Wong and others to build a wearable motion sensor and neurostimulator in the form of a wristwatch that records the frequency of a patient's hand tremor and stimulates the nerves in the wrist at their tremor frequency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.8">It was incredibly rewarding to find that many people who use this device experience a meaningful reduction in hand tremor (Lin et al., 2018). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.9">They recover the ability to write a note, drink coffee, and perform other activities that were impossible with shaking hands (</span><a id="c13-fig-0002a"/><a href="#c13-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Figure 13.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">).</span></p>
<figure id="c13-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"><img src="../images/c13-fig-0001.jpg" alt="c13-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c13-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">Figure 13.1</span></a></span> <a id="c13-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Wearable motion sensor and neurostimulator for reducing hand tremor. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">A wearable stimulator from Cala Health (top left) reduces hand tremor substantially (bottom). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">A patient's spiral drawing improves dramatically after 40 minutes of neurostimulation therapy (top right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.4">Cala Health, Inc. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.5">is a Stanford University spin-out company cofounded by Kate Rosenbluth, Serena Wong, and Scott Delp.</span></p></figcaption></figure>
<p><a id="c13-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">This new treatment reduces hand tremor without medication and without surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">It was made possible by Kate's creativity and by the small inertial measurement units that record the motions of patients’ hands, which allowed us to determine personalized stimulation patterns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.3">The effect of the neural stimulation, and of drinking coffee or alcohol (which can make the hands shake more or less) and other events, can be monitored over months as the person goes about their daily life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.4">In the future, we envision thousands of individuals wearing neurostimulators that record their motions and monitor the effects of treatment, allowing us to optimize each patient's function.</span></p>
<p><a id="c13-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Small-scale motion sensing technology presents other opportunities to advance therapies and research. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">Currently, most biomechanics experiments are performed in controlled laboratory settings using techniques such as those described in this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.3">But laboratory measurements have important limitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.4">For example, analyses of gait used to plan surgeries for children with cerebral palsy typically rely on measurements of just a few steps taken in the unfamiliar environment of our lab, which may not represent the child's capabilities in everyday life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.5">Now that we have the ability to measure movement outside the laboratory, we can begin to plan treatments using measurements of thousands of steps taken over several months during daily life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.6">I expect this will help us make better surgical decisions.</span></p>
<p><a id="c13-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">There is much room for improvement in small-scale sensing devices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">The accuracy of current approaches to wearable motion monitoring is insufficient for many applications, particularly those involving people with impaired movement patterns where accurately distinguishing between functional and symptomatic movement is critical. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">Real-world biomechanical measurements from sensors worn over long durations generate massive quantities of noisy data, and we need new methods to gain insights from these large datasets. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.4">This is an opportunity for meaningful interactions between people working in the fields of data science and biomechanics.</span></p></section>
<section>
<h2><a id="c13-sec-0002"/><a id="c13-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Physical rehabilitation everywhere</span></h2>
<p class="paraaftertitle"><a id="c13-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">The ability to walk is a hallmark of independence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">Unfortunately, neurological disorders and injuries like stroke, Parkinson's disease, and cerebral palsy severely limit people's ability to move. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">Musculoskeletal diseases such as osteoarthritis cause pain and limit the movement of millions of individuals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.4">Collectively, the consequences of limited mobility are widespread and severe.</span></p>
<p><a id="c13-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Rehabilitation is vital to improving life for people with impaired movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">Having worked in rehabilitation clinics for many years, I have been deeply inspired by people's drive to regain their abilities and by the skill of the therapists who guide their rehabilitation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.3">However, current approaches to rehabilitation rely on in-clinic assessments and therapy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.4">Physical and occupational therapists evaluate patients to design treatment plans, but they lack tools to measure how patients function outside the clinic as well as methods to leverage data from hundreds of similar patients in order to plan treatments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.5">The need for patients to travel to a clinic and the high cost of the therapy limit the amount of therapy that can be delivered to patients who are working hard to recover.</span></p>
<p><a id="c13-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">We must develop tools that allow patients to participate in rehabilitation without the need to travel to a clinic. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">Strengthening and mobility exercises could be performed more often if they could be done at home. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">Mobile sensors can measure motion but provide incomplete information. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">We also need software that applies state-of-the-art biomechanical models to accurately quantify movement in patients with mobility disorders. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.5">By optimizing these tools to run on a smartphone and delivering haptic, auditory, and visual feedback, we can transform a smartphone into a motion measurement system and a virtual physical therapist. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.6">In addition, machine-learning methods that extract insights from thousands of scientific articles and data describing millions of individuals—including videos, clinical notes, and signals from mobile sensors—have the potential to deliver valuable guidance at low cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.7">It will be a challenge for our field to develop these technologies in a way that provides clear benefits to people with impaired movement, not merely to develop technologies for technology's sake.</span></p></section>
<section>
<h2><a id="c13-sec-0003"/><a id="c13-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Large-scale experiments</span></h2>
<p class="paraaftertitle"><a id="c13-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Most of the studies I have performed included a few dozen participants. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">That changed a few years ago when some of the largest companies on the planet became interested in biomechanics, and millions of people began carrying smartphones equipped with motion sensors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">I had dreamed of being able to do experiments on a large scale. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.4">With much of the world's population equipped with accelerometers in their phones, this dream could become a reality.</span></p>
<p><a id="c13-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">My collaborators and I worked with a local start-up company, Azumio Inc., to collect and analyze smartphone-sensor-based activity patterns from over 600,000 people in 46 countries, making this the largest survey of physical activity by a factor of roughly 1,000. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">We found that the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">inequality</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> between the least and most active segments of populations predicts obesity prevalence in each population (</span><a id="c13-fig-0003a"/><a href="#c13-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Figure 13.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">Activity inequality is calculated with the Gini index, the same formula used to compute income inequality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">The Gini index ranges from 0, where everyone receives an equal share of a resource (perfect equality), to 1, where one person receives all of a resource. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.4">In countries where activity inequality is high, it is usually because large numbers of women are relatively inactive; in these populations, women have lower life expectancy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.5">We found that activity inequality is lower in more walkable cities—those with restaurants within walking distance of homes and workplaces, for example. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.6">In these walkable cities, women have the greatest increases in physical activity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.7">These findings suggest that urban planning and public health policy should focus on increasing activity in people who are the least active. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.8">I recommend that biomechanists get involved in city and community planning to build physical activity into daily life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.9">This can have great positive impact on the health of millions of people.</span></p>
<figure id="c13-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"><img src="../images/c13-fig-0002.jpg" alt="c13-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c13-fig-0003a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Figure 13.2</span></a></span> <a id="c13-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">Activity inequality predicts obesity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">Individuals in the five countries with highest activity inequality are 196 percent more likely to be obese than individuals in the five countries with lowest activity inequality. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">Adapted from Althoff et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.4">(2017).</span></p></figcaption></figure>
<p><a id="c13-para-0021"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">The mobile health market is projected to grow to $500 billion worldwide by 2025 (TMR, 2017). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.2">Smartphone apps and wearable devices are available to monitor a wide range of health behaviors, such as physical activity, walking speed, sedentary time, heart rate, and sleep. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.3">Analyzing the data generated by wearable sensors and apps has the potential to alter how we study human behavior and how we intervene to improve health. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.4">These data are many orders of magnitude larger than those collected in traditional research studies and can be acquired at low cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.5">Because the data are collected automatically, they reveal behavior in natural environments and reach individuals who do not typically enroll in research studies.</span></p>
<p><a id="c13-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Modifiable behaviors like physical activity (WHO, 2010) and sedentary behavior (Biswas et al., 2015) have significant effects on health, but until the advent of modern wearable sensors, tools for studying these behaviors at scale have been limited. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">The large-scale data from apps and wearables can help us uncover the environmental, social, and personal factors that motivate healthy behaviors and identify new ways to improve health.</span></p>
<p><a id="c13-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Mobile apps, wearables, and the massive amounts of data they are collecting have transformational potential. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">However, effective analysis of these data requires expertise in biomechanics, data science, and public health. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.3">Few researchers are cross-trained in these areas, making collaboration and communication between disciplines difficult. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.4">I have tried to gain experience in data science and public health so that I can engage with researchers in these domains and mentor students who want to cross these disciplinary boundaries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.5">This is an area in which you can have great impact, and I encourage you to dive in.</span></p>
<p><a id="c13-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Large-scale studies require data and sophisticated tools to gain insights from these data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">Unfortunately, most research labs do not share their data or tools. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.3">Companies maintain databases that characterize the activities of millions of individuals, but these databases are rarely shared with researchers for analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.4">The future of biomechanics—and, indeed, the health of millions of individuals—calls for us to liberate these data and develop methods to gain insights from these rich datasets.</span></p></section>
<section>
<h2><a id="c13-sec-0004"/><a id="c13-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Modern statistics and machine learning</span></h2>
<p class="paraaftertitle"><a id="c13-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">The conclusions of nearly all biomedical research studies are based on hypothesis testing using parametric tests, such as the Student's </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">t</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">-test. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">The current surge of data, however, presents new challenges for many biomedical disciplines, including biomechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">Data characterizing human movement are high-dimensional, heterogeneous, and growing in volume with wearable sensing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.4">Traditional statistical methods limit the insights we can gain from such data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.5">New statistical methods will transform biomechanics, as they have done with autonomous driving, image recognition, and automated cancer detection.</span></p>
<p><a id="c13-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">One popular method to unlock the power of large datasets is machine learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">Eni Halilaj searched for research articles that used machine learning to study movement biomechanics and discovered a rapid rise in the number of publications in this area (</span><a id="c13-fig-0004a"/><a href="#c13-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Figure 13.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">I expect this trend to continue as more people engage in collaboration and cross-training between biomechanics and machine learning.</span></p>
<figure id="c13-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"><img src="../images/c13-fig-0003.jpg" alt="c13-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c13-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Figure 13.3</span></a></span> <a id="c13-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Use of data science methods in human movement biomechanics studies has increased dramatically in recent years. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">Adapted from Halilaj et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.3">(2018).</span></p></figcaption></figure>
<p><a id="c13-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">A study by Apoorva Rajagopal and colleagues illustrates the impact of combining modern statistical methods and biomechanical modeling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">Apoorva's study examined surgical correction of equinus gait (walking on the toes), one of the most common gait abnormalities in children with cerebral palsy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">She wanted to know whether we could use estimates of gastrocnemius length during gait to identify limbs whose ankle kinematics were likely to improve following gastrocnemius lengthening surgery (</span><a id="c13-fig-0005a"/><a href="#c13-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Figure 13.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">She analyzed gait data from 891 limbs that underwent surgery and categorized outcomes based on the presurgical and postsurgical ankle kinematics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.3">Limbs with a short gastrocnemius that received a gastrocnemius lengthening surgery (“case” limbs) were far more likely to have a good surgical outcome than limbs whose gastrocnemius was not short yet still received a lengthening surgery (“overtreated” limbs). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.4">The difference was staggering: 71 percent of case limbs had good outcomes at the follow-up gait visit compared to only 33 percent of overtreated limbs (</span><a id="c13-fig-0006a"/><a href="#c13-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Figure 13.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.2">Her results suggest that estimates of gastrocnemius length should be used to identify good candidates for surgery.</span></p>
<figure id="c13-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"><img src="../images/c13-fig-0004.jpg" alt="c13-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c13-fig-0005a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">Figure 13.4</span></a></span> <a id="c13-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Method to estimate gastrocnemius length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">An OpenSim model recreated the movement recorded with motion capture (left) and then computed muscle–tendon length of the gastrocnemius medialis (right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.3">These lengths were normalized to the average peak length computed for typical gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.4">Limbs whose peak length was at least 2 standard deviations below the typical mean (i.e., below the shaded band in the right panel) were categorized as having “short” gastrocnemius muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.5">Subject 1 (blue lines) had a short peak gastrocnemius length and Subject 2 (orange lines) did not. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.6">Adapted from Rajagopal et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.7">(2019).</span></p></figcaption></figure>
<figure id="c13-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1"><img src="../images/c13-fig-0005.jpg" alt="c13-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c13-fig-0006a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Figure 13.5</span></a></span> <a id="c13-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">Long-term outcomes following gastrocnemius lengthening surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">Case limbs underwent surgery consistent with the musculoskeletal model and had better outcomes than overtreated limbs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">The observations were binned based on years elapsed following the surgery, and the rate of good outcome in each bin was computed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.4">Bins overlap in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.5">The error bars indicate 1 standard deviation; areas of the circles are proportional to the number of observations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.6">Adapted from Rajagopal et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.7">(2019).</span></p></figcaption></figure></section>
<section>
<h2><a id="c13-sec-0005"/><a id="c13-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Modeling neuromuscular control to predict movement</span></h2>
<p class="paraaftertitle"><a id="c13-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Modeling how the brain coordinates movement is a grand challenge in biomechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">Computational modeling has mostly been limited to reproducing observed movements to study quantities that cannot be measured, such as muscle forces and joint loads. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">Modern computational techniques have enabled development of predictive simulations, which produce simulations of movement without first collecting experimental data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.4">Predictive simulations use optimization to achieve high-level objectives, such as minimizing a model's energy expenditure during gait, while adhering to physical constraints like Newton's laws and physiological constraints like muscle activation delays. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.5">The variables in the optimization problem describe how to coordinate the model's muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.6">The solution produces a simulation that represents movement observed in nature as long as the optimization problem captures the salient qualities of real movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.7">Predictive simulations will allow us to design better prostheses and surgeries that maximize an individual's function.</span></p>
<p><a id="c13-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">To generate predictive simulations, we must solve high-dimensional optimization problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">One strategy for solving these problems is to use reinforcement learning, which can be applied without knowledge of an underlying model and without proposing the structure of a controller: the optimizer simply learns how to generate model inputs (in this case, muscle excitations over time) that produce desirable outputs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.3">Łukasz Kidziński (2018) ran a fantastic competition in conjunction with the past two Neural Information Processing Systems conferences in which over a thousand participants used reinforcement learning to solve classical problems in motor control. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.4">For example, competitors were challenged to develop controllers that would enable a musculoskeletal model to run over uneven terrain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.5">The results were amazing! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.6">The competitors proved that reinforcement learning techniques can synthesize natural movements like walking and running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.7">Their optimizers also discovered a variety of bizarre hopping and skipping gaits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.8">This project was successful because of the collaboration between biomechanists and computer scientists, and the availability of powerful open-source software like OpenSim and the reinforcement learning environment from CrowdAI.</span></p>
<p><a id="c13-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Direct collocation is another powerful method to solve high-dimensional optimization problems in biomechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.2">Direct collocation converts the equations of motion into algebraic constraint equations, effectively computing all time frames simultaneously. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.3">Solving optimization problems is challenging, and researchers frequently wait for days, or even weeks, for the results of an optimization. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.4">Direct collocation has been used to solve optimal control problems in biomechanics much faster than traditional methods and will enable broader use of predictive simulations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.5">I am certain that direct collocation will have a great impact on the future of biomechanics, and I encourage you to learn more about it.</span></p></section>
<section>
<h2><a id="c13-sec-0006"/><a id="c13-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Motivating movement</span></h2>
<p class="paraaftertitle"><a id="c13-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">We all know that physical activity is good for us. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">As Hippocrates famously said, “Walking is man's best medicine.” </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.3">Yet nearly half of adults fail to get enough activity to maintain their health, and this inactivity is costing us dearly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.4">Worldwide, five million deaths each year are due to conditions like heart disease, stroke, and diabetes, and many of these could be prevented just by increasing physical activity (Lee et al., 2012). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.5">Technology that motivates healthy behaviors—especially well-established, low-cost behaviors like exercise—could improve the health of millions of people and lower the economic burden of physical inactivity.</span></p>
<p><a id="c13-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">Smartphones and wearable sensors have the potential to fulfill this vision and revolutionize healthcare. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">I have already mentioned that these devices provide vast amounts of data about physical activity, and smartphones enable near-continuous interaction with users for motivating healthy behaviors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">However, smartphones and other devices have not improved health—and some have had the opposite effect (Jakicic et al., 2016). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.4">Clearly, technological capability alone is insufficient to solve this problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.5">If we want to make these devices into active tools for improving public health, not just for gathering information, we have to understand how people interact with technology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.6">Motivating individuals is more complex than merely developing a nifty new gadget.</span></p>
<p><a id="c13-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Physical activity is a powerful, low-cost medicine, but we need precise and engaging tools to motivate it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">Ideas from diverse disciplines such as behavioral psychology, human–computer interaction theory, and biomechanics have been successful on a small scale; however, these innovations have rarely been incorporated into mobile health apps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.3">Biomechanists, in collaboration with experts in other disciplines, must look for new ways to motivate physical activity that will reach millions of people around the world and address areas of great need, such as neurological disability. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.4">Our vision is to achieve effective yet affordable healthcare that is deployable on a global scale.</span></p></section>
<section>
<h2><a id="c13-sec-0007"/><a id="c13-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">Open science</span></h2>
<p class="paraaftertitle"><a id="c13-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Open science is the best way to advance our field. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.2">As a community, we must make publications, data, models, and software freely available to everyone. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.3">Immense amounts of high-fidelity movement data have been collected from healthy individuals and those with every imaginable movement impairment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.4">But the data are hidden on computer hard drives and unavailable to the community. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.5">Anonymizing and releasing these data would enable biomechanical studies of unprecedented scale. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.6">To encourage data sharing and open science, my colleagues and I have created a website for sharing biomechanical data, models, and software—simtk.org—which hosts over 1,000 projects with shared resources. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.7">The models and data presented in this book are available on this website. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.8">The biomechanics culture must continue to change to make data sharing the norm.</span></p>
<p><a id="c13-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Sharing software can also accelerate research. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.2">Biomechanical simulation is rapidly growing in popularity, in part because it is a powerful complement to experimental approaches, but also because established software tools are now available. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.3">As we have seen throughout the book, the OpenSim software enables users to build biomechanical models, simulate musculoskeletal dynamics, predict novel movements, and disseminate new computational tools. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.4">Jeff Rankin, Jonas Rubenson, and John Hutchinson (2016) used OpenSim to study the mechanisms responsible for the impressive speed, agility, and efficiency of the ostrich, the fastest-running biped (</span><a id="c13-fig-0007a"/><a href="#c13-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Figure 13.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">Taymaz Homayouni and colleagues (2015) used OpenSim to prototype new implantable mechanisms to restore function in patients with partial paralysis of the arm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.3">Matt DeMers, Jennifer Hicks, and I used OpenSim to compare the effectiveness of reflexes and preparatory muscle coactivation in preventing ankle injuries (</span><a id="c13-fig-0008a"/><a href="#c13-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Figure 13.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">), a study that would be too dangerous to perform experimentally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">These are just a few of the hundreds of studies that have been enabled by the OpenSim software, and I am delighted to see the OpenSim community continuing to grow.</span></p>
<figure id="c13-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"><img src="../images/c13-fig-0006.jpg" alt="c13-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c13-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Figure 13.6</span></a></span> <a id="c13-para-0039"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">OpenSim model of an ostrich, the fastest biped on the planet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">Model from Rankin et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.3">(2016).</span></p></figcaption></figure>
<figure id="c13-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"><img src="../images/c13-fig-0007.jpg" alt="c13-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c13-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Figure 13.7</span></a></span> <a id="c13-para-0040"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Frames from a simulation of landing on an incline to study ankle injuries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">OpenSim model from DeMers et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.3">(2017).</span></p></figcaption></figure>
<p><a id="c13-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">In addition to open-source software, open access to computational models of musculoskeletal structures has enabled a wide range of studies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">For example, Sam Hamner's model to simulate running (Figure 12.4), Miguel Christophy's model of the lumbar spine (Christophy et al., 2012), and Kate Saul's model of the upper extremity (Figure 10.6) have each been used by thousands of researchers and students. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">Continuing the trend toward open science will enable investigation of increasingly complex problems that can only be solved through the combined effort of individuals with diverse expertise. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.4">The OpenSim project provides a collaborative research platform that supports a diverse, global, and expanding community that is working to solve the most important problems in biomechanics (</span><a id="c13-fig-0009a"/><a href="#c13-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Figure 13.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.2">I hope you will join this team.</span></p>
<figure id="c13-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"><img src="../images/c13-fig-0008.jpg" alt="c13-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c13-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">Figure 13.8</span></a></span> <a id="c13-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Locations of visitors to the OpenSim documentation in a recent one-year period. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.2">Since its launch in 2012, the OpenSim documentation wiki has been visited by over 25,000 users from around the world per year. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.3">Adapted from Seth, Hicks, Uchida et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.4">(2018).</span></p></figcaption></figure></section>
<section>
<h2><a id="c13-sec-0008"/><a id="c13-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">Taking the baton</span></h2>
<p class="paraaftertitle"><a id="c13-para-0043"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">I hope this book has increased your appreciation of the elegance and complexity of human movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">Even the limited material we have covered is the culmination of research that has taken thousands of individuals hundreds of years to develop. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.3">It's an amazing team effort. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.4">As Walt Whitman wrote, “the powerful play goes on, and you may contribute a verse.” </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.5">Indeed, the principles you have learned by working through this book set the stage for you to participate in the field. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.6">You can read news articles and journal papers about running shoes and robots with a new perspective. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.7">You can attend a seminar or conference, or just talk to your friend about the way we move. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.8">With a little creativity and a bit of hard work, you can make meaningful contributions to the world through biomechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.9">Let's keep moving!</span></p>
