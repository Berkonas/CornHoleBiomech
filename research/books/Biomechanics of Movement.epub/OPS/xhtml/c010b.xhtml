<section epub:type="chapter" role="doc-chapter">
<header>
<h1><a id="c10-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">10</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Muscle-Driven Simulation</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c10-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">Prediction is very difficult,</span></p>
<p class="quote-epigraphpara"><a id="c10-para-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">especially if it's about the future.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">—Niels Bohr</span></p></blockquote>
<p><a id="c10-para-0003"/></p>
<figure id="c10-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"><img src="../images/c10-fig-5001.jpg" alt="c10-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c10-para-0004"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">my first job after graduating</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"> from college in 1983 was helping small companies write computer-aided design software. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.2">I was working at a computer factory in Colorado that had just produced a powerful new graphics computer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.3">Powerful in those days meant that it could draw a few lines on a small screen every second. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.4">No one would use our graphics computers without graphics software, so my job was to help engineers at other companies get their computer-aided design software running on our newly minted computers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.5">What became clear to me was that nearly all future products would be designed on computers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.6">In my applications for graduate school, I proposed building computer graphics tools for designing surgeries.</span></p>
<p><a id="c10-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">When I entered graduate school two years later, I was fortunate to join a biomechanics research laboratory led by Felix Zajac in the Design Group at Stanford University. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">As a neuroscientist interested in understanding the control of movement, Zajac had spent decades performing elegant experiments to measure muscle activation patterns, ground reaction forces, and joint motions during movements such as jumping. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.3">He realized that synthesizing these experimental data into a comprehensive understanding of muscle function during movement would require more than expert analysis of the data.</span></p>
<p><a id="c10-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Experimental measurements alone are insufficient to understand muscle actions during movement for two reasons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">First, important quantities like the forces generated by muscles cannot usually be measured in experiments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">Second, it is difficult to establish cause–effect relationships through experimental observation alone. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">For example, ground reaction forces can be measured during walking (Chapter 2) and can be used to estimate the accelerations of the body's center of mass. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5">However, ground reaction force measurements alone offer little insight into how muscles contribute to the accelerations of the body's center of mass, and thereby to the critical tasks of supporting the body's weight and propelling the body forward during walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.6">EMG signals (Chapter 4) can be analyzed to understand when muscles are active but do not reveal which motions of the body arise from each muscle's activity.</span></p>
<p><a id="c10-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">We needed a new framework to advance our understanding of muscle function during movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">This framework had to reveal the relationships between muscle activations, muscle forces, ground reaction forces, and motions of the body.</span></p>
<p><a id="c10-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">Muscle-driven simulations of movement offer this framework. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Simulations provide estimates of muscle forces and reveal cause–effect relationships, such as a muscle's contribution to the ground reaction force during walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">We can also use simulations to predict how the body will respond to a disease, surgery, or altered muscle activations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">These capabilities allow us to characterize the actions of muscles during movement and to design surgeries and assistive devices.</span></p>
<p><a id="c10-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Zajac and his students were at the forefront of developing muscle-driven simulations when I entered his research group in 1985. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Joining this group started me on a journey lasting over 30 years that has focused on creating muscle-driven simulations and analyzing them to improve movement for people with impaired biomechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">Whereas my work just after college produced computer-aided design tools for engineered products within two years, developing computer-aided design tools for understating the complexities of human movement turned out to be a lifelong challenge.</span></p>
<p><a id="c10-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">This chapter describes some of what I have learned about creating muscle-driven simulations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">The chapter begins by illustrating why it is so difficult to determine the actions of muscles during movement without a simulation, and why the literature is riddled with incorrect conclusions about muscle function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">We move on to discuss the four stages of building and analyzing muscle-driven simulations to determine muscle actions correctly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">The chapter then describes the open-source simulation software my colleagues and I have developed to enable a worldwide collaboration in which thousands of researchers build and share computer simulations of movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.5">My goal is to advance the field by pulling together.</span></p>
<section>
<h2><a id="c10-sec-0001"/><a id="c10-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Understanding muscle actions during movement is challenging</span></h2>
<p class="paraaftertitle"><a id="c10-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Experimental approaches to infer a muscle's actions based on its geometry, EMG measurements, and observed motions do not correctly explain how muscles move the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Analyses based on anatomical knowledge alone frequently lead to incorrect conclusions about the function of muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">For example, the soleus muscle is described in much of the anatomical and biomechanical literature as a muscle that plantarflexes the ankle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">The soleus muscle does generate an ankle plantarflexion moment which does, indeed, plantarflex the ankle, but the muscle can also perform other actions (</span><a id="c10-fig-0002a"/><a href="#c10-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Figure 10.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">These actions arise from an effect known as </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">dynamic coupling</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">.</span></p>
<figure id="c10-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1"><img src="../images/c10-fig-0001.jpg" alt="c10-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Figure 10.1</span></a></span> <a id="c10-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Actions of the soleus muscle during single-limb stance, ignoring (left) and including (right) dynamic effects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">The ankle plantarflexion moment generated by the soleus plantarflexes the ankle in both cases but is seen to affect other joints and body segments when the ground reaction force is considered, due to dynamic coupling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">Adapted from Anderson et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.4">(2006).</span></p></figcaption></figure>
<p><a id="c10-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Dynamic coupling describes the phenomenon whereby the motion of one body segment affects the motion of another segment due to induced forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">As shown in </span><a href="#c10-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Figure 10.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">, the force generated by the soleus not only generates an ankle plantarflexion moment but also induces intersegmental forces and joint accelerations throughout the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">The magnitudes and directions of these intersegmental forces depend on the force applied by the muscle, the muscle's moment arm, the mass and inertia of the body segments, and the pose of the body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.3">In the example shown on the right side of </span><a href="#c10-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Figure 10.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">, the force generated by the soleus produces a counterclockwise angular acceleration of the shank, which requires the knee joint to accelerate upward and to the left. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">The inertia of the thigh and adjoining segments resists this acceleration and results in an intersegmental force at the knee—which in turn accelerates the thigh, and so on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">Thus, the soleus accelerates all the joints of the body despite spanning only the ankle.</span></p>
<p><a id="c10-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">In many cases, the intersegmental forces resulting from dynamic coupling are large enough to influence our interpretation of a muscle's actions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.2">Although the “muscle-induced” accelerations are generally small at joints far from the muscle, they can be substantial at nearby joints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.3">For example, Felix Zajac and Michael Gordon (1989) demonstrated that, during standing, the soleus can accelerate the knee into extension even more than it accelerates the ankle into plantarflexion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.4">Furthermore, they noted that it is possible for a biarticular muscle to induce a joint acceleration that opposes the moment it generates about one of the joints it crosses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.5">For example, although the gastrocnemius generates a knee flexion moment and an ankle plantarflexion moment, it can nevertheless induce a knee extension acceleration or an ankle dorsiflexion acceleration (</span><a id="c10-fig-0003a"/><a href="#c10-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Figure 10.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">These seemingly incongruous accelerations are possible when the gastrocnemius is activated because, for example, the knee flexion acceleration due to the knee flexion moment it generates may be overshadowed by the knee extension acceleration induced by the ankle plantarflexion moment it generates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">Many biomechanical studies have ignored dynamic coupling when interpreting muscle actions and have drawn erroneous conclusions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">It is challenging to deduce the actions of muscles during movement for musculoskeletal systems that consist of dozens of body segments, joints, and muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.5">Muscle-driven simulations are needed to meet this challenge.</span></p>
<figure id="c10-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"><img src="../images/c10-fig-0002.jpg" alt="c10-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0003a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Figure 10.2</span></a></span> <a id="c10-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">A biarticular muscle can induce a joint acceleration that opposes the moment it generates about one of the joints it crosses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">For example, from the initial position shown (far left), a force generated by the gastrocnemius may act to flex or extend the knee and ankle as shown due to dynamic coupling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.3">Adapted from Zajac (1993).</span></p></figcaption></figure>
<p><a id="c10-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">You may be wondering whether muscles really produce accelerations in the direction opposite to their applied moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.2">I had my doubts as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.3">Steve Piazza was a student working in my lab who had created muscle-driven simulations of the swing phase of walking (Piazza and Delp, 1996). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.4">His simulations showed that the hamstrings generated a hip flexion acceleration in some situations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.5">Recall that the hamstrings cross behind the hip and, for this reason, many scientists believe that these muscles always produce hip extension. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.6">Analysis of the equations of motion confirmed that generation of hip flexion was indeed possible, but our clinical colleagues were skeptical. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.7">In particular, Jacqueline Perry, a world-leading expert in muscle and gait, and one of my scientific heroes, did not believe our results and wanted more evidence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.8">So Steve built “the convincer,” a simple mechanism that resembled a leg with a wire where the hamstrings would be. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.9">When we pulled on the hamstrings wire under the right conditions, the hip would flex slightly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.10">Steve and I were convinced—and so were our clinical colleagues, including Dr. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.11">Perry.</span></p></section>
<section>
<h2><a id="c10-sec-0002"/><a id="c10-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Creating muscle-driven simulations</span></h2>
<p class="paraaftertitle"><a id="c10-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">The equations arising from Newton's laws of motion characterize the dynamics of our bodies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">We can make predictions about how a person will move by solving these equations over time, a process referred to as </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">dynamic simulation</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.2">A “muscle-driven” dynamic simulation predicts how the forces produced by muscles contribute to motions of the body segments during movements such as walking and running.</span></p>
<p><a id="c10-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">The process of developing, testing, and analyzing muscle-driven simulations comprises four stages (</span><a id="c10-fig-0004a"/><a href="#c10-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Figure 10.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">In Stage 1, you create a computational model that characterizes the dynamic behavior of the musculoskeletal system with sufficient accuracy to answer your research question. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.3">You may be able to skip this laborious step if someone else has created and shared a model that is appropriate for your research. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.4">Stage 2 involves computing a set of muscle excitations which, when applied to the model, generate a simulation of the movement of interest. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.5">Stage 3 confirms that the simulation adequately represents the movement of interest by comparing the simulation results to experimental measurements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.6">In Stage 4, you analyze your simulations to answer your research question. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.7">We explore each of these stages in the sections that follow.</span></p>
<figure id="c10-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"><img src="../images/c10-fig-0003.jpg" alt="c10-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Figure 10.3</span></a></span> <a id="c10-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">The process for creating and analyzing muscle-driven simulations includes (1) modeling musculoskeletal dynamics, (2) simulating movement, (3) testing the accuracy of the simulations, and (4) analyzing the simulations to answer a specific research question.</span></p></figcaption></figure></section>
<section>
<h2><a id="c10-sec-0003"/><a id="c10-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Stage 1: Modeling musculoskeletal system dynamics</span></h2>
<p class="paraaftertitle"><a id="c10-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">A model of musculoskeletal dynamics allows us to compute the motions caused by each muscle force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">The first stage of our four-stage process is to create a model of the musculoskeletal system using equations that describe muscle activation dynamics, muscle–tendon contraction dynamics, musculoskeletal geometry, and skeletal dynamics (</span><a id="c10-fig-0005a"/><a href="#c10-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Figure 10.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">These equations characterize the time-dependent behavior of the musculoskeletal system in response to muscle excitations.</span></p>
<figure id="c10-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"><img src="../images/c10-fig-0004.jpg" alt="c10-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0005a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Figure 10.4</span></a></span> <a id="c10-para-0021"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">Elements of a muscle-driven simulation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">Excitations from a neural controller produce muscle activations and muscle forces via models of muscle activation and contraction dynamics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">These forces are transmitted to the skeleton, generating joint moments that accelerate the body segments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.4">Sensory feedback modifies neural commands. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.5">Feedback is also shown to indicate that body movement affects other elements of the system.</span></p></figcaption></figure>
<p><a id="c10-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">As we saw in Chapter 4, the relationship between muscle excitation and activation is governed by the dynamics of the motor unit action potentials and cross-bridge cycling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">The activation of a muscle (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">a</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">) can be modeled by relating its time derivative (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"><img src="../images/c10-fig-6001.jpg" alt="c10-fig-6001.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">) to the current activation and excitation (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">u</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">), as described by Equation 4.1.</span></p>
<p><a id="c10-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Muscle activations are inputs to the model of muscle–tendon contraction dynamics, as are the lengths and lengthening velocities of the muscle–tendon actuators (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"><img src="../images/c10-fig-6002.jpg" alt="c10-fig-6002.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"><img src="../images/c10-fig-6003.jpg" alt="c10-fig-6003.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">As described in Chapter 5, the dynamics of muscle and tendon are governed by the time course of cross-bridge formation, the sliding of actin filaments, and the dynamics of tendon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.3">The forces generated by a muscle (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">M</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">) and transmitted through its tendon (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">F</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">T</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">) can be estimated using four dimensionless curves and five muscle-specific parameters, as detailed in Chapter 5. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">When applied to the skeleton, muscle forces produce moments about the joints, as discussed in Chapter 6. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.3">The joint moments generated by muscles cause the joints and body segments to accelerate, thereby producing movement.</span></p>
<p><a id="c10-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">The accelerations of the body in response to muscle forces and other loads can be computed using the equations of motion for the body:</span></p>
<p><a id="c10-para-0025"/></p>
<figure id="c10-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"><img src="../images/c10-fig-3001.jpg" alt="c10-fig-3001.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c10-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">(10.1)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">In this set of equations, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"><img src="../images/c10-fig-6004.jpg" alt="c10-fig-6004.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"><img src="../images/c10-fig-6005.jpg" alt="c10-fig-6005.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">, and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"><img src="../images/c10-fig-6006.jpg" alt="c10-fig-6006.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1"> are the positions, velocities, and accelerations of the joints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"><img src="../images/c10-fig-6007.jpg" alt="c10-fig-6007.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> is the inverse of the system mass matrix, which contains the masses and inertial properties of the body segments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.2">As shown in Equation 10.1, the mass matrix defines the relationships between forces and joint accelerations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"><img src="../images/c10-fig-6008.jpg" alt="c10-fig-6008.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> is a vector of forces arising from gravity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1"><img src="../images/c10-fig-6009.jpg" alt="c10-fig-6009.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1"> is a vector of Coriolis and centrifugal forces, which arise when Newton's laws of motion are applied in reference frames that are fixed to rotating bodies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1"><img src="../images/c10-fig-6010.jpg" alt="c10-fig-6010.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1"> is a matrix of muscle moment arms and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1"><img src="../images/c10-fig-6011.jpg" alt="c10-fig-6011.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1"> is a vector of tendon forces, which is a function of muscle excitations (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"><img src="../images/c10-fig-6012.jpg" alt="c10-fig-6012.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.2">The muscle moment arms determine the joint moments that result when the tendon forces are applied to the skeleton. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.3">Finally, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1"><img src="../images/c10-fig-6013.jpg" alt="c10-fig-6013.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> is a vector of external forces that characterize the interactions between the body and its environment (e.g., ground reaction forces). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">Analyzing Equation 10.1 allows us to compute the accelerations caused by each muscle force and thereby determine the actions of a muscle in a complex multijoint system.</span></p>
<p><a id="c10-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">The modeling approach illustrated in </span><a href="#c10-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">Figure 10.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"> has been used to create muscle-driven simulations of a wide variety of movements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.2">Some studies use a model of the musculoskeletal system that is relatively simple. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.3">For example, a two-dimensional model with only a few degrees of freedom and actuated by just a few muscles may be sufficient to capture the phenomena of interest (</span><a id="c10-fig-0007a"/><a href="#c10-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Figure 10.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">In other cases, a three-dimensional model with many degrees of freedom and dozens of muscles may be necessary to elucidate the contributions of individual muscles to an observed movement (</span><a id="c10-fig-0008a"/><a href="#c10-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Figure 10.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">Note that the usefulness of a model does not always increase as model complexity increases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.3">In fact, it is counterproductive to use a model that is more complex than is necessary to answer your research question. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.4">Additional complexity increases the effort required to build and validate a model, generate simulations, and analyze simulation results. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.5">So beware: complexity begets perplexity!</span></p>
<figure id="c10-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1"><img src="../images/c10-fig-0005.jpg" alt="c10-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">Figure 10.5</span></a></span> <a id="c10-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">Planar musculoskeletal models of the upper and lower extremity used to generate muscle-driven simulations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">Simple models like these may be sufficient for studying planar elbow flexion or the dynamics of leg swing during gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.3">Models derived from Murray et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.4">(1995); Delp et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.5">(1990).</span></p></figcaption></figure>
<figure id="c10-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1"><img src="../images/c10-fig-0006.jpg" alt="c10-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">Figure 10.6</span></a></span> <a id="c10-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Detailed neck and upper-extremity musculoskeletal models used to generate muscle-driven simulations of neck injuries and reaching tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.2">Relatively complex models like these can provide detailed information about the activity, force production, and energetics of individual muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.3">Models derived from Vasavada et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.4">(1998); Cazzola et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.5">(2017); Saul et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.6">(2015).</span></p></figcaption></figure>
<p><a id="c10-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">Once a generic model has been selected for a particular study, the model must be calibrated to match the geometry and strength of each study participant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">You can calibrate a model by adjusting the size and inertial properties of each body segment based on measurements made during a motion capture experiment (see Chapter 7). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.3">The location, orientation, and range of motion of the model's joints may be adjusted based on experiments in which the subject moves each joint through a series of standard motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.4">The paths and other parameters of muscles may be calibrated using clinical exams, strength tests, and activities like a maximum-height jump. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.5">A powerful approach to calibrate a model is to adjust model parameters through optimization, minimizing the error between a measurement and an analogous simulation.</span></p>
<p><a id="c10-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Although we have spent only a few pages here, it can take years to build, calibrate, and validate a new musculoskeletal model. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.2">I urge model developers to share their creations with the biomechanics community so that others can build upon their work.</span></p></section>
<section>
<h2><a id="c10-sec-0004"/><a id="c10-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Stage 2: Simulating movement</span></h2>
<p class="paraaftertitle"><a id="c10-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">To generate a simulation of movement, the differential equations of a dynamic model are numerically integrated forward in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.2">If the simulation is driven by muscles, a set of muscle excitations (i.e., </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"><img src="../images/c10-fig-6014.jpg" alt="c10-fig-6014.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"> in Equation 10.1) must be applied. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">The muscle excitations are usually generated by an optimizer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.3">One must also provide the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">initial conditions</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1"> of the simulation, or the value of each state variable at the initial time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">State variables include the joint angles and angular velocities, muscle activations, muscle fiber lengths, and other time-varying quantities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.3">The governing differential equations (Equation 10.1) describe the rate at which these state variables change as a function of their current values. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.4">The numerical solution of these equations yields the trajectories of the state variables, from which one can compute all other state-dependent quantities, such as muscle and tendon forces, tendon strains, joint contact forces, and the metabolic energy consumed by each muscle.</span></p>
<p><a id="c10-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Finding a set of muscle excitations that produces a coordinated movement is challenging, particularly for movements as complex as walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.2">Not only must many degrees of freedom be controlled, but the time-dependent, nonlinear force-generating properties of muscle must also be taken into account. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.3">Furthermore, we are often interested in generating simulations that agree with experimental measurements, such as joint angle trajectories or metabolic power consumption over time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.4">To overcome these challenges, dynamic optimization (Chapter 9) can be used to find muscle excitations that minimize a specified performance criterion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.5">Muscle excitations can be parameterized in a variety of ways. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.6">A common approach is to represent each excitation signal as a sequence of points spaced evenly over time, where the excitation at an instant in time is computed from the two neighboring points using linear interpolation (</span><a id="c10-fig-0009a"/><a href="#c10-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Figure 10.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.2">In this case, the optimizer would maximize performance by adjusting the height of each point.</span></p>
<figure id="c10-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1"><img src="../images/c10-fig-0007.jpg" alt="c10-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Figure 10.7</span></a></span> <a id="c10-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">A curve representing the excitation of a muscle can be parameterized as a sequence of points over time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.2">An optimizer predicts muscle coordination during movement by solving for the height of each point for each muscle.</span></p></figcaption></figure>
<p><a id="c10-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">Two optimization strategies can be used to generate muscle-driven simulations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">One approach is to solve an optimal tracking problem, where the objective function reflects the difference between simulated and measured quantities such as joint angles, joint powers, and ground reaction forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.3">By minimizing the objective function over the duration of the simulation, the model is driven to reproduce a movement that was observed experimentally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.4">For example, Anne Silverman and Richard Neptune (2012) used the following objective function to generate muscle-driven simulations of amputee gait that track experimental measurements:</span></p>
<p><a id="c10-para-0036"/></p>
<figure id="c10-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1"><img src="../images/c10-fig-3002.jpg" alt="c10-fig-3002.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c10-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">(10.2)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">ij</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1"> is the measurement of variable </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">i</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1"> (including joint kinematics and the components of the ground reaction force vectors) at time step </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">j</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1"><img src="../images/c10-fig-6015.jpg" alt="c10-fig-6015.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1"> is the corresponding quantity from the simulation, and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1"><img src="../images/c10-fig-6016.jpg" alt="c10-fig-6016.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1"> is the variance of experimental quantity </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">y</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">i</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.2">The squared errors are divided by the variance of the corresponding experimental variable so that variables with large variance are tracked less closely.</span></p>
<p><a id="c10-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">Solving optimal tracking problems can be computationally expensive. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.2">Even simple problems like tracking kinematics for a single gait cycle may take hours or days to solve. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.3">I was fortunate to work with Darryl Thelen and Clay Anderson when they were developing the computed muscle control algorithm, which solves the optimal tracking problem 100–1,000 times faster than previous approaches (Thelen et al., 2003). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.4">Many people now use this approach.</span></p>
<p><a id="c10-para-0039"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">The second method to generate muscle-driven simulations of movement is dynamic optimization, where movements are generated using goals like minimizing total energy consumption or maximizing a metric of athletic performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.2">As we saw in Chapter 9, Carmichael Ong and colleagues generated simulations of a standing long jump using an objective function that rewards longer distances and penalizes undesirable solutions, such as those that would cause injuries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.3">Tim Dorn, who was also working in my lab at the time, used an objective function of a similar form to generate muscle-driven simulations of loaded and inclined walking:</span></p>
<p><a id="c10-para-0040"/></p>
<figure id="c10-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1"><img src="../images/c10-fig-3003.jpg" alt="c10-fig-3003.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c10-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">(10.3)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">J</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">fall</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1"> penalizes unstable gaits, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">J</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">speed</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1"> penalizes gaits that differed from a target speed, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">J</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">head</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1"> penalizes gaits that involved unrealistic head motions, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">J</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">eff</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">o</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">rt</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1"> penalizes gaits that were energetically expensive, and weights </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">w</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">i </span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">balance these competing objectives. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.2">Solving this dynamic optimization problem produces simulations of walking in a variety of scenarios, including simulations of humans walking uphill while carrying heavy loads (Dorn et al., 2015).</span></p></section>
<section>
<h2><a id="c10-sec-0005"/><a id="c10-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">Stage 3: Testing the accuracy of dynamic simulations</span></h2>
<p class="paraaftertitle"><a id="c10-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Once you have developed a model of a musculoskeletal system, you must confirm that the behavior of the system is represented with sufficient accuracy to answer your research questions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.2">This process is known as </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">validation</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.2">My colleague Jennifer Hicks led our team in writing a review article that addresses the question faced by all of us involved in computer simulation: Is my model good enough? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.3">(Hicks et al., 2015).</span></p>
<p><a id="c10-para-0043"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">All models are designed with intended uses and have limitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.2">It is important to be aware of these limitations when selecting a model for a research study. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.3">For example, one must confirm the suitability of assumptions such as approximating short, stiff tendons as rigid links to improve simulation speed (</span><a id="c10-fig-0012a"/><a href="#c10-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Figure 10.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.2">For muscles with short tendons, representing the tendon as an elastic structure dramatically increases the time required to simulate muscle–tendon dynamics with no appreciable improvement in accuracy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.3">However, for muscles with long tendons, errors in muscle fiber lengths (and therefore in muscle forces) are large when tendons are assumed to be rigid. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.4">Thus, I typically use a rigid-tendon model to represent muscles with short tendons but include tendon elastic properties when the tendon is at least as long as the muscle fibers.</span></p>
<figure id="c10-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1"><img src="../images/c10-fig-0008.jpg" alt="c10-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">Figure 10.8</span></a></span> <a id="c10-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">A rigid-tendon approximation can greatly reduce the time required to simulate a muscle with a relatively short tendon (top), but introduces error in the muscle–tendon force (bottom), particularly when the tendon is long relative to the optimal fiber length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.2">Adapted from Millard et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.3">(2013).</span></p></figcaption></figure>
<p><a id="c10-para-0045"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">In 1990, I developed a model of the knee that represents the complex biological contact surfaces with simple geometry (</span><a id="c10-fig-0013a"/><a href="#c10-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">Figure 10.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.2">Computers were very slow and expensive at the time, so I needed a model that could calculate the moment arms of the muscles crossing the knee with little computational effort. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.3">The model has continued to perform well in this application for nearly 30 years. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.4">However, if I had needed a model to calculate contact stresses within the knee, I would have used more detailed geometric representations of the articular contact surfaces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.5">There are now detailed models of biological joints that exploit the computational resources available today.</span></p>
<figure id="c10-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1"><img src="../images/c10-fig-0009.jpg" alt="c10-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0013a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">Figure 10.9</span></a></span> <a id="c10-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">In many studies, the complex biological contact surfaces in the knee (left) can be approximated by simpler geometry (center) and incorporated into a musculoskeletal model (right) to increase simulation speed.</span></p></figcaption></figure>
<p><a id="c10-para-0047"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">We test simulations by comparing quantities that are predicted by the simulation to analogous experimental measurements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.2">As we have already seen, we can compare the joint angles, joint moments, ground reaction forces, and muscle excitation patterns from a muscle-driven simulation to experimentally measured kinematic, kinetic, and EMG data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.3">For example, our simulations of the standing long jump outlined in Chapter 9 included a simple model of the contact between the foot and the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.4">Although this model does not reproduce all of the details of experimentally measured ground reaction forces (</span><a id="c10-fig-0014a"/><a href="#c10-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">Figure 10.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">), the integral of our simulated force over time was similar to the integral of the experimentally measured ground reaction force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.2">Because the integral of force is the major determinant of jump distance, we decided that our simple model of foot–ground contact was good enough.</span></p>
<figure id="c10-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1"><img src="../images/c10-fig-0010.jpg" alt="c10-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0014a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">Figure 10.10</span></a></span> <a id="c10-para-0048"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">Horizontal (top) and vertical (bottom) ground reaction forces during the ground contact phase of a standing long jump. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.2">The simulation results generated using dynamic optimization (blue) are compared to corresponding experimental data (orange; 95 percent confidence interval, 6 jumps from each of 3 subjects; Ashby and Heegaard, 2002). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.3">Adapted from Ong et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.4">(2016).</span></p></figcaption></figure>
<p><a id="c10-para-0049"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">One of the most important and challenging comparisons to make is between simulated muscle activations and experimentally recorded EMG patterns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.2">The comparison is important because the timing of muscle activations influences the interpretation of muscle function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.3">The comparison is challenging because EMG recordings are notoriously noisy and are usually collected for only a subset of muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.4">Before Sam Hamner analyzed his simulations of running, he compared his simulated activation patterns to EMG measurements that were collected during his experiments (</span><a id="c10-fig-0015a"/><a href="#c10-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">Figure 10.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.2">There are no established criteria for determining when the match is good enough, so Sam and I had to use our best judgment to decide how to account for the uncertainty associated with his simulated activations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.3">We found good agreement between the simulated activations and measured EMG once we had considered the electromechanical delay between EMG and force production.</span></p>
<figure id="c10-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1"><img src="../images/c10-fig-0011.jpg" alt="c10-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0015a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">Figure 10.11</span></a></span> <a id="c10-para-0050"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">Simulated activations and EMG recordings of four muscles when running at 5 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.2">The delay of approximately 75 ms between measured EMG and simulated activations is consistent with the electromechanical delay between EMG and force production. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.3">Adapted from Hamner and Delp (2013).</span></p></figcaption></figure>
<p><a id="c10-para-0051"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">When Kat Steele was a student in my lab, she studied how crouch gait affects the loads in the knee joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.2">As a first step, she needed to determine whether the loads computed with her model of typical walking matched the knee loads measured by sensors that had been implanted in human knee joints during total knee replacement surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.3">When we first made these comparisons, we found that the knee loads predicted by our model were larger than loads we had measured with instrumented implants. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.4">We made adjustments to the model until we had sufficiently accurate results (</span><a id="c10-fig-0016a"/><a href="#c10-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">Figure 10.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.2">We were then confident that we could use the model to study knee loads in crouch gait.</span></p>
<figure id="c10-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1"><img src="../images/c10-fig-0012.jpg" alt="c10-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0016a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">Figure 10.12</span></a></span> <a id="c10-para-0052"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">Tibiofemoral contact force estimated in simulation (blue) and measured by an instrumented total knee replacement (TKR; orange). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.2">Mean ±1 standard deviation shown for four trials. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.3">Adapted from Steele et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.4">(2012).</span></p></figcaption></figure>
<p><a id="c10-para-0053"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">The ability to predict how much metabolic energy is consumed by each muscle during a movement is one of the most powerful features of muscle-driven simulations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.2">It is powerful because we cannot collect these data experimentally, but this presents a challenge for validating calculations of metabolic cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.3">We typically compare the sum of the energy consumed by all the muscles in the model to estimates of energy expenditure measured via indirect calorimetry (</span><a id="c10-fig-0017a"/><a href="#c10-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">Figure 10.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">).</span></p>
<figure id="c10-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1"><img src="../images/c10-fig-0013.jpg" alt="c10-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0017a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">Figure 10.13</span></a></span> <a id="c10-para-0054"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Average metabolic power consumed during typical walking and when walking while carrying a backpack of increasing mass (up to 40 percent of the subject's body weight). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.2">The total metabolic power predicted using dynamic optimization (colored bars) showed trends similar to experimental measurements of total energy consumption (black; mean ±1 standard deviation). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.3">The “basal rate” represents the energy consumed while at rest. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.4">Adapted from Dorn et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.5">(2015).</span></p></figcaption></figure>
<p><a id="c10-para-0055"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">In some studies, we wish to generate muscle-driven simulations for which experimental data would be difficult or impossible to collect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.2">For example, we may wish to evaluate hundreds of assistive device designs without constructing expensive prototypes, recruiting test subjects, or collecting experimental data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.3">In such cases, we can first simulate unassisted walking, for which experimental data are readily available for comparison, and then proceed to investigate assisted walking only once we are confident in our simulation's predictions.</span></p>
<p><a id="c10-para-0056"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1">Software tests must also be performed, such as confirming that iterative algorithms converge, numerical integration tolerances are met, and physical laws are obeyed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.2">The process of determining whether a computational model is an accurate representation of the underlying mathematical model is called </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">verification</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.2">In contrast to validation, where one asks “Am I solving the correct equations?,” the verification process involves asking “Am I solving the equations correctly?” </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.3">We perform hundreds of automated software tests every time we make a change to the OpenSim software to ensure that we are not introducing errors into the code. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.4">These tests are critical because if an algorithm has been implemented incorrectly, all resulting simulations will be wrong and the conclusions of a study will be contaminated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.5">Paradoxically, large errors are least problematic because they are easiest to detect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.6">It is the small errors that can be most pernicious: they can produce results that are plausible and can, therefore, go unnoticed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.7">Verification is facilitated by designing software in a modular fashion, where each component can be tested independently (sometimes called “unit testing”) before higher-level tests are performed on a software system.</span></p>
<p><a id="c10-para-0057"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">It is often useful to compute the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">sensitivity</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1"> of key outputs to parameters of your model that have large uncertainty. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.2">To be reliable, the conclusions of a study must be insensitive to small changes in uncertain inputs and arbitrary modeling choices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.3">As we noted in Chapter 8, all models are wrong but some are useful; we must always ensure that simulation results are useful and not merely wrong. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.4">As computational biomechanists, we are responsible for ensuring that rigorous software verification has been performed, that our models and simulations have been adequately validated, and that the results we report are insensitive to parameters with large uncertainty.</span></p></section>
<section>
<h2><a id="c10-sec-0006"/><a id="c10-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Stage 4: Analyzing muscle-driven simulations</span></h2>
<p class="paraaftertitle"><a id="c10-para-0058"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">To gain insight from muscle-driven simulations of human movement, we require more than properly validated simulations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.2">Most importantly, we must pose a question that a simulation can answer (and that an experiment cannot answer more effectively). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.3">Simulations compute many quantities that can be measured experimentally, which are useful for validation, but they also provide quantities that cannot be measured in practice. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.4">For instance, it is generally not possible to measure the force a muscle generates during a movement; in a simulation, however, muscle forces are computed by a model of muscle contraction dynamics and are readily available for analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.5">When combined with calculations of joint kinematics and muscle paths, a model of muscle contraction dynamics allows us to estimate tendon strain, another quantity that is difficult to measure </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">in vivo</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1"> and one that can play a key role in the storage and release of energy during movement.</span></p>
<p><a id="c10-para-0059"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">Simulations allow you to perform powerful analyses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.2">For example, the system of equations governing the dynamics of a model can be solved to determine the contribution of each muscle force to accelerating the model's center of mass (or any other point). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.3">This is called a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">muscle-induced acceleration analysis</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">, which uses Equation 10.1 to compute the accelerations of the body that are induced by the application of each muscle force to the skeleton. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.2">This analysis applies Newton's second law to determine the accelerations caused by each muscle force, a necessary step to establish cause–effect relationships in a biomechanical system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.3">Note that such an analysis is strictly retrospective and would not be appropriate for predicting new movements or muscle compensation strategies if, for example, a muscle were injured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.4">As we will see in Chapters 11 and 12, a muscle-induced acceleration analysis can reveal how each muscle supports the weight of the body during walking and propels you forward during running.</span></p>
<p><a id="c10-para-0060"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Simulations also reveal cause–effect relationships, such as how the compliance of the Achilles tendon affects the energetics of running, and can predict the outcome of hypothetical scenarios. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.2">Will a model run twice as fast if you double its strength? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.3">Will a model adopt a limp or crouched gait when its muscles are weakened? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.4">Simulations have begun to answer these questions.</span></p></section>
<section>
<h2><a id="c10-sec-0007"/><a id="c10-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">Software for creating muscle-driven simulations</span></h2>
<p class="paraaftertitle"><a id="c10-para-0061"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">In the early 1990s, Peter Loan and I introduced SIMM: Software for Interactive Musculoskeletal Modeling, a package that allowed users to create, alter, and analyze models of many musculoskeletal structures (Delp and Loan, 1995). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.2">Over the next decade, researchers created dozens of models of humans and animals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.3">They used these models to generate simulations of walking, running, cycling, stair climbing, and pathological gait, and studied the biomechanical consequences of surgical reconstructions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.4">SIMM facilitated discovery of principles that govern movement control and treatments for individuals with movement pathologies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.5">It became clear to me that we could accelerate research by expanding the user base and allowing users to share models and simulations more easily.</span></p>
<p><a id="c10-para-0062"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">In 2007, my colleagues and I launched the OpenSim project, an open-source software platform that extends the capabilities of SIMM (Delp et al., 2007). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.2">OpenSim's capabilities span three areas. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.3">First, users can build, manipulate, and interrogate biomechanical models (</span><a id="c10-fig-0018a"/><a href="#c10-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Figure 10.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.2">For example, bone specimens have been used to build a model of the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Australopithecus afarensis</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1"> hand to investigate whether this primate species had sufficient grip strength to make certain stone tools (Domalain et al., 2017). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.2">Second, OpenSim can enable studies that are difficult to perform experimentally, such as investigating how we exploit tendon elasticity to make running more efficient (Uchida et al., 2016a). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.3">Third, using principles of neuromuscular control and dynamic simulation, and without performing any experiments, OpenSim can predict novel movements and adaptations to novel conditions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.4">This capability has led to a deeper understanding of the role that muscles play in preventing ankle injuries (DeMers et al., 2017).</span></p>
<figure id="c10-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1"><img src="../images/c10-fig-0014.jpg" alt="c10-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c10-fig-0018a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">Figure 10.14</span></a></span> <a id="c10-para-0063"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">OpenSim can be used to generate forward dynamic and inverse dynamic simulations of movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.2">The software allows users to model a wide variety of biological and mechanical systems, including neural controllers, muscle–tendon actuators, and assistive devices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.3">Adapted from Seth, Hicks, Uchida et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.4">(2018).</span></p></figcaption></figure>
<p><a id="c10-para-0064"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">Thousands of biomechanists have shared OpenSim models, simulations, and computational tools on the </span><a href="http://simtk.org"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">simtk.org</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1"> repository, which we built to enable researchers to reproduce, validate, and extend the work of others. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.2">It is exciting for me to watch the OpenSim community grow and diversify. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.3">From running shoes to orthopedic surgeries, the greatest insights are likely to appear through collaboration among experts in a variety of domains. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.4">OpenSim provides a platform for this collaboration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.5">In the next two chapters, we will analyze simulations created in OpenSim to study the contributions of muscles to human walking and running, and will see how these simulation results have already been applied in the real world.</span></p></section>
