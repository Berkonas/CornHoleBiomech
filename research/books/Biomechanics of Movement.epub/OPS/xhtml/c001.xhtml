<header>
<h1><a id="c1-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">1</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">First Steps</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c1-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">It was already one in the morning; the rain pattered dismally against the panes, and my candle was nearly burnt out, when, by the glimmer of the half-extinguished light, I saw the dull yellow eye of the creature open; it breathed hard, and a convulsive motion agitated its limbs.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">—Mary Shelley, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Frankenstein</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1"> (1818)</span></p></blockquote>
<p><a id="c1-para-0002"/></p>
<figure id="c1-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"><img src="../images/c1-fig-5001.jpg" alt="c1-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c1-para-0003"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">when mary shelley</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1"> wrote the gothic novel that made her famous, the world was still agog over the discovery of electricity—and the shocking discovery by Luigi Galvani that electrical stimulation could cause a dead frog's muscles to twitch. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.2">It was a short leap for Shelley to imagine an entire being brought to life by a jolt of electricity.</span></p>
<p><a id="c1-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">Today, two centuries after Galvani's demonstration, technology for electrical stimulation of muscles has a profoundly positive impact on life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">Electrical defibrillators are installed in every airport, school, and hospital, and have restarted the hearts of thousands of people who would have died without a powerful shock to their heart muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">A more sophisticated technology, called functional electrical stimulation, has been developed to reanimate the muscles of people with various forms of paralysis and thus improve their quality of life.</span></p>
<p><a id="c1-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">In functional electrical stimulation, electrodes are either affixed to the skin or implanted in paralyzed muscles near the nerves that innervate them. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">Electrical impulses are transmitted through the electrodes to nerves which, in turn, cause the associated muscles to contract and generate force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">Electrical stimulation of muscles has enabled people with paralysis to stand and walk when the trunk and leg muscles are properly activated and appropriately coordinated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">In 2016, several people who had injuries to their spinal cord that resulted in paralysis from the chest down competed in a bike race as part of a new international competition called the Cybathlon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.5">The winner pedaled 750 meters in less than 3 minutes.</span></p>
<p><a id="c1-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">There is much more to functional electrical stimulation than merely delivering a jolt of electricity to the nerves and muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">In able-bodied people, the nervous system coordinates many muscles to enable us to walk, run, or ride a bike, much like a conductor coordinating the musicians of an orchestra. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">As the winner of the Cybathlon competition pedaled around the track, up to 24 channels of precisely timed stimuli could be delivered to coordinate the forces generated by his otherwise paralyzed muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">Even with this level of complexity, the results were less than perfect. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">We still have much to learn about how our muscles work together to create the music of movement.</span></p>
<p><a id="c1-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">In this book, we will explore this magnificent symphony. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">We will examine the movement of humans and animals through the lens of mechanics to understand the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">biomechanics of movement</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">We will use simple conceptual models to answer questions like why walking and running are efficient forms of locomotion, why astronauts adopt a bounding gait on the moon, and how running tracks and shoes can increase performance while reducing injuries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">We will examine the structure of a muscle down to its microscopic force-generating motors and see precisely how electrical stimulation causes muscles to contract. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.4">We will describe sophisticated computational tools for generating simulations of movement, which in turn allow us to estimate the muscle forces responsible for producing this movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.5">Such simulations show us how we coordinate our muscles when walking, running, or cycling. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.6">Indeed, muscle-driven simulations were a valuable tool for the gold medal team in the Cybathlon.</span></p>
<p><a id="c1-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">Throughout the book, we emphasize established theories to provide a foundation for understanding movement biomechanics and include innovations in areas like computer simulation, mobile motion monitoring, and wearable robotics that build on these fundamentals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">Many recent advances were foreseen by science fiction and provide glimpses of new technologies we imagine for the future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">Some of these visions may seem as fantastical as awakening Frankenstein's Creature; others are well within sight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">Either way, we are just opening our eyes to the potential of this exciting field.</span></p>
<section>
<h2><a id="c1-sec-0001"/><a id="c1-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Why we study movement</span></h2>
<p class="paraaftertitle"><a id="c1-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Movement is fascinating and fundamental to life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Our bodies are amazingly versatile, exhibiting both strength and dexterity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">Movement is vital for maintaining physical and psychological health. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.4">Regular physical activity helps prevent heart disease, cancer, osteoporosis, obesity, diabetes, depression, anxiety, and other serious illnesses, yet less than half of the world's population is sufficiently active to maintain their physical and mental health. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.5">Physical activity is potent and inexpensive medicine that can have profound health benefits, even in small doses. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.6">In studying the biomechanics of movement, we seek to understand the biological structures and processes involved in producing movement, and to apply this knowledge to improve mobility, physical activity, and health.</span></p>
<p><a id="c1-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">The field of movement biomechanics has a rich history. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">As with many human pursuits, advances have been driven by a desire to improve our lives coupled with an innate curiosity about our environment and ourselves. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.3">Aristotle wrote the first book that examined the general principles of animal locomotion, aptly titled </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">On the Motion of Animals</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">, around 350 bce. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">He and other ancient Greeks thought that muscles contract when they are inflated by </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">pneuma</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">, the “breath of life” flowing through our nerves.</span></p>
<p><a id="c1-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Countless scholars have since advanced the field, some of whom are featured in this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">Among the pioneers of biomechanics are Leonardo da Vinci (1452–1519), who produced hundreds of detailed anatomical drawings and who studied the mechanical function of the musculoskeletal system (</span><a id="c1-fig-0002a"/><a href="#c1-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Figure 1.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.2">Giovanni Borelli (1608–1679) was the first to apply the laws of mechanics to relate the force exerted by a muscle to the moment it generates about a joint (</span><a id="c1-fig-0003a"/><a href="#c1-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Figure 1.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">Borelli, however, still held to the classical view that muscles contract by a pneumatic, inflationary process. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">This theory was refuted by Nicolas Steno (1638–1686), a rival of Borelli in the Florentine court, who pointed out that muscle retains a constant volume while contracting—a paradox that we will examine in Chapter 4. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.4">Later, Luigi Galvani (1737–1798) discovered the previously unsuspected ability of electrical signals to generate muscular contraction, essentially founding our modern field of electrophysiology. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.5">Finally, I cannot fail to mention Eadweard Muybridge (1830–1904), who performed early photographic studies of human and animal movement about a kilometer from my home on what is now the Stanford University campus. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.6">Muybridge's photos are fascinating to look at even today, and they were a landmark in the history of both film and biomechanics (</span><a id="c1-fig-0004a"/><a href="#c1-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Figure 1.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">Indeed, the technology of filmmaking and the science of biomechanics still advance hand in hand.</span></p>
<figure id="c1-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1"><img src="../images/c1-fig-0001.jpg" alt="c1-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">Figure 1.1</span></a></span> <a id="c1-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Page from Leonardo da Vinci's notebook showing his concept of muscle lines of force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">Image courtesy of the Royal Collection Trust.</span></p></figcaption></figure>
<figure id="c1-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1"><img src="../images/c1-fig-0002.jpg" alt="c1-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0003a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Figure 1.2</span></a></span> <a id="c1-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Static analysis of human muscles and joints by Giovanni Borelli, often described as the father of biomechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">Image from </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">De motu animalium</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">.</span></p></figcaption></figure>
<figure id="c1-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"><img src="../images/c1-fig-0003.jpg" alt="c1-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">Figure 1.3</span></a></span> <a id="c1-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Sequence of photographs from Eadweard Muybridge, a pioneer in motion capture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.2">Images courtesy of Stanford University.</span></p></figcaption></figure>
<p><a id="c1-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Today, biomechanics is a rapidly growing, multidisciplinary field involving collaborations between individuals from many areas of science and engineering. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.2">Biologists use insights from biomechanics to understand the relationship between form and function in animals: for example, how a lizard leaps and grabs onto a wall (</span><a id="c1-fig-0005a"/><a href="#c1-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Figure 1.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">) or whether </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">Tyrannosaurus rex</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1"> was capable of running (Chapter 3). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">Neuroscientists study how the brain coordinates our muscles during movement and how these neural circuits are disrupted in cases of injury and disease. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">Surgeons can use biomechanical models to determine whether a patient with cerebral palsy will benefit from tendon lengthening surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.4">Roboticists are inventing prostheses that are increasingly sophisticated (</span><a id="c1-fig-0006a"/><a href="#c1-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Figure 1.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">) and bipedal robots that can perform complex tasks in dangerous environments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.2">Sports scientists analyze athletic movements, such as the “Fosbury flop” high-jump technique (Chapter 9), to learn how to increase performance and prevent injuries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.3">Computer scientists and biomechanical engineers develop new algorithms and software tools to simulate movements and gain insights from these simulations.</span></p>
<figure id="c1-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"><img src="../images/c1-fig-0004.jpg" alt="c1-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0005a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">Figure 1.4</span></a></span> <a id="c1-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">The red-headed agama uses its tail to control its body orientation during flight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.2">The lizard prepares to grab the vertical wall at right by rotating its tail clockwise, which orients its body vertically through conservation of angular momentum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.3">Image courtesy of Robert Full.</span></p></figcaption></figure>
<figure id="c1-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1"><img src="../images/c1-fig-0005.jpg" alt="c1-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0006a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Figure 1.5</span></a></span> <a id="c1-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Highly functional prosthetic hands are now within reach. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.2">Image courtesy of Johns Hopkins University.</span></p></figcaption></figure>
<p><a id="c1-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">Biomechanics plays a role even outside the world of science. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">Filmmakers use biomechanics and motion capture techniques to create computer-generated imagery for games and movies that range in style from fantastical to photorealistic (</span><a id="c1-fig-0007a"/><a href="#c1-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">Figure 1.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.2">The results marry beauty with scientific accuracy in a way that would have been hard to imagine a generation or two ago.</span></p>
<figure id="c1-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1"><img src="../images/c1-fig-0006.jpg" alt="c1-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">Figure 1.6</span></a></span> <a id="c1-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Image from the movie </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Avatar</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> and the performance artist Jenn Stafford, whose motions were recorded with motion capture to produce computer-generated imagery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">Images courtesy of Twentieth Century Fox.</span></p></figcaption></figure>
<p><a id="c1-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Collectively, these efforts have benefited our lives immensely. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">We now have recommendations for the daily physical activity levels we require to stay healthy, and we have access to tools that help us achieve our fitness goals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.3">Assembly lines, office furniture, and many consumer products are designed ergonomically to improve comfort and prevent injury. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.4">Products and procedures have been designed to replace hip and knee joints, reducing pain and restoring function to millions of people with osteoarthritis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.5">Powered exoskeletons are revolutionizing post-stroke rehabilitation and can enable locomotion in individuals with paralysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.6">Movement disorders such as Parkinson's disease have been successfully treated using deep brain stimulation, in which implanted electrodes deliver electrical impulses to specific regions of the brain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.7">Epidural stimulation, a technology that activates neural circuits in the spinal cord, has recently shown promise for helping to restore voluntary movement to individuals with spinal cord injuries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.8">Athletes are benefiting from equipment and training programs designed to reduce injury risk while enhancing performance (</span><a id="c1-fig-0008a"/><a href="#c1-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Figure 1.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">).</span></p>
<figure id="c1-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"><img src="../images/c1-fig-0007.jpg" alt="c1-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Figure 1.7</span></a></span> <a id="c1-para-0021"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Biomechanical studies help create sports equipment that maximizes athletic performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">The hinge between the boot and blade of this skate prolongs contact between the blade and the ice, increasing the duration of propulsive force to increase speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.3">Image courtesy of McSmit.</span></p></figcaption></figure></section>
<section>
<h2><a id="c1-sec-0002"/><a id="c1-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">The Cybathlon</span></h2>
<p class="paraaftertitle"><a id="c1-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">The impact of biomechanics can perhaps be best appreciated by looking more closely at a compelling example—the Cybathlon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">In 2016, Robert Riener, a professor at ETH Zurich (the Swiss Federal Institute of Technology), organized the first Cybathlon, an innovative merger of science and athletics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.3">Unlike the Paralympics, it had events that focused on everyday tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.4">For example, people with prosthetic arms competed at carrying objects, slicing bread, opening a jar, and hanging laundry. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.5">People with prosthetic legs competed at climbing ramps and ascending a staircase while balancing a cup on a saucer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.6">To emphasize that the competition was about the interface between humans and technology, the competitors were called pilots rather than athletes.</span></p>
<p><a id="c1-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">The most traditional sporting event in this untraditional competition was the bicycle race for people with paralysis of the legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">The gold medal went to a team from Case Western Reserve University, under the scientific leadership of Ronald Triolo. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.3">The team's pilot was Mark Muhn (</span><a id="c1-fig-0009a"/><a href="#c1-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">Figure 1.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">), who had injured his spinal cord in a ski accident in 2008 and was paralyzed from the chest down.</span></p>
<figure id="c1-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1"><img src="../images/c1-fig-0008.jpg" alt="c1-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Figure 1.8</span></a></span> <a id="c1-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Mark Muhn competing at the Cybathlon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.2">Image courtesy of Paul and Gabrielle Marasco.</span></p></figcaption></figure>
<p><a id="c1-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">The team at Case Western had been doing research on functional electrical stimulation for forty years and developed the first implanted neuromuscular stimulators. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">Triolo believed that their experience with implanted electrodes would be a winning advantage, because the other teams would be using electrodes that transmit electrical signals through the skin. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.3">Implanted electrodes allow stimulation to be more specific about which muscles are activated, and the resulting muscle contractions can be stronger.</span></p>
<p><a id="c1-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">The team maximized their chances of winning in several ways (McDaniel et al., 2017). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">They purchased a recumbent bike and stripped it down, removing all nonessential weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.3">They put their pilots (originally five, of whom two were selected to go to Zurich) through an intensive training program. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.4">Of most interest to us is their use of biomechanical models (</span><a id="c1-fig-0010a"/><a href="#c1-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Figure 1.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">).</span></p>
<figure id="c1-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"><img src="../images/c1-fig-0009.jpg" alt="c1-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0010a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Figure 1.9</span></a></span> <a id="c1-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Example of a muscle-driven biomechanical model used to tune muscle excitation patterns to produce cycling.</span></p></figcaption></figure>
<p><a id="c1-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">Triolo says that the models, similar to the ones we describe later in this book, were helpful in two ways: first, to eliminate “dead ends” (ideas that wouldn't work), and second, to optimize the electrical stimulation patterns provided to the pilot. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">Every contraction of every leg muscle was controlled by an external control unit, a box strapped to the pilot's waist. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">For safety, the pilot controlled whether the box was switched on or off.</span></p>
<p><a id="c1-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">To obtain the stimulation pattern, the team took biomechanical models of cycling motion from the literature and customized them to the characteristics of each pilot. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">Customization was important because the properties of muscle change after paralysis, and the number of muscles that can be activated with stimulation is small, so the activation pattern that would work for an able-bodied cyclist might not work for stimulation-driven pedaling in someone with a spinal cord injury. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.3">Musa Audu led the effort to model and customize the stimulation patterns for each pilot, and employed techniques described in Chapter 10 to estimate the timing and intensity of the activation of each muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.4">It is worth noting that the stimulation pattern never changed during the race. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.5">As the pilot's muscles fatigued, his legs would keep pumping at the same rate, but they would not be able to push as hard so the pilot had to shift gears to keep the bike going.</span></p>
<p><a id="c1-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">In fact, the pilots tired rapidly because functional electrical stimulation does not recruit muscle fibers in the same way that natural signals from the brain do. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.2">We will review this phenomenon in Chapter 4, but for now it suffices to say that most naturally occurring movements are generated by recruiting “slow-twitch” muscle fibers first (which are relatively small and fatigue-resistant), followed by “fast-twitch” fibers (which produce larger forces but tire quickly). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.3">However, electrical stimulation recruits muscle fibers in the opposite order. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.4">As a result of this “reverse recruitment,” the pilots could scarcely keep the bike going for more than a minute when they began their training.</span></p>
<p><a id="c1-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">But something unexpected came to the rescue—the pilots loved the outdoor exercise that race-ready bikes provided, compared to the humdrum labor of stationary bikes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.2">And exercise training can make the paralyzed muscles stronger. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.3">With the pilots motivated to improve, after 5 months of training they were able to keep cycling for a 3-minute race. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.4">In future years, Triolo says he would like to come up with a technological solution for the recruitment reversal issue, but in 2016 there was only one solution: to “exercise the heck out of our pilots.” </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.5">And it worked! </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.6">In Zurich, Muhn finished the 750-meter course in 2 minutes and 58 seconds, and won the gold medal.</span></p>
<p><a id="c1-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">The Cybathlon experience changed Muhn's life, and perhaps more surprisingly, it changed Triolo's research. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.2">Previously, Triolo says, their approach to rehabilitation had been task-oriented. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.3">They focused on getting their volunteers to stand and walk or perform activities of daily living, like dressing and cooking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.4">But when their participants rode their bikes outside, and started having fun while exercising, it changed everything. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.5">They exercised more, and it paid huge dividends for all aspects of their rehabilitation, including boosting their self-esteem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.6">While one pilot was riding his bike on a public trail, another cyclist caught up to him and said, “Nice wheels.” </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.7">It was practically the first time that a stranger saw him not as a person with a disability, but as a person with a cool bike.</span></p></section>
<section>
<h2><a id="c1-sec-0003"/><a id="c1-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Tools to study movement</span></h2>
<p class="paraaftertitle"><a id="c1-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">One of my goals in this book is to familiarize you with the muscle-driven biomechanical models that my team and others have developed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.2">It is important to realize that these models are informed by experimental data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.3">Let's take a look at the types of data we collect.</span></p>
<p><a id="c1-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">A common technique for analyzing movement is to record video of individuals in research labs and clinics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.2">Many of these recordings are obtained with infrared cameras that track markers affixed to the skin, similar to the technology used in filmmaking (</span><a id="c1-fig-0011a"/><a href="#c1-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Figure 1.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.2">Recently, motion capture techniques that do not require markers have become more popular. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.3">Video-based systems are widely available, but the prevalence of these systems has been eclipsed by inertial measurement units (IMUs), which are now integrated into smartphones, wearable activity monitors, and clothing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.4">IMUs enable collection of movement data (velocities and accelerations) in natural environments and over long durations, which can be valuable for monitoring disease progression and planning treatments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.5">The availability of IMUs in low-cost activity monitors is also enabling large-scale studies of millions of individuals across the globe (</span><a id="c1-fig-0012a"/><a href="#c1-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">Figure 1.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">).</span></p>
<figure id="c1-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"><img src="../images/c1-fig-0010.jpg" alt="c1-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0011a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">Figure 1.10</span></a></span> <a id="c1-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Trajectories of markers affixed to the skin, captured during a front handspring (2.9-second duration). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.2">The subject was initially standing (far left), then skipped forward, flipped over his hands planted on the floor (center), landed on his feet, and took one hop to regain his balance (far right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.3">Spheres that are further apart indicate that the marker was moving faster. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.4">Data from ACCAD (2018).</span></p></figcaption></figure>
<figure id="c1-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1"><img src="../images/c1-fig-0011.jpg" alt="c1-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">Figure 1.11</span></a></span> <a id="c1-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Smartphone data from over 68 million days of activity by 717,527 individuals reveal variability in physical activity across 111 countries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.2">Image adapted from Althoff et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.3">(2017), the world's largest survey of physical activity.</span></p></figcaption></figure>
<p><a id="c1-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">When performed in the lab or clinic, experiments may involve several pieces of specialized equipment beyond a motion capture system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.2">We often use force plates to measure the forces between the feet and the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.3">In studies of walking and running, it is convenient to use a treadmill so that the subject remains within the volume that can be accurately measured by the motion capture system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.4">Some treadmills are instrumented to measure ground reaction forces as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.5">Electromyography is used to measure the timing and intensity of activity in various muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.6">We may monitor a runner's breathing, measuring the amounts of oxygen consumed and carbon dioxide produced, to estimate the metabolic energy required to run. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.7">The proliferation of imaging technologies, such as magnetic resonance imaging and fluoroscopic imaging, has enabled us to see inside an animal or human body in motion, providing a powerful tool to visualize and measure movement.</span></p>
<p><a id="c1-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">Conceptual models can be powerful analytical tools, as we will see throughout the book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.2">Chapters 2 and 3, for instance, show how a simple pendulum model gives us a reasonable facsimile of walking, and a mass–spring model can give us important insights about running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.3">A simple model that gets the job done is almost always preferable to a more complicated version, the latter providing similar utility but being more difficult to construct and understand. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.4">Of course, not all complex phenomena can be represented with simple mechanical models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.5">As we will see in Chapters 11 and 12, muscle-driven simulations are powerful tools that can fill in many of the details that are missing from the simple models of Chapters 2 and 3.</span></p>
<p><a id="c1-para-0039"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">Computer simulations that represent the dynamics of movement complement experiments by calculating quantities that cannot be directly measured and by predicting movement in hypothetical scenarios. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">Simulations can be useful for understanding injuries, for example, which are difficult to study experimentally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.3">We may also estimate the muscle forces that are responsible for an observed motion, as well as joint loads, tendon strains, and other quantities that cannot be measured. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.4">In a </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">forward dynamic</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1"> simulation, we prescribe a pattern of neural activation of one or several muscles, and then predict the resulting motion of a musculoskeletal model (</span><a id="c1-fig-0013a"/><a href="#c1-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">Figure 1.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.2">Experimental data are required to develop and test the mathematical models of musculoskeletal dynamics that are used in simulations of movement, and to evaluate the degree to which simulations reflect reality.</span></p>
<figure id="c1-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1"><img src="../images/c1-fig-0012.jpg" alt="c1-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0013a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Figure 1.12</span></a></span> <a id="c1-para-0040"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Elements of a typical </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">forward dynamic</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"> simulation. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.2">Movement arises from a complex orchestration of the neural, muscular, skeletal, and sensory systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.3">Computational models of these systems enable us to predict and analyze human and animal movement.</span></p></figcaption></figure>
<p><a id="c1-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">The reverse process is often used when we have measurements of the motion of a test subject and we want to convert these data into meaningful insights, such as what forces must have been generated by the muscles to produce the measured motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.2">For this we need an </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">inverse dynamic</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1"> analysis, a common analytical strategy that combines experimental data with musculoskeletal models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.2">The first step is to use a biomechanical model of the body to convert measurements of marker positions, as shown in </span><a href="#c1-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Figure 1.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">, into joint angles through a process called inverse kinematics (</span><a id="c1-fig-0014a"/><a href="#c1-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Figure 1.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.2">The joint angles are differentiated with respect to time to estimate joint angular velocities and accelerations, which are used with measurements of the external forces applied to the body to estimate joint moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.3">A biomechanical model is then used with an optimization algorithm to estimate muscle forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.4">We call this strategy an inverse analysis because measurements of motion are used to deduce what forces must have been present to produce those motions.</span></p>
<figure id="c1-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1"><img src="../images/c1-fig-0013.jpg" alt="c1-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0014a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">Figure 1.13</span></a></span> <a id="c1-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Elements of a typical </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">inverse dynamic</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1"> analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.2">The analysis begins with measurements of marker trajectories and external forces (right) and uses a biomechanical model to estimate the angles, velocities, and accelerations of the body segments and joints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.3">An inverse dynamic model and optimization procedure produce estimates of joint moments and muscle forces.</span></p></figcaption></figure></section>
<section>
<h2><a id="c1-sec-0004"/><a id="c1-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Overview of this book</span></h2>
<p class="paraaftertitle"><a id="c1-para-0043"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">In the chapters that follow, we begin by studying the two common forms of human locomotion, walking and running, using simple conceptual models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.2">We then explore the production of movement by examining the biology and architecture of skeletal muscle, its dynamic interaction with tendon, and how muscles generate the forces that animate the skeleton. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.3">Next, we examine the models and algorithms used to analyze movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.4">We demonstrate methods to compute joint angles, joint moments, and individual muscle forces from motion capture data and biomechanical models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.5">Finally, we synthesize these concepts to study the roles of muscles during walking and running, and conclude with some ideas about where I think the field is headed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.6">As shown in </span><a id="c1-fig-0015a"/><a href="#c1-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Figure 1.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">, the material has been arranged into four parts, and I encourage readers to think of the book in this way. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.2">Thus, Chapter 4 (the beginning of Part II) is not exactly a sequel to Chapter 3, but Chapter 5 definitely picks up where Chapter 4 ends. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.3">The material will have more meaning for you if you keep this in mind.</span></p>
<figure id="c1-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1"><img src="../images/c1-fig-0014.jpg" alt="c1-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c1-fig-0015a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Figure 1.14</span></a></span> <a id="c1-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Organization of this book.</span></p></figcaption></figure>
<p><a id="c1-para-0045"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">While we focus primarily on human locomotion, the fundamental concepts we describe can be used to understand the motion of animals and robots as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.2">The material covered here will allow you to understand the fantastic and broad scientific literature that provides detailed analyses of more topics than could be covered in a single book.</span></p></section>
<section>
<h2><a id="c1-sec-0005"/><a id="c1-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">Language of movement</span></h2>
<p class="paraaftertitle"><a id="c1-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">I would like to explain what you should know to get the most out of this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.2">Tom and I have written the book for readers who are familiar with certain engineering fundamentals. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.3">Mathematics and mechanics provide a precise framework for analyzing movement, and we assume a basic understanding of vectors and matrices. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.4">We further assume that the reader is familiar with free-body diagrams, deriving equations of motion, and solving these equations for simple systems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.5">If these topics are unfamiliar, you should be prepared to spend some extra time with them when they come up.</span></p>
<p><a id="c1-para-0047"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">On the biological side, a background in human anatomy and physiology is helpful but not required. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.2">For those readers who are not familiar with anatomy, the figures that follow illustrate the terminology that will be used throughout this book. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.3">These terms include the anatomical planes and directions (</span><a id="c1-fig-0016a"/><a href="#c1-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">Figure 1.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">), joint motions (</span><a id="c1-fig-0017a"/><a id="c1-fig-0018a"/><a href="#c1-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Figures 1.16 and 1.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">), and major bones and muscles (</span><a id="c1-fig-0019a"/><a id="c1-fig-0020a"/><a href="#c1-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Figures 1.18 and 1.19</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.2">This nomenclature may look intimidating at first, but a few minutes spent studying these figures and learning these words now will serve you well.</span></p>

<p><a id="c1-para-0053"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">This book is only the start of what I hope will be a continuing journey for you. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.2">Our dream is that you will build on the material assembled here, adding your unique spark of creativity to discover something about nature and invent something that enriches the lives of others.</span></p></section>
