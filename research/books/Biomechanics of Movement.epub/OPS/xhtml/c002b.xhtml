<p><a id="c2-para-0072"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">Notice that the model shown in </span><a href="#c2-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">Figure 2.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1"> is three-dimensional. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.2">As we have seen, walking is a three-dimensional activity, and non-sagittal-plane motions and forces must be analyzed to understand balance and body-weight support. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.3">A variety of methods are available to measure these three-dimensional motions, which we describe in Chapter 7. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.4">We can use these methods to estimate the motions of human subjects during walking, which we present next.</span></p></section>
<section>
<h2><a id="c2-sec-0009"/><a id="c2-title-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">Kinematics of walking</span></h2>
<p class="paraaftertitle"><a id="c2-para-0073"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">The pelvis undergoes a complex motion during walking (</span><a id="c2-fig-0027a"/><a href="#c2-fig-0027"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">Figure 2.18</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.2">In the frontal plane, as the limb is loaded in early stance, the pelvis tips down on the swing side. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.3">The range of this motion nearly doubles from about 5 degrees at low walking speeds to about 10 degrees at high speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.4">In the transverse plane, the pelvis rotates toward the advancing limb; thus, the hip of the lead limb is in front of the hip of the trailing limb. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.5">This motion also increases with speed and provides a mechanism for increasing step length.</span></p>
<figure id="c2-fig-0027"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1"><img src="../images/c2-fig-0018.jpg" alt="c2-fig-0018.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0027a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">Figure 2.18</span></a></span> <a id="c2-para-0074"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">Representative pelvis orientations over the gait cycle when walking at several speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.2">Averaged over 10 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.3">Vertical lines on the horizontal axis indicate toe off at each speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.4">Data from Arnold et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.5">(2013).</span></p></figcaption></figure>
<p><a id="c2-para-0075"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">The joints of the lower limb also move in stereotypical patterns (</span><a id="c2-fig-0028a"/><a href="#c2-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">Figure 2.19</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.2">At foot contact, the hip is in flexion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.3">During the stance phase the hip extends, reaching peak extension just prior to toe off, and then flexes during the swing phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.4">The knee is fully extended at foot contact. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.5">As the limb is loaded, the knee flexes and then extends, like a shock absorber, with larger flexion at higher speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.6">Just prior to swing, the knee flexes rapidly, reaching peak flexion near mid-swing, and then extends rapidly to reach full extension before the next foot contact. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.7">The ankle is in a neutral position at foot contact. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.8">The ankle plantarflexes as the foot rotates toward the ground and then dorsiflexes as the tibia passes over the foot during early stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.9">Near the end of the stance phase, the ankle plantarflexes rapidly, reaching a peak at approximately the time of toe off. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.10">As walking speed increases, peak joint angles generally increase, and the fraction of the gait cycle spent in stance decreases.</span></p>
<figure id="c2-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1"><img src="../images/c2-fig-0019.jpg" alt="c2-fig-0019.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0028a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">Figure 2.19</span></a></span> <a id="c2-para-0076"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">Joint motions over the gait cycle when walking at several speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.2">Averaged over 10 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.3">Vertical lines on the horizontal axis indicate toe off at each speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.4">Data from Arnold et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.5">(2013).</span></p></figcaption></figure></section>
<section>
<h2><a id="c2-sec-0010"/><a id="c2-title-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">Ground reaction forces and walking speed</span></h2>
<p class="paraaftertitle"><a id="c2-para-0077"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">The ground reaction forces during walking are shown in </span><a id="c2-fig-0029a"/><a href="#c2-fig-0029"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">Figure 2.20</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.2">At high speed, the vertical component of the ground reaction force rises rapidly after foot contact and has a characteristic double-humped shape. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.3">We saw a similar shape in </span><a href="#c2-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">Figures 2.4–2.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.2">The humps become more pronounced as speed increases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.3">The first hump of the ground reaction force arises from the muscles of the leading limb that support body weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.4">The second hump of the ground reaction force arises from the muscles of the trailing limb during push off. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.5">These reaction forces provide insight into the acceleration of the center of mass, but experiments alone cannot tell us which muscles are responsible for generating the measured ground reaction forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.6">We will examine how muscles coordinate walking and generate the ground reaction forces in Chapter 11.</span></p>
<figure id="c2-fig-0029"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1"><img src="../images/c2-fig-0020.jpg" alt="c2-fig-0020.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0029a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1">Figure 2.20</span></a></span> <a id="c2-para-0078"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1">Representative ground reaction forces over the gait cycle when walking at several speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.2">Normalized by body weight and averaged over 10 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.3">Data from Arnold et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.4">(2013).</span></p></figcaption></figure>
<p><a id="c2-para-0079"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">The data shown in </span><a href="#c2-fig-0027"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">Figures 2.18–2.20</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1"> are freely available for download from </span><a href="http://simtk.org"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">simtk.org</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.2">Normative data such as these are valuable for quantifying aberrations in a subject's gait and for testing the accuracy of models and simulations of movement.</span></p></section>
<section>
<h2><a id="c2-sec-0011"/><a id="c2-title-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">Atypical gait</span></h2>
<p class="paraaftertitle"><a id="c2-para-0080"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1">Humans can walk smoothly and efficiently using the mechanisms discussed in this chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.2">However, injuries to the body or brain and diseases of the joints or muscles can disrupt walking dynamics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.3">For example, individuals with cerebral palsy, a movement disorder that arises from damage to the brain, frequently walk with a crouch gait (</span><a id="c2-fig-0030a"/><a href="#c2-fig-0030"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">Figure 2.21</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.2">Crouch gait is characterized by excessive flexion of the knee during the stance phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.3">Excessive knee flexion is problematic because it increases forces in the knees during stance, impedes toe–ground clearance during swing, and dramatically increases energy expenditure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.4">(Try walking in a crouch gait for two minutes to see whether you get out of breath.) Excessive knee flexion typically worsens over time in individuals with cerebral palsy, often leading to altered knee joint mechanics and chronic knee pain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.5">In severe cases, knee flexion may become so great that the person loses the ability to walk entirely.</span></p>
<figure id="c2-fig-0030"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1"><img src="../images/c2-fig-0021.jpg" alt="c2-fig-0021.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0030a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1">Figure 2.21</span></a></span> <a id="c2-para-0081"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">Crouch gait is characterized by excessive knee flexion during stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.2">Average knee flexion angle is plotted over one gait cycle for subjects who walked with an unimpaired gait and for subjects with cerebral palsy who walked with mild, moderate, and severe crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.3">At left, Rachel Jackson demonstrates walking with a moderate level of crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.4">Plot adapted from Steele et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.5">(2012).</span></p></figcaption></figure>
<p><a id="c2-para-0082"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1">Many persons with cerebral palsy, as well as individuals who have had a stroke, walk with a stiff-knee gait in which swing-phase knee flexion is diminished and delayed (</span><a id="c2-fig-0031a"/><a href="#c2-fig-0031"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">Figure 2.22</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.2">This gait pattern also hinders toe–ground clearance and can result in tripping or require compensatory movements that are energetically inefficient. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.3">Stiff-knee gait is thought to be caused primarily by inappropriate activity of the rectus femoris muscle, which crosses in front of the knee via the patella and produces a knee extension moment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.4">Accordingly, stiff-knee gait is often treated with a rectus femoris transfer surgery in which the attachment of this muscle is relocated from the patella to a site that decreases the muscle's ability to generate a knee extension moment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.5">Unfortunately, outcomes of the rectus femoris transfer surgery are inconsistent: some individuals show substantial improvement in their swing-phase knee flexion after surgery, but others show little change.</span></p>
<figure id="c2-fig-0031"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1"><img src="../images/c2-fig-0022.jpg" alt="c2-fig-0022.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0031a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1">Figure 2.22</span></a></span> <a id="c2-para-0083"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">Stiff-knee gait is characterized by diminished and delayed knee flexion during swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.2">Knee flexion angle over the gait cycle is shown for individuals walking with stiff-knee gait compared to unimpaired gait (mean ±1 standard deviation). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.3">At left, Scott Uhlrich demonstrates walking with stiff-knee gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.4">Plot adapted from Fox et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.5">(2009).</span></p></figcaption></figure>
<p><a id="c2-para-0084"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1">It is not possible to understand the causes of crouch gait or stiff-knee gait simply by examining joint kinematics, because measurements of a motion do not establish what caused the motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.2">As we will see in Chapter 11, muscle-driven simulations of walking can provide insights for understanding the causes of crouch gait and stiff-knee gait, and can be used to design effective treatments.</span></p></section>
<section>
<h2><a id="c2-sec-0012"/><a id="c2-title-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">Changes in walking under various conditions</span></h2>
<p class="paraaftertitle"><a id="c2-para-0085"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">Walking is a stereotypical activity, which means that we can learn a great deal about it from simple models and average experimental data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.2">Nevertheless, there is no single ideal gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.3">We all have had the experience of recognizing a friend from a distance just by the way he or she walked. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.4">In addition, there are many variations of walking that are completely “normal” adaptations to different circumstances. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.5">People walk differently when going slower or faster, carrying groceries, trekking uphill, marching in a parade, or wearing high-heeled shoes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.6">We can also observe changes in walking dynamics when wearing robotic systems that have been optimized to decrease the energy we consume during walking. </span><a id="c2-tbl-0001a"/><a href="#c2-tbl-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1">Table 2.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1"> lists some of the changes that have been observed when walking in various conditions, all of which increase the cost of transport, with the exception of walking downhill. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.2">There are, of course, many more changes that have been observed during walking in steady-state conditions as well as transient conditions like gait initiation, turning, and accelerating.</span></p>
<figure><figcaption class="tablecaption"><a id="c2-tbl-0001"/><span class="figureLabel"><a href="#c2-tbl-0001a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1">Table 2.1</span></a></span> <a id="c2-para-0086"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1">Changes observed when walking in various conditions</span></figcaption>
<div>
<table border="1"><thead>
<tr>
<td><a id="c2-para-0087"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">Condition</span></td>
<td><a id="c2-para-0088"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">Observed changes</span></td></tr></thead><tbody>
<tr>
<td><a id="c2-para-0089"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">Slow</span></td>
<td><a id="c2-para-0090"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1">Decreased knee flexion during stance and swing, modulation of ground reaction force, and muscle activity</span></td></tr>
<tr>
<td><a id="c2-para-0091"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">Fast</span></td>
<td><a id="c2-para-0092"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1">Increased knee flexion during stance and swing, modulation of ground reaction force, and muscle activity</span></td></tr>
<tr>
<td><a id="c2-para-0093"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">Crouch gait</span></td>
<td><a id="c2-para-0094"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">Increased knee flexion during stance, commonly accompanied by increased hip flexion</span></td></tr>
<tr>
<td><a id="c2-para-0095"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">Stiff-knee gait</span></td>
<td><a id="c2-para-0096"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">Decreased and delayed peak knee flexion in swing</span></td></tr>
<tr>
<td><a id="c2-para-0097"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">Drop foot</span></td>
<td><a id="c2-para-0098"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1">Decreased ankle dorsiflexion in swing</span></td></tr>
<tr>
<td><a id="c2-para-0099"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">Equinus gait</span></td>
<td><a id="c2-para-0100"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Increased ankle plantarflexion in stance (walking on the toes)</span></td></tr>
<tr>
<td><a id="c2-para-0101"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">High-heeled shoes</span></td>
<td><a id="c2-para-0102"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">Increased ankle plantarflexion, knee flexion, and loading rate on the supporting limb</span></td></tr>
<tr>
<td><a id="c2-para-0103"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">Uphill</span></td>
<td><a id="c2-para-0104"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1">Increased hip flexion, knee flexion, and ankle dorsiflexion during stance</span></td></tr>
<tr>
<td><a id="c2-para-0105"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">Downhill</span></td>
<td><a id="c2-para-0106"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">Increased ankle plantarflexion during early stance; increased hip and knee flexion during late stance</span></td></tr>
<tr>
<td><a id="c2-para-0107"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">Slippery surface</span></td>
<td><a id="c2-para-0108"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">Decreased angular velocity of the foot at initial contact, loading rate on the supporting limb, and stride length</span></td></tr>
<tr>
<td><a id="c2-para-0109"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1">Carrying a backpack</span></td>
<td><a id="c2-para-0110"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">Increased stance duration, peak flexion angles during stance, ground reaction force, and muscle activity</span></td></tr>
<tr>
<td><a id="c2-para-0111"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">Added leg mass</span></td>
<td><a id="c2-para-0112"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">Increased cost of transport, with larger increases for more distal mass location; increased activity in muscles that initiate swing</span></td></tr>
<tr>
<td><a id="c2-para-0113"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">Obesity</span></td>
<td><a id="c2-para-0114"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">Increased step width, ground reaction force, and sagittal-plane net muscle moments during stance</span></td></tr>
<tr>
<td><a id="c2-para-0115"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">Below-knee prosthesis</span></td>
<td><a id="c2-para-0116"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">Increased hip extensor activity during early and midstance</span></td></tr></tbody></table></div></figure>
<p><a id="c2-para-0117"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">Humans are efficient walkers. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.2">In the best case, we simply fall forward and then step to catch ourselves from falling, injecting a little energy to make the transition between steps and to swing our legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.3">Yet there are many cases in which walking is impaired, which can limit activities of daily living. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.4">Walking is the primary form of physical activity for billions of individuals, and there are severe health consequences when physical activity is limited. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.5">To help restore and improve walking in the face of neurological and musculoskeletal diseases, it is essential to have a deep understanding of walking dynamics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.6">This chapter has just scratched the surface. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.7">Later, we will examine the actions of muscles in normal and impaired walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.8">For now, we transition from walking to running.</span></p></section>
