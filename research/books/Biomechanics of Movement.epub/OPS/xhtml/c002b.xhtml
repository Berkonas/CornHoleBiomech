<section epub:type="chapter" role="doc-chapter">
<header>
<h1><a id="c2-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">2</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Walking</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c2-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">With each step, you fall forward slightly</span></p>
<p class="quote-epigraphpara"><a id="c2-para-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">And then catch yourself from falling</span></p>
<p class="quote-epigraphpara"><a id="c2-para-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Over and over, you're falling</span></p>
<p class="quote-epigraphpara"><a id="c2-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">And then catching yourself from falling</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">—Laurie Anderson</span></p></blockquote>
<p><a id="c2-para-0005"/></p>
<figure id="c2-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"><img src="../images/c2-fig-5001.jpg" alt="c2-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c2-para-0006"/><b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">“</span><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1">i was strolling on the moon one day</span></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">,”</span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1"> sang astronaut Harrison Schmitt cheerfully, as he set out on the first moonwalk of the last Apollo mission. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">“In the merry, merry month of May,” chimed in Commander Gene Cernan. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">Tufts of moondust sprayed from their boots as they . </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.6">did what, exactly? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.7">hopped? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.8">pranced? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.9">stumbled? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.10">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.11">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.12">. across the surface of the moon.</span></p>
<p><a id="c2-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Whatever it was, it bore little resemblance to what we normally think of as walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Schmitt loped along and swayed from side to side like a toddler. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">Cernan's gait looked like a child riding a broomstick and pretending it is a horse. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.4">It was as if the two highly trained astronauts had forgotten the most basic human skill—walking—and had to learn a new way to move (</span><a id="c2-fig-0002a"/><a href="#c2-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Figure 2.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">).</span></p>
<figure id="c2-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1"><img src="../images/c2-fig-0001.jpg" alt="c2-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Figure 2.1</span></a></span> <a id="c2-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">Astronauts rarely “walk” on the surface of the moon, preferring a hopping gait in lunar gravity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Images courtesy of NASA.</span></p></figcaption></figure>
<p><a id="c2-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">In this chapter, we'll see why the seemingly simple task of walking, which human evolution has perfected for Earth's gravity, becomes so difficult on the moon. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.2">The astronauts’ bizarre gaits may help us to appreciate more fully the carefully orchestrated sequence of events that occur when we walk, and the pivotal role that gravity plays.</span></p>
<p><a id="c2-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Another way to appreciate the feat of walking is to build a machine that does it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.2">Ingenious experiments by Tad McGeer have shown that an unpowered mechanism with human-like proportions can walk down a sloped surface. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.3">No brain, spinal cord, or muscles are needed for these mechanisms to walk, just a little push in the right direction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.4">This observation suggests that we can learn a lot about walking using simple mechanical models, which we will demonstrate in this chapter.</span></p>
<p><a id="c2-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Before beginning our analyses, however, it is useful to examine the walking gait cycle and some of the basic physics involved in locomotion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">The next section will give you a little push in the right direction.</span></p>
<section>
<h2><a id="c2-sec-0001"/><a id="c2-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">The walking gait cycle</span></h2>
<p class="paraaftertitle"><a id="c2-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Humans have two common gaits: walking and running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.2">We are all familiar with the stereotypical cyclical patterns our body segments undergo when we walk, but it is useful to characterize these qualitative observations more formally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.3">A walking gait cycle is delimited by two consecutive foot contact events on the same leg, with foot contact of the opposite leg typically occurring halfway through (</span><a id="c2-fig-0003a"/><a href="#c2-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">Figure 2.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">Each leg has a stance phase, when the foot is in contact with the ground, and a swing phase, when the foot is off the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.3">Stance begins at foot contact, ends at toe off, and accounts for about 60 percent of the gait cycle in walking for a given leg; its remaining time is spent in swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.4">Because the stance phase is longer than the swing phase, there are periods in each walking gait cycle when both feet are in contact with the ground, which we call double-support phases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.5">We refer to the intervals when only one foot is in contact with the ground as single-support phases.</span></p>
<figure id="c2-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1"><img src="../images/c2-fig-0002.jpg" alt="c2-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0003a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">Figure 2.2</span></a></span> <a id="c2-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">The walking gait cycle and its constituent events (e.g., foot contact) and phases (e.g., double support).</span></p></figcaption></figure>
<p><a id="c2-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">The step length is the distance along the line of progression between the same point on two consecutive footprints (</span><a id="c2-fig-0004a"/><a href="#c2-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Figure 2.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.2">The distance traveled in two consecutive steps, or the distance covered in one gait cycle, is called the stride length. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.3">The rate at which foot contact events occur (equivalently, the reciprocal of step duration) is called the step frequency or cadence; the rate at which strides are taken is called the stride frequency. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.4">Walking speed can be computed as the product of stride length and stride frequency or, equivalently, step length and cadence:</span></p>
<figure id="c2-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"><img src="../images/c2-fig-0003.jpg" alt="c2-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Figure 2.3</span></a></span> <a id="c2-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">Measurements of gait in the horizontal (ground) plane.</span></p></figcaption></figure>
<p><a id="c2-para-0016"/></p>
<figure id="c2-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"><img src="../images/c2-fig-3001.jpg" alt="c2-fig-3001.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c2-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">(2.1)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">The speed at which individuals typically walk varies with height, fitness, and other factors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">Healthy adults usually choose to walk at speeds of about 1.2–1.4 m/s on level ground, with a cadence of 2 steps/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">A typical step length is around 0.6–0.7 m.</span></p>
<p><a id="c2-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Two additional metrics of note are measured in the horizontal plane (</span><a href="#c2-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Figure 2.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">Step width is the distance between the middle of the heel at foot flat and the same point on the opposite leg, measured perpendicular to the line of progression. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.3">Step width is approximately 10 percent of leg length in healthy adults. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.4">If leg length is about 1 m, step width will be about 10 cm, but it is larger in toddlers who are learning to walk and in some people who have poor balance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.5">Foot progression angle is the angle between the line of progression and the line joining the midpoint of the heel and the second toe (i.e., the long axis of the foot). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.6">Positive and negative foot progression angles are referred to as toe-out and toe-in angles, respectively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.7">A small amount of toe out, about 10 degrees, is typical for adults, but this value can vary among individuals with musculoskeletal or neurological impairments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.8">For example, individuals with cerebellar ataxia, which causes disturbances in balance, may walk with greater toe out and step width to reduce the risk of falling.</span></p></section>
<section>
<h2><a id="c2-sec-0002"/><a id="c2-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">Ground reaction forces</span></h2>
<p class="paraaftertitle"><a id="c2-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">We study walking by measuring the forces between the feet and the floor (</span><a id="c2-fig-0006a"/><a href="#c2-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Figure 2.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">We will learn more about muscle coordination during walking in Chapter 11; for now, it is sufficient to know that muscles produce movement by generating forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">The “action” forces generated by muscles result in “reaction” forces applied by the ground to the foot. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.4">Ground reaction forces can be measured during walking with a force plate, an instrument that measures the forces in the vertical, anteroposterior (fore–aft), and mediolateral (side-to-side) directions as a person walks over the plate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.5">Ground reaction forces are important because they provide a measure of how the body's center of mass is accelerating at each instant in time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.6">We can use Newton's second law to relate the ground reaction forces and other external forces to the acceleration of the center of mass (COM) of a body:</span></p>
<figure id="c2-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1"><img src="../images/c2-fig-0004.jpg" alt="c2-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0006a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">Figure 2.4</span></a></span> <a id="c2-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">Representative ground reaction forces during walking at 1.55 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">Vertical and horizontal (fore–aft) components (left) and schematic of total vector (right) are shown over the gait cycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.3">Positive horizontal forces are directed forward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.4">Side-to-side forces, which are smaller, are not shown. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.5">Data from Dembia et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.6">(2017).</span></p></figcaption></figure>
<p><a id="c2-para-0021"/></p>
<figure id="c2-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1"><img src="../images/c2-fig-3002.jpg" alt="c2-fig-3002.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c2-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">(2.2)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">F</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">external</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1"> is the sum of all external forces applied to the body, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">m</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1"> is the total mass of the body, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1">g</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1"> is gravitational acceleration, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">a</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">C</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">O</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">M</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1"> is the acceleration of the center of mass. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">It's worth taking a moment to think about the significance of the words “sum” and “all” in the previous sentence. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">When both feet are contacting the ground, we must add the forces applied to each foot. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.4">Because Equation 2.2 is a vector sum, directions matter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.5">The vertical components of the forces under both feet support the body's weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.6">But, as you can see in </span><a id="c2-fig-0008a"/><a href="#c2-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">Figure 2.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">, the fore-to-aft force on the lead foot tends to cancel the aft-to-fore force on the trailing foot; that is, the lead foot serves as a brake that prevents us from going faster and faster, and the trailing foot provides propulsive force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.2">If no external forces are applied (i.e., </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">F</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">external</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1"> = 0), then the body is in freefall and its center of mass will accelerate toward the ground at </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">g</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"> = 9.81 m/s</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">2</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">.</span></p>
<figure id="c2-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"><img src="../images/c2-fig-0005.jpg" alt="c2-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">Figure 2.5</span></a></span> <a id="c2-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Ground reaction forces measured by two force plates during walking at 1.55 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.2">The two sets of arrows illustrate the force applied to each foot over time. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.3">As indicated by the black arrows, the fore–aft components of the ground reaction forces point in opposite directions during double support.</span></p></figcaption></figure>
<p><a id="c2-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Recordings of ground reaction forces during walking show several interesting features (</span><a id="c2-fig-0009a"/><a href="#c2-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">Figure 2.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.2">The vertical component of the ground reaction force rises rapidly after foot contact and reaches a force greater than body weight at about 10 percent of the gait cycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.3">The vertical force falls below body weight at midstance and then rises again above body weight during push off. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.4">The vertical force then falls to zero because, after toe off, the foot is no longer in contact with the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.5">On average, the total vertical ground reaction force is 1 bodyweight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.6">Notice that, according to Equation 2.2, the center of mass has no net vertical acceleration when the vertical component of the ground reaction force is equal to body weight, exactly balancing the downward force due to gravity.</span></p>
<figure id="c2-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"><img src="../images/c2-fig-0006.jpg" alt="c2-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Figure 2.6</span></a></span> <a id="c2-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">Representative ground reaction force applied to the foot during walking at 1.55 m/s. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">The force vectors shown here (in space) are the same as those shown in </span><a href="#c2-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1">Figure 2.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> (over time).</span></p></figcaption></figure>
<p><a id="c2-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">The horizontal ground reaction force is directed toward the back of the body, decelerating the center of mass, during the first half of stance and is directed toward the front of the body thereafter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">In addition to the fore–aft component shown in </span><a href="#c2-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">Figure 2.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">, the horizontal ground reaction force has a mediolateral component, which is small but important for controlling side-to-side balance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.2">Although at any given instant the center of mass may be accelerating, the average fore–aft acceleration over a few steps of steady-speed walking is zero. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.3">Average fore–aft acceleration will be nonzero when changing forward speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.4">In the vertical direction, nonzero average accelerations occur when changing slope, such as when walking from level ground onto a ramp.</span></p>
<p><a id="c2-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">Bear in mind that during part of the gait cycle both feet are touching the ground and the two forces are summed to obtain the net upward force on the body (</span><a href="#c2-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Figure 2.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.2">One ground reaction force is directed upward and forward, while the other is directed upward and backward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.3">The net ground reaction force is mostly upward, with a small forward component at the beginning of the double-support phase and a small backward component at toe off. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.4">These forces counteract the downward force of gravity and help you modulate your walking speed.</span></p>
<p><a id="c2-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Force plate recordings can be divided by the total body mass to estimate the acceleration of the center of mass (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">a</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">C</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">O</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">M</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1"> in Equation 2.2). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">This acceleration can be integrated once to estimate the velocity of the center of mass (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">v</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">C</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1">O</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">M</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">) and twice to estimate its position (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">r</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">C</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">O</span></sub><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">M</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.2">From these quantities, the kinetic energy of the center of mass in the forward direction (Ekf) can be estimated as</span></p>
<p><a id="c2-para-0029"/></p>
<figure id="c2-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1"><img src="../images/c2-fig-3003.jpg" alt="c2-fig-3003.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c2-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">(2.3)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">where the “f” subscript denotes the forward component. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.2">(Please note that the fluctuation of the velocity in the vertical direction is very small and thus we are ignoring it here.) The integral sign in Equation 2.3 reminds us that the effect of acceleration is cumulative and has to be integrated over time if we want to know the velocity or kinetic energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.3">The forward kinetic energy is lowest at midstance because the horizontal ground reaction force is directed backward, decelerating the center of mass, during the first half of stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.4">The gravitational potential energy can be estimated as</span></p>
<p><a id="c2-para-0031"/></p>
<figure id="c2-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1"><img src="../images/c2-fig-3004.jpg" alt="c2-fig-3004.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c2-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">(2.4)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">where the “v” subscript denotes the vertical component. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.2">The gravitational potential energy is highest at midstance as the body vaults over the stance limb (</span><a id="c2-fig-0012a"/><a href="#c2-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Figure 2.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.2">If we plot the forward kinetic energy and the gravitational potential energy over the gait cycle, we see that they are out of phase (</span><a id="c2-fig-0013a"/><a href="#c2-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">Figure 2.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">): forward kinetic energy is at its peak when gravitational potential energy is near its minimum and vice versa. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.2">As a result, the total energy is nearly constant. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.3">One of the means by which we conserve energy during walking is by trading gravitational potential energy for forward kinetic energy or forward speed, similar to what occurs in a pendulum oscillating under the influence of gravity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.4">This observation suggests that gravity has a lot to do with walking.</span></p>
<figure id="c2-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1"><img src="../images/c2-fig-0007.jpg" alt="c2-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">Figure 2.7</span></a></span> <a id="c2-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Vertical motion of the center of mass over one walking gait cycle.</span></p></figcaption></figure>
<figure id="c2-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1"><img src="../images/c2-fig-0008.jpg" alt="c2-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0013a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Figure 2.8</span></a></span> <a id="c2-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">Representative gravitational potential and forward kinetic energies during walking at 1.55 m/s (bottom) resemble the exchange of potential and kinetic energies in a ball rolling up and down hills (top). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.2">During walking, fluctuations of kinetic energy in the vertical direction are small and not shown. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.3">Human data adapted from Dembia et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.4">(2017).</span></p></figcaption></figure></section>
<section>
<h2><a id="c2-sec-0003"/><a id="c2-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1">Ballistic walking model</span></h2>
<p class="paraaftertitle"><a id="c2-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">In 1980, Thomas McMahon and Simon Mochon developed a mathematical model for walking based on the assumptions that the body exchanges potential for kinetic energy and minimizes the role of muscles during the swing phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.2">The model is very simple, consisting of only three rigid links and three revolute (pin) joints—and, notably, no muscles or motors (</span><a id="c2-fig-0014a"/><a href="#c2-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">Figure 2.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.2">The stance limb is represented by an inverted pendulum that is pinned to the ground at the ankle, allowing the limb to rotate about the ankle in the sagittal plane; the stance-limb knee is assumed to remain locked in a fully extended position. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.3">The swing limb is modeled as a double pendulum, with the thigh and shank segments pin-connected at the knee. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.4">The two legs are pinned together at the hip and have realistic mass distributions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.5">The head, arms, and trunk are ignored, except for their mass, which is concentrated at the hip.</span></p>
<figure id="c2-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1"><img src="../images/c2-fig-0009.jpg" alt="c2-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0014a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Figure 2.9</span></a></span> <a id="c2-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">The ballistic walking model described by Mochon and McMahon (1980) is simple yet analytically powerful. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.2">The stance limb is represented by an inverted pendulum (left); the swing limb, by a double pendulum (center). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.3">The complete model is formed by pinning the two limbs together at the hip (right).</span></p></figcaption></figure>
<p><a id="c2-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Experimental recordings of muscle activity have revealed that the muscles in the swing limb are relatively inactive during normal-speed walking, except at the beginning and end of the swing phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.2">Accordingly, the ballistic walking model assumes that the muscles establish the positions and velocities of the limb segments necessary for the model to initiate and evolve through the swing phase entirely passively, acted upon only by gravity (like a projectile, hence “ballistic”). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.3">When the muscles are inactive, the swing limb is assumed to behave like an unforced double pendulum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.4">If just the right initial conditions are provided to the model at toe off, the toe of the swing limb will clear the ground at mid-swing and the knee will reach full extension at foot contact.</span></p></section>
<section>
<h2><a id="c2-sec-0004"/><a id="c2-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">The Froude number</span></h2>
<p class="paraaftertitle"><a id="c2-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">The inverted pendulum on its own, an even simpler model than the ballistic walking model, does not accurately predict human walking speed but does provide some important insights about the physical constraints on how fast we can walk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.2">Consider an inverted pendulum, as shown on the left side of </span><a href="#c2-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Figure 2.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">, of length </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">ℓ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1"> where the body mass </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">m</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1"> is concentrated at the hip. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.2">When the hip is at its maximum height, its instantaneous velocity </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">v</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1"> is directed horizontally and the vertical reaction force (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">F</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">) in the ankle joint is equal to the centripetal force:</span></p>
<p><a id="c2-para-0039"/></p>
<figure id="c2-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1"><img src="../images/c2-fig-3005.jpg" alt="c2-fig-3005.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c2-para-0040"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">(2.5)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">The centripetal force is the downward force that must be applied to the pendulum to prevent it from leaving the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.2">Because the ground is unable to apply downward forces to the foot (unless you've stepped in glue), the centripetal force must be generated by the body weight, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">mg</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.2">Equating these forces and solving for velocity, we find that the maximum walking speed (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">v</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">max</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">) for an inverted pendulum model is</span></p>
<p><a id="c2-para-0041"/></p>
<figure id="c2-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1"><img src="../images/c2-fig-3006.jpg" alt="c2-fig-3006.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c2-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">(2.6)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">We use </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">v</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">max</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1"> to define nondimensional walking speed (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">v</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">*):</span></p>
<p><a id="c2-para-0043"/></p>
<figure id="c2-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1"><img src="../images/c2-fig-3007.jpg" alt="c2-fig-3007.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c2-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">(2.7)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">At speeds above </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">v</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1">max</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">, the foot will leave the ground; thus, 0 ≤ </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">v</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">* ≤ 1,to the extent that we walk as an inverted pendulum. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.2">The Froude number (Fr) is a dimensionless quantity that represents the ratio between the centripetal and gravitational forces:</span></p>
<p><a id="c2-para-0045"/></p>
<figure id="c2-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1"><img src="../images/c2-fig-3008.jpg" alt="c2-fig-3008.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c2-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">(2.8)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">The nondimensional walking speed and Froude number provide very useful metrics for comparing walking speeds between animals and among people with different maximum speeds and leg lengths.</span></p>
<p><a id="c2-para-0047"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">An important prediction of the inverted pendulum model is that the maximum walking speed decreases if </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">ℓ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1"> or </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">g</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1"> decreases. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.2">The first relationship is evident when watching a child walk alongside an adult. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.3">With shorter legs, the child will be walking at a higher Froude number than the adult and will have a lower </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">v</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">max</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.2">Thus, you might observe an adult walking at a comfortable pace while a child is running to keep up. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.3">The dependence of </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">v</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">max</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1"> on gravity, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">g</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">, explains the challenges that astronauts experienced on the lunar surface. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.2">Because the gravity on the moon is only about one-sixth that on earth, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">v</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">max</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1"> on the moon is </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1"><img src="../images/c2-fig-6001.jpg" alt="c2-fig-6001.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1"> of its terrestrial value. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.2">Thus, a normal Earth-based walking speed will cause an astronaut to lift off the lunar surface. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.3">For this reason, Apollo 11 astronauts Neil Armstrong and Buzz Aldrin walked mostly at a slow pace to keep their feet on the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.4">The later crews adopted a variety of bounding gaits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.5">Interestingly, experiments before the moon missions had suggested that a kangaroo hop would be the most efficient gait, but the astronauts resorted to this strategy only rarely.</span></p>
<p><a id="c2-para-0048"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1">It is important to note that humans and other land animals do not normally walk at a Froude number of 1; they transition from walking to running at Froude numbers around 0.5 to save energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.2">An important exception is elephants, the largest land animal, which appear to walk much faster than the inverted pendulum model would allow, at Froude numbers greater than 1 (Hutchinson et al., 2003). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.3">As always, discrepancies between theory and observation provide an opportunity for learning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.4">From 2003 to 2010, John Hutchinson and colleagues studied video and conducted experiments on elephants using custom-built force plates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.5">(They had to be strong force plates!) Hutchinson discovered that even though the elephant always kept at least one foot on the ground and thus was still “walking” in the traditional sense, it went into an exaggerated crouch at high speeds (</span><a id="c2-fig-0019a"/><a href="#c2-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">Figure 2.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.2">This “Groucho walk,” named after comedian Groucho Marx who popularized this style of walking, meant that the leg muscles were generating high forces, and the exchange of gravitational potential and kinetic energy was inconsistent with the inverted pendulum model of walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.3">Thus, the elephants’ gait was something of a blend between walking and running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.4">We will explain this idea more fully in the next chapter, when we discuss the differences between walking and running and whether or not another large animal, the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">Tyrannosaurus rex</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1">, could run.</span></p>
<figure id="c2-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1"><img src="../images/c2-fig-0010.jpg" alt="c2-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0019a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">Figure 2.10</span></a></span> <a id="c2-para-0049"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">Even during a race, elephants always keep at least one foot on the ground but use a more bouncy gait (bottom) than during typical walking (top). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.2">This is often called “Groucho walking,” made famous by Groucho Marx.</span></p></figcaption></figure></section>
<section>
<h2><a id="c2-sec-0005"/><a id="c2-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">Cost of transport</span></h2>
<p class="paraaftertitle"><a id="c2-para-0050"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1">The ballistic walking model captures some of the salient features of normal walking, in part because we naturally learn how to move in ways that minimize our energy expenditure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.2">Reducing the activity of muscles during leg swing is one example. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.3">We also naturally select our walking speed, cadence, step width, and other variables to minimize cost of transport, or the energy required to move a given distance (</span><a id="c2-fig-0020a"/><a href="#c2-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1">Figure 2.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.2">Many studies over the past 60 years have verified that we walk in a way that minimizes our cost of transport—an important tenet of biomechanics. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.3">The cost of transport for walking is typically estimated by collecting and analyzing the mixture of gases inhaled and exhaled by a person while they walk at a particular speed (</span><a id="c2-fig-0021a"/><a href="#c2-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Figure 2.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">).</span></p>
<figure id="c2-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1"><img src="../images/c2-fig-0011.jpg" alt="c2-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0020a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1">Figure 2.11</span></a></span> <a id="c2-para-0051"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">Cost of transport varies with walking speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.2">The energy required to move a unit mass a unit distance is lowest near the natural walking speed, as shown by three experimental studies. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.3">Data from Ralston (1958), Browning et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.4">(2006), and Martin et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.5">(1992).</span></p></figcaption></figure>
<figure id="c2-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1"><img src="../images/c2-fig-0012.jpg" alt="c2-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0021a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">Figure 2.12</span></a></span> <a id="c2-para-0052"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1">Experiment during which oxygen consumption and carbon dioxide production are measured to calculate the energy expended during running. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.2">The same type of experiment is used to calculate the cost of transport in walking shown in </span><a href="#c2-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">Figure 2.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">.</span></p></figcaption></figure>
<p><a id="c2-para-0053"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">Note that we cannot measure energy use directly, but indirect estimates based on measurements of breathing are an excellent proxy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.2">Our muscles are powered by chemical reactions that burn carbohydrates, fats, and proteins. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.3">These reactions consume oxygen and produce carbon dioxide. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.4">By determining the rate at which exhaust is produced, we can infer how much fuel was used and therefore how much energy was consumed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.5">As shown in </span><a href="#c2-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">Figure 2.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">, we often express cost of transport as the number of Joules of energy required per kilogram of body mass to travel one meter.</span></p>
<p><a id="c2-para-0054"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1">Although the ballistic model can be useful for understanding some basic characteristics of walking, it has some limitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.2">For example, it is unable to model double support, which is essential for understanding the transition between consecutive steps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.3">The inverted pendulum model predicts that our maximum walking speed will occur at a Froude number of 1, whereas in reality humans transition from walking to running at Froude numbers well below 1, and race walkers can “walk” at Froude numbers above 1. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.4">Also notice that a ballistic walking model might lead one to conclude that walking does not cost any energy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.5">Furthermore, a model with a rigid stance limb does not accurately predict the ground reaction force observed experimentally. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.6">Finally, the ballistic walking model does not produce a repeated gait cycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.7">Some of these limitations are resolved in a slightly more complex model called the dynamic walking model.</span></p></section>
<section>
<h2><a id="c2-sec-0006"/><a id="c2-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">Dynamic walking model</span></h2>
<p class="paraaftertitle"><a id="c2-para-0055"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1">The ballistic walking model improved on the pendulum model by adding knees (or, to be more precise, one knee). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.2">We might expect, then, that adding one more anatomical ingredient would improve the model further. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.3">But it did more than that: by adding feet, Tad McGeer designed a walking robot that could be built and tested in a laboratory.</span></p>
<p><a id="c2-para-0056"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">McGeer had been trained as an aeronautical engineer, so it is no surprise that he adopted a strategy echoing that used to develop the airplane a century earlier. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.2">Before they attempted a powered flight, the Wright brothers worked for years developing gliders that were powered by gravitational potential energy as they flew down a slope. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.3">By the end of 1902 they had completed hundreds of such flights. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.4">Once the Wrights had mastered gliding, they were confident they could master powered flight and recorded their first powered flights the following year (Collins et al., 2005).</span></p>
<p><a id="c2-para-0057"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">Emulating the Wright brothers, ten years after Mochon and McMahon proposed the ballistic model, McGeer built a passive mechanism that could stably walk down a gentle slope, powered only by gravity, when provided with the right initial conditions (</span><a id="c2-fig-0022a"/><a href="#c2-fig-0022"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1">Figure 2.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.2">Proof that such a mechanism could be built was a breakthrough and started a new field of research into “dynamic walking,” locomotion generated primarily by the passive dynamics of the legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.3">Today, powered dynamic walking robots are designed following the principle used by the Wright brothers: if a passive mechanism can move down a gentle slope strictly under the influence of gravity, then an active mechanism should be able to move on level ground using actuators that inject only the small amount of energy that would be supplied by gravity when descending a gentle slope.</span></p>
<figure id="c2-fig-0022"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1"><img src="../images/c2-fig-0013.jpg" alt="c2-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0022a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1">Figure 2.13</span></a></span> <a id="c2-para-0058"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1">Replica of a walking machine described by Tad McGeer (1990). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.2">This mechanism, which includes two pairs of legs, will walk down a sloped surface when given the correct initial pose and push. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.3">Photo courtesy of Steve Collins.</span></p></figcaption></figure>
<p><a id="c2-para-0059"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1">The dynamic walking model extends the ballistic model in three key respects: by adding feet, modeling double support, and, most importantly, enabling the step-to-step transition (</span><a id="c2-fig-0023a"/><a href="#c2-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1">Figure 2.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.2">These features enable the mechanism to engage in cyclic, continuous walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.3">During single support, the foot of the stance limb rolls (without slipping) on the ground while the swing limb swings passively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.4">Knee extension stops prevent hyperextension of the knee at the end of swing and keep the stance limb fully extended, passively supporting body weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.5">The center of mass moves upward in the first half of stance and downward in the second half. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.6">Just before foot contact, the center of mass is redirected to an upward trajectory by a push-off moment generated at the ankle of the stance limb. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.7">Redirecting the center of mass before foot contact reduces the velocity of the foot–ground collision and the corresponding energy loss. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.8">Some energy is still lost in the collision between the foot and the ground, as well as when the knees hit the stops at full extension. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.9">To produce continuous gait, a small amount of energy must be injected in each step to compensate for this dissipation and for any frictional losses in the joints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.10">In fully passive walking machines, this energy is provided by the gravitational potential energy as the mechanism walks down a gentle slope; on level ground, this energy can be injected by motors at the ankles or hips.</span></p>
<figure id="c2-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1"><img src="../images/c2-fig-0014.jpg" alt="c2-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0023a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1">Figure 2.14</span></a></span> <a id="c2-para-0060"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1">The dynamic walking model described by Kuo and Donelan (2010). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.2">This model addresses some limitations of the ballistic model by enabling step-to-step transitions, producing a repeated gait cycle.</span></p></figcaption></figure>
<p><a id="c2-para-0061"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1">The dynamic walking model provides a theoretical framework for understanding some fundamental features of walking on level ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.2">Dynamic walking models have been used to study energy consumption over the gait cycle, how energy consumption changes with walking speed, and other aspects of human walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.3">For example, the energy required to redirect the center of mass trajectory at the beginning of double support is known as the step-to-step transition cost. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.4">The dynamic walking model correctly predicts that this cost increases with longer and faster steps. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.5">Increasing step length (while maintaining a constant step frequency) increases energy expenditure because the velocity of the center of mass increases and its trajectory must be redirected by a larger amount. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.6">Increasing step frequency (while maintaining a constant step length) increases energy expenditure because the legs must swing faster than would occur due to passive dynamics alone, and muscles expend energy to swing the legs.</span></p>
<p><a id="c2-para-0062"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">The energy expenditure due to the step-to-step transition and forced swing leg motion contribute to the cost of human walking, along with maintaining balance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.2">Humans usually select step lengths and step frequencies that minimize cost of transport. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.3">When increasing walking speed beyond the speed at which cost of transport is lowest, humans increase step length and step frequency in nearly equal proportion, balancing increases in cost due to the step-to-step transition and forced leg motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.4">The step-to-step transition cost is also mitigated by using our feet like sections of wheels (note the arc-shaped feet in the lower part of </span><a href="#c2-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1">Figure 2.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">), reducing the required change in the direction of the center of mass. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.2">The human foot effectively rolls over the ground as the ground reaction forces move from the rear of the foot at foot contact to the forefoot at toe off (</span><a href="#c2-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1">Figure 2.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.2">In a dynamic walker, the position of the foot is essential: if the foot is placed too far forward, the walker will fall backward; if the leg swings too slowly and the step length is too short, the walker will fall forward.</span></p>
<p><a id="c2-para-0063"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1">The dynamic walking model has more analytical strength than the ballistic model, but of course still has limitations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.2">Many modeling assumptions and simplifications preclude using the model to study certain elements of human walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.3">For example, the dynamic walking model assumes strictly planar motion, neglecting motion out of the sagittal plane. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.4">McGeer's apparatus enforces this assumption by doubling the number of legs to minimize side-to-side sway. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.5">In 2001, Steve Collins, then an undergraduate at Cornell University, built the first two-legged passive dynamic walking machine (</span><a id="c2-fig-0024a"/><a href="#c2-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">Figure 2.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.2">Designing this mechanism required careful attention to the trajectory of the machine's center of mass, to prevent it from falling due to non-sagittal-plane motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.3">Counter-swinging arms in the sagittal plane stabilized yaw, foot shape and lateral arm swing controlled lean, and a soft heel avoided sensitivity to the pose at foot contact (Collins et al., 2001). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.4">In each case, biomimicry improved the performance of the mechanism, and it gives us some idea of why each of these ingredients—arm swing, feet, and heels—give humans a biomechanical advantage.</span></p>
<figure id="c2-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1"><img src="../images/c2-fig-0015.jpg" alt="c2-fig-0015.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0024a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">Figure 2.15</span></a></span> <a id="c2-para-0064"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">The first two-legged passive dynamic walker. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.2">Photo courtesy of Steve Collins.</span></p></figcaption></figure></section>
<section>
<h2><a id="c2-sec-0007"/><a id="c2-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">Arm swing</span></h2>
<p class="paraaftertitle"><a id="c2-para-0065"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">Thus far, we have used simple models to study the dynamics of the lower body, but the upper body plays a role in walking as well. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.2">The most obvious motion in the upper body is arm swing, but why we swing our arms when we walk is less obvious. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.3">To study this behavior, Steve Collins and his colleagues proposed a straight-legged passive walking mechanism similar to McGeer's but with arm-like pendula attached at the hips (</span><a id="c2-fig-0025a"/><a href="#c2-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Figure 2.16</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.2">They tested several arm swing strategies, including the familiar “normal” swing, and an “anti-normal” swing where the left arm advances with the left leg and the right arm with the right leg. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.3">I can't help thinking of this strategy as the “Bro walk,” in honor of my older brother Brian Delp, who enjoyed walking this way for his and our amusement when we were children.</span></p>
<figure id="c2-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1"><img src="../images/c2-fig-0016.jpg" alt="c2-fig-0016.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0025a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">Figure 2.16</span></a></span> <a id="c2-para-0066"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">Normal and anti-normal arm swing emerge spontaneously in a passive walking mechanism with arms (left). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.2">In human experiments, energy expenditure was least using normal arm swing and highest using anti-normal arm swing (right; error bars and asterisks indicate standard deviations and statistically significant differences). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.3">Adapted from Collins et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.4">(2009).</span></p></figcaption></figure>
<p><a id="c2-para-0067"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1">Experiments on human subjects walking normally showed that the activity of muscles crossing the shoulder and elbow joints is low, confirming that normal arm swing is primarily passive. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.2">The kinematics and kinetics of the lower body are unaffected by arm swing strategy, but the whole body twists more about the vertical axis when the arms are not swinging, and still more during anti-normal arm swinging. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.3">The increase in angular momentum is countered by a higher ground reaction moment about the vertical axis, with a corresponding increase in muscle activity and energy expenditure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.4">To put it more simply, the Bro walk is awkward, and that's why people past a certain age don't usually walk this way.</span></p></section>
<section>
<h2><a id="c2-sec-0008"/><a id="c2-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">Skeletal model for gait analysis</span></h2>
<p class="paraaftertitle"><a id="c2-para-0068"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">Because each biologically inspired feature of passive walkers has improved their performance, it's natural to wonder what a higher-fidelity model would look like. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.2">Let's start with some bad news: anatomical joints are complex, with adjacent body segments translating and rotating relative to each other in all directions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.3">We are often interested in, or can only accurately measure, a subset of these motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.4">Therefore, even a model deliberately patterned after the human body will make simplifying assumptions, such as disallowing relative translation between the femoral head and the pelvis so that the hip is represented as a ball-and-socket joint.</span></p>
<p><a id="c2-para-0069"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">Nevertheless, a typical and reasonably accurate lower-limb skeletal model used for analyzing gait is shown in </span><a id="c2-fig-0026a"/><a href="#c2-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">Figure 2.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.2">(It may be supplemented with a torso and arms when necessary.) The model consists of 9 articulating rigid bodies: a pelvis and left and right femur, patella, tibia-plus-fibula (shank), and foot. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.3">The model has 16 degrees of freedom in the lower body: 6 describe the position and orientation (tilt, list, and rotation) of the pelvis relative to a fixed frame of reference, and 5 describe the pose of each leg (hip flexion, adduction, and rotation; knee extension; and ankle dorsiflexion). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.4">These terms are standard, well worth learning, and shown in Figure 1.16.</span></p>
<figure id="c2-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1"><img src="../images/c2-fig-0017.jpg" alt="c2-fig-0017.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c2-fig-0026a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">Figure 2.17</span></a></span> <a id="c2-para-0070"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">Example model used in gait analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.2">The model includes rigid bodies representing the pelvis, thighs, shanks, and feet, and permits only those joint motions that can be reliably measured in a typical gait analysis: pelvic tilt, list, and rotation; hip flexion, adduction, and rotation; knee extension; and ankle dorsiflexion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.3">Adapted from Rajagopal et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.4">(2016).</span></p></figcaption></figure>
<p><a id="c2-para-0071"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">Just think about this for a moment: at every instant while we are walking, we are simultaneously controlling more than a dozen angular positions, without being aware of it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.2">By contrast, the ballistic walking model of Mochon and McMahon had only 3 degrees of freedom, and the dynamic walking model had only a few more. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.3">We succeed in part because we take shortcuts, using passive motions whenever possible, but also because we have a brain that spends a great deal of time in the first year of our life learning how to coordinate the complex movement of walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.4">Next time you joke that someone can't walk and chew gum at the same time, remember that even the first part—bipedal walking—is an amazing accomplishment.</span></p>
