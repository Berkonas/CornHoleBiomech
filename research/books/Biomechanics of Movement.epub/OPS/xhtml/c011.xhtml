<section epub:type="chapter" role="doc-chapter">
<header>
<h1><a id="c11-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">11</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Muscle-Driven Walking</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c11-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">We shall not cease from exploration</span></p>
<p class="quote-epigraphpara"><a id="c11-para-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">And the end of all our exploring</span></p>
<p class="quote-epigraphpara"><a id="c11-para-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1">Will be to arrive where we started</span></p>
<p class="quote-epigraphpara"><a id="c11-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">And know the place for the first time.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1">—T. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">S. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Eliot</span></p></blockquote>
<p><a id="c11-para-0005"/></p>
<figure id="c11-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1"><img src="../images/c11-fig-5001.jpg" alt="c11-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c11-para-0006"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">the video ended</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"> and the lights flickered back on. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.2">No one knew exactly what to do. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.3">The video had shown a 13-year-old girl walking back and forth across our gait lab. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.4">The girl had been born six weeks prematurely and was diagnosed with cerebral palsy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.5">She started walking at age 3 and now had a crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.6">Her knees hurt from the high loads in her joints, and she expended more energy walking on level ground than other kids do running up stairs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.7">She was 20 cm shorter than most of her peers because she walked with flexed hips and knees. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.8">My colleagues and I were reviewing her video to devise a strategy to improve her walking, but we could not agree on the best plan of action. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.9">In addition to the video, we reviewed a 20-page report from our gait lab, which showed that her joint angles, joint moments, and EMG patterns differed from typical gait, but we still did not know what was causing her crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.10">Was it tight hamstrings? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.11">Weak plantarflexors? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.12">Tight hip flexors? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.13">If we could identify the underlying causes of her crouch gait, we could suggest a physical therapy program, a leg brace, or an orthopedic surgery to address these causes.</span></p>
<p><a id="c11-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">I spent the first 15 years of my career working with other experts to determine the causes of movement abnormalities in children with cerebral palsy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.2">We used all the information we had available and did our best to plan treatments that would improve their ability to walk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.3">There was reason for hope. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.4">About half of the children improved substantially following surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.5">Unfortunately, many did not, and some got worse. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.6">There was a fundamental barrier to developing better treatments: we did not know the contributions of individual muscles to producing joint motions during typical gait or how these contributions differed in children with cerebral palsy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.7">This motivated me to develop tools to help us better understand the actions of muscles during walking.</span></p>
<p><a id="c11-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">So far in this book, we have explored the form, function, and simulation of muscle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">We now arrive where we started, with the desire to understand walking, but with new tools to deepen our understanding. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">In Chapter 2, we analyzed walking using models consisting of only a few mechanical linkages representing the legs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.4">Although these simple models are valuable, they do not help us determine the actions of individual muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.5">Legs have muscles which generate the forces that keep us from falling down and propel us forward as we walk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.6">Muscles allow us to carry a backpack, change our walking speed, and transition from walking to running.</span></p>
<p><a id="c11-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">In this chapter, we will see how muscles are coordinated to produce typical walking and how the dynamics of walking change with speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">We will also see why poorly coordinated muscles result in atypical patterns, such as stiff-knee gait and crouch gait, and what might be done to improve walking dynamics when muscle coordination is impaired.</span></p>
<p><a id="c11-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">An important use of muscle-driven simulations is to extend the insights gained from experiments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">For example, while it is possible to measure muscle activity, ground reaction forces, and joint motions, experiments alone are insufficient to determine how each muscle contributes to ground reaction forces and body motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">This is the reason we could not determine why the girl in the video was walking with a crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">We identified abnormal muscle activities and abnormal motions, but we could not determine which muscles were causing the abnormal motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.5">Muscle-driven simulations reveal the motions caused by muscles and provide a powerful tool for understanding muscle actions during movement. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.6">In this chapter, we will see how to build, test, and analyze muscle-driven simulations of walking.</span></p>
<section>
<h2><a id="c11-sec-0001"/><a id="c11-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">Building and testing simulations of walking</span></h2>
<p class="paraaftertitle"><a id="c11-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">To build simulations of walking, we often start by recording the motions of the body segments and ground reaction forces as a person walks over force plates. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.2">We may measure other quantities as well, such as muscle activity using EMG or whole-body energy expenditure using indirect calorimetry. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.3">We then tailor a generic musculoskeletal model to match the subject's size and shape based on measured positions of anatomical landmarks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.4">We calculate the joint angles during walking using an inverse kinematics algorithm that minimizes the difference between the measured marker positions and the positions of the corresponding markers on the model at each time frame, as described in Chapter 7. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.5">We simulate the muscle activations and forces needed to track the measured motions as outlined in Chapter 10, producing a muscle-driven simulation of walking (</span><a id="c11-fig-0002a"/><a href="#c11-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">Figure 11.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">The accuracy of the simulation must then be evaluated as described in detail by Liu et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">(2008) and Hicks et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.4">(2015). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.5">For example, we might compare simulated muscle activations with EMG measurements, or the total metabolic energy consumed by all simulated muscles with measurements of whole-body metabolic cost.</span></p>
<figure id="c11-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1"><img src="../images/c11-fig-0001.jpg" alt="c11-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">Figure 11.1</span></a></span> <a id="c11-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">Visualization of a muscle-driven simulation of walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">The colors of the muscles indicate their level of activation ranging from inactive (blue) to highly active (red). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.3">Data from Dembia et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.4">(2017).</span></p></figcaption></figure>
<p><a id="c11-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">Once the accuracy of a simulation has been tested, we can analyze it to determine how muscles contribute to the vertical and fore–aft accelerations of the body's center of mass, and to the motions of the joints and body segments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.2">Over the last 30 years, my research group has used this approach to analyze thousands of muscle-driven simulations of human gait, including healthy and impaired walking at various speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.3">These analyses have allowed us to synthesize a reasonably complete picture of how muscles contribute to support and progression. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.4">I summarize our key findings below.</span></p></section>
<section>
<h2><a id="c11-sec-0002"/><a id="c11-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">Muscle contributions to ground reaction forces</span></h2>
<p class="paraaftertitle"><a id="c11-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">During the stance phase, muscles generate forces that support the body's weight and regulate forward progression. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">We can quantify a muscle's contribution to body-weight support by determining how the muscle affects the vertical acceleration of the center of mass. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">Similarly, we can investigate how a muscle contributes to forward progression by analyzing its role in generating accelerations of the center of mass in the fore–aft direction. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.4">Recall that the acceleration of the body's center of mass during walking is related to the ground reaction force divided by the mass of the body (Equation 2.2); thus, analyzing ground reaction forces is akin to analyzing the acceleration of the center of mass. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.5">Also recall that the ground reaction forces are generated by, and can be attributed to, muscle “action” forces.</span></p>
<p><a id="c11-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">The same muscles that provide body-weight support during walking also regulate forward progression. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.2">For example, a research team at Stanford led by May Liu found that the vasti and gluteus maximus make important contributions to support during early stance while the vasti also reduce the body's forward velocity (</span><a id="c11-fig-0003a"/><a href="#c11-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">Figure 11.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">The gluteus medius provides support during midstance and, in the second half of stance, contributes to forward acceleration. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">The soleus and gastrocnemius contribute to vertical and forward acceleration in late stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">The contributions to body-weight support from the soleus and gastrocnemius are so important that weakness of these muscles may lead to crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.5">It is for this reason that, in some cases, crouch gait can be improved by wearing a spring-loaded ankle brace that generates a plantarflexion moment.</span></p>
<figure id="c11-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1"><img src="../images/c11-fig-0002.jpg" alt="c11-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0003a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Figure 11.2</span></a></span> <a id="c11-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Actions of the gluteus medius, vasti, soleus, gluteus maximus, and gastrocnemius during the stance phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.2">The vasti are most active during early stance when they accelerate the center of mass upward and backward; the plantarflexors are active during late stance when they accelerate the center of mass upward and forward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.3">The gluteus medius, gluteus maximus, and skeletal alignment make important contributions to body-weight support. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.4">Data from Liu et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.5">(2008).</span></p></figcaption></figure>
<p><a id="c11-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">For brief periods during stance, the body's center of mass accelerates downward at values close to 9.8 m/s</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1">2</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.2">In the absence of muscle forces, the body would be in near-freefall during these periods. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.3">When the foot is flat on the ground and the knee is near full extension, however, the magnitude of the mass center's vertical acceleration due to gravity is less than 9.8 m/s</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">2</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1"> because the skeleton provides passive resistance to gravity (see skeletal alignment in </span><a href="#c11-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">Figure 11.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.2">However, the passive support of the bones is insufficient to prevent buckling of the legs and collapse. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.3">Muscles are necessary to support the body's weight during normal walking.</span></p>
<p><a id="c11-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">Summing the contributions of the stance-limb muscles to the ground reaction force produces a pattern similar to that of the familiar ground reaction force vectors (</span><a id="c11-fig-0004a"/><a href="#c11-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1">Figure 11.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.2">This indicates that, during walking, muscles are principally responsible for generating the ground reaction force and thus for supporting the body's weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.3">The difference between the total ground reaction force and the muscle-generated ground reaction force can be attributed to skeletal alignment, or the resistance provided by the skeleton to downward acceleration caused by gravity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.4">During double support, muscles in both limbs contribute to supporting the body's weight; however, the muscles in the trailing limb assist forward progression while those in the leading limb resist it (Figure 2.5).</span></p>
<figure id="c11-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1"><img src="../images/c11-fig-0003.jpg" alt="c11-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1">Figure 11.3</span></a></span> <a id="c11-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1">Contribution to ground reaction force from stance-limb muscles (red) relative to the measured ground reaction force (gray). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.2">The difference represents the contribution of skeletal alignment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.3">Adapted from Liu et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.4">(2008).</span></p></figcaption></figure></section>
<section>
<h2><a id="c11-sec-0003"/><a id="c11-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1">Muscle actions during the swing phase</span></h2>
<p class="paraaftertitle"><a id="c11-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">The swing phase begins with flexion of the hip, knee, and ankle, which draws the toe of the swing limb away from the ground as the limb moves forward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">Flexion of the knee is especially important for toe clearance during swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">Without sufficient knee flexion, the toe of the swing limb will strike the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.4">During typical walking, the toe clears the ground by only about 1 cm. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.5">With so little margin for error, it's no wonder that we occasionally scuff our feet on the ground.</span></p>
<p><a id="c11-para-0021"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">In the ballistic walking model, the motion of the swing leg is likened to the unforced swinging of a compound pendulum (Figure 2.9). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.2">The low level of activity in the leg muscles during swing (relative to stance) supports the characterization of leg swing as being a largely passive motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.3">However, the leg muscles do exhibit stereotypical patterns of activity before and during the swing phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.4">Even this relatively small amount of muscle activity plays an important role.</span></p>
<p><a id="c11-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1">The motion of the swing limb is shaped by muscle forces that are generated before and during swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.2">In late stance, muscle forces establish the initial conditions for swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.3">The knee flexion velocity at toe off is a key factor affecting how the limb swings and is determined by the action of muscles even before the foot leaves the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.4">Using muscle-driven simulations to analyze the actions of muscles during double support, Saryn Goldberg and her colleagues found that the iliopsoas and gastrocnemius are the largest contributors to increasing knee flexion velocity at toe off; the vasti, soleus, and rectus femoris muscles act to decrease this velocity (</span><a id="c11-fig-0005a"/><a href="#c11-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">Figure 11.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">Thus, the actions of these muscles must be balanced prior to swing so that, at toe off, the right conditions are established for effective swing-phase knee flexion.</span></p>
<figure id="c11-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1"><img src="../images/c11-fig-0004.jpg" alt="c11-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0005a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">Figure 11.4</span></a></span> <a id="c11-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">The knee flexes rapidly during double support, resulting in a high knee flexion velocity at toe off. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.2">The knee flexion velocity increases during double support due to forces generated by the iliopsoas and gastrocnemius, and is limited by forces generated by the vasti, soleus, and rectus femoris. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.3">Data from Goldberg et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.4">(2004).</span></p></figcaption></figure>
<p><a id="c11-para-0024"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">Swing dynamics are also influenced by muscle activity during swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.2">For example, the hamstrings play an important role near the end of the swing phase (</span><a id="c11-fig-0006a"/><a href="#c11-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Figure 11.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">The hamstrings have a complex action because they cross posterior to the hip and the knee, thereby generating a hip extension moment and a knee flexion moment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">The knee flexion moment produces a knee flexion acceleration, but the hip extension moment induces a nearly equivalent knee extension acceleration; thus, the net action of the hamstrings at the knee is small. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.4">Allison Arnold analyzed simulations of the swing phase to show that the primary effect of the hamstrings is to produce a backward acceleration of the shank (Arnold et al., 2007). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.5">Thus, the hamstrings slow the limb at the end of swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.6">The rectus femoris has the opposite action—it gets the limb moving forward at the start of swing.</span></p>
<figure id="c11-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"><img src="../images/c11-fig-0005.jpg" alt="c11-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0006a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Figure 11.5</span></a></span> <a id="c11-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">The rectus femoris is active in early swing and accelerates the limb forward. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">The hamstrings are active in late swing and reduce the forward velocity of the swing leg prior to foot contact.</span></p></figcaption></figure>
<p><a id="c11-para-0026"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1">The rectus femoris muscle also plays a critical role in regulating knee flexion during the swing phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.2">It has long been thought that excessive activity of the rectus femoris during swing produces a gait abnormality called stiff-knee gait, in which swing-limb knee flexion is reduced and toe clearance is compromised. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.3">We have used muscle-driven simulations to investigate the extent to which excessive rectus femoris activity before and during the swing phase contributes to producing stiff-knee gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.4">We will see the results of this investigation in the next section.</span></p></section>
<section>
<h2><a id="c11-sec-0004"/><a id="c11-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">Muscle actions in stiff-knee gait</span></h2>
<p class="paraaftertitle"><a id="c11-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1">Stiff-knee gait, characterized by diminished and delayed peak knee flexion in swing (Figure 2.22), is one of the most common gait problems in children with cerebral palsy and in adults who have suffered a stroke. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.2">Insufficient knee flexion during swing can lead to tripping and falling as well as inefficient compensatory movements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.3">Despite the prevalence of stiff-knee gait, its causes are not well understood. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.4">Several factors may contribute to stiff-knee gait, but excessive activity of the rectus femoris muscle is considered to be a primary cause. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.5">Common treatments alter the function of the rectus femoris to improve knee motion during the swing phase. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.6">For example, rectus femoris transfer surgery relocates the attachment of the rectus femoris from the patella to a more posterior site (e.g., the sartorius just behind the knee) to augment knee flexion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.7">A nonsurgical treatment option is botulinum toxin injection into the rectus femoris. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.8">Botulinum toxin is a neurotoxin that, when injected into a muscle, blocks acetylcholine release at the neuromuscular junction, thereby preventing activation of the muscle.</span></p>
<p><a id="c11-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">What are the causes of stiff-knee gait? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.2">How important is swing-phase activity of the rectus femoris in producing stiff-knee gait? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.3">These questions are important to ask but are not easy to answer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.4">The causes of stiff-knee gait are difficult to determine from experimental data alone and may differ from one individual to another. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.5">The outcomes of treatments are also variable—some patients have improved knee flexion after surgery while others do not. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.6">These challenges motivated me to develop muscle-driven simulations of stiff-knee gait.</span></p>
<p><a id="c11-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1">We used muscle-driven simulations to examine how activity of the rectus femoris prior to and during swing contributes to knee flexion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.2">Jeff Reinbolt created simulations that reproduced the dynamics of subjects with stiff-knee gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.3">To study the effects of rectus femoris activity on knee motion, Jeff eliminated excitation of the rectus femoris in the simulations, first prior to swing and then early in the swing phase (</span><a id="c11-fig-0007a"/><a href="#c11-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">Figure 11.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.2">We found that knee flexion increased in both cases, but the increase in knee flexion was greater when rectus femoris activity was eliminated prior to swing (during “preswing”). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.3">This suggests that preswing activity of the rectus femoris may be responsible for limiting the knee flexion of many persons with stiff-knee gait—not activity during swing as is often presumed.</span></p>
<figure id="c11-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1"><img src="../images/c11-fig-0006.jpg" alt="c11-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0007a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Figure 11.6</span></a></span> <a id="c11-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">Methods used to compare increase in peak knee flexion when rectus femoris activity is eliminated during preswing and in early swing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">(A) Rectus femoris EMG of a stiff-knee subject over one gait cycle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.3">(B) Eliminating excitation of the rectus femoris during preswing (red line) and in early swing (orange line). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.4">(C) Simulated changes in knee flexion angles were larger when rectus femoris activity was eliminated during preswing (red) than in early swing (orange). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.5">Adapted from Reinbolt et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.6">(2008).</span></p></figcaption></figure>
<p><a id="c11-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1">This example illustrates an important characteristic of muscle function—the activity of a muscle affects motions in the future. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.2">As we have seen, there is a delay between muscle excitation and muscle force production, as well as a delay between muscle force production and appreciable changes in joint position. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.3">Thus, when attempting to identify which muscles are producing an abnormal motion, we must consider muscle activity that precedes the motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.4">Muscle activity that occurs during or after an event of interest (e.g., at the instant of peak knee flexion) can have no effect on an individual's motion until sometime later, after the development of muscle force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.5">This statement may seem obvious, but it is often forgotten when attempting to determine which muscles cause abnormal motions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.6">I have been in many meetings where an expert suggests that abnormal EMG occurring after an abnormal motion caused the motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.7">It simply can't happen that way.</span></p>
<p><a id="c11-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">My research group has also used muscle-driven simulations of stiff-knee gait to study the mechanisms by which rectus femoris transfer surgery alters muscle function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.2">Melanie Fox altered the rectus femoris in a computer model to simulate the effects of various treatments (</span><a id="c11-fig-0008a"/><a href="#c11-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">Figure 11.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.2">The simulations showed that the largest improvement in peak knee flexion occurred after simulated transfer of the rectus femoris to the sartorius, a surgery that converts the rectus femoris from a generator of knee extension moments to a generator of knee flexion moments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.3">Transfer of the rectus femoris to the iliotibial band produced a smaller improvement in peak knee flexion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.4">Simulated botulinum toxin injection into the rectus femoris, which eliminates the knee extension moment it generates as well as its hip flexion moment, produced less improvement than either simulated transfer. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.5">These simulations suggest that the primary mechanism by which rectus femoris transfer improves knee flexion is the reduction of the muscle's knee extension moment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.6">A secondary mechanism of improvement is preservation of the muscle's hip flexion moment, which induces knee flexion.</span></p>
<figure id="c11-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1"><img src="../images/c11-fig-0007.jpg" alt="c11-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">Figure 11.7</span></a></span> <a id="c11-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1">Peak knee flexion of lower-limb model (left) during simulation of preoperative gait and gait after three candidate interventions (right) for a patient with stiff-knee gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.2">Adapted from Fox et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.3">(2009).</span></p></figcaption></figure>
<p><a id="c11-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1">We next examined the relationships between knee flexion velocity at toe off, joint moments during double support, and improvements in stiff-knee gait following rectus femoris transfer surgery in individuals with cerebral palsy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.2">Subjects with stiff-knee gait tended to exhibit abnormally low knee flexion velocities at toe off and excessive knee extension moments during double support. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.3">Subjects with good outcomes following surgery showed substantial improvement in these metrics postoperatively; subjects with poor outcomes did not. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.4">Therefore, although stiff-knee gait is observed during the swing phase, its primary cause is abnormal muscle activity during late stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.5">As Carl Sagan once said, “You have to know the past to understand the present.”</span></p></section>
<section>
<h2><a id="c11-sec-0005"/><a id="c11-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1">Muscle actions over a range of walking speeds</span></h2>
<p class="paraaftertitle"><a id="c11-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1">We saw in Chapter 2 how walking speed influences joint kinematics and ground reaction forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.2">It should come as no surprise that muscle activations also change with walking speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.3">Activation patterns of key lower-limb muscles during walking at four speeds are shown in </span><a id="c11-fig-0009a"/><a href="#c11-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1">Figure 11.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.2">To obtain these patterns, Edith Arnold measured surface EMG signals from healthy subjects while they walked on a treadmill. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.3">The EMG signals were then high-pass-filtered at 30 Hz, rectified, and low-pass-filtered at 10 Hz (Figure 4.14). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.4">Each subject's filtered EMG measurements were normalized by the maximum EMG value detected for each muscle across a range of activities, including walking, running, and maximum voluntary contractions (i.e., after normalization, maximum activity = 1).</span></p>
<figure id="c11-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"><img src="../images/c11-fig-0008.jpg" alt="c11-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1">Figure 11.8</span></a></span> <a id="c11-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1">Average normalized EMG patterns for eleven muscles measured at four walking speeds (1.00–1.75 m/s). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.2">The raw EMG signals were rectified, filtered, and normalized to the maximum value detected for each muscle across a variety of activities. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.3">Data from Arnold et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.4">(2013).</span></p></figcaption></figure>
<p><a id="c11-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1">During typical walking, we observe activation of the gluteus maximus, gluteus medius, vastus lateralis, and vastus medialis in early stance, all of which make important contributions to the ground reaction force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.2">We also see strong activity of the tibialis anterior in early stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.3">During typical gait, the tibialis anterior generates force while it lengthens, acting as a brake to control the lowering of the foot to the ground (</span><a id="c11-fig-0010a"/><a href="#c11-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Figure 11.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">); “foot slap” may occur if the tibialis anterior is fatigued or paralyzed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.2">You may have felt soreness in your shins the day after a strenuous hike; this is from the strain the tibialis anterior experienced while serving as a brake. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.3">The tibialis anterior is also active during swing, to lift the toes and avoid tripping. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.4">In general, muscle activity increases with increasing walking speed (</span><a href="#c11-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">Figure 11.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.2">In late stance, the gastrocnemius and soleus become highly active as they accelerate the center of mass forward (</span><a href="#c11-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">Figure 11.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.2">The rectus femoris is most strongly activated at the beginning of the swing phase, whereas the hamstrings (including the biceps femoris long head and semitendinosis) are most strongly activated at the end of swing.</span></p>
<figure id="c11-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1"><img src="../images/c11-fig-0009.jpg" alt="c11-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0010a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">Figure 11.9</span></a></span> <a id="c11-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">The tibialis anterior is active at heel strike and generates force to control the lowering of the foot to the ground in early stance.</span></p></figcaption></figure>
<p><a id="c11-para-0039"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">Many individuals with neuromuscular impairments walk slowly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.2">Evaluating a patient's gait requires us to discriminate between deviations caused by pathology and changes that are simply due to walking slowly. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.3">Here, we examine how muscles modulate ground reaction forces at various walking speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.4">My research group worked with Michael Schwartz, a bioengineer at Gillette Children's Specialty Healthcare, to analyze three-dimensional muscle-driven simulations of walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.5">We used OpenSim to reproduce the motion of eight healthy individuals walking at four speeds: very slow, slow, natural, and fast (</span><a id="c11-fig-0011a"/><a href="#c11-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">Figure 11.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.2">These speed categories were defined based on nondimensional walking speeds: “fast” included walking trials that were at least one standard deviation faster than the mean “natural” walking speed for each individual, “slow” trials were between one and three standard deviations slower, and “very slow” trials were more than three standard deviations slower than natural.</span></p>
<figure id="c11-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"><img src="../images/c11-fig-0010.jpg" alt="c11-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0011a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1">Figure 11.10</span></a></span> <a id="c11-para-0040"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">Visualizations from muscle-driven simulations of a representative subject walking at four speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">Muscle color indicates simulated activation level, from no activation (blue) to full activation (red). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.3">Data from Liu et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.4">(2008).</span></p></figcaption></figure>
<p><a id="c11-para-0041"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">We found that muscle contributions to support and progression increase with walking speed, with especially large increases in the vasti between slow-speed and natural-speed walking (</span><a id="c11-fig-0012a"/><a href="#c11-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">Figure 11.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.2">During very slow and slow walking, a straighter limb in early stance—rather than muscles—provided a majority of the support against gravity.</span></p>
<figure id="c11-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1"><img src="../images/c11-fig-0011.jpg" alt="c11-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0012a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">Figure 11.11</span></a></span> <a id="c11-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">Contributions to the acceleration of the body's center of mass from key muscles at four walking speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">Each ray is the resultant vector of the vertical and fore–aft accelerations, averaged across 8 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.3">Adapted from Liu et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.4">(2008).</span></p></figcaption></figure>
<p><a id="c11-para-0043"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">These results highlight similarities between simple and muscle-driven dynamic walking models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.2">For example, in muscle-driven simulations, we observe forward acceleration (propulsion) from trailing-limb muscles and backward acceleration (braking) from leading-limb muscles during double support, which is consistent with the redirection of the mass center's velocity in simple models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.3">Max Donelan and colleagues (2002) used a simple model with rigid limbs to demonstrate that a force applied to the trailing limb redirects the velocity of the center of mass; muscle-driven simulations of walking reveal that the gastrocnemius and soleus play this role. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.4">In simple models, the braking influence of the strut-like leading limb arises from the passive transmission of the ground reaction force to the center of mass (Kuo, 2002). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.5">Similarly, in our slowest walking simulations, we observed that skeletal alignment served a strut-like function.</span></p>
<p><a id="c11-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">The differences between simple models and muscle-driven models are more apparent at faster walking speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.2">As walking speed increases, the magnitude of the fore–aft ground reaction force during early and late stance increases (Figure 2.20), which produces larger braking and propulsive forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.3">The muscle-driven simulations show that the gastrocnemius and soleus provide the required increased propulsion from the trailing limb. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.4">However, due to knee flexion, the leading limb is no longer strut-like at faster walking speeds and cannot transmit the ground reaction forces passively. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.5">Knee flexion in humans requires active modulation by the vasti, which provide the braking force from the leading limb.</span></p></section>
<section>
<h2><a id="c11-sec-0006"/><a id="c11-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">Muscle actions in crouch gait</span></h2>
<p class="paraaftertitle"><a id="c11-para-0045"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1">Many individuals with cerebral palsy walk in a crouch gait, in which the knee and hip are excessively flexed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.2">Walking in a crouched posture can cause knee pain and increase energy expenditure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.3">Understanding how muscles accelerate the center of mass during crouch gait can provide insight into the biomechanics of this condition and suggest methods to improve walking.</span></p>
<p><a id="c11-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">Muscle-driven simulations have revealed how the muscle contributions to vertical and fore–aft accelerations of the center of mass differ between crouch gait and typical gait, and how these muscle contributions change with crouch severity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.2">To calculate muscle contributions to the acceleration of the body's center of mass, Kat Steele analyzed three-dimensional simulations of walking for typically developing children and for children with cerebral palsy who walked with varying degrees of crouch severity (</span><a id="c11-fig-0013a"/><a href="#c11-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">Figure 11.12</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1">).</span></p>
<figure id="c11-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1"><img src="../images/c11-fig-0012.jpg" alt="c11-fig-0012.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0013a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">Figure 11.12</span></a></span> <a id="c11-para-0047"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1">Musculoskeletal models used to create muscle-driven simulations of individuals with typical gait (left) and individuals with cerebral palsy who walked with mild and moderate crouch gait (center and right). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">Adapted from Steele et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.3">(2013).</span></p></figcaption></figure>
<p><a id="c11-para-0048"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1">The simulations revealed that, as in unimpaired gait, two muscle groups are largely responsible for accelerating the center of mass upward and modulating fore–aft acceleration during crouch gait: the quadriceps and the ankle plantarflexors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.2">However, unlike in typical gait, these muscles accelerate the center of mass throughout stance and induce large, opposing fore–aft accelerations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.3">In crouch gait, the ankle plantarflexors accelerate the center of mass upward and forward while the vasti accelerate the center of mass upward and backward throughout stance (</span><a id="c11-fig-0014a"/><a href="#c11-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">Figure 11.13</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.2">Proper coordination of quadriceps and plantarflexor activity during unimpaired gait provides an efficient walking strategy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.3">This strategy is compromised during crouch gait, and these muscles are required to make more sustained contributions to vertical and fore–aft accelerations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.4">It's like driving with the brakes on (</span><a id="c11-fig-0015a"/><a href="#c11-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">Figure 11.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">).</span></p>
<figure id="c11-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1"><img src="../images/c11-fig-0013.jpg" alt="c11-fig-0013.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0014a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">Figure 11.13</span></a></span> <a id="c11-para-0049"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1">During crouch gait, the vasti and plantarflexors are active throughout stance and produce sustained ground reaction forces in the upward direction to support body weight, but these muscle groups also produce opposing ground reaction forces in the forward and backward directions.</span></p></figcaption></figure>
<figure id="c11-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1"><img src="../images/c11-fig-0014.jpg" alt="c11-fig-0014.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0015a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">Figure 11.14</span></a></span> <a id="c11-para-0050"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">Fore–aft accelerations of the center of mass produced by the gastrocnemius and vasti during stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.2">The blue-shaded region indicates the experimentally measured acceleration of the center of mass (i.e., fore–aft ground reaction force divided by body mass). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.3">Data from Steele et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.4">(2013).</span></p></figcaption></figure>
<p><a id="c11-para-0051"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">In the erect posture of unimpaired gait, a larger portion of body weight is supported by skeletal alignment than when in a crouched posture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.2">As a result, greater forces are generated by the muscles that support body weight in crouch gait, contributing to the inefficiency of walking in a crouched posture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.3">The forces produced by the quadriceps, for example, are significantly greater in crouch gait than in unimpaired gait, and these muscle forces increase with crouch severity (</span><a id="c11-fig-0016a"/><a href="#c11-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">Figure 11.15</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.2">Our simulations indicate that increasing crouch severity is also associated with increasing knee loads, which may wear out knee joints and cause pain.</span></p>
<figure id="c11-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1"><img src="../images/c11-fig-0015.jpg" alt="c11-fig-0015.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0016a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">Figure 11.15</span></a></span> <a id="c11-para-0052"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1">Average knee flexion angle (top), compressive knee force (center), and quadriceps force (bottom) during one gait cycle for subjects who walked with unimpaired gait and with mild, moderate, and severe crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.2">Data from Steele et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.3">(2012).</span></p></figcaption></figure>
<p><a id="c11-para-0053"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">Our simulations also revealed that a crouched posture increases the demand on muscles to accelerate the center of mass upward due to a decrease in skeletal support. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.2">The quadriceps and ankle plantarflexors produce the greatest upward acceleration of the center of mass during crouch gait, but the ability of the gluteus medius to accelerate the center of mass upward is compromised in crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.3">During unimpaired gait, the gluteus medius accelerates the center of mass upward in midstance during the transition from quadriceps to ankle plantarflexor activity. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.4">When walking in a crouched posture, the gluteus medius contribution to upward acceleration is reduced; thus, the contributions from the quadriceps and plantarflexors must be sustained over a greater portion of the gait cycle to support the center of mass in midstance (</span><a href="#c11-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1">Figure 11.14</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">).</span></p>
<p><a id="c11-para-0054"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">The above results provide useful guidance on treatment options. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.2">Demand on the vasti and rectus femoris is greater when walking in a crouched posture and may contribute to fatigue. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.3">Strength training or other programs that improve the endurance of these muscles may help to reduce fatigue in individuals with crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.4">The ankle plantarflexors are critical muscles for accelerating the center of mass upward and forward during crouch gait and are good targets for strength training programs. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.5">Jack Engsberg and colleagues (2006) reported an improvement in knee flexion during stance after strengthening the ankle plantarflexors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.6">Weakening the gastrocnemius or soleus by tendon lengthening surgeries, neuromuscular toxin injections, or other procedures that are commonly performed on individuals with cerebral palsy could </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1">reduce</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1"> an individual's ability to support their body weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.2">Ankle–foot orthoses and active devices that assist the ankle plantarflexors may reduce knee flexion, reduce knee loads, and improve walking efficiency in people with crouch gait.</span></p>
<p><a id="c11-para-0055"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">How did we use insights from muscle-driven simulations to improve the gait of the 13-year-old girl I introduced at the beginning of the chapter? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.2">First, we used a musculoskeletal model to determine that her hamstrings were of sufficient length for normal walking, so short hamstrings were not a likely cause of her crouch gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.3">She was a candidate for a hamstring lengthening surgery, but I recommended against this surgery. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.4">Second, we looked carefully at the strength of her ankle plantarflexors. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.5">We understood from the muscle-driven simulations that the soleus muscle is important for generating upward accelerations of the center of mass. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.6">Her plantarflexors were weak and could generate less than half of the ankle moments required to walk with a typical gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.7">Her physical therapist recommended a lightweight, spring-loaded ankle brace that would fit inside her shoe and produce ankle plantarflexion moments to augment her muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.8">Two weeks later, she was walking with her new brace in a more upright posture. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.9">No painful surgery was necessary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.10">Her plantarflexion moments were greater, and more importantly, the ankle brace allowed her to walk with less flexion of her knees and hips. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.11">She still walked with a mild crouch, but she was able to stand taller and keep up with her friends.</span></p></section>
<section>
<h2><a id="c11-sec-0007"/><a id="c11-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">Heel-walking and toe-walking</span></h2>
<p class="paraaftertitle"><a id="c11-para-0056"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Weakness and tightness of the ankle plantarflexor muscles are often present in individuals with cerebral palsy, stroke, and muscular dystrophy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.2">Recall that muscle contracture (tightness) will result in higher passive stiffness in the affected muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.3">Determining cause–effect relationships between these muscular deficits and observed gait pathologies, like heel-walking and toe-walking, is complicated by co-occurring conditions such as skeletal deformities and neural deficits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.4">Carmichael Ong used muscle-driven simulations to predict gait adaptations in response to plantarflexor weakness and contracture, in isolation from other deficits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.5">Carmichael developed a planar model with 9 degrees of freedom (rotation and translation of the pelvis in the sagittal plane, and flexion of the hip, knee, and ankle of each leg) and 9 muscle–tendon actuators per leg representing the major muscle groups of the lower limb. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.6">He used dynamic optimization (see Figure 9.15) to find muscle coordination strategies that minimize cost of transport while avoiding falls and injuries. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.7">Optimizations using an unimpaired model resulted in gaits that reproduced experimental measurements of kinematics, kinetics, and energy expenditure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.8">After having validated the simulation framework, he repeated the optimization procedure using models with plantarflexor weakness and contracture—under the assumption that these muscular deficits would not affect one's desire to walk with minimum cost of transport. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.9">Weakness was modeled by reducing the maximum isometric force of the soleus and gastrocnemius; contracture, by reducing their optimal fiber lengths.</span></p>
<p><a id="c11-para-0057"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1">The optimizer produced stable gaits in all cases, regardless of muscular deficit. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.2">That is, each model was able to “learn” how to walk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.3">Weakness of the plantarflexor muscles decreased the model's capacity to generate ankle plantarflexion moments, which are critical for producing forward propulsion during walking (</span><a href="#c11-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">Figure 11.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.2">As a consequence, the weakened model walked slower than the unimpaired model, an effect that is also observed in patients who have plantarflexor weakness. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.3">Furthermore, plantarflexor weakness caused the model to adopt a “heel-walking” or calcaneal gait, landing with substantially greater ankle dorsiflexion (</span><a id="c11-fig-0017a"/><a href="#c11-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">Figure 11.16</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">), which is also observed in some patients whose plantarflexors are weak yet flexible. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.2">By contrast, plantarflexor muscle contracture resulted in a “toe-walking” or equinus gait, where the model landed on its toes at foot contact and remained on its toes throughout stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.3">Severe plantarflexor contracture also resulted in crouch gait.</span></p>
<figure id="c11-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1"><img src="../images/c11-fig-0016.jpg" alt="c11-fig-0016.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0017a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">Figure 11.16</span></a></span> <a id="c11-para-0058"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">Dynamic optimizations that minimize cost of transport predict calcaneal gait when plantarflexor muscles are weak (top) and equinus gait when plantarflexor muscles have contracture (bottom). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.2">Adapted from Ong et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.3">(2019).</span></p></figcaption></figure>
<p><a id="c11-para-0059"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">Simulation studies like this one are useful for elucidating cause–effect relationships that would be difficult to disentangle from other factors in an experimental study. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">This is a critical point because surgical interventions are based on cause–effect reasoning. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.3">If we do not know the cause of a patient's crouch gait, or if we assess it incorrectly, we may subject the patient to an unnecessary and ineffective surgery.</span></p></section>
<section>
<h2><a id="c11-sec-0008"/><a id="c11-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">Device-assisted walking</span></h2>
<p class="paraaftertitle"><a id="c11-para-0060"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">Exoskeleton devices can augment the capabilities of the human body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.2">Some of the earliest exoskeleton-like devices were conceived in the late 1800s to assist walking, running, and jumping (</span><a id="c11-fig-0018a"/><a href="#c11-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">Figure 11.17</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">), but only recently have such devices become practical. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.2">We can use muscle-driven simulations to improve these devices and guide design of new technologies.</span></p>
<figure id="c11-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1"><img src="../images/c11-fig-0017.jpg" alt="c11-fig-0017.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0018a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1">Figure 11.17</span></a></span> <a id="c11-para-0061"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Illustration from a nineteenth-century patent describing the invention of Nicholas Yagn. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.2">From Yagn (1890).</span></p></figcaption></figure>
<p><a id="c11-para-0062"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">The first powered exoskeleton wasn't built until the 1960s, and it was another four decades before the technology had advanced to the point of practical application. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.2">Braces and powered exoskeletons can now improve mobility following a stroke or spinal cord injury (</span><a id="c11-fig-0019a"/><a href="#c11-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">Figure 11.18</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">), support and stabilize the body to prevent injuries, and endow users with superhuman strength. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.2">This timeline of about 70 years from conception to successful implementation reflects the considerable challenge of designing, building, and testing devices that interact harmoniously with a complex, finely tuned biological system.</span></p>
<figure id="c11-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1"><img src="../images/c11-fig-0018.jpg" alt="c11-fig-0018.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0019a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">Figure 11.18</span></a></span> <a id="c11-para-0063"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">One of the first exoskeletons to help patients with stroke and spinal cord injury regain bipedal locomotion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.2">Image courtesy of Ekso Bionics.</span></p></figcaption></figure>
<p><a id="c11-para-0064"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">A common goal among device designers has been to reduce the metabolic cost of unimpaired walking—a challenging task given the efficiency of natural gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.2">Designers have made progress using physical prototypes and relatively simple mathematical models. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.3">The first exoskeleton to reduce the metabolic cost of walking was reported by Philippe Malcolm and colleagues in 2013. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.4">Their device was worn on the shank and used a pneumatic muscle that was attached to the shoe (and tethered to an air compressor) to apply an ankle plantarflexion moment during late stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.5">Malcolm reported a metabolic savings of about 6 percent compared to natural walking.</span></p>
<p><a id="c11-para-0065"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">The following year, Luke Mooney and colleagues reported savings of about 10 percent with a powered but untethered device that used a similar assistance strategy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.2">In 2015, Steve Collins and colleagues accomplished the same feat with an unpowered ankle exoskeleton, leading to the provocative suggestion that the structure of the human body could, in theory, further evolve to be more efficient during walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.3">Their device reduced metabolic cost by about 7 percent using a passive clutch mechanism to engage and disengage a spring acting in parallel with the calf muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.4">This assistance strategy exploits the fact that, unlike a muscle, a clutched cord requires no energy to maintain its length under tension.</span></p>
<p><a id="c11-para-0066"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1">Despite these amazing accomplishments, experimental approaches to device design are limited in several ways. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.2">For example, building physical prototypes can be expensive and time-consuming, and it can be difficult to obtain insight about interactions between the musculoskeletal system and an assistive device from experiments alone—that is, without knowledge of muscle forces or muscle energy consumption.</span></p>
