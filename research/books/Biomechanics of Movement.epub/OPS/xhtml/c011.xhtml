<p><a id="c11-para-0067"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Muscle-driven simulations can be used to explore new assistance strategies without building physical prototypes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.2">Simulations are also useful for testing hypothetical, ideal devices—devices that are massless, provide lossless transmission of torques to the limbs, and have no torque or power limits. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.3">Thus, we can use simulations of ideal devices to compare assistance strategies independent of other practical challenges. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.4">For example, Chris Dembia and colleagues generated muscle-driven simulations of walking while carrying a 38 kg load, and predicted the effectiveness of seven ideal assistive devices for load-carrying tasks (</span><a id="c11-fig-0020a"/><a href="#c11-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Figure 11.19</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.2">Although devices that apply ankle plantarflexion torques have received much of the focus to date, other assistance strategies (e.g., assisting hip flexion and abduction) may provide greater metabolic savings while also requiring less actuator power.</span></p>
<figure id="c11-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1"><img src="../images/c11-fig-0019.jpg" alt="c11-fig-0019.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0020a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">Figure 11.19</span></a></span> <a id="c11-para-0068"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1">Muscle-driven simulations predicted the performance of seven ideal devices for assisting walking while carrying a 38 kg load. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.2">The most promising devices are those that achieve high savings but have low power requirements. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.3">Adapted from Dembia et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.4">(2017).</span></p></figcaption></figure>
<p><a id="c11-para-0069"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">Muscle-driven simulations complement experiments by providing detailed analyses of muscle-level dynamics and energy consumption. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.2">Chris found that, in general, the optimal device torque profiles differ from the net joint moments generated by muscles during unassisted gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.3">For example, the ideal ankle plantarflexion device applied a torque that peaked later in the gait cycle and had only about half the magnitude of the ankle moment generated by muscles when unassisted (</span><a id="c11-fig-0021a"/><a href="#c11-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Figure 11.20</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.2">The ankle plantarflexion device did most of the work performed by the soleus, but the gastrocnemius remained active due to its contribution to the required knee flexion moment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.3">Assistive devices can affect the activity of muscles throughout the limb; muscle-driven simulations can provide biomechanical explanations for these effects, and can help determine the timing and magnitude of optimal assistive torques. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.4">Computer-aided design has already revolutionized the process of engineering products from appliances to airplanes; it has similar potential for accelerating development of exoskeletons.</span></p>
<figure id="c11-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1"><img src="../images/c11-fig-0020.jpg" alt="c11-fig-0020.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c11-fig-0021a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">Figure 11.20</span></a></span> <a id="c11-para-0070"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">Muscle-level analysis of ankle plantarflexion device for assisting loaded walking (average from 7 subjects). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.2">Our simulations predicted differences between joint moments when unassisted (dashed lines) and assisted (solid lines), with far greater reductions in the soleus than the gastrocnemius. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.3">Adapted from Dembia et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.4">(2017).</span></p></figcaption></figure>
