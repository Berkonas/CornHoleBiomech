<p class="paraaftertitle"><a id="c8-para-0097"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.397.1">If the ground reaction forces are not known, then there are five unknowns in the dynamic equations for the foot: </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.398.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.399.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.400.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.401.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.402.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.403.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.404.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.405.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.406.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.407.1">Fx</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.408.1">g</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.409.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.410.1">Fy</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.411.1">g</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.2">The system is underdetermined, and we require additional information to complete an inverse dynamic analysis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.412.3">One strategy is to replace Equations 8.4c, 8.5c, and 8.7c with the dynamic equations for the HAT (</span><a href="#c8-fig-0038"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.413.1">Figure 8.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.414.1">):</span></p>
<p><a id="c8-para-0098"/></p>
<figure id="c8-fig-0039"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.415.1"><img src="../images/c8-fig-3015a.jpg" alt="c8-fig-3015a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0099"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.416.1">(8.15a)</span></p></figcaption></figure>

<p><a id="c8-para-0100"/></p>
<figure id="c8-fig-0040"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.417.1"><img src="../images/c8-fig-3015b.jpg" alt="c8-fig-3015b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0101"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.418.1">(8.15b)</span></p></figcaption></figure>

<p><a id="c8-para-0102"/></p>
<figure id="c8-fig-0041"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.419.1"><img src="../images/c8-fig-3015c.jpg" alt="c8-fig-3015c.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0103"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.420.1">(8.15c)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.421.1">Provided that the kinematics of the HAT have been measured, Equations 8.15 comprise a linear system of three equations in three unknowns (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.422.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.423.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.424.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.425.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.426.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.427.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.428.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.429.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.2">If we use Equations 8.15 instead of the three equations we derived from the free-body diagram of the foot segment, we obtain a system of nine equations in nine unknowns as we had in the previous section. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.3">Note, however, that our sequential calculations now begin at the HAT (sometimes referred to as a “top-down” algorithm) rather than the foot (a “bottom-up” algorithm). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.430.4">Thus, we would be relying on our measurements of the HAT segment kinematics (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.431.1">θ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.432.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.433.1"> and potentially noisy derivatives thereof) rather than measurements of the ground reaction forces (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.434.1">Fx</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.435.1">g</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.436.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.437.1">Fy</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.438.1">g</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.2">Recall our assumption that the head, arms, and torso act as a single rigid body whose inertia is constant and whose center of mass location is known. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.439.3">These assumptions are likely to introduce greater uncertainty in our results than measurements of the ground reaction forces, which are typically reliable as long as the force plate has been properly calibrated.</span></p></section>
<section>
<h2><a id="c8-sec-0006"/><a id="c8-title-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.440.1">Verifying dynamic consistency</span></h2>
<p class="paraaftertitle"><a id="c8-para-0104"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.1">What if we have confidence in our measurements of both the ground reaction forces and the HAT segment kinematics? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.2">In that case, we have an overdetermined system (i.e., more equations than unknowns) and can use the “extra” information to improve the model performance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.441.3">For example, we can begin at the foot segment and use the equations we derived when assuming that the ground reaction forces are known to obtain the net forces and moments applied at the hip (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.442.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.443.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.444.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.445.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.446.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.447.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.448.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.449.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.450.2">We can then </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.451.1">apply</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.452.1"> these forces to the HAT segment and use the model to predict the HAT segment's linear and angular accelerations (forward dynamics):</span></p>
<p><a id="c8-para-0105"/></p>
<figure id="c8-fig-0042"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.453.1"><img src="../images/c8-fig-3016a.jpg" alt="c8-fig-3016a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0106"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.454.1">(8.16a)</span></p></figcaption></figure>

<p><a id="c8-para-0107"/></p>
<figure id="c8-fig-0043"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.455.1"><img src="../images/c8-fig-3016b.jpg" alt="c8-fig-3016b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0108"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.456.1">(8.16b)</span></p></figcaption></figure>

<p><a id="c8-para-0109"/></p>
<figure id="c8-fig-0044"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.457.1"><img src="../images/c8-fig-3016c.jpg" alt="c8-fig-3016c.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0110"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.458.1">(8.16c)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.1">These predictions can then be compared with the measured accelerations of the torso to adjust model parameters such as the mass, inertia, and center of mass location of the HAT segment, parameters with which there is typically a high amount of uncertainty. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.459.2">A similar approach is to apply fictitious forces to the HAT segment's center of mass so that the model experiences the same accelerations that were measured (i.e., so that the model's motion is dynamically consistent with the observations), and then adjust the parameters of the model to minimize these fictitious or “residual” forces.</span></p>
<p><a id="c8-para-0111"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.1">Adjusting model parameters to improve dynamic consistency can be a time-consuming and subjective task when done by hand. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.460.2">Art Kuo proposed a method to find the best compromise among all observations in an objective way, simply by assembling all dynamic equations into an overdetermined system of the form </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.461.1"><img src="../images/c8-fig-6027.jpg" alt="c8-fig-6027.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.462.1"> and computing the pseudoinverse </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.463.1">A</span></i><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.464.1">+</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.465.1"> of matrix </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.466.1">A</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.467.2">The solution </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.468.1"><img src="../images/c8-fig-6028.jpg" alt="c8-fig-6028.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.469.1"> then represents a least-squares “best fit” to the measured ground reaction forces and joint kinematics (Kuo, 1998).</span></p>
<p><a id="c8-para-0112"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.1">Now that we have seen how to solve a simple two-dimensional inverse dynamics problem by hand, we can move on to solve more realistic three-dimensional inverse dynamics problems. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.470.2">These tools allow us to estimate the net moments about the hip, knee, and ankle during walking and running.</span></p></section>
<section>
<h2><a id="c8-sec-0007"/><a id="c8-title-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.471.1">Joint moments during walking and running</span></h2>
<p class="paraaftertitle"><a id="c8-para-0113"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.1">Edith Arnold and Sam Hamner were working in my lab and wanted to examine the changes in joint moments during walking and running at different speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.472.2">They collected experimental marker positions and ground reaction forces as subjects walked and ran on a treadmill, and then used OpenSim to perform three-dimensional inverse kinematic and inverse dynamic analyses.</span></p>
<p><a id="c8-para-0114"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.473.1">During walking and running, we see that the produced joint moments are generally greater during stance than during swing (</span><a id="c8-fig-0045a"/><a id="c8-fig-0046a"/><a href="#c8-fig-0045"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.474.1">Figures 8.9 and 8.10</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.2">Of all lower-limb joint moments, the peak ankle plantarflexion moment is greatest. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.3">At slow walking speeds, swing is largely passive (i.e., moments are low), an assertion that we will confirm when we investigate muscle activity during walking in Chapter 11. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.4">Also notice the systematic increases in joint moments with increasing walking and running speed, and that the joint moments are higher in running than walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.475.5">These higher joint moments indicate greater muscle activity and, together with the higher ground reaction forces, result in larger joint loads during running than walking.</span></p>
<figure id="c8-fig-0045"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.476.1"><img src="../images/c8-fig-0009.jpg" alt="c8-fig-0009.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0045a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.477.1">Figure 8.9</span></a></span> <a id="c8-para-0115"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.1">Representative joint moments over the gait cycle when walking at several speeds. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.2">Normalized by body mass and averaged over 10 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.3">Vertical lines on the horizontal axis indicate toe off at each speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.4">Data from Arnold et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.478.5">(2013).</span></p></figcaption></figure>
<figure id="c8-fig-0046"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.479.1"><img src="../images/c8-fig-0010.jpg" alt="c8-fig-0010.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0046a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.480.1">Figure 8.10</span></a></span> <a id="c8-para-0116"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.481.1">Representative joint moments over the gait cycle when running at several speeds (walking at 1.5 m/s from </span><a href="#c8-fig-0045"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.482.1">Figure 8.9</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.1"> is shown for reference). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.2">Normalized by body mass and averaged over 10 subjects. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.3">Vertical lines on the horizontal axis indicate toe off at each speed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.483.4">Data from Hamner and Delp (2013).</span></p></figcaption></figure></section>
<section>
<h2><a id="c8-sec-0008"/><a id="c8-title-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.484.1">Gait retraining to reduce knee loads and pain</span></h2>
<p class="paraaftertitle"><a id="c8-para-0117"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.1">Knee osteoarthritis affects about 20 percent of adults over the age of 45 and can cause pain, restrict physical activity, and decrease one's quality of life. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.485.2">Although it is often treated by surgical intervention, such as a total joint replacement, it would be preferable to avoid surgery—provided that we can find another effective treatment.</span></p>
<p><a id="c8-para-0118"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.1">Remarkably, Pete Shull and his colleagues have discovered a nonsurgical approach to treating knee osteoarthritis that reduces knee loads and relieves pain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.486.2">In many patients, an effective treatment is simply to learn how to walk with a reduced foot progression angle, or with more of a toe-in gait (</span><a id="c8-fig-0047a"/><a href="#c8-fig-0047"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.487.1">Figure 8.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.488.1">, top right).</span></p>
<figure id="c8-fig-0047"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.489.1"><img src="../images/c8-fig-0011.jpg" alt="c8-fig-0011.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0047a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.490.1">Figure 8.11</span></a></span> <a id="c8-para-0119"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.1">The ground reaction force generates an external knee adduction moment, which loads the medial compartment of the knee. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.2">Walking with a toe-in gait can reduce the peak knee adduction moment in many people and provides a nonsurgical treatment option for patients with medial compartment knee osteoarthritis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.3">Data from Shull et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.4">(2013). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.491.5">X-ray image courtesy of Julie Thompson-Kolesar.</span></p></figcaption></figure>
<p><a id="c8-para-0120"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.1">We can understand why this strategy works by looking at the geometry of knee joints and the frontal-plane dynamics during walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.2">Throughout most of this book, we have focused on motions and moments in the sagittal plane; however, the motions and moments in the frontal plane are critical in the development and treatment of knee osteoarthritis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.492.3">As shown in </span><a href="#c8-fig-0047"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.493.1">Figure 8.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.1">, the ground reaction force generates an external knee adduction moment during stance. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.2">(Please note that our convention in this book is to report the “internal” moments generated by muscles, as opposed to the “external” moments of ground reaction forces; but we report external moments in this example to match the literature on this topic.) This moment acts to load the medial compartment of the knee, which typically supports about 50 percent more weight than the lateral compartment during walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.3">The peak knee adduction moment typically occurs in early stance; in individuals with knee osteoarthritis, the magnitude of this peak has been linked to the severity and progression of medial compartment osteoarthritis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.4">Note that a large ground reaction force (e.g., due to obesity or engaging in high-impact activities) increases the load on the knee and can contribute to a loss of cartilage in the medial compartment. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.494.5">A lack of exercise can also lead to poor cartilage health.</span></p>
<p><a id="c8-para-0121"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.1">Once osteoarthritis has developed, reducing the knee adduction moment (and therefore the load on the medial compartment) can alleviate pain and improve function. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.2">Surgery can reduce the knee adduction moment by up to 30 percent. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.495.3">But as shown in </span><a href="#c8-fig-0047"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.496.1">Figure 8.11</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.1">, patients with medial compartment osteoarthritis were able to reduce the adduction moment simply by adjusting their foot progression angle (i.e., walking with more of a toe-in gait). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.2">This improvement reduced the adduction moment more than other nonsurgical treatments, such as braces or insoles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.3">Decreasing the foot progression angle shifted the knee joint center medially and the center of pressure laterally, both of which reduced the moment arm of the ground reaction force at the knee. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.4">This simple gait modification was easy to learn and remarkably effective, decreasing pain and improving function in the study participants (Shull et al., 2013). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.497.5">Scott Uhlrich has recently shown that even greater improvements can be achieved by personalizing the gait retraining program (Uhlrich et al., 2018).</span></p>
<p><a id="c8-para-0122"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.1">In this chapter, we have seen that inverse dynamics is a useful technique for computing the net forces and moments that must be present at each joint to produce an observed motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.2">However, we have not yet discussed the role of muscles, so our inverse dynamics story is still incomplete. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.3">This omission is important for two reasons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.4">First, as we mentioned at the outset, the net joint forces computed in this chapter are not the same as the contact forces experienced by the cartilage in the joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.5">For example, we can easily imagine two ways in which a net joint moment can be zero. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.6">In one scenario, the muscles spanning the joint are inactive and generating no force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.7">In another scenario, two muscles on opposite sides of the joint are generating large forces but producing equal and opposite moments about the joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.8">In each case, the net joint moment is zero, but the joint contact forces in the second scenario would be higher. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.498.9">We would expect to see more wear and tear on the cartilage in the second scenario because of the high compressive loads produced by the muscles, even though the net joint moment is the same.</span></p>
<p><a id="c8-para-0123"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.1">A second reason to take account of individual muscle forces is that our bodies have a great deal of redundancy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.2">There are many ways to accomplish most of the tasks we ask our muscles to do. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.3">That's a good thing: it means that if one muscle is fatigued or injured, others can pick up the slack. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.499.4">Net forces tell us what the body </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.500.1">must</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.1"> do, but by bringing individual muscles into our models, we start to appreciate the variety of options for accomplishing these tasks. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.501.2">Understanding how our brain chooses among the available options is one of the most fascinating problems in biomechanics, a problem we will turn to in the next chapter.</span></p>
<p><a id="c8-para-0124"/></p>
<figure id="c8-fig-0048"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.502.1"><img src="../images/c8-fig-5002.jpg" alt="c8-fig-5002.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>
</section>
