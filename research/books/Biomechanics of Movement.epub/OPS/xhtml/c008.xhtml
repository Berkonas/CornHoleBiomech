<section epub:type="chapter" role="doc-chapter">
<header>
<h1><a id="c8-title-0001"/><span class="chapterNumber"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.1.1">8</span></span> <br/><span class="chapterTitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.2.1">Inverse Dynamics</span></span></h1>
</header>
<blockquote class="quote-epigraph">
<p class="quote-epigraphparafirst"><a id="c8-para-0001"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.3.1">To every action there is always opposed an equal reaction.</span></p>
<p class="quote-epigraphsource"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.4.1">—Sir Isaac Newton</span></p></blockquote>
<p><a id="c8-para-0002"/></p>
<figure id="c8-fig-0001"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.5.1"><img src="../images/c8-fig-5001.jpg" alt="c8-fig-5001.jpg"/></span><figcaption class="figurecaption">
</figcaption></figure>

<p class="paraaftertitle"><a id="c8-para-0003"/><b><span class="smallcaps"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.6.1">by the time my mother</span></span></b><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.1"> was 75 years old she could barely walk. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.2">Her right knee hurt with every step, and ascending stairs was out of the question. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.3">Too much pain. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.4">She wanted to play with my kids but could not keep up. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.5">Not being able to walk limited her participation in life and took a psychological toll. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.7.6">An X-ray of her knee showed that she had severe osteoarthritis, a degenerative joint disease that affects over 30 million individuals in the United States (</span><a id="c8-fig-0002a"/><a href="#c8-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.8.1">Figure 8.1</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.9.1">).</span></p>
<figure id="c8-fig-0002"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.10.1"><img src="../images/c8-fig-0001.jpg" alt="c8-fig-0001.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0002a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.11.1">Figure 8.1</span></a></span> <a id="c8-para-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.1">X-ray of a knee showing signs of osteoarthritis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.2">Notice that the bones are in contact on the medial side of the knee (see arrow); the lateral side has retained more cartilage, which appears as space between the femur and tibia. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.12.3">Image courtesy of Julie Thompson-Kolesar.</span></p></figcaption></figure>
<p><a id="c8-para-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.1">Osteoarthritis occurs when the cartilage surfaces that cap the ends of bones wear out. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.2">Cartilage is slippery and unequipped to sense pain, so it's an excellent material for allowing our joints to move freely without us feeling a thing. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.13.3">When cartilage wears out, however, it exposes the underlying bone, which is extremely sensitive to pressure and produces more friction, leading to joints that feel painful and stiff.</span></p>
<p><a id="c8-para-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.1">Overloading the knee contributes to the wear and tear that leads to osteoarthritis, yet it is impossible to measure the loads within a joint without performing a surgery to install a sensor in it. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.2">This has been done in only a few brave people who needed surgery for other reasons. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.3">Thus, we usually resort to other methods for estimating the loads within joints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.14.4">Solving an inverse dynamics problem provides some of the information we need to estimate joint contact loads, an essential step toward understanding why biological joints fail.</span></p>
<p><a id="c8-para-0007"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.1">When engineered products fail, forensic engineers seek to determine the root causes of these failures and, ultimately, the legal liability of those involved. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.2">For example, forensic engineers with expertise in biomechanics are employed by law firms to evaluate the legitimacy of injury claims following vehicle collisions. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.3">Physical evidence like tire skid marks can be used to estimate the forces and accelerations during the collision. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.15.4">The process of reconstructing an accident is an example of an inverse problem because indirect observations are used to study phenomena for which one is unable to obtain direct measurements.</span></p>
<p><a id="c8-para-0008"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.16.1">In Chapter 7, we introduced the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.17.1">inverse kinematics</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.1"> problem, an example of which is determining the pose of a subject's skeleton from measurements of the locations of skin-mounted optical markers in a global reference frame. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.2">Our goal in that chapter was limited; we were simply answering the question: What happened? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.3">In other words, what joint angles must have been present to produce the marker trajectories that were observed? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.4">In this chapter, we dig deeper and ask: What made it happen? </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.18.5">Specifically, what forces and moments were responsible for producing the observed motion?</span></p>
<p><a id="c8-para-0009"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.19.1">The process of determining forces and moments from kinematics is known as </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.20.1">inverse dynamics</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.2">It is different from inverse kinematics because we are interested in the forces that produce the motion, not just the motion itself. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.21.3">It is also different from </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.22.1">forward dynamics</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.23.1">, where we predict the motion that will result when specified forces are applied to a system.</span></p>
<p><a id="c8-para-0010"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.1">An inverse dynamics problem can be solved in a few ways. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.2">Typically, we use measurements of the ground reaction forces if they are available, so we will begin by briefly discussing techniques for measuring these forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.3">We then show a detailed example of how to compute joint moments during a squat. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.4">In this example, we work from the ground up, using measurements of the ground reaction forces and propagating this information upward through the leg joints. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.24.5">It is also possible to work from the top down, if we have reliable measurements of the motions of all the body segments.</span></p>
<p><a id="c8-para-0011"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.25.1">Note that the forces we compute in this chapter are </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.26.1">not</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.1"> the forces that would be measured in a biological joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.2">To compute joint contact loads, we must also estimate the forces applied by our muscles. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.3">This is a nontrivial problem and will be the focus of Chapter 9. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.27.4">For now, just note that the same motion and external forces could be measured as a result of vastly different muscle coordination strategies, which would produce different joint contact loads (yet the same solution to an inverse dynamics problem).</span></p>
<p><a id="c8-para-0012"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.1">Interestingly, if we have access to the ground reaction forces as well as the motions of all the body segments, then we obtain an overdetermined system of equations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.2">In this case, we can use the additional information to minimize the consequences of measurement error, a strategy that echoes the constrained inverse kinematics algorithm described in Chapter 7. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.3">We close this chapter with an example that demonstrates how an inverse dynamic analysis has been used to evaluate a nonsurgical treatment for patients with knee osteoarthritis. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.28.4">This treatment could have helped my mother had I thought of it twenty years earlier.</span></p>
<section>
<h2><a id="c8-sec-0001"/><a id="c8-title-0002"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.29.1">Measuring external forces</span></h2>
<p class="paraaftertitle"><a id="c8-para-0013"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.30.1">Newton's three laws of motion are stated in his landmark book </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.31.1">Philosophiæ naturalis principia mathematica</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.32.1"> (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.33.1">Mathematical Principles of Natural Philosophy</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.1">), first published in 1687. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.34.2">Newton's second law is among the most important equations ever derived; Andrew Motte's 1729 translation from the original Latin states it as follows:</span></p>
<blockquote class="quote">
<p class="quoteparafirst"><a id="c8-para-0014"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.35.1">Law II: The alteration of motion is ever proportional to the motive force impress'd; and is made in the direction of the right line in which that force is impress'd.</span></p></blockquote>
<p class="paraaftertitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.1">In other words, the rate of change of a particle's momentum is equal to and in the direction of an applied force. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.36.2">Newton's second law is now generally known as </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.37.1"><img src="../images/c8-fig-6001.jpg" alt="c8-fig-6001.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.38.1">, where </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.39.1"><img src="../images/c8-fig-6002.jpg" alt="c8-fig-6002.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.40.1"> is the vector sum of all forces applied to a body, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.41.1">m</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.42.1"> is the mass of the body, and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.43.1"><img src="../images/c8-fig-6003.jpg" alt="c8-fig-6003.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.1"> is the (linear) acceleration of its center of mass. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.2">This version follows from the original version, provided that the mass of the body does not change during the motion, an assumption that is reasonable in most applications. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.3">(A notable exception is rocketry.) Leonhard Euler later extended Newton's laws to apply to rotational motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.4">Euler's second law tells us that the rate of change of a body's angular momentum about its center of mass is equal to the sum of all moments acting about this point. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.44.5">(See Equation 8.6 below for a formal mathematical statement.)</span></p>
<p><a id="c8-para-0015"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.1">If the mass and acceleration of each body segment are known, we can use Newton's and Euler's laws to determine the forces and moments applied to each body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.2">Depending on the movement under investigation, there may be external forces acting on the subject, such as gravity, air resistance, or ground reaction forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.3">These external forces appear in the free-body diagram of the subject and must be either measured or estimated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.45.4">In most cases of human movement, it is reasonable to neglect forces due to air resistance and to use a gravitational acceleration of </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.46.1">g</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.47.1"> = 9.81 m/s</span><sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.48.1">2</span></sup><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.1"> for computing weight. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.49.2">We usually prefer to measure ground reaction forces and other contact forces whenever possible to improve the accuracy of our calculations, as demonstrated below.</span></p>
<p><a id="c8-para-0016"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.1">The first devices for measuring foot–ground contact forces were designed in the late 1800s by Étienne-Jules Marey and his student Gaston Carlet. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.2">By embedding pressure transducers into the sole of a shoe, Marey and Carlet were able to estimate the forces exerted between the foot and the ground during gait. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.3">The characteristic double-humped vertical component of the ground reaction force during walking was first reported in Carlet's Ph.D. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.4">thesis, which was published in 1872—the same year that Leland Stanford hired Eadweard Muybridge to determine whether a horse was ever completely airborne when trotting (see Figure 7.1). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.50.5">I find it remarkable that two of the most important quantitative tools for modern biomechanics were developed simultaneously, by two researchers (Carlet and Muybridge) who almost certainly had no idea of what the other was doing.</span></p>
<p><a id="c8-para-0017"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.51.1">In modern experiments, ground reaction forces are measured using one or more </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.52.1">force plates</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.53.1">: flat, rigid platforms supported by load sensors (</span><a id="c8-fig-0003a"/><a href="#c8-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.54.1">Figure 8.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.2">The load sensors contain strain gauges or piezoelectric crystals that convert small platform displacements into voltages. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.3">While force plates are somewhat reminiscent of an ordinary spring-based bathroom scale, there are major differences in precision, speed, and richness of the data. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.4">Because the ground reaction forces can change rapidly, particularly during foot strikes, the data are typically collected at a rate of thousands of measurements per second. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.5">There is typically one load sensor located near each corner of a force plate, with each load sensor measuring strain and reporting force along three orthogonal axes. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.55.6">Thus, there are 12 independent force measurements, rather than just one as with a bathroom scale, which can be combined to compute the resultant force and moment relative to the force plate origin.</span></p>
<figure id="c8-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.56.1"><img src="../images/c8-fig-0002.jpg" alt="c8-fig-0002.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0003a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.57.1">Figure 8.2</span></a></span> <a id="c8-para-0018"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.1">A force plate measures the forces and moments applied between the ground and the subject, collectively referred to as ground reaction forces. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.58.2">The center of pressure (COP) and the “free moment” (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.59.1"><img src="../images/c8-fig-6029.jpg" alt="c8-fig-6029.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.60.1">) can be computed from the resultant force (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.61.1"><img src="../images/c8-fig-6030.jpg" alt="c8-fig-6030.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.62.1">) and total moment (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.63.1"><img src="../images/c8-fig-6031.jpg" alt="c8-fig-6031.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.64.1">).</span></p></figcaption></figure></section>
<section>
<h2><a id="c8-sec-0002"/><a id="c8-title-0003"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.65.1">Center of pressure</span></h2>
<p class="paraaftertitle"><a id="c8-para-0019"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.66.1">Pressure is distributed unevenly over the bottom of the foot (</span><a id="c8-fig-0004a"/><a href="#c8-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.67.1">Figure 8.3</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.2">This distributed pressure can be expressed as an equivalent resultant force applied at a point called the center of pressure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.68.3">We can determine the center of pressure using the following moment-equivalence equation:</span></p>
<figure id="c8-fig-0004"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.69.1"><img src="../images/c8-fig-0003.jpg" alt="c8-fig-0003.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0004a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.70.1">Figure 8.3</span></a></span> <a id="c8-para-0020"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.1">Pressure distributed over the foot during walking. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.2">Adapted from Pataky et al. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.71.3">(2012).</span></p></figcaption></figure>
<p><a id="c8-para-0021"/></p>
<figure id="c8-fig-0005"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.72.1"><img src="../images/c8-fig-3001.jpg" alt="c8-fig-3001.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0022"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.73.1">(8.1)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.74.1">where </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.75.1"><img src="../images/c8-fig-6004.jpg" alt="c8-fig-6004.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.76.1"> is the moment at the force plate origin, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.77.1"><img src="../images/c8-fig-6005.jpg" alt="c8-fig-6005.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.78.1"> is the vector from the origin to the center of pressure, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.79.1"><img src="../images/c8-fig-6006.jpg" alt="c8-fig-6006.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.80.1"> is the resultant ground reaction force, and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.81.1"><img src="../images/c8-fig-6007.jpg" alt="c8-fig-6007.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.82.1"> is the moment required to produce an equivalent system when the force </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.83.1"><img src="../images/c8-fig-6008.jpg" alt="c8-fig-6008.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.84.1"> is applied at the center of pressure (</span><a href="#c8-fig-0003"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.85.1">Figure 8.2</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.86.2">In Equation 8.1, we have three independent equations (for </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.87.1">M</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.88.1">x</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.89.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.90.1">M</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.91.1">y</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.92.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.93.1">M</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.94.1">z</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.95.1">) but six unknowns: the three components of vector </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.96.1"><img src="../images/c8-fig-6009.jpg" alt="c8-fig-6009.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.97.1"> and the three components of moment </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.98.1"><img src="../images/c8-fig-6010.jpg" alt="c8-fig-6010.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.99.2">We obtain three additional equations by noting that the center of pressure remains on the surface of the force plate (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.100.1">r</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.101.1">z</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.102.1"> = 0) and that surface friction can generate a moment about only the vertical axis (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.103.1">T</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.104.1">z</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.1">, which is also referred to as the “free moment”). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.2">While moments about the other two axes are conceivable, we would observe these moments only if we glued a person's foot to the force plate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.105.3">It would then be possible for the sticky-footed subject to produce downward ground reaction forces and, thus, force couples about the other two axes.</span></p>
<p><a id="c8-para-0023"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.106.1">In the absence of sticky feet, we can substitute </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.107.1">r</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.108.1">z</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.109.1"> = </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.110.1">T</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.111.1">x</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.112.1"> = </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.113.1">T</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.114.1">y</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.1"> = 0 into Equation 8.1 and solve for the remaining unknowns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.115.2">We obtain the following expressions for the location of the center of pressure relative to the force plate origin (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.116.1"><img src="../images/c8-fig-6011.jpg" alt="c8-fig-6011.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.117.1">) and for the free moment (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.118.1">T</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.119.1">z</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.120.1">):</span></p>
<p><a id="c8-para-0024"/></p>
<figure id="c8-fig-0006"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.121.1"><img src="../images/c8-fig-3002.jpg" alt="c8-fig-3002.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0025"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.122.1">(8.2)</span></p></figcaption></figure>

<p><a id="c8-para-0026"/></p>
<figure id="c8-fig-0007"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.123.1"><img src="../images/c8-fig-3003.jpg" alt="c8-fig-3003.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0027"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.124.1">(8.3)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.1">It is useful to compute and visualize the center of pressure when verifying data-processing algorithms; a center of pressure located outside the footprint is an indication of calibration errors between the force plate and the motion capture system. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.2">It is also generally more intuitive to interpret forces and moments acting on the foot if they are transformed to the center of pressure. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.125.3">Note that the expressions in Equation 8.2 become ill-conditioned as the normal component of the ground reaction force (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.126.1">F</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.127.1">z</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.128.1">) approaches zero, so the calculated center of pressure will be unreliable near foot contact and toe off.</span></p></section>
<section>
<h2><a id="c8-sec-0003"/><a id="c8-title-0004"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.129.1">Inverse dynamics algorithms</span></h2>
<p class="paraaftertitle"><a id="c8-para-0028"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.1">A dynamic analysis considers the motion of objects (kinematics) as well as the forces responsible for and generated by this motion (kinetics). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.130.2">In this section, we consider a typical inverse dynamics problem: </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.131.1">given</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.132.1"> a representative model of a subject, the subject's joint kinematics over time, and measurements of the external forces applied to the subject, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.133.1">find</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.1"> the net joint forces and moments that must have been present to produce the given motion. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.2">In brief, we apply the laws of mechanics to each body segment in the model and compute the internal forces and moments acting at each joint. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.3">The joint angles are often estimated from optical marker trajectories using an inverse kinematics algorithm (Chapter 7), then smoothed and differentiated to obtain angular velocities and angular accelerations. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.4">It is possible to perform an inverse dynamic analysis without measurements of external forces, but we defer that discussion to later in this chapter. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.134.5">To demonstrate a simple inverse dynamics algorithm, we will compute the net joint forces and moments during the squat shown in </span><a id="c8-fig-0008a"/><a href="#c8-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.135.1">Figure 8.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.136.1">.</span></p>
<figure id="c8-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.137.1"><img src="../images/c8-fig-0004.jpg" alt="c8-fig-0004.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0008a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.138.1">Figure 8.4</span></a></span> <a id="c8-para-0029"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.1">Experimental setup (left) and approximate sagittal-plane model (right) for studying a squat. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.139.2">An inverse dynamic analysis computes the net forces and moments at each joint from the mass, inertia, geometry, and kinematics (positions, velocities, and accelerations) of each body segment (as well as external forces, when available).</span></p></figcaption></figure>
<p><a id="c8-para-0030"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.140.1">Before proceeding, it is worth considering the important question of how to select a suitable model for a particular study and, specifically, whether the simple model shown in </span><a href="#c8-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.141.1">Figure 8.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.1"> is suitable for studying a squat. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.2">In general, the appropriate model fidelity—that is, the degree to which the model represents reality—depends on the research question being investigated. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.3">It is important to recognize that a more detailed model is not necessarily better. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.4">The objective when selecting a model is to maximize the model's utility, which often involves minimizing its complexity so that the simulation results are not polluted with irrelevant details. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.142.5">This objective echoes the following wisdom from Einstein's 1934 paper “On the Method of Theoretical Physics”:</span></p>
<blockquote class="quote">
<p class="quoteparafirst"><a id="c8-para-0031"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.143.1">It can scarcely be denied that the supreme goal of all theory is to make the irreducible basic elements as simple and as few as possible without having to surrender the adequate representation of a single datum of experience.</span></p></blockquote>
<p class="paraaftertitle"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.1">Einstein was speaking of the relationship between theoretical and experimental physics, but the same sentiment holds here: we favor models that are minimally complex while being able to explain experimental observations and produce the desired outputs to a sufficient level of accuracy. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.144.2">Indeed, as famously stated by statisticians George Box and Norman Draper, “all models are wrong, but some are useful.”</span></p>
<p><a id="c8-para-0032"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.1">Whether a particular model will be useful rather than just wrong depends on the context in which it is used. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.2">For example, it may be reasonable to model Mars as a point mass while simulating planetary orbits in our solar system or predicting the trajectory of an interplanetary spacecraft, but such a model would be insufficient for studying Martian weather patterns or simulating a spacecraft landing there. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.3">Conversely, using detailed planetary models in a study on orbital mechanics would increase modeling complexity and computational effort without adding value to the results. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.4">Back in the biomechanics world, we have noticed that some new users of our OpenSim software initially assume that they should always use a full-body model with dozens of degrees of freedom, when a much simpler model might tell them everything they need to know for their particular subject of interest. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.145.5">A single-degree-of-freedom knee joint model that can only flex and extend may be suitable for studying how knee extension moments vary with running speed, while a more detailed knee model with more degrees of freedom would be required for analyzing moments in the frontal plane in people with osteoarthritis.</span></p></section>
<section>
<h2><a id="c8-sec-0004"/><a id="c8-title-0005"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.146.1">Inverse dynamics with ground reaction forces</span></h2>
<p class="paraaftertitle"><a id="c8-para-0033"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.147.1">In this section, we will perform an inverse dynamic analysis of one instant of a two-legged squat using the planar model shown in </span><a href="#c8-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.148.1">Figure 8.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.2">The model consists of four rigid bodies connected by three revolute (pin) joints representing the ankle, knee, and hip. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.3">We assume that the joint angles, angular velocities, and angular accelerations are known from previously solving the inverse kinematics problem. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.4">We further assume that the subject's body is symmetrical and that any motion out of the sagittal plane can be neglected. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.5">We combine the left and right feet into a single rigid body (“the foot”) that is assumed to have negligible mass and to remain stationary on the ground. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.6">The left and right shanks are also combined into a single rigid body, with mass and inertia that represent both shanks; the left and right thighs are similarly combined. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.7">We model the head, arms, and torso (HAT) as a single rigid body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.8">We assume that each body segment of the model has been appropriately scaled to match the dimensions and mass properties of the corresponding body segments of the subject. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.9">In practice, model parameters such as lengths, masses, and inertias can be determined using a combination of direct measurements, published anthropometric tables, photographs, medical images, and other measurement and estimation techniques. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.10">The OpenSim models my group has developed include values for these parameters that can be scaled to represent a particular individual. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.149.11">Our models are freely available and can be accessed from the book's website.</span></p>
<p><a id="c8-para-0034"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.1">In this simple example, we will begin at the feet and use the laws of motion, aided by a sequence of free-body diagrams, to compute the net forces and moments applied at each joint, starting with the ankle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.2">For now, we assume that the ground reaction forces are known. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.150.3">The strategy of drawing free-body diagrams and performing hand calculations is sufficient for simple models like this one; in practice, we typically use software implementations of algorithms that are similar to the one we use below.</span></p>
<p><a id="c8-para-0035"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.1">We have assumed that the dimensions and ground reaction forces are known, and that the feet are massless and stationary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.151.2">Consequently, the only unknowns appearing in the free-body diagram of the foot segment (</span><a id="c8-fig-0009a"/><a href="#c8-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.152.1">Figure 8.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.1">) are the forces and moments applied at the ankle. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.2">Note that, by Newton's third law, forces and moments that are of equal magnitude and opposite direction must be applied at the ankle on the shank body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.3">We use the convention of drawing these vector pairs in the positive direction on the more proximal body and in the negative direction on the more distal body. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.153.4">For example, the </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.154.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.155.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.156.1"> vector points in the −X direction in </span><a href="#c8-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.157.1">Figure 8.5</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.158.1">, and the corresponding vector in the free-body diagram of the shank (</span><a id="c8-fig-0010a"/><a href="#c8-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.159.1">Figure 8.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.160.1">) will point in the +X direction.</span></p>
<figure id="c8-fig-0009"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.161.1"><img src="../images/c8-fig-0005.jpg" alt="c8-fig-0005.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0009a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.162.1">Figure 8.5</span></a></span> <a id="c8-para-0036"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.163.1">Free-body diagram for the foot segment of the model shown in </span><a href="#c8-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.164.1">Figure 8.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.165.1">.</span></p></figcaption></figure>
<figure id="c8-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.166.1"><img src="../images/c8-fig-0006.jpg" alt="c8-fig-0006.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0010a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.167.1">Figure 8.6</span></a></span> <a id="c8-para-0037"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.168.1">Free-body diagram for the shank segment of the model shown in </span><a href="#c8-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.169.1">Figure 8.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.2">The pose of the body segment in a free-body diagram need not match its pose during the activity being studied. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.170.3">Although irrelevant mathematically, we draw the shank segment in this convenient canonical pose, where </span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.171.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.172.1"> is between 0 and 90 degrees.</span></p></figcaption></figure>
<p><a id="c8-para-0038"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.173.1">We can use Newton's second law and its rotational analogue to solve for </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.174.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.175.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.176.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.177.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.178.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.179.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.180.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.181.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.182.2">First, we sum the forces and apply Newton's second law in the X direction to compute </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.183.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.184.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.185.1">:</span></p>
<p><a id="c8-para-0039"/></p>
<figure id="c8-fig-0011"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.186.1"><img src="../images/c8-fig-3004a.jpg" alt="c8-fig-3004a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0040"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.187.1">(8.4a)</span></p></figcaption></figure>

<p><a id="c8-para-0041"/></p>
<figure id="c8-fig-0012"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.188.1"><img src="../images/c8-fig-3004b.jpg" alt="c8-fig-3004b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0042"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.189.1">(8.4b)</span></p></figcaption></figure>

<p><a id="c8-para-0043"/></p>
<figure id="c8-fig-0013"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.190.1"><img src="../images/c8-fig-3004c.jpg" alt="c8-fig-3004c.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0044"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.191.1">(8.4c)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.192.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.193.1">m</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.194.1">0</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.195.1"> is the mass of the foot segment and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.196.1"><img src="../images/c8-fig-6012.jpg" alt="c8-fig-6012.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.1"> is the horizontal acceleration of its center of mass, both of which we have assumed to be zero. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.197.2">Next, we sum the forces in the Y direction to compute </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.198.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.199.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.200.1">:</span></p>
<p><a id="c8-para-0045"/></p>
<figure id="c8-fig-0014"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.201.1"><img src="../images/c8-fig-3005a.jpg" alt="c8-fig-3005a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0046"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.202.1">(8.5a)</span></p></figcaption></figure>

<p><a id="c8-para-0047"/></p>
<figure id="c8-fig-0015"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.203.1"><img src="../images/c8-fig-3005b.jpg" alt="c8-fig-3005b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0048"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.204.1">(8.5b)</span></p></figcaption></figure>

<p><a id="c8-para-0049"/></p>
<figure id="c8-fig-0016"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.205.1"><img src="../images/c8-fig-3005c.jpg" alt="c8-fig-3005c.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0050"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.206.1">(8.5c)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.207.1">Finally, we solve for </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.208.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.209.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.210.2">The rotational analogue of </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.211.1"><img src="../images/c8-fig-6013.jpg" alt="c8-fig-6013.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.212.1">, which we mentioned above, has the following general form when moments are computed in a planar system about an arbitrary point P on a body:</span></p>
<p><a id="c8-para-0051"/></p>
<figure id="c8-fig-0017"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.213.1"><img src="../images/c8-fig-3006.jpg" alt="c8-fig-3006.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0052"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.214.1">(8.6)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.215.1">where </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.216.1"><img src="../images/c8-fig-6014.jpg" alt="c8-fig-6014.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.217.1"> is the sum of moments about point P, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.218.1">I</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.219.1"> is the moment of inertia of the body about its center of mass (COM), </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.220.1"><img src="../images/c8-fig-6015.jpg" alt="c8-fig-6015.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.221.1"> is the body's angular acceleration, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.222.1"><img src="../images/c8-fig-6016.jpg" alt="c8-fig-6016.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.223.1"> is the vector from point P to the COM, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.224.1">m</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.225.1"> is the mass of the body, and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.226.1"><img src="../images/c8-fig-6017.jpg" alt="c8-fig-6017.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.1"> is the linear acceleration of the body's COM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.227.2">Because the product of mass and acceleration is force, we can interpret the second term on the right-hand side of Equation 8.6 as the projection of a moment onto the axis of rotation (as we saw in Equation 6.4).</span></p>
<p><a id="c8-para-0053"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.1">Equivalent systems of equations are obtained regardless of the point about which moments are computed. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.228.2">For simplicity, we generally compute moments about the COM so that the cross product in Equation 8.6 is zero (specifically, so that </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.229.1"><img src="../images/c8-fig-6018.jpg" alt="c8-fig-6018.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.2">However, we have assumed that the feet are massless and stationary. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.3">Thus, the right-hand side of Equation 8.6 is always zero and we can assume any location for the COM. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.230.4">For convenience, we sum moments about the ankle:</span></p>
<p><a id="c8-para-0054"/></p>
<figure id="c8-fig-0018"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.231.1"><img src="../images/c8-fig-3007a.jpg" alt="c8-fig-3007a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0055"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.232.1">(8.7a)</span></p></figcaption></figure>

<p><a id="c8-para-0056"/></p>
<figure id="c8-fig-0019"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.233.1"><img src="../images/c8-fig-3007b.jpg" alt="c8-fig-3007b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0057"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.234.1">(8.7b)</span></p></figcaption></figure>

<p><a id="c8-para-0058"/></p>
<figure id="c8-fig-0020"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.235.1"><img src="../images/c8-fig-3007c.jpg" alt="c8-fig-3007c.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0059"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.236.1">(8.7c)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.237.1">Equations 8.4c, 8.5c, and 8.7c comprise a linear system of equations that can be used to compute </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.238.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.239.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.240.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.241.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.242.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.243.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.244.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.245.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.246.1"> given </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.247.1">ℓ</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.248.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.249.1">h</span></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.250.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.251.1">Fx</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.252.1">g</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.253.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.254.1">Fy</span><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.255.1">g</span></sub></i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.256.1">.</span></p>
<p><a id="c8-para-0060"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.257.1">We now repeat the process for the shank segment (</span><a href="#c8-fig-0010"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.258.1">Figure 8.6</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.259.1">), where the forces and moments applied at the ankle (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.260.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.261.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.262.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.263.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.264.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.265.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.266.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.267.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.268.1">) are assumed to be known from the previous step and those at the knee (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.269.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.270.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.271.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.272.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.273.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.274.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.275.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.276.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.1">) are now the unknowns. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.277.2">We first compute the acceleration of the COM (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.278.1"><img src="../images/c8-fig-6019.jpg" alt="c8-fig-6019.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.279.1"> and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.280.1"><img src="../images/c8-fig-6020.jpg" alt="c8-fig-6020.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.281.1">) from the kinematics of the ankle joint (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.282.1">θ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.283.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.284.1">, </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.285.1"><img src="../images/c8-fig-6021.jpg" alt="c8-fig-6021.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.286.1">, and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.287.1"><img src="../images/c8-fig-6022.jpg" alt="c8-fig-6022.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.288.1">), noting that the ankle joint center is stationary:</span></p>
<p><a id="c8-para-0061"/></p>
<figure id="c8-fig-0021"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.289.1"><img src="../images/c8-fig-3008a.jpg" alt="c8-fig-3008a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0062"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.290.1">(8.8a)</span></p></figcaption></figure>

<p><a id="c8-para-0063"/></p>
<figure id="c8-fig-0022"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.291.1"><img src="../images/c8-fig-3008b.jpg" alt="c8-fig-3008b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0064"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.292.1">(8.8b)</span></p></figcaption></figure>

<p><a id="c8-para-0065"/></p>
<figure id="c8-fig-0023"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.293.1"><img src="../images/c8-fig-3008c.jpg" alt="c8-fig-3008c.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0066"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.294.1">(8.8c)</span></p></figcaption></figure>

<p><a id="c8-para-0067"/></p>
<figure id="c8-fig-0024"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.295.1"><img src="../images/c8-fig-3009a.jpg" alt="c8-fig-3009a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0068"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.296.1">(8.9a)</span></p></figcaption></figure>

<p><a id="c8-para-0069"/></p>
<figure id="c8-fig-0025"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.297.1"><img src="../images/c8-fig-3009b.jpg" alt="c8-fig-3009b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0070"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.298.1">(8.9b)</span></p></figcaption></figure>

<p><a id="c8-para-0071"/></p>
<figure id="c8-fig-0026"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.299.1"><img src="../images/c8-fig-3009c.jpg" alt="c8-fig-3009c.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0072"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.300.1">(8.9c)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.301.1">where we have used </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.302.1"><img src="../images/c8-fig-6023.jpg" alt="c8-fig-6023.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.303.1"> and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.304.1"><img src="../images/c8-fig-6024.jpg" alt="c8-fig-6024.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.1"> for notational convenience. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.305.2">We now apply Newton's second law in the X direction to compute </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.306.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.307.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.308.1">:</span></p>
<p><a id="c8-para-0073"/></p>
<figure id="c8-fig-0027"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.309.1"><img src="../images/c8-fig-3010a.jpg" alt="c8-fig-3010a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0074"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.310.1">(8.10a)</span></p></figcaption></figure>

<p><a id="c8-para-0075"/></p>
<figure id="c8-fig-0028"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.311.1"><img src="../images/c8-fig-3010b.jpg" alt="c8-fig-3010b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0076"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.312.1">(8.10b)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.313.1">and again in the Y direction to compute </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.314.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.315.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.316.1">:</span></p>
<p><a id="c8-para-0077"/></p>
<figure id="c8-fig-0029"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.317.1"><img src="../images/c8-fig-3011.jpg" alt="c8-fig-3011.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0078"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.318.1">(8.11)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.319.1">Finally, we sum moments about the COM to obtain an expression for </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.320.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.321.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.322.1">:</span></p>
<p><a id="c8-para-0079"/></p>
<figure id="c8-fig-0030"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.323.1"><img src="../images/c8-fig-3012.jpg" alt="c8-fig-3012.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0080"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.324.1">(8.12)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.325.1">where </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.326.1">d</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.327.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.328.1"> ≜ </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.329.1">ℓ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.330.1">1</span></sub><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.331.1">r</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.332.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.1">. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.333.2">Equations 8.10b, 8.11, and 8.12 comprise a second linear system of three equations in three unknowns, and we can now solve for the net forces and moments applied at both the ankle and the knee.</span></p>
<p><a id="c8-para-0081"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.334.1">The same procedure is repeated for the thigh segment (</span><a id="c8-fig-0031a"/><a href="#c8-fig-0031"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.335.1">Figure 8.7</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.336.1">), where the unknowns are the forces and moments applied at the hip (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.337.1">Fx</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.338.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.339.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.340.1">Fy</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.341.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.342.1">, and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.343.1">T</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.344.1">3</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.1">). </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.345.2">To compute the acceleration of the COM relative to ground (</span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.346.1"><img src="../images/c8-fig-6025.jpg" alt="c8-fig-6025.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.347.1"> and </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.348.1"><img src="../images/c8-fig-6026.jpg" alt="c8-fig-6026.jpg"/></span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.349.1">), note that the position of the hip relative to the ankle is a function of both </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.350.1">θ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.351.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.352.1"> and </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.353.1">θ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.354.1">2</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.355.1"> (see </span><a href="#c8-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.356.1">Figure 8.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.357.1">):</span></p>
<figure id="c8-fig-0031"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.358.1"><img src="../images/c8-fig-0007.jpg" alt="c8-fig-0007.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0031a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.359.1">Figure 8.7</span></a></span> <a id="c8-para-0082"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.360.1">Free-body diagram for the thigh segment of the model shown in </span><a href="#c8-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.361.1">Figure 8.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.362.1">.</span></p></figcaption></figure>
<p><a id="c8-para-0083"/></p>
<figure id="c8-fig-0032"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.363.1"><img src="../images/c8-fig-3013a.jpg" alt="c8-fig-3013a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0084"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.364.1">(8.13a)</span></p></figcaption></figure>

<p><a id="c8-para-0085"/></p>
<figure id="c8-fig-0033"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.365.1"><img src="../images/c8-fig-3013b.jpg" alt="c8-fig-3013b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0086"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.366.1">(8.13b)</span></p></figcaption></figure>

<p><a id="c8-para-0087"/></p>
<figure id="c8-fig-0034"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.367.1"><img src="../images/c8-fig-3013c.jpg" alt="c8-fig-3013c.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0088"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.368.1">(8.13c)</span></p></figcaption></figure>

<p><a id="c8-para-0089"/></p>
<figure id="c8-fig-0035"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.369.1"><img src="../images/c8-fig-3014a.jpg" alt="c8-fig-3014a.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0090"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.370.1">(8.14a)</span></p></figcaption></figure>

<p><a id="c8-para-0091"/></p>
<figure id="c8-fig-0036"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.371.1"><img src="../images/c8-fig-3014b.jpg" alt="c8-fig-3014b.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0092"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.372.1">(8.14b)</span></p></figcaption></figure>

<p><a id="c8-para-0093"/></p>
<figure id="c8-fig-0037"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.373.1"><img src="../images/c8-fig-3014c.jpg" alt="c8-fig-3014c.jpg"/></span><figcaption class="figurecaption">
<p class="mathlabel"><a id="c8-para-0094"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.374.1">(8.14c)</span></p></figcaption></figure>
<p><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.1">The dynamic equations for the thigh segment are analogous to those we obtained for the shank. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.375.2">Notice that the coordinates of the knee are (</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.376.1">ℓ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.377.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.378.1"> c</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.379.1">θ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.380.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.381.1">, </span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.382.1">ℓ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.383.1">1</span></sub><sub> </sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.384.1">s</span><i><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.385.1">θ</span></i><sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.386.1">1</span></sub><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.387.1">); these terms in Equations 8.13a and 8.14a could be replaced with measurements if the knee location were tracked directly.</span></p>
<p><a id="c8-para-0095"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.1">In summary, we obtain a linear system of nine equations in nine unknowns: the net forces and moments applied at the ankle, knee, and hip. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.2">Thus, if the ground reaction forces are known, it is necessary to measure or otherwise obtain the geometric properties, inertial properties, and kinematics of only the foot, shank, and thigh segments. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.3">Measurements of the motions of the head, arms, and torso are not needed, which can be an advantage because measurements of these body segments can be inaccurate. </span><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.388.4">A free-body diagram of the HAT segment (</span><a id="c8-fig-0038a"/><a href="#c8-fig-0038"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.389.1">Figure 8.8</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.390.1">) confirms that all variables have now been computed, and thus analysis of the HAT is not needed when ground reaction forces are measured.</span></p>
<figure id="c8-fig-0038"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.391.1"><img src="../images/c8-fig-0008.jpg" alt="c8-fig-0008.jpg"/></span><figcaption class="figurecaption">
<p><span class="figureLabel"><a href="#c8-fig-0038a"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.392.1">Figure 8.8</span></a></span> <a id="c8-para-0096"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.393.1">Free-body diagram for the head, arms, and torso (HAT) of the model shown in </span><a href="#c8-fig-0008"><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.394.1">Figure 8.4</span></a><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.395.1">.</span></p></figcaption></figure></section>
<section>
<h2><a id="c8-sec-0005"/><a id="c8-title-0006"/><span xmlns="http://www.w3.org/1999/xhtml" class="koboSpan" id="kobo.396.1">Inverse dynamics without ground reaction forces</span></h2>
