<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Cornhole Biomechanics Lab</title>
  <desc>Side view of the measured throw: a jointed throwing arm, the tracked bag flight (dotted parabola) and the first contact on a regulation board.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3A52"/>
      <stop offset="1" stop-color="#0F2436"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="78" y="78" width="868" height="868" rx="188" fill="none" stroke="#2E4A60" stroke-width="3"/>
  <g transform="translate(512 512) scale(1.06) translate(-512 -575)">
  <!-- floor line -->
  <path d="M150 790H874" stroke="#2E4A60" stroke-width="10" stroke-linecap="round"/>
  <!-- throwing arm: shoulder, elbow, wrist -->
  <path d="M232 470L262 596L338 664" fill="none" stroke="#F1EADA" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="232" cy="470" r="30" fill="#F1EADA"/>
  <circle cx="262" cy="596" r="24" fill="#1B3A52" stroke="#F1EADA" stroke-width="12"/>
  <circle cx="338" cy="664" r="24" fill="#1B3A52" stroke="#F1EADA" stroke-width="12"/>
  <!-- tracked flight (dotted parabola) -->
  <path d="M352 646C430 300 640 250 742 604" fill="none" stroke="#E07A62" stroke-width="22" stroke-linecap="round" stroke-dasharray="0.1 46"/>
  <!-- regulation board in side view: deck sloping up to the back, back leg -->
  <path d="M606 752L862 646" stroke="#DAC39E" stroke-width="30" stroke-linecap="round"/>
  <path d="M836 660L836 786" stroke="#DAC39E" stroke-width="22" stroke-linecap="round"/>
  <path d="M606 752L606 786" stroke="#DAC39E" stroke-width="18" stroke-linecap="round"/>
  <!-- bag at first contact -->
  <rect x="712" y="626" width="72" height="54" rx="14" transform="rotate(-22 748 653)" fill="#E07A62"/>
  </g>
</svg>
