[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cornhole-biomech"
version = "0.1.0"
description = "Transparent single-camera 2D cornhole biomechanics analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Cornhole Biomechanics Lab"}]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "opencv-contrib-python>=4.10,<6",
]

[project.optional-dependencies]
pose = [
  "onnxruntime>=1.19,<2",
  "rtmlib>=0.0.13,<1",
  "mediapipe>=0.10.21,<0.11",
]
sports2d = ["sports2d>=0.8.34,<0.9"]
test = ["pytest>=8.3,<9", "pytest-cov>=5,<7"]

[project.scripts]
cornhole-biomech = "cornhole_biomech.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
